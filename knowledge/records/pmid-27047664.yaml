key_findings:
- 16-year-old with 9-month secondary amenorrhoea and 2-month bilateral galactorrhoea.
- Serum prolactin 7081 mIU/l, LH <0.1 U/l, FSH <0.1 U/l, oestradiol 7442 pmol/l, inhibin B 2735 ng/l; pituitary MRI showed enlarged pituitary without adenoma.
- 4.8 cm right ovarian mass; right salpingo-oophorectomy; JGCT FIGO 1A; tumor immunohistochemistry negative for prolactin.
- Oestrogen and prolactin normalized after surgery; she conceived 6 months after surgery and gave birth; at 2 years oestradiol 821 pmol/l and prolactin 327 mIU/l; pregnant with second child at time of writing.
- Authors postulate hyperprolactinaemia was caused by oestrogenic stimulation of pituitary lactotrophs.
relevance_to_jgct: First reported JGCT presenting with oestrogen-driven hyperprolactinaemia; shows inhibin B as a marker and preserved fertility after unilateral surgery.
