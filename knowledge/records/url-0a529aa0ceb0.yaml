key_findings:
- 'OTST Registry update: 73 individuals with Sertoli-Leydig cell tumor (SLCT), JGCT or gynandroblastoma enrolled since December 2011, with central pathology review and germline DICER1 testing. The number with JGCT is not given in the abstract.'
- 'Whole cohort: median age at diagnosis 15 years (IQR 8 to 21); 45% (33) stage IA; 12% (9) recurred; 4% (3) died of progressive disease; 4% (3) developed metachronous ovarian stromal tumors; 4% (3) had pleuropulmonary blastoma; 19% (14) thyroid nodules and 8% (6) thyroid cancer; 14% (10) other non-DICER1-related tumors.'
- 'Germline DICER1 mutations in 40% (23/57 tested): 53% (20/38) of tested SLCT and 3 of 4 gynandroblastomas; per-histology figures for JGCT are not stated.'
- Germline DICER1-positive patients had more thyroid nodules (39% vs 9%, p=0.009) and thyroid cancer (26% vs 0%, p=0.003) than germline-negative patients. Authors state germline DICER1 status did not appear to affect outcome of the primary tumor but is a risk factor for other tumors.
relevance_to_jgct: Early OTST Registry abstract covering JGCT together with SLCT and gynandroblastoma; DICER1 germline rates are given for SLCT and gynandroblastoma but not for JGCT.
