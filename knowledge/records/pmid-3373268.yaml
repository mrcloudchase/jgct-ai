key_findings:
- Single-institution pediatric series of 15 JGCT (1967 to 1985), 12% of pediatric ovarian tumors there.
- 'Wollner stage I 6, II 1, III 6 (4 ruptured), IV 1, unstaged 1.'
- 11 alive and disease-free at median 6 years; 4 relapsed 6 to 17 months after surgery and died, 2 with bone relapse.
- Authors report a favorable prognosis for low stage treated with surgery; best treatment for extensive or recurrent disease undetermined.
relevance_to_jgct: Early pediatric oncology series showing early, often fatal relapse in advanced JGCT.
