presentation:
- precocious pseudopuberty (6/7 under 8 years)
- virilization (1)
key_findings:
- 15 girls at Institut Gustave-Roussy 1967-1985; JGCT was 12% of ovarian tumors treated in the pediatric department; median age 8 years 7 months.
- Precocious pseudopuberty in six of seven girls under 8; one older girl had virilization.
- Wollner stage I 6, II 1, III 6 (including four ruptured), IV 1; six received adjuvant treatment.
- Eleven alive and disease-free (median follow-up 6 years); four relapsed 6 to 17 months after surgery and died, two with bone relapse.
relevance_to_jgct: Historical French pediatric series documenting early, fatal relapses in advanced JGCT.
