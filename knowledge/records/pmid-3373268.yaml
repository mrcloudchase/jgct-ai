title: 'Juvenile granulosa cell tumor of the ovary in children: a clinical study of 15 cases.'
journal: Journal of clinical oncology
year: 1988
first_author: Vassal G
study_type: case_series
n_jgct_patients: 15
age_range: 22 months-15 years 7 months
alterations: []
