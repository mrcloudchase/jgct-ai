key_findings:
- 'CD10 immunostaining in 101 ovarian stromal and sex cord-stromal tumors: 8 of 9 juvenile granulosa cell tumors were positive, mostly in under 5% to 39% of cells at 1+ intensity; staining was faint across SCST compared with the strong diffuse staining of endometrial stromal tumors.'
relevance_to_jgct: Faint CD10 positivity is compatible with JGCT and does not indicate endometrial stromal tumor.
