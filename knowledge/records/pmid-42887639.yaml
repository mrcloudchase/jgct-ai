key_findings:
- 4-year-old girl, after staged herniotomies for bilateral inguinal hernia, noted to have pubic hair, clitoromegaly, adult-type body odor, bilateral breast enlargement, a large pelvic mass, and vaginal bleeding.
- Gonadotropins suppressed; estradiol, testosterone, anti-Mullerian hormone, inhibin A, and CA 125 elevated.
- Imaging showed a left adnexal mass with ascites; left oophorectomy confirmed stage IA JGCT.
- Sex steroids normalized within 7 days after tumor removal, and anti-Mullerian hormone declined.
- Authors conclude coexisting estrogenic and androgenic signs should prompt evaluation for JGCT.
relevance_to_jgct: Rare mixed estrogenic and androgenic (virilizing) presentation of ovarian JGCT in a prepubertal child.
