presentation:
- swollen ovary found during work-up of esophagogastric junction and rectal cancers
key_findings:
- A woman in her 60s with double cancers (esophagogastric junction, rectum) and a swollen left ovary had laparoscopic bilateral salpingo-oophorectomy; the ovary was a JGCT, not a Krukenberg metastasis, which allowed curative surgery for both cancers (Japanese).
- CA19-9 was expressed by the esophagogastric cancer and not by the JGCT.
relevance_to_jgct: JGCT in a woman in her 60s mimicking a Krukenberg tumor.
