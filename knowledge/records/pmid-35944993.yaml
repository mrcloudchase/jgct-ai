key_findings:
- Woman in her 60s with double cancers at the esophagogastric junction and rectum and a swollen left ovary suspected to be Krukenberg tumor.
- Laparoscopic bilateral salpingo-oophorectomy; resected ovary diagnosed as juvenile granulosa cell tumor, not Krukenberg tumor.
- Subsequent curative surgeries for esophagogastric junction and rectal cancer were performed.
- CA19-9 expressed in the esophagogastric junction tumor but not in the ovarian tumor.
relevance_to_jgct: Incidental JGCT in an older adult, where the diagnosis changed cancer staging and enabled curative surgery for other primaries.
