notes: 'The text contains several apparent errors: adnexal mass size ''90 cm'' (likely 9 cm or 90 mm), the abstract says the patient had a ''left ovarian cystectomy'' whereas the text describes tumor resection, and ''Ten adequate follow-ups'' appears garbled. FIGO stage is not stated. Because of age 35, JGCT vs adult type was decided on morphology (no Call-Exner bodies, ungrooved hyperchromatic nuclei, numerous mitoses) without molecular testing.'
