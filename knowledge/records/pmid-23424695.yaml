key_findings:
- 13-year-old premenarchal girl with progressive painless abdominal distention for about two months and massive ascites.
- CT showed a multiseptated cystic left ovarian mass; beta-hCG, AFP, CEA, CA 19-9 and CA-125 normal; about 10 liters of transudate ascites evacuated; cytology negative.
- Left salpingo-oophorectomy and omentectomy; immunohistochemistry positive for calretinin, inhibin and CD99; FIGO stage IC.
- Serum inhibin was not measured before surgery; it was increased when measured immediately after surgery; postoperative imaging showed residual pelvic tumor.
- Four cycles of adjuvant carboplatin, bleomycin, etoposide and vinblastine; complete remission at 18-month follow-up.
- Menarche began shortly after surgery.
relevance_to_jgct: Reports massive ascites as the only manifestation of JGCT and onset of menarche after tumor removal.
