key_findings:
- Study of SMARCA4 immunohistochemistry in 3048 gynecologic and non-gynecologic tumors to test the specificity of SMARCA4 loss for small cell carcinoma of the ovary, hypercalcaemic type (SCCOHT). SMARCA4 was lost in 46 of 50 SCCOHT-derived samples (42/46 primary tumors, 2/2 xenografts, 2/2 cell lines) and in 15 of 2324 other ovarian tumors, all clear cell carcinomas.
- 'Juvenile granulosa cell tumor: 29 cases, 0 SMARCA4-negative (0%). Adult granulosa cell tumor 113 cases, 0 negative; whole ovarian sex cord-stromal group 221 cases, 0 negative. The authors list JGCT among tumors in the SCCOHT differential diagnosis that retained SMARCA4.'
- SMARCA2 loss by immunohistochemistry was seen in all 45 SCCOHT examined; SMARCA2 testing was done in clear cell carcinomas, not reported for JGCT. Authors conclude SMARCA4 (with SMARCA2) loss is sensitive and specific for SCCOHT.
- 'Cell-line work: the adult granulosa cell tumor line KGN and the immortalized granulosa line SVOG3e were used as comparison lines with higher SMARCA2 mRNA than the SCCOHT lines BIN67 and SCCOHT1. No JGCT cell lines were examined.'
relevance_to_jgct: 'Provides negative-control data for the JGCT-versus-SCCOHT differential diagnosis: all 29 JGCT retained SMARCA4 on IHC, so SMARCA4 loss argues against JGCT.'
