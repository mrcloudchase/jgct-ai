key_findings:
- A 5-month-old boy had a hard, mobile, painless right testicular mass; AFP was normal and ultrasound showed a 1.7 x 1.1 cm lobulated mass.
- After orchiectomy the 2.8 x 1.8 x 1.5 cm testis held a white-grey glistening lesion with an intact capsule separating it from normal parenchyma; the tumour was mainly solid with a few cystic follicles lined by inner round cells and outer spindle cells, with a high mitotic rate and high Ki-67.
- The tumour cells were positive for inhibin, alpha-1-antitrypsin and CD99 and negative for AFP; the diagnosis was JGCT of the testis.
- The authors state that JGCT is considered benign because no metastasis has been reported, and that yolk sac tumour is the main histological differential, requiring laboratory and immunohistochemical findings.
relevance_to_jgct: Brief image report of an infant testicular JGCT with immunohistochemistry separating it from yolk sac tumour.
