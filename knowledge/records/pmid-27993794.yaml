key_findings:
- GCIG fifth Ovarian Cancer Consensus Conference (Tokyo, November 2015) statements on trial design for rare ovarian tumours including sex-cord stromal tumours (SCST).
- Lack of randomised phase III data defining standards of care; internationally agreed diagnostic criteria, expert pathological review and translational research are crucial.
- For SCSTs, validated prognostic markers and alternatives to the current standard of bleomycin/etoposide/cisplatin (BEP) should be identified.
- Randomised trials are considered feasible through international collaboration; ongoing trials have demonstrated feasibility of RCT in SCST.
relevance_to_jgct: International consensus that BEP is the current SCST standard and that alternatives and prognostic markers are research priorities; not JGCT-specific in the abstract.
