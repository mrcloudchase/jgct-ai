key_findings:
- Consensus statements from working group C of the fifth Ovarian Cancer Consensus Conference of the Gynecologic Cancer InterGroup (Tokyo, 7-9 November 2015; 99 delegates, 29 member groups) on designing clinical trials in rare epithelial ovarian cancers, germ cell tumours (GCT) and sex cord-stromal tumours (SCST). The text never mentions juvenile granulosa cell tumour or distinguishes juvenile from adult type, and does not discuss children specifically for SCST.
- The authors give an incidence of 0.2 per 100,000 per year for SCST, 2%-3% of ovarian malignancies (same figures as GCT), and classify GCT and SCST as rare diseases (incidence below 6-15 per 100,000 per year). They state that most SCST have a good prognosis and present early, and that two thirds present at stage I, where surgery is the cornerstone.
- 'Research priorities for SCST (Table 2 and Statement 2): an urgently needed prognostic system incorporating histological parameters, which high-risk SCST need adjuvant systemic treatment, effective alternatives to first-line BEP, the role of post-operative chemotherapy or hormonal therapy after resection of relapse, and novel targeted therapies for relapsed SCST.'
- The authors state that studies are needed on whether pre-operatively ruptured stage IC granulosa cell tumours benefit from adjuvant chemotherapy; a histological risk-stratification score was suggested for stage IC SCST, and trials of systemic treatment versus observation in stage IC granulosa cell tumours stratified by histological features could define risk-adapted management. There is no consensus on the prognostic value of histological pattern, mitotic index, atypia, p53 overexpression, or FOXL2 and DICER1 mutations (for granulosa and Sertoli-Leydig tumours respectively). The small numbers and indolent course (median time to relapse of 5 years, as the authors state) make such trials challenging.
- 'Treatment statements for SCST: post-operative chemotherapy may be offered for stage II-IV disease and for stage I poorly differentiated Sertoli-Leydig tumours with heterologous elements or retiform component, but no prospective data support adjuvant chemotherapy for stage II-IV in the absence of macroscopic disease. BEP has long been the default; carboplatin and paclitaxel is also active, without prospective comparison to BEP (the authors cite two retrospective reports). Repeat resection is offered for recurrence when feasible, with no standard for unresectable metastatic disease. A GOG trial was ongoing.'
- 'Trial feasibility: the authors state phase III trials are unrealistic in SCST but randomised phase II trials are possible with strong international cooperation. The phase II ALIENOR trial (chemotherapy with or without bevacizumab in recurrent SCST, NCT01770301) had randomised 48 of a planned 60 patients in under 3 years, which they cite as evidence of feasibility. Possible randomised designs: first-line BEP versus carboplatin alone or with paclitaxel, or post-operative chemotherapy versus hormonal therapy after resection of recurrence; the challenge is the number of patients needed in this slow-growing disease. Overall survival may be an unrealistic endpoint in slow-growing tumours such as SCST.'
- 'General recommendations for rare ovarian tumours: harmonised international histopathological diagnostic criteria and expert pathological review before trial or registry entry; international registries with clinical samples and tumour banks; prospective single-arm studies with common data elements allowing pooled analysis; individual-patient meta-analyses; translational and molecular characterisation; and Bayesian designs that borrow prior external data to strengthen small randomised trials.'
- 'Paediatric points (GCT, not SCST): the authors state that pre-menarchal girls with ovarian GCT receive JEB (bleomycin, etoposide, carboplatin) rather than BEP, and that randomised trials in poor-prognosis or relapsed GCT may best be run as a subset of male and/or paediatric germ cell studies; this is the only paediatric-specific content in the text.'
relevance_to_jgct: International consensus on research priorities and trial feasibility for sex cord-stromal tumours, including whether ruptured stage IC granulosa cell tumours need chemotherapy; not specific to JGCT (the text never names the juvenile type), and its granulosa statements largely reflect adult-type disease.
