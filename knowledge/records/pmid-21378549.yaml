key_findings:
- FOXL2 immunostaining was present in 95 of 119 sex cord-stromal tumors (80%), including more than 95% of adult granulosa cell tumors, juvenile granulosa cell tumors, fibromas and sclerosing stromal tumors, and only 50% of Sertoli-Leydig cell tumors; specificity against 368 non-SCSTs was 99%.
- FOXL2 mutation was present in 39 of 42 adult GCT, 3 of 40 SLCT, 2 of 5 thecomas and 1 of 4 unclassified SCST; FOXL2, inhibin and calretinin together stain essentially all SCST.
relevance_to_jgct: FOXL2 protein is expressed in more than 95% of JGCT despite the absence of the mutation.
