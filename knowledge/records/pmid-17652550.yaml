key_findings:
- JGCT arising in the testis of a neonate.
- Chromosome analysis of the tumor showed a normal male karyotype 46 XY.
- Histopathology and immunohistochemistry showed 2 well-differentiated epithelial-like and smooth muscle-like components.
- Testicular JGCT of neonates and infants is described as frequently associated with abnormal sex chromosome and ambiguous genitalia.
