key_findings:
- 23 children (5-176 months) with ovarian SCST from 13 Italian centers, 2000-2009, staged with the COG system.
- 12 had juvenile granulosa cell tumor, 6 Sertoli-Leydig, 3 fibrothecoma, 2 sclerosing stromal tumor.
- 9/23 had signs of hormonal secretion; two hospitalized for ovarian torsion.
- 21 maintained complete remission (follow-up 9-91 months); the 2 relapses were stage II Sertoli-Leydig cell tumors.
relevance_to_jgct: Italian pediatric registry series in which all 12 JGCT patients remained in remission.
