presentation:
- multifocal pelvic recurrence after stage IA
key_findings:
- 10-year-old girl with stage IA JGCT initially treated with resection only presented with extensive unresectable multifocal pelvic recurrence.
- Treated with surgery, chemotherapy (cisplatin/paclitaxel alternating with cisplatin/cyclophosphamide/etoposide/bleomycin), myeloablative chemotherapy (carboplatin/etoposide/melphalan) with autologous bone marrow transplant, and pelvic radiation.
- In complete remission 69 months after her recurrence.
- Authors state advanced and recurrent JGCT carries a very poor prognosis.
relevance_to_jgct: Recurrence after stage IA resection-only; durable remission after multimodal salvage including high-dose chemotherapy with autologous transplant and radiation.
