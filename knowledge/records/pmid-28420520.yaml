key_findings:
- 22-year-old patient with Ollier disease complicated by malignant transformation to chondrosarcoma and JGCT of the right ovary.
- Authors state JGCT should be considered a leading diagnosis when an ovarian mass is found in young patients with enchondromatosis (Ollier disease and Maffucci syndrome).
- Authors state that a large unilateral multilocular-solid ovarian mass in a female with enchondromatosis allows the specific diagnosis of granulosa cell tumor with high accuracy.
relevance_to_jgct: Imaging report of the Ollier disease-JGCT association together with chondrosarcoma.
