key_findings:
- 6-year-old girl with precocious pseudo-puberty (premature thelarche, vaginal discharge, elevated estrogen) and a 6 x 4 x 3 cm solid pelvic tumor on MRI.
- Laparoscopic left salpingo-oophorectomy (3 ports, 5-mm instruments) of a non-invasive mobile tumor.
- 'Histopathology: JGCT with intact capsule (FIGO 1a); no chemotherapy.'
- Signs of precocious puberty resolved within 3 months; no recurrence after more than 3 years follow-up.
- Authors note minimally invasive surgery of solid ovarian tumors in children remains controversial.
