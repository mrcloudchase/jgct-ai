key_findings:
- Transgenic Drosophila expressing WT AKT1 and four JGCT pathogenic variants.
- Mutant AKT1 increased wing surface and reduced trichome density (larger cells); in ovarian follicular cells mutant AKT1 associated with plasma membrane and caused morphological abnormalities and increased cell size.
- Proteomics showed changes in glycolysis and Rho GTPase signaling; transcriptomics showed gain of function for a subset of genes but weaker activation of others than WT AKT1.
relevance_to_jgct: Model-organism functional study of JGCT AKT1 variants.
