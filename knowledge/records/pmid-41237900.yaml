key_findings:
- Transgenic Drosophila expressing human WT AKT1, four JGCT-derived AKT1 tandem duplications (T1, T5, T12, T15) and the Q79K-W80R double mutant; mutant proteins showed stronger phosphorylation than WT.
- Mutant AKT1 in ovarian follicle cells caused abnormally enlarged follicle cells, nuclei closer to the basal membrane (polarity defects), and abnormal dorsal appendages; the effect was strongest for Q79K-W80R.
- In wings, mutant AKT1 increased wing surface and decreased trichome density, indicating larger cells (growth) rather than more cells.
- 'Proteomics: 255 DEPs between all mutants and WT AKT1 (202 up, 53 down), enriched for Rho GTPase signaling, autophagy, cytoskeleton organization and transport; WT AKT1 overexpression affected glycolysis.'
- 'RNA-seq: 624 DEGs between mutants and WT (353 up, 271 down); some genes showed gain of function while others were less activated than by WT AKT1, i.e. partial loss of function; T15 (smallest insertion) had the fewest DEGs.'
- 'Background stated by authors: more than 60% of JGCT samples harbored in-frame AKT1 duplications in their earlier series.'
relevance_to_jgct: Model-organism functional study showing that JGCT-derived AKT1 duplications and Q79K-W80R drive cell growth, polarity defects and complex gain- and loss-of-function transcriptional effects.
