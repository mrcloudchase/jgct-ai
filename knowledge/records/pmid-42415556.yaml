key_findings:
- 'Retrospective Hong Kong Children''s Hospital cohort of 68 patients with 45,X/46,XY mosaicism (1990 to 2023; 35 raised female, 33 raised male); histology was available for 49 patients and gonadal tumors were found in 11 (22.4%): 6 of 34 raised female (17.6%), 5 of 13 males with abnormal genitalia (38.5%), none in males with normal genitalia.'
- 'One of the 11 tumors was a juvenile granulosa cell tumor (Table 2, patient 11): raised male, referred for abnormal genitalia, external genitalia score 6.5, karyotype mos 45,X[23]/46,X,idic(Y)(p11.3)[7], genetic diagnosis at 0.1 years, gonadectomy at 5 years, right gonad juvenile granulosa cell tumor, left testis atrophic; immunohistochemistry not done.'
- The other tumors in the table were gonadoblastoma, intratubular germ cell neoplasia and one seminoma; the JGCT is the only sex cord-stromal tumor listed. The text does not discuss the JGCT case beyond the table.
- Authors conclude gonadal tumor risk is higher in less masculinized males and that females may develop tumors across a wide age range (youngest 1.3 years), and advocate individualized surveillance.
relevance_to_jgct: Documents a single JGCT arising in a gonad of a child with mosaic 45,X/46,X,idic(Yp) DSD, relevant to gonadal tumor spectrum and Y-chromosome material in dysgenetic gonads, but with no JGCT-specific detail beyond one table row.
