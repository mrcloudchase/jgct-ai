key_findings:
- 3-month-old boy, term birth, with a right testis enlarged for one month; hard, mobile, painless mass; penis and left testis normal.
- 'Ultrasound: near-complete replacement of the right testis by a 3.7 x 2.2 x 2.5 cm multicystic mass without Doppler vascularity. Serum AFP and beta-hCG normal for age; karyotype 46,XY.'
- 'Right radical inguinal orchiectomy: 4.1 x 2.8 x 2.2 cm testis with a unilocular cystic mass containing pinkish fluid; sheets of cells with oval nuclei and abundant cytoplasm, rare mitoses. Immunohistochemistry positive for inhibin, vimentin, smooth muscle actin, S-100 and CD99; negative for PLAP and CD117.'
- 'Discussion (literature-based, authors'' statements): testicular JGCT is mostly seen in the first 6 months of life (about 90% under 1 year); fewer than 50 cases reported, all benign; about 20% of reported cases have chromosomal anomalies (Y structural abnormalities, XO/XY mosaicism) and some genital ambiguity; only two bilateral cases reported (both intra-abdominal testes).'
- Authors note the benign outcome suggests a role for testis-sparing surgery (enucleation) when healthy tissue remains, but their centre's usual practice remains radical inguinal orchiectomy with surveillance (chest radiograph, abdominopelvic ultrasound); AFP is physiologically high in infants so elevation under 1 year does not by itself indicate yolk sac tumor.
relevance_to_jgct: Typical infant testicular JGCT (multicystic, normal markers, 46,XY, inhibin positive) with a review of the benign behaviour and orchiectomy versus testis-sparing options.
