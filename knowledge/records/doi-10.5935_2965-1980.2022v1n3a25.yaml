key_findings:
- A female patient (age not stated; G0P0A0, first sexual activity at 15 years) was sent to the gynaecology emergency service with severe diffuse abdominal pain and vomiting; an outside ultrasound had shown a hypogastric/pelvic mass.
- Examination found significant hair growth on the upper lip and linea alba and a palpable mass from the pubic symphysis to the umbilicus; serum estradiol and testosterone were reported as increased (no values given) and beta-hCG was negative.
- 'Imaging: ultrasound showed a 14.7 x 11.9 x 7.5 cm heterogeneous, mainly hypoechoic mass with cystic areas (700 cm3); CT 14.0 x 12.4 x 9.1 cm (about 820 mL), solid and heterogeneous with cystic areas; MRI 14.3 x 12.9 x 8.1 cm (747 mL) in the left ovarian fossa, enhancing, without diffusion restriction, displacing the uterus posteriorly and to the right.'
- Left oophorectomy removed a mass of about 20 cm; the case history says morphology and histochemistry favoured granulosa cell tumour, and the stated diagnosis is juvenile-type granulosa cell tumour.
- The authors cite in their discussion that JGCT is about 5% of granulosa cell tumours, is associated with Ollier disease and Maffucci syndrome, that stage is the main prognostic factor, and that late recurrence occurs (longest cited time 40 years), so lifelong follow-up with inhibin B is advised.
- 'Differential list given: endodermal sinus tumour, small cell carcinoma of hypercalcaemic type, thecoma, fibroma, fibrosarcoma. Stage, histological details (mitoses, immunohistochemistry), adjuvant treatment and follow-up are not reported.'
relevance_to_jgct: Radiology case report of a large (about 20 cm) androgen/oestrogen-producing ovarian tumour labelled juvenile-type granulosa cell tumour in a patient of unstated age; imaging features and differential diagnosis described, no stage or outcome.
