notes: 'Language read: Portuguese; figures not readable in the text extraction. The patient''s age is not given (only first sexual activity at 15 years and cannabis/tobacco use for 1.5 years), so she may be an adolescent or older; the ''juvenile'' label rests on the authors'' diagnosis line, while the case history only says ''granulosa cell tumour'' favoured, with no histological description. Hirsutism with raised testosterone is unusual for JGCT. Size of the mass differs between imaging (about 14 cm) and surgery (about 20 cm) as stated.'
