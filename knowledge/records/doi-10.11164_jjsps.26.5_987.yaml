notes: 'Japanese with English abstract; OCR text legible with garbled tables. Unusual for JGCT: bilateral ovarian involvement, adrenal-region mass, no hormone secretion, no theca component in the adrenal mass, stage IV at diagnosis, death within 5 months; the diagnosis rests on 1990-era morphology only. The drug dose lines for the second regimen are OCR-damaged (VP16 100 mg/m2, DTIC and cisplatin 20 mg/m2 x 5 days as read). Authors'' literature statements on prognosis are theirs.'
