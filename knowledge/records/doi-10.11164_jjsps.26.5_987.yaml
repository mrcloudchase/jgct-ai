alterations: []
treatments:
- regimen: bilateral salpingo-oophorectomy with partial resection of right adrenal-region tumour, then cyclophosphamide, vincristine, adriamycin, cisplatin; later VP16, DTIC and cisplatin
  setting: primary surgery plus chemotherapy for stage IV
  n: 1
  outcome: no response; died 4.5 months from presentation
presentation:
- constipation then abdominal pain and rapid abdominal distension
- large bloody ascites and right pleural effusion
- no precocious puberty or secondary sex characteristics
key_findings:
- A 3-year-old girl with constipation, abdominal pain and rapidly increasing distension had bilateral ovarian tumours and a right adrenal-region tumour on ultrasound and CT with massive ascites; she had no vaginal bleeding or secondary sexual characteristics, and urinary estrogens, androgens and progesterone were age-appropriate.
- 'Blood tests: white cells 27,500/mm3, LDH 4,330 IU/l (isozymes 1 and 2 high); other tumour markers normal; bone marrow had no abnormal cells. At surgery there was bloody ascites; both ovarian tumours were encapsulated (right 10 x 7 x 6 cm, 856 g; left 8.5 x 7.5 x 6 cm, 670 g), and a tumour at the right adrenal region reached the diaphragm and involved the inferior vena cava and could not be removed.'
- Both ovaries were removed with the tubes and the adrenal tumour partly resected; about 100 cc of bloody pleural fluid was taken. Ascitic and pleural fluid cytology was class V. The authors staged the case FIGO IV (bilateral ovaries, dissemination to the adrenal capsule, pleural and peritoneal malignant cells).
- 'Histology: granulosa cells with scant cytoplasm in macrofollicular and diffuse patterns surrounded by theca cells, many mitoses, and the resected right adrenal region mass (5 x 4 x 3 cm) was separated from adrenal tissue by its capsule and showed the same granulosa-cell pattern without theca cells. The diagnosis was JGCT (no immunohistochemistry or molecular testing reported).'
- Chemotherapy with cyclophosphamide 1,200 mg/m2, vincristine 1.5 mg/m2, adriamycin 40 mg/m2 and cisplatin 90 mg/m2 gave only a transient effect; bone, bone marrow, oral cavity and both orbits became involved, and VP16, DTIC and cisplatin did not stop growth. She died of respiratory arrest thought to be caused by intracranial metastasis 4.5 months after presentation; no autopsy; blood and urine sex hormones stayed normal even during metastasis.
- The authors attribute the course to an undifferentiated tumour with no hormone production; in their table of 11 Japanese cases (their review) this is the only bilateral case without precocious puberty.
relevance_to_jgct: Rapidly fatal bilateral stage IV tumour in a 3-year-old called JGCT without hormone production or precocity; poor response to cyclophosphamide, vincristine, adriamycin and cisplatin; unusual features raise the question of classification.
