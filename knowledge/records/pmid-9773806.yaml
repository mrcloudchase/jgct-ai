key_findings:
- 19-year-old woman with refractory JGCT had persistent disease after PVB (cisplatin, vinblastine, bleomycin) and multiple high-dose ICE (ifosfamide, carboplatin, etoposide) with peripheral stem cell support.
- Achieved stable disease for 4 months with low dose intensity gemcitabine 500 mg/m2/week (planned 1250 mg/m2/week).
- Dose intensity limited by myelosuppression, especially thrombocytopenia.
relevance_to_jgct: Gemcitabine activity (stable disease) in heavily pretreated refractory JGCT.
