key_findings:
- 'Thirty-five ovarian sex cord-stromal tumors at a North Indian cancer center (2019 to 2023), 11.4% in children or adolescents: adult granulosa cell tumor commonest, then fibroma, Sertoli-Leydig, juvenile granulosa cell and steroid cell tumors; 57.7% stage I; 5-year survival 95.5% over a median 36 months.'
relevance_to_jgct: JGCT among a mixed Indian SCST series; number not stated in the abstract.
