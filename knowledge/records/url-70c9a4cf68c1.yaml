- '52 patients with ovarian tumors enrolled; 41 presented: SLCT (n=22), juvenile granulosa cell tumor (n=14), Sertoli cell tumor (n=4), gynandroblastoma (n=1).'
- 'JGCT row of table: n 14; age at diagnosis median 9 (<1-18) years; DICER1+ 1/12 (8%); thyroid nodules 1 (7%); other (non-thyroid) tumors 0; recurrence 1 (7%); overall survival 13 (93%); OS months median 28 (15-223).'
- Germline DICER1 mutations in 11 of 32 tested (34%) overall and 56% of SLCT; 'as well as in one patient with juvenile granulosa cell tumor and one with gynandroblastoma.'
- Pathology centrally reviewed; germline DICER1 testing performed.
