key_findings:
- Newborn presented with unilateral scrotal swelling; histopathology and immunohistochemistry confirmed JGCT.
- Follow-up at 6 months after surgery did not show any recurrence.
- Authors state testicular JGCT is considered benign because metastasis has never been reported, and testicular-sparing surgery is the recommended treatment.
