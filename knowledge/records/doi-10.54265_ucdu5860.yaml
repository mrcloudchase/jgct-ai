key_findings:
- A 6-year-old girl presented with diffuse abdominal pain for 1 month with abdominal distension, nausea, vomiting and loss of appetite, worse over the last day.
- Abdominal and pelvic CT showed a heterogeneous expansile lesion with a cystic component and solid mural areas that enhanced with contrast, measuring about 10.6 x 9.6 x 10.2 cm, with regular contours, near the right adnexal region and without signs of invasion of adjacent structures.
- Exploratory laparotomy found a moderate amount of serohaematic fluid and a solid-cystic right ovarian tumour of about 12 cm in diameter with rupture and active capsular bleeding; right salpingo-oophorectomy with omentectomy was performed.
- Pathology showed a sex cord tumour compatible with juvenile granulosa cell tumour.
- The authors state, in their discussion, that treatment is surgical with resection of all tumour, that JGCT is considered borderline but needs oncological follow-up because relapse usually occurs at 5-10 years, and that prognosis is favourable when diagnosed early with adequate resection.
- The abstract does not report tumour stage, hormone or tumour-marker levels, immunohistochemistry, adjuvant treatment or any follow-up.
relevance_to_jgct: Meeting-abstract case of ovarian JGCT in a 6-year-old with a ruptured 12 cm tumour treated by salpingo-oophorectomy and omentectomy; no stage, markers or outcome given.
