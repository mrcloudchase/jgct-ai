key_findings:
- Of 34 pediatric testicular tumors in North West England (1998 to 2018), 20 were prepubertal, including 4 sex cord-stromal tumors (1 juvenile granulosa cell tumor, 2 Sertoli cell, 1 Leydig cell); 6 patients had testis-sparing surgery; overall survival 97%.
relevance_to_jgct: One testicular JGCT in a 20-year UK regional series.
