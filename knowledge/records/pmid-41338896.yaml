key_findings:
- Female in early adolescence with chemoresistant JGCT and extensive peritoneal recurrence after initial surgery and systemic therapy.
- Underwent cytoreductive surgery followed by hyperthermic intraperitoneal chemotherapy (HIPEC) with cisplatin, with a favourable postoperative course.
- Authors present CRS plus HIPEC as a promising approach for selected chemoresistant peritoneal JGCT and call for further studies.
relevance_to_jgct: One of few reports of CRS-HIPEC for relapsed, chemoresistant peritoneal JGCT.
