key_findings:
- Three cases of the juvenile type of granulosa cell tumor, with ultrastructural study of one.
- Variant described as encountered almost exclusively in the first two decades, with macrofollicular or diffuse pattern, often extensive luteinization and hyperchromatic nuclei.
- One patient developed precocious pseudopuberty.
- Electron microscopy supported granulosa cell nature; spectrum from granulosa cells to fibroblast-like/theca-like stromal cells; intermediate cells with smooth endoplasmic reticulum proposed as possible steroid source.
relevance_to_jgct: Early ultrastructural characterization of JGCT soon after its recognition as an entity.
