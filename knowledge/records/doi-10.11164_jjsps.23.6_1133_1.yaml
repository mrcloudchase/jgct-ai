key_findings:
- A 7-year-old girl developed sudden abdominal pain at night and was referred for suspected appendicitis; ultrasound showed a solid right ovarian tumour.
- At laparotomy a 4.5 x 3.5 x 2.5 cm, 55 g right ovarian tumour that had twisted on its pedicle was removed; pathology was juvenile granulosa cell tumor, Stage Ia, and no hormonal abnormality was found.
- The authors state that granulosa cell tumour accounts for about 10% of paediatric solid ovarian tumours and is rare in children.
relevance_to_jgct: Small stage Ia JGCT in a 7-year-old presenting as torsion with an acute abdomen and no hormonal abnormality.
