key_findings:
- 'A male infant born at 34 weeks (Apgar 9 and 10) had an enlarged left testis noticed at the second-month check: an indurated, painless mass of about 3 cm without scrotal involvement; the right testis and penis were normal.'
- Ultrasound showed a 25 x 35 x 20 mm testis with heterogeneous parenchyma, multiple anechoic spaces up to 14 mm and marked colour-Doppler vascularity; alpha-fetoprotein and beta-hCG were normal; CT of pelvis, abdomen and chest showed no secondary lesions.
- Left orchiectomy gave a 15 g, 45 x 25 x 20 mm testis with parenchyma replaced by cysts of 3-15 mm with mucoid contents and yellowish-white solid areas.
- Histology showed cystic follicle-like spaces lined by granulosa cells and filled with basophilic material, polyhedral cells with round to oval hyperchromatic nuclei without nuclear grooves, a mitotic count of 6 per 10 high-power fields, no Call-Exner bodies, surrounding spindle (theca-like) cells and remnant immature seminiferous tubules; the spermatic cord was unremarkable.
- There were no postoperative complications and at 8 months after surgery the patient was well with no evidence of disease on chest, abdomen and pelvis CT.
- The authors cite in their review that testicular JGCT has not been reported to recur or metastasise, that orchiectomy is considered curative, and that cited series report associated urogenital malformations in 17% and Y-chromosome anomalies in 20%.
relevance_to_jgct: Classic infantile testicular JGCT (3 months, left testis, normal markers, 6 mitoses/10 HPF) cured by orchiectomy with 8 months of disease-free follow-up; immunohistochemistry and genetics not reported.
