key_findings:
- 'The Tübingen University Women''s Hospital identified all patients treated 2000-2015 with a diagnosis of malignant ovarian germ cell or sex cord-stromal tumour: 72 patients, of whom tumour material from 68 was supplied by 12 pathology institutes.'
- 'The study cohort comprised 19 malignant germ cell tumours and 53 sex cord-stromal tumours: adult granulosa cell tumour n = 45, juvenile granulosa cell tumour n = 4, Sertoli-Leydig cell tumour n = 4.'
- Specialist gynaecopathology second review by two pathologists had been completed in 43 cases; the original diagnoses were confirmed in 33 (76%).
- The abstract gives no age, stage, treatment or outcome for the four juvenile granulosa cell tumour patients, and does not say whether they were among the cases already re-reviewed.
- The authors cite recent work in which up to 20% of adult granulosa cell tumour diagnoses were made in error.
relevance_to_jgct: Single-centre count of 4 ovarian JGCT among 72 malignant germ cell and sex cord-stromal tumours, with the finding that second pathology review changed about a quarter of original diagnoses (all types combined).
