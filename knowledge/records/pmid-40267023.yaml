notes: Abstract only, retrieved from Europe PMC REST API via WebFetch (model-assisted extraction); PMC12305807 is listed but full text was not returned. Conflict with pmid-40272823 on event-free survival by stage (3-year EFS 80.2% in stage IA here vs 48 of 52 stage IA patients relapse-free after observation in STEP) and on whether stage predicts outcome. Both agree on mitotic index above 19 per 10 HPF.
