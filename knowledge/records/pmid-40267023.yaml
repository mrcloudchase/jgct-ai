key_findings:
- 70 patients with ovarian juvGCT diagnosed 2001-2024; central pathology review in 80% (56/70).
- 'Stage: IA 36% (25/70, three IX), IC1 29% (20/70), IC2-IC3/ICX 17% (12/70), II-IV 14% (10/70); only 14/70 (20%) had complete FIGO staging.'
- Median tumor size 12.0 cm (range 4.6-30.0 cm); 97% unilateral.
- Recurrence in 14 patients, median time to recurrence 8.5 months (range 3-32); 93% (13/14) within two years. Eight patients died, all from recurrent juvGCT.
- 3-year EFS 73.2% and 3-year OS 91.7% for all patients. 3-year EFS stage IA 80.2%, IC1 87.4%, IC2-IC3 63.6%, II-IV 48.0% (p=.05).
- 'High mitotic index (>19 per 10 HPF): 3-year EFS 55.5% vs 100.0% for low/intermediate MI (p<.01). All 13 recurrent patients with known MI had high MI at diagnosis; no deaths with low/intermediate MI.'
- Two stage IA/IX patients with high MI and no adjuvant chemotherapy died of recurrent juvGCT at 64 and 69 months.
- Among low-risk surgery-only patients, tumor dimension (HR 1.13 per cm, p=.03) and MI as continuous variable (HR 1.15, p=.02) associated with recurrence.
- JuvGCT was not detected in any sampled lymph node; malignant peritoneal washings were not seen without rupture or spread beyond the ovary.
- Inhibin B was elevated at recurrence in 60% (3/5) of patients with elevated inhibin B at diagnosis.
- Authors strongly recommend MI assessment for all juvGCTs; suggest adjuvant chemotherapy for low-stage, high-MI tumors could be considered individually, and tumor testing for targetable alterations in higher-risk or recurrent disease.
relevance_to_jgct: Largest international registry series of ovarian JGCT with central mitotic index review; establishes mitotic index >19/10 HPF as the strongest prognostic factor and reports stage-specific outcomes.
