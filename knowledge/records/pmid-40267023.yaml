key_findings:
- International OTST and PPB/DICER1 Registry cohort of 70 ovarian JGCT diagnosed 2001 to 2024; 57 of 70 (81%) were FIGO 2014 stage I.
- 21 of 70 (30%) received platinum-based adjuvant chemotherapy.
- '3-year EFS: stage IA 80.2%, IC1 87.4%, IC2-IC3 63.6%, II-IV 48%.'
- Every patient with recurrence and known mitotic index had more than 19 mitoses per 10 HPF at diagnosis.
- Outcomes were worse with FIGO stage IC2 or higher and with more than 19 mitoses per 10 HPF; authors strongly recommend mitotic index assessment for all JGCT.
relevance_to_jgct: Largest North American registry report on ovarian JGCT; independently identifies high mitotic index (above 19 per 10 HPF) and stage IC2 or higher as adverse factors.
