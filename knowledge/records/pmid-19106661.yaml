key_findings:
- 'Review of granulosa cell tumour management: serum inhibin is useful for diagnosis in postmenopausal women and for monitoring after oophorectomy; surgery remains the most effective treatment; about 80% of patients with advanced tumours die of recurrence; the gsp oncogene and high GATA-4 expression in juvenile granulosa cell tumours may provide prognostic markers.'
relevance_to_jgct: Early mention of gsp (GNAS) and GATA-4 as candidate prognostic markers in JGCT.
