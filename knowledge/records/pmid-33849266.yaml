key_findings:
- Girl aged 2.17 years with three months of breast development and rapid growth; Tanner B3P2A1; single cafe au lait patch; bone age 5 years.
- Bilaterally enlarged multicystic ovaries (76 mL left, 139 mL right); suppressed LH/FSH; estradiol 130 pg/mL; tamoxifen 20 mg daily started.
- After seven weeks, progression with menorrhagia, estradiol 184 pg/mL; right ovary now normal (1.8 mL) and a large left solid/cystic tumour (850 g) excised.
- Histology JGCT FIGO stage IA.
- Tumour DNA showed no mutation in GNAS, exon 3 of AKT1, or FOXL2.
- Authors describe bilateral ovarian activity progressing to unilateral JGCT as novel and raise a possible relationship with McCune-Albright syndrome.
relevance_to_jgct: Informative for differential diagnosis of ovarian precocious pseudo-puberty (MAS vs JGCT) and for a JGCT negative for GNAS, AKT1 exon 3 and FOXL2.
