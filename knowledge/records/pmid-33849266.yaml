notes: Estradiol in the cited paper is quoted in pg/mL; detection limit stated as <10 ng/mL (likely pg/mL, as printed). The figure legend for Fig 2 says 'right ovary' while text says left. Authors calculated ovarian volumes from ultrasound dimensions with assumptions; these are estimates. Possible MAS not excluded. The authors' gene-expression comparison (GEO dataset, B-Raf enrichment) is exploratory.
