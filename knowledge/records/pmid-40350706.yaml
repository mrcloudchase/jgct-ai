key_findings:
- Systematic review/meta-analysis of 12 retrospective studies (695 stage IC GCT patients; 255 adjuvant chemotherapy, 440 observation).
- No significant difference between chemotherapy and observation in recurrence (OR 1.32), mortality (OR 0.83), 5-year DFS or OS.
- 'JGCT subgroup: 5 studies, 33 JGCTs; of 17 who received adjuvant chemotherapy 4 relapsed; none of 16 observed relapsed; OR 4.20 (95% CI 0.51-34.28; p=0.180).'
- Authors caution the JGCT sample is small and that non-randomized allocation likely assigns higher-risk patients to chemotherapy; stage IC1-IC3 subgroups could not be analysed.
relevance_to_jgct: Only meta-analysis of adjuvant chemotherapy in stage IC GCT with a JGCT subgroup; finds no demonstrable benefit.
