key_findings:
- Of 67 pediatric ovarian tumors at three referral centers (1980 to 2003), 37 were malignant, including 7 juvenile granulosa cell tumors, 11 immature teratomas, 7 mixed germ cell tumors, 5 dysgerminomas and 1 small cell carcinoma; pain was the commonest symptom, precocious puberty occurred in 7 patients, and torsion was more frequent with benign tumors (23% versus 8%).
relevance_to_jgct: JGCT accounted for 7 of 37 malignant pediatric ovarian tumors.
