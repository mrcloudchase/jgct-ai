notes: Inhibin B serum level was normal, and tumor inhibin IHC was not reported. Focal poorly differentiated Sertoli-Leydig-like areas raise a possible mixed sex cord-stromal tumor; the authors diagnosed JGCT. No follow-up reported. Mitotic index 3 per HPF as written.
