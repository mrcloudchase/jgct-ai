notes: Original in Polish with English abstract; read in Polish. The authors state they cannot tell whether the tumor shares a genetic basis with, is independent of, or is a complication of the earlier brain tumor treatment. Text gives units for post-op testosterone as 464 pg/ml and 0.464 ng/ml (consistent). 'No follow-up duration' is stated beyond normal control hormone tests. Literature statements (e.g. incidence figures) are cited, not original.
