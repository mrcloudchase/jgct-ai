key_findings:
- DICER1 RNase IIIb domain mutations in 30 of 102 nonepithelial ovarian tumors (29%), predominantly Sertoli-Leydig cell tumors (26 of 43, 60%).
- Mutations restricted to codons encoding metal-binding sites of RNase IIIb; somatic in all 16 samples with germline DNA available.
- Mutant DICER1 had reduced RNase IIIb but retained RNase IIIa activity.
relevance_to_jgct: Landmark paper establishing somatic DICER1 hotspot mutations in ovarian SCST, the basis for DICER1 testing in JGCT differential diagnosis.
