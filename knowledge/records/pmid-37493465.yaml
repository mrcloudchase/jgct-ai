notes: Whether the first tumor was a pure JGCT or already part of the gynandroblastoma was a retrospective interpretation after the second tumor. The authors cite 6 of 28 gynandroblastoma cases with JGCT component in the literature. Follow-up is short (2 years). Date of the carboplatin/paclitaxel course relative to surgery is not specified in detail.
