presentation:
- hirsutism (73.5% of all virilizing tumors)
- clitoromegaly (68.4%)
- voice change (60.7%)
- menstrual irregularity (n = 79)
- elevated 17-hydroxyprogesterone (70%)
- elevated DHEAS (18.3%)
key_findings:
- PRISMA systematic review of 117 pediatric patients under 20 with virilizing ovarian tumors (PubMed and Google Scholar, English only); median tumor size 6.6 cm, 8 bilateral.
- JGCT and Sertoli-Leydig cell tumor were the most common types, JGCT most common under 8 years and Sertoli-Leydig over 13 years; the abstract gives no per-type counts.
- Children under 8 had shorter diagnostic latency and fewer hyperandrogenic signs.
- Elevated 17-OHP or DHEAS should not exclude a virilizing ovarian tumor; recurrence was rare over a median 1 year of follow-up.
relevance_to_jgct: Shows JGCT can present with virilization and is the leading virilizing ovarian tumor in young children, a differential relevant to endocrine presentation.
