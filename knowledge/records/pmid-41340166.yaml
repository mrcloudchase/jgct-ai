key_findings:
- 'Systematic review of 117 pediatric virilizing ovarian tumors (median age 15): hirsutism 73.5%, clitoromegaly 68.4%, voice change 60.7%; children under 8 had shorter diagnostic latency and fewer hyperandrogenic signs; 17-hydroxyprogesterone was elevated in 70% and DHEAS in 18.3%; median tumor size 6.6 cm, bilateral in 8.'
- Juvenile granulosa cell tumors were the most common virilizing tumor under 8 years and Sertoli-Leydig cell tumors over 13; recurrence was rare over a median follow-up of 1 year.
relevance_to_jgct: JGCT is the leading virilizing ovarian tumor in young children; raised 17-OHP does not exclude it.
