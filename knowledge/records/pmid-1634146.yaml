key_findings:
- 'Flow cytometry on 33 analyzable JGCTs (27 Stage Ia, 2 Ic, 4 III): 18 (55%) diploid, 15 (45%) aneuploid; mean S-phase fraction 13.6%.'
- Ploidy and SPF not associated with stage; aneuploidy associated with high mitotic rate.
- Aneuploidy not associated with aggressive behavior in Stage Ia; among four Stage III, two diploid low-SPF alive and well, two aneuploid high-SPF recurred or died.
relevance_to_jgct: Early study of DNA ploidy as a prognostic marker in JGCT.
