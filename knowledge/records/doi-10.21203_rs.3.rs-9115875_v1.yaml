presentation:
- 2-month-old boy with testicular mass; AFP 244.19 ng/mL; elevated preoperative testosterone
key_findings:
- Single-center retrospective study (Beijing, Nov 2016 to Jun 2024) of 117 patients aged 0-14 years, 118 lesions, with pathology-confirmed prepubertal testicular tumors and preoperative scrotal ultrasound; 71.2% benign.
- 'One juvenile granulosa cell tumor (0.8% of lesions) in a 2-month-old: maximum diameter 3.9 cm, ''Swiss cheese'' multilocular mass with hypoechoic or isoechoic, hypervascular solid components; classified as predominantly cystic on ultrasound (Table 2).'
- In that infant AFP was 244.19 ng/mL (mildly elevated; all other non-germ-cell tumors had normal AFP) and preoperative testosterone was elevated, one of 9 patients with raised testosterone (2 Leydig cell tumors, 6 teratomas, 1 JGCT); beta-hCG normal in all.
- Authors (citing the literature) describe testicular JGCT as the most common congenital testicular tumor, typically in the first 6 months, benign and hormonally inactive, rarely recurring after testis-sparing surgery, and note that Leydig cell tumors are the most common sex cord-stromal tumor in children followed by JGCT.
- Cystic or cystic-dominant ultrasound pattern had a PPV of 96.1% for benignity (NPV 47.8%); solid or solid-dominant pattern had NPV 91.5% for malignancy (PPV 49.2%); with AFP above 300 ng/mL it gave PPV 94.7% and NPV 97.0% for yolk sac tumor. The abstract's claim that JGCT shows a 'pathognomonic' Swiss-cheese pattern rests on this single case plus literature.
relevance_to_jgct: Provides one imaging-pathology correlated infant testicular JGCT with mildly raised AFP and raised testosterone, and places testicular JGCT in the differential of cystic testicular masses; very small JGCT sample.
