notes: 'Preprint, not peer reviewed. JGCT data are from n=1; the ''pathognomonic'' wording is not supported by the numbers. Internal inconsistencies: text says JGCT is ''hormonally inactive'' while this case had raised testosterone; benign proportion 71.2% (abstract) vs 71.8% (discussion); Table 1 lists teratoma n=68 including immature, while text says 62 mature + 6 immature. Pathology images (Figure 4) not available as text; no JGCT-specific IHC or follow-up reported.'
