notes: Tumor called 'folliculoma' in the text; histology and IHC match JGCT per authors. Initial enucleation (tumorectomy) preceded recurrence at 9 months, consistent with the general concern about ovarian-sparing excision. Estradiol is listed as 750 pg/mL, within the quoted reference range. Insulin units in Table 1 are garbled in the source. Staging 'FIGO IA' for the recurrence is the authors' wording. Authors' statement about the recommended treatment and 5-year delay cites other sources.
