key_findings:
- Patient with hypothyroidism, insulin resistance, psoriasis and hirsutism from age 15; laparoscopic enucleation of a left ovarian tumor in 2018, FIGO IA.
- At 9 months follow-up, a 7 cm recurrent tumor in the left ovary; testosterone and insulin elevated; E2 750 pg/mL, CA-125 27.96 U/mL, AFP 3.2 kU/L.
- At 17 years, unilateral removal of the adnexa with staging after multidisciplinary consultations (patient requested hysterectomy and bilateral salpingo-oophorectomy; parental consent not granted).
- Two days after surgery total testosterone declined to 4.87 nmol/L; pathology confirmed unilateral FIGO IA relapse of JGCT; IHC alpha-inhibin, CD99, calretinin positive.
- Patient declined the recommended adjuvant chemotherapy.
- Authors suggest the androgen-secreting tumor may have influenced gender dysphoria.
relevance_to_jgct: Recurrence after ovarian-sparing enucleation (cystectomy) of stage IA JGCT; androgen-secreting JGCT.
