title: 'A giant ovarian juvenile granulosa cell tumour in an adolescent females: an uncommon case presentation'
journal: Sciences of Europe
year: 2023
first_author: Babuci V
study_type: case_report
tumor_site: ovary
n_jgct_patients: 1
age_range: 15 years
alterations: []
treatments:
- regimen: Left laparotomy with radical resection of the tumor and left fallopian tube (unilateral salpingo-oophorectomy)
  setting: primary
  n: 1
  outcome: discharged in satisfactory condition and referred to an oncology institute for further treatment decision; no follow-up reported
presentation:
- 12-month history of periodic abdominal pain
- abdominal enlargement
- amenorrhea
- 24 x 20 x 10.6 cm polyseptate cystic mass on CT
- moderate ascites
- anemia (hemoglobin 76 g/L)
key_findings:
- 15-year-old girl (menarche at 14, sexually active) with 12 months of periodic abdominal pain, abdominal enlargement and amenorrhea, who believed she was pregnant.
- 'CT: massive polyseptate, polylobed cystic formation 24.0 x 20.0 x 10.6 cm with intrastromal vessels and moderate free fluid; ovaries not identified; radiologic suspicion included yolk sac tumor of the left ovary. Hemoglobin 76 g/L; AFP and LDH within reference values.'
- 'Surgery: massive tumor from the left ovary without involvement of adjacent organs, up to 50 mL serous peritoneal fluid, enlarged regional lymph nodes, normal uterus and right adnexa; radical resection with the fallopian tube.'
- 'Histology: juvenile-type granulosa cell tumor, provisional stage pT1a, mitotic rate 40 per 10 fields, moderate nuclear atypia, extensive necrosis, with tumor infiltrating tubal tissue. No immunohistochemistry reported. Referred to oncology for further treatment; no follow-up.'
- Authors (discussion, literature-based) state JGCT is usually diagnosed before age 20, that juvenile forms have a higher mitotic index and more aggressive growth than adult forms, and that unilateral salpingo-oophorectomy is preferred for stage IA with long-term follow-up needed because of recurrence risk.
relevance_to_jgct: Giant (24 cm) ovarian JGCT with high mitotic rate (40/10 fields) and necrosis in a 15-year-old, illustrating preoperative imaging confusion with yolk sac tumor.
