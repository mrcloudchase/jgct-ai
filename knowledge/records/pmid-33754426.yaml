key_findings:
- Intra-abdominal cystic structure in a female fetus (one of dichorionic-diamniotic twins) detected at 30 weeks of gestation.
- Sonographic triad of ovarian cystic mass, polyhydramnios, and signs of fetal virilization suggested an androgen-secreting ovarian tumor.
- After delivery, acute ovarian torsion and intracystic hemorrhage required emergent surgery, confirming JGCT.
- Laboratory, clinical, and morphological features improved progressively after surgery.
relevance_to_jgct: Prenatally detected (fetal) androgen-secreting JGCT; extends the age range to before birth.
