key_findings:
- 'Nationwide French study: 6/30 JGCT patients had clinical hyperandrogenism and high plasma testosterone.'
- Intratumoral aromatase absent (n=5) or dramatically reduced (n=1) in 6/6 virilized patients vs conserved aromatase in 15/24 without virilization (p<0.05).
- SOX9 and FOXL2 expression did not differ between groups.
