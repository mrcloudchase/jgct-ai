key_findings:
- Review of prepubertal testicular and paratesticular tumours, a group distinct from postpubertal tumours, including germ cell tumours (teratoma, epidermoid cyst, yolk sac tumour) and stromal tumours (juvenile granulosa cell, Leydig cell, Sertoli cell); centralised pathology and collaborative trials have established management.
