key_findings:
- A girl aged 2 years 4 months seen at a family-health (PSF) unit in Porto Alegre, Brazil, in April 2003 had odourless vaginal discharge, pubic papules and bilateral breast buds; the mother reported at least two months of diaper-area redness and heavy discharge, treated repeatedly as candidiasis.
- Gonadotropins were suppressed (LH 0.09, FSH 0.1). Ultrasound, then MRI (August 2003) and Doppler (September 2003), showed a solid left ovarian mass with neovascularisation, about 3 x 2.1 x 2 cm on Doppler.
- Left oophorectomy was done in September 2003 and pathology showed JGCT; she then began chemotherapy cycles. The authors infer more advanced disease than stage I from the chemotherapy, but because referral feedback failed they could not establish the stage.
- 'The report''s point is about primary care: about five months passed between the first primary-care visit and surgery, and the primary-care team learned the outcome only through community health agents, students and the family.'
relevance_to_jgct: Brazilian primary-care report of isosexual pseudo-precocious puberty from JGCT in a toddler, first managed as recurrent candidiasis; illustrates diagnostic delay and lost follow-up.
