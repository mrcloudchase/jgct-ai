key_findings:
- A 36-year-old with a pituitary adenoma had bilateral ovarian masses (right ovary 15 cm) of multiple luteinized follicle cysts; the left ovary returned to normal size about 3 months after adenoma excision.
- The differential in pregnancy-type follicle cysts is cystic granulosa cell tumor, more likely juvenile; the cyst lining is identical to standard follicle cysts and lacks the immature mitotically active nuclei and follicular differentiation of JGCT.
relevance_to_jgct: Multiple luteinized follicle cysts as a mimic of cystic JGCT.
