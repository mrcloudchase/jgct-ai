key_findings:
- 10 patients 1995-2014; median age 21.5 years (13-36); stage IA 9, IC 1.
- Five had pelvic and para-aortic lymph node dissection with no nodal involvement.
- Three had adjuvant therapy (two chemotherapy, one radiotherapy).
- Four of five patients desiring pregnancy achieved five term pregnancies; no recurrence at median 58 months (3-113).
relevance_to_jgct: Turkish series supporting fertility-sparing surgery and showing no nodal involvement.
