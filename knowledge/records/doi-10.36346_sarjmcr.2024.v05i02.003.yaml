notes: 'Internal inconsistencies: the title and pathology line say juvenile granulosa tumor, yet the described morphology (grooved ''coffee bean'' nuclei, Call-Exner bodies) is classic adult-type, the abstract and conclusion discuss the adult form, the introduction says the objective was ''to report a series of 17 cases of TGA (adult)'', and the discussion refers to ''our three patients''. Ultrasound mass size is printed as ''69 x 68 cm'' (presumably mm). Follow-up duration not reported. Treat the JGCT diagnosis as unconfirmed (38 years, no IHC).'
