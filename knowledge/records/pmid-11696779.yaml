key_findings:
- 'Prepubertal Testis Tumor Registry: 43 stromal tumors; mean age at presentation 38 months overall and 1.5 months for juvenile granulosa cell tumors; no Leydig, Sertoli or juvenile granulosa cell tumor had metastases at presentation or during a mean 24.6 months of follow-up; one undifferentiated stromal tumor with frequent mitoses and local invasion metastasized.'
relevance_to_jgct: Registry confirmation that testicular JGCT behaves benignly.
