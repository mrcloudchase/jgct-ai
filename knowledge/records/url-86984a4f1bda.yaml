key_findings:
- The report presents five granulosa cell tumours of the ovary, four adult-type and one juvenile-type, with a brief literature review.
- The authors state that JGCT is only about 5% of GCT and that sexual pseudoprecocity is the usual presentation of the juvenile type, whereas adult type presents with vaginal bleeding.
relevance_to_jgct: Korean series with one JGCT; the abstract gives no details of that patient.
