key_findings:
- Retrospective descriptive thesis (Rabat children's hospital, paediatric surgery department A, January 1998 to February 2016) of 4 juvenile granulosa cell tumors; ages 3 months to 14 years, mean 8 years; the textbook chapters (anatomy, embryology, histology, physiology, classification, literature discussion) were not abstracted.
- 'Patient 1 (14 years, menarche at 13): 15 days of abdominal pain and distension; mass 22 x 21 cm, ascites on imaging, white peritoneal nodules at laparotomy; right adnexectomy; tumour 26 x 25.5 x 15 cm, 3 kg, no rupture; juvenile type with macrofollicular pattern; hormones not done for lack of means; no stage is stated.'
- Patient 1 relapsed 5 months after surgery (5.9 x 3.9 x 3.8 cm suprauterine lesion plus retroperitoneal and iliac nodes), received 3 courses of 'VIP' chemotherapy, later developed a sacral epidural mass, retroperitoneal nodal mass and a hepatic secondary, and was put on palliative analgesia, corticosteroids and cyclophosphamide; the thesis reports no later status.
- 'Patient 2 (3 years 4 months): haematuria; breast Tanner 3, pubic hair, vulvar hypertrophy; FSH 0.1, LH 0.07 mUI/ml (low), testosterone 0.05 ng/ml, estradiol and AFP normal; left ovarian cystic mass 62 x 40 mm on ultrasound (45 x 55 mm on CT); left adnexectomy; granulosa cell tumor of cystic type; no chemotherapy; uneventful follow-up.'
- 'Patient 3 (3 months 24 days): right genital swelling and abdominal distension with large ascites; right ovarian mass 39 x 40 x 40 mm on CT; bone age 2 years; estradiol 387 pg/ml, FSH 0.05 and LH 0.02 mU/ml (low), AFP 134.4 ''ug/ml'' as printed; right adnexectomy; juvenile granulosa tumor with luteinization; no chemotherapy; hormones and ultrasound normalised at 6 months and a photograph is captioned 4 years after surgery.'
- 'Patient 4 (8 months): vulvar bleeding with bilateral breast development (Tanner 2), 0.5 cm vaginal prolapse; right multiloculated ovarian mass 44 x 32 mm on ultrasound and 60 x 40 x 43 mm on CT; AFP 15 ng/ml; hormonal tests not done for lack of means; right oophorectomy; juvenile granulosa tumor; no chemotherapy; uneventful follow-up with a photograph captioned 3 years after surgery.'
- In the thesis's cases all tumours were unilateral, cystic in 2 and solid-cystic in 2, and all stained positive for vimentin, inhibin, CD99 and smooth muscle actin; the pathology descriptions say no cytonuclear atypia in the first two cases while the summary says atypia was evident.
- The authors cite the literature that FOXL2 402C>G occurs in about 10% of juvenile-type GCT (97% of adult-type) and that DICER1 exon 26/27 mutation was found in 1 of 14 juvenile tumours; none of their patients was tested.
relevance_to_jgct: Four-patient Moroccan paediatric series (infants to age 14) with one early relapse that progressed to metastatic disease on palliative care; two infants with very low gonadotropins and high estradiol.
