notes: 'Language read: French; PDF text extraction is noisy (accents, some Arabic and font-encoded headings; most front matter and figures empty). Read in full; the long discussion repeats published literature and is not abstracted except where the authors compare with their own cases. FIGO stage is not stated for any patient in the case sections. Possible overlap with doi-10.83129_toubkal-11437 / doi-10.83129_toubkal-9338 (2010 Rabat children''s hospital thesis, 2 JGCT aged 3 and 14 with one relapse), though tumour sizes and the stage/chemotherapy details differ between the documents; do not add the counts. Patient 3 has a very high AFP as printed (units probably ng/ml). Patient 2''s histology line does not use the word juvenile (''granulosa cell tumor of cystic type'') but the thesis counts it among the four juvenile tumours. Summary says estradiol was very high in the two patients tested, but patient 2''s estradiol is reported as normal.'
