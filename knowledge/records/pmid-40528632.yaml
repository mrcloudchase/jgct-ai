key_findings:
- ISUP/GUPS-sponsored TESST expert panel consensus (first meeting 2024) on classification and management of testicular sex cord-stromal tumours.
- Notes testicular SCST classification still relies on morphology, with some types (including granulosa cell tumour) defined by resemblance to ovarian counterparts, and that molecular findings have not yet impacted classification.
relevance_to_jgct: Pathology consensus framework that includes testicular juvenile granulosa cell tumour classification.
