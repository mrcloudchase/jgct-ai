key_findings:
- ISUP/GUPS-endorsed TESST expert panel (20 voting genitourinary pathologists) used a modified Delphi process with a 70% consensus threshold; live meeting 3/23/2024.
- Recommends that juvenile granulosa cell tumour of the testis be renamed 'benign juvenile granulosa cell tumour' (consensus on need to rename 12/15, 80%; on the name 15/15, 100%), to avoid overtreatment.
- 'Rationale: testicular JGCTs are a largely infantile entity (>90% within the first year of life), mostly hormonally inactive, a subset arise in dysgenetic gonads, and they appear to lack malignant potential; a limited genomic study found they do not harbour the alterations seen in ovarian JGCT.'
- 'Contrasts with ovarian JGCT: median age about 8 years, steroid hormone production, about 10% behave aggressively, and pathogenic AKT1 internal tandem duplications and hotspot GNAS variants.'
- Brisk mitotic activity predicts aggressive potential in Leydig and Sertoli cell tumours but not in juvenile granulosa cell tumour; JGCT is listed among invariably indolent testicular SCST types.
- Testicular adult granulosa cell tumour should be diagnosed only for prototypical morphology; FOXL2 p.C134W can support it (consensus 16/20, 80%).
relevance_to_jgct: International pathology consensus that testicular JGCT is benign and distinct from ovarian JGCT, recommending the name 'benign juvenile granulosa cell tumour'.
