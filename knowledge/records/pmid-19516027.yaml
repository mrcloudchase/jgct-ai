key_findings:
- Whole-transcriptome sequencing of four adult granulosa cell tumors identified the FOXL2 402C>G (C134W) missense mutation, then found in 86 of 89 additional adult-type GCT (97%), 3 of 14 thecomas (21%) and 1 of 10 juvenile-type GCT (10%), and absent from 49 other sex cord-stromal tumors and 329 ovarian or breast tumors.
relevance_to_jgct: 'The index FOXL2 paper: 1 of 10 JGCT carried the adult-type mutation.'
