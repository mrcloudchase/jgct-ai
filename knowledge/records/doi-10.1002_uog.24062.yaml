key_findings:
- A retrospective single-centre series from the Charles Nicolle Hospital (obstetrics-gynaecology department A), 2016 to 2019, covered six ovarian granulosa cell tumours.
- Adult-type GCT was found in 83.33% of cases; only one patient had a juvenile-type GCT.
- The JGCT was diagnosed at age 19; she had no signs of hyperoestrogenism and normal pubertal development.
- Pelvic ultrasound showed a heterogeneous pelvic mass, and she underwent emergency laparotomy for severe acute pelvic pain.
- For the series as a whole, pelvic pain was the most common symptom, inhibin B was measured in one case (high), and Demons-Meigs syndrome was diagnosed in 20% of cases.
relevance_to_jgct: A small series with a single JGCT (age 19, no oestrogenic signs); the abstract gives no stage, pathology detail or outcome for that patient.
