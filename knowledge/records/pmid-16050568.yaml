key_findings:
- 'Review with data from 62 children and adolescents with ovarian sex cord-stromal tumors prospectively reported to the German MAKEI protocols: juvenile granulosa cell tumors were the most frequent subtype, then Sertoli-Leydig and sclerosing stromal tumors; JGCT and SLCT showed greater mitotic activity, and high mitotic activity was associated with adverse outcome; prognosis correlated with FIGO stage.'
- Event-free survival 0.87 and overall survival 0.88 for the 62 patients; most stage II and III tumors responded to cisplatin-based chemotherapy; comparative genomic hybridization of 27 tumors showed mostly normal profiles with occasional whole-chromosome gains (such as 12) without consistent pattern; a prospective study began in 2005.
relevance_to_jgct: MAKEI experience establishing mitotic activity and stage as prognostic in pediatric JGCT.
