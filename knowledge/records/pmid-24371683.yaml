key_findings:
- 15-year-old with abdominal pain, vomiting, fever 38 C; corrected serum calcium 14.9 mg/dl (3.70 mmol/l) with PTH-i 10 pg/ml; CA-125 204 U/ml; AFP and beta-HCG normal.
- Hypercalcemia treated with saline, pamidronate (1 mg/kg) and furosemide; bone scan without metastasis.
- Right salpingo-oophorectomy, omentectomy and ascites drainage on day six; 120 x 90 x 65 mm tumor, intact capsule, 7 mitoses per 10 HPF.
- Positive for alpha-inhibin, calretinin, ER, PR, CD56, SMA; negative for TTF1, synaptophysin, chromogranin; FIGO IA; no FOXL2 mutation found.
- No adjuvant chemotherapy; calcium normal and no recurrence, with normal ultrasound 24 months after surgery.
- Authors describe this as the third reported JGCT with paraneoplastic hypercalcemia; of prior cases, an 11-year-old with stage III died of disease and a 25-year-old with stage IC was in remission at 10 months.
relevance_to_jgct: Documents paraneoplastic hypercalcemia in JGCT and the need to exclude small cell carcinoma of hypercalcemic type; no FOXL2 mutation.
