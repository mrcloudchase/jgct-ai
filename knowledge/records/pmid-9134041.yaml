key_findings:
- Of 198 childhood testicular tumours in the Kiel Paediatric Tumour Registry, 11 were JGCT (5.6%); average age at diagnosis 0.4 months.
- Infiltrative growth, dense cellularity and considerable proliferation were common; cytokeratins in 7/10 and smooth-muscle actin in 4/10 JGCTs.
- After complete removal (usually orchiectomy) no local recurrences or metastases; authors state adjuvant chemotherapy or lymphadenectomy not indicated.
relevance_to_jgct: Registry pathology series supporting surgery alone for infantile testicular JGCT.
