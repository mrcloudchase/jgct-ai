key_findings:
- 'Single-centre observational study (Aga Khan University Hospital histopathology laboratory, Karachi; January 1992 to July 2013): of 513 sex cord-stromal tumours (SCST) diagnosed, 39 (7.6%) were in patients under 21 years. Types: 15 juvenile granulosa cell tumours (JGCT, 38.4%), 11 sclerosing stromal tumours, 10 fibroma-thecoma group, 2 Sertoli-Leydig cell tumours, 1 sex cord tumour with annular tubules. No adult-type granulosa cell tumour was found.'
- JGCT age range 4 to 212 months (median 168 months in Table 2). JGCT was the majority type in the pre-menstrual group (6 of 9, 66.6%), and all 6 patients younger than 6 years had JGCT; 9 JGCT occurred in post-pubertal patients. Youngest patient in the series was 4 months old; no neonatal case.
- JGCT size was large, mean 16.2 cm (range 10 to 22 cm); cystic areas on gross examination in 10 of 15, with solid, haemorrhagic and yellowish areas. Mitotic activity was mostly high, range 2 to 28 per 10 HPF.
- 'JGCT immunohistochemistry (Table 3): inhibin positive in all 15 (strong in 9, the rest weak); vimentin positive in all tested; cytokeratin Cam 5.2 focally positive in 2 JGCT only; EMA negative where applied; calretinin and CD99 (Mic-2) frequently positive. Authors state pancytokeratin was focally or even diffusely positive in a large number of JGCT.'
- 'Hormonal presentation: in the whole series pseudo-precocious puberty or virilisation (hirsutism, voice change) was more common pre-pubertally; Table 2 lists virilisation as the most common presenting symptom of JGCT. Authors note most patients showed androgen excess signs, and that JGCT are not usually metastatic.'
- 'Stage: whole series all FIGO stage I except two cases of stage II (tumour type of the two not stated in the text). Authors cite more than 90% of JGCT as stage I in the literature.'
- Follow-up was available for only 21 of 39 patients. Recurrence was noted in 2 cases with follow-up, both JGCT, with recurrent material diagnosed at the same hospital; one JGCT metastasised to the skin of the arm (subcutaneous tissue, forearm) 2.5 years after diagnosis, and the patient was treated elsewhere and lost to follow-up after recurrence. One of the 2 Sertoli-Leydig tumours recurred at 27 months.
- 'Treatment (whole series): cisplatin-based chemotherapy was most commonly used after incomplete excision; most stage I patients with intact capsule remained free of recurrence without chemotherapy or radiotherapy. Authors conclude initial complete excision was therapeutic when disease was confined to one ovary with intact capsule, with the caveat of limited follow-up, and that fertility-sparing surgery was sufficient at this stage.'
- Authors conclude JGCT is the commonest SCST in young girls in their population, that hormonal signs allow early diagnosis, and that enlarging or persistent ovarian cysts should prompt investigation.
relevance_to_jgct: Largest South Asian single-centre pathology series of paediatric and young-adult ovarian SCST, with a 15-patient JGCT subgroup giving age, size, mitoses, immunohistochemistry and two recurrences (one skin metastasis).
