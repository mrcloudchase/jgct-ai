notes: 'Abstract says ''recurrence/metastasis in 4/21 cases with follow-up data''; the Results and Discussion describe recurrence in two JGCT (one with skin metastasis) plus one recurrent Sertoli-Leydig tumour at 27 months, so the fourth event is not identified in the text. Text inconsistencies: whole-series median age 162 months in Results; JGCT median 168 months in Table 2; ''age <21 years'' in abstract vs ''<=21'' in methods; Table 1 percentages do not sum cleanly (overlapping symptoms). JGCT age range 4 to 212 months includes post-pubertal teenagers up to about 17.7 years diagnosed as JGCT; diagnostic criteria for JGCT in adolescents are not described. Stage II cases and chemotherapy are not broken down by tumour type. The source PDF was read from KoreaScience; no PMC version.'
