key_findings:
- 'Thirty-three pure testicular yolk sac tumors in boys 5 to 71 months (mean 20.7): 24 without disease, 8 metastatic, 5 died; size over 4.5 cm, rete or epididymal invasion and necrosis predicted poor outcome in stage I.'
- The authors stress distinguishing yolk sac tumor from the juvenile granulosa cell tumor, which occurs at a slightly younger age with distinctive features despite some overlap.
relevance_to_jgct: Yolk sac tumor is the main malignant differential of infant testicular JGCT.
