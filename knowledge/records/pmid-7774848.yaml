presentation:
- diffuse liver metastases 10 months after diagnosis
key_findings:
- 4-year-old child developed diffuse liver metastases 10 months after JGCT of the left ovary.
- Treated with chemotherapy including ifosfamide, etoposide and carboplatin combined with regional deep hyperthermia, then consolidation radiotherapy.
- In complete remission at 1 year of follow-up.
- Authors state the case shows feasibility of combined modalities for liver metastases but does not allow comparison of treatments.
relevance_to_jgct: Regional hyperthermia plus ICE-type chemotherapy and radiation for hepatic JGCT relapse in a young child.
