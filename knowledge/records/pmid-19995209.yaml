key_findings:
- Newborn boy with bilateral intra-abdominal testicular JGCT presenting with abdominal distention and respiratory distress at birth.
- Emergency resection of 2 large masses connected by gubernacula to the inguinal canals.
- 'Associated abnormalities: constitutional chromosome 4 abnormality, polymicrogyria and renal cysts.'
- Authors describe it as the first report of JGCT associated with a chromosome 4 abnormality, highlighting a region that may be important in JGCT development.
