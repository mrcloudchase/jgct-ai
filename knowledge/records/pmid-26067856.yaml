key_findings:
- In COV434 (then used as a juvenile-type model) and KGN cells, sunitinib had no effect while sorafenib dose-dependently inhibited proliferation and viability, implicating BRAF or upstream MAPK signaling; a RAF1 inhibitor had no effect and the Src inhibitor SU6656 reduced viability without affecting proliferation.
relevance_to_jgct: Tyrosine kinase inhibitor screen in COV434, since reclassified as SCCOHT (pmid-33328126), so applicability to JGCT is uncertain.
