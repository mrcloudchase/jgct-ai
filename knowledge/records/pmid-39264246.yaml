key_findings:
- AACR 2023 Childhood Cancer Predisposition Workshop review of genomic instability disorders including mosaic variegated aneuploidy (MVA).
- Genes reported to cause MVA include BUB1B, CEP57, TRIP13 and more recently CENATAC, SLF2, SMC5 and MAD2L1B.
- The two reported siblings of consanguineous parents with biallelic mutations in MAD2l1B developed juvenile granulosa cell tumors of the ovary and testis, respectively.
- A third unrelated affected individual did not develop cancer, and other (modifying) genetic cancer risk factors in the siblings cannot be excluded.
- A convincing increased childhood cancer risk is described only for MVA1 and MVA3.
relevance_to_jgct: Expert-workshop review that cites the MAD2L1BP sibling JGCT report and frames the association cautiously.
