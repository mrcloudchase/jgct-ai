key_findings:
- SWR/Bm mice spontaneously develop early-onset ovarian granulosa cell tumors that can metastasize and serve as a model of human juvenile-type tumors; susceptibility is polygenic.
- Congenic strains mapped two X-linked modifier genes, Gct4 (paternal-origin effect) and Gct6, 6.5 cM apart, that raise tumor frequency.
