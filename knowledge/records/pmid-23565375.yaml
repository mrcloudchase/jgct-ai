notes: 'The JGCT diagnosis rests on the phrase ''suggestive of juvenile granulosa cell tumor''; no histology or immunohistochemistry reported, and no tumor size or stage. Internal inconsistencies in the source: the case 2 bone age, height age and chronological age line is run together, and the discussion gives 12 months follow-up for the JGCT patient versus 6 months in the case description. Case 3 is not a JGCT (CT left ovary, resection described as right).'
