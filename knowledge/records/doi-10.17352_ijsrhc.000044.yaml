notes: 'Classification concerns: patient is 33 years old and the text says mitotic activity is evident in juvenile form but gives no counts, IHC or molecular data for this patient; Figure 4 is described as juvenile-type morphology. The authors call the tumor stage Ia while also describing capsular rupture (which would normally upstage to IC). No follow-up duration or outcome is reported. Text contains translation artifacts from French.'
