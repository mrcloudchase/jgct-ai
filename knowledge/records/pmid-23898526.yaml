key_findings:
- Of 40 ovarian granulosa cell tumours reviewed at one Chinese centre between April 2002 and September 2011, 34 (85%) were adult type (mean age at onset 50.1 years) and 6 (15%) juvenile type (mean age 35.3 years); the difference in mean age was significant (P = 0.034).
- The JGCT were mainly diffuse in pattern with rare Call-Exner bodies and common luteinisation, haemorrhage and necrosis, whereas AGCT were mainly follicular, insular and trabecular with frequent Call-Exner bodies.
- Across all granulosa cell tumours, features of unfavourable prognosis were a mixed histological pattern (two or more of follicular, insular, trabecular, diffuse), rare Call-Exner bodies, 3 or more mitoses per 10 HPF, low PTEN and high Ki-67 expression.
relevance_to_jgct: Chinese single-centre GCT series with 6 JGCT in adults (mean 35.3 years); prognostic factors are reported for GCT as a whole, not for JGCT separately.
