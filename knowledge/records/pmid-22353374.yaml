key_findings:
- 16-year-old girl with primary amenorrhea due to ovarian JGCT.
- 'Preoperative hormones: extremely low FSH, relatively low estradiol, high inhibin B.'
- Menarche followed tumor removal; postoperative FSH rose as tumor-produced inhibin fell.
- Authors suggest an inhibin-secreting granulosa cell tumor be considered in girls with primary amenorrhea.
relevance_to_jgct: Shows inhibin B secretion by JGCT can suppress FSH and cause primary amenorrhea.
