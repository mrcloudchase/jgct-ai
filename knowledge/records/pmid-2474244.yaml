key_findings:
- 'Immunostaining of 15 ovarian small cell carcinomas, 15 adult and 15 juvenile granulosa cell tumors and 5 Sertoli cell tumors: one third of small cell carcinomas expressed EMA and none S-100, while one third of granulosa cell tumors expressed S-100 and none EMA or B72.3; chromogranin in 4 of 5 small cell carcinomas and no granulosa cell tumor; the cell of origin of small cell carcinoma remained unclear.'
relevance_to_jgct: EMA, S-100 and chromogranin patterns separating JGCT from small cell carcinoma.
