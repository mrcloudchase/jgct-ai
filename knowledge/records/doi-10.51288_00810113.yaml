notes: Original in Spanish. Abstract states a right ovarian tumor whereas the text describes a left ovarian tumor (30 x 20 cm) with the right ovary 4 x 3 x 2 cm and a right salpingo-oophorectomy performed; the surgical laterality is internally inconsistent. Diagnosis rests on H&E and inhibin B only; the term 'suggestive of' JGCT is used. A 31-year-old age is atypical for JGCT, as the authors note.
