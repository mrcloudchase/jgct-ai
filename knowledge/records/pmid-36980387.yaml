notes: Review of guidelines for all adolescent malignant ovarian tumors (germ cell, sex cord-stromal, SCCOHT); JGCT content is limited to a few paragraphs and rows of Table 2. n_jgct_patients is null since no patients are reported. Table 2 columns for JGCT are partly misaligned in the extracted text, so the guideline-to-recommendation mapping for ESMO versus EXPeRT/PARTNER was read from the narrative where possible (the narrative says BEP for stage IC2-IC3 in the guideline quartet and 'potentially IC1 per ESMO'; the table lists ESMO stage IC chemotherapy recommended). The review itself is secondary (guidelines are not independently verified).
