  outcome: third CR 6 years after second relapse
presentation: []
key_findings:
- 4 1/2-year-old with stage IA ovarian JGCT received 4 courses of chemotherapy after complete resection because of high mitotic index, high microvessel density, blood vessel invasion.
- Para-aortic lymph node relapse at one year treated with surgery, local radiotherapy, conventional and high-dose chemotherapy; paratracheal lymph node relapse 7 months later treated with surgery and radiotherapy.
- Then adjuvant antiangiogenic treatment (paclitaxel, bevacizumab, thalidomide, pegylated interferon) for 2 years; in third complete remission 6 years after second relapse.
relevance_to_jgct: Documents a multiply relapsed stage IA high-mitotic JGCT with long-term remission after multimodal and antiangiogenic therapy.
