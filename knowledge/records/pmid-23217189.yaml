presentation:
- prenatally detected multicystic testicular mass
- scrotal mass at birth
key_findings:
- Fetal ultrasound at 36th week of gestation showed a multicystic left testicular mass; postnatal ultrasound showed a 1.57 x 1.33 cm complex cystic mass.
- Karyotype normal; serum AFP 6679 IU/ml, HCG 8 mIU/ml, testosterone 1.75 ng/ml, inhibin B 346 pg/ml.
- Left radical orchiectomy by sub-inguinal (prescrotal) incision; tumor immunopositive for inhibin and calretinin, negative for AFP; no normal testicular parenchyma.
- No complications; ultrasound a month after surgery without masses; patient healthy at time of writing.
- Authors state JGCT accounts for about 5% of prepubertal testis tumors and radical orchiectomy is sufficient treatment.
relevance_to_jgct: Prenatally detected testicular JGCT managed by orchiectomy through a prescrotal approach.
