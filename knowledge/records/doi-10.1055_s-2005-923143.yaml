presentation:
- large cystic lower-abdominal tumour of unclear organ origin developing in the third trimester
key_findings:
- A pregnancy with an initially normal course developed a large cystic lower-abdominal tumour of unclear organ origin in the third trimester; it was a fetal testicular tumour.
- Histology first raised suspicion of an immature teratoma with cystic and spindle-cell solid parts; immunohistochemical stains then showed a prenatal juvenile granulosa cell tumour of the testis.
- Because the tumour is very rare and data on postpartum management are scarce, management was agreed interdisciplinarily; close cooperation of prenatal medicine, neonatology and paediatric oncology gave a good perinatal outcome.
- The authors suggest that a register of rare fetal diseases, their prognosis and therapy would be useful.
- The abstract gives no operation details, stage, markers or follow-up beyond the perinatal period.
relevance_to_jgct: Congenital (prenatally detected) testicular JGCT first mistaken for immature teratoma on histology and resolved by immunohistochemistry.
