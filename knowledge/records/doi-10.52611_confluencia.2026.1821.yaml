presentation:
- unilateral cryptorchidism (intra-abdominal testis) with a solid-cystic lesion on ultrasound
- raised AFP in one infant (> 1000), normal markers in the other
key_findings:
- 'Case A: a term newborn with an absent left scrotal testis; ultrasound at 48 hours showed a left intra-abdominal testis next to the bladder with a heterogeneous, vascularised solid-cystic lesion of about 1.5 cm, with normal AFP, LDH and beta-hCG.'
- Case A underwent left inguinal orchiectomy; the intra-abdominal testis carried an indurated mass of about 14 mm, replaced almost completely by a non-encapsulated solid-cystic tumour without vascular invasion or spread to epididymis or cord; immunohistochemistry was positive for inhibin, calretinin, WT1 and FOXL2 and negative for SALL4 and beta-catenin; she/he was discharged at 24 hours.
- 'Case B: a male infant aged 1 month with an absent right scrotal testis; ultrasound showed a right intra-abdominal testis of 2.0 x 1.4 x 2.0 cm, heterogeneous and hypoechoic with anechoic areas and flow, first read as possible yolk sac tumour; AFP was > 1000 (reference 0-5.8) with normal beta-hCG and LDH.'
- Case B had a right scrotal mass 14 days later and underwent right orchiectomy with tumour resection and contralateral orchidopexy at 35 days of life; the testis was replaced by an ill-defined orange-yellow multicystic tumour; immunohistochemistry was positive for calretinin, inhibin A, BRG1 (SMARCA4) and WT1 and negative for SALL4, PLAP, glypican 3 and AFP, consistent with juvenile granulosa cell tumour.
- Both infants were reported to have good postoperative evolution; follow-up duration, imaging surveillance and AFP normalisation are not reported.
- The authors discuss that AFP can be physiologically raised in infants and that yolk sac tumour is the main differential, and cite (without reporting it themselves) a case of bilateral testicular JGCT controlled with GnRH-analogue therapy and registry series.
relevance_to_jgct: Two neonatal/infant testicular JGCT cases, both with cryptorchidism and treated by orchiectomy; one had AFP > 1000 mimicking yolk sac tumour, resolved by immunohistochemistry (SALL4/glypican 3 negative).
