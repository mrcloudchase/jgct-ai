- 'Review of pediatric gynecologic cancers (stromal tumors including JGCT and Sertoli-Leydig, rhabdomyosarcoma, germ cell tumors): event-free and overall survival are high; treatment aims at unilateral salpingo-oophorectomy with limited staging, marker surveillance after surgery, and adjuvant chemotherapy often reserved for recurrence.'
