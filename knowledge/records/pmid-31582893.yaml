key_findings:
- 13-year-old girl with prolonged fever and delayed puberty diagnosed with JGCT of the left ovary.
- Serum IL-6 level was very high; it was not clear whether IL-6 was secreted by the tumor cells.
- After tumorectomy, symptoms immediately disappeared, IL-6 level decreased, and she entered puberty.
- Authors propose tumor-induced IL-6 secretion as a potential cause of prolonged fever and/or delayed puberty.
relevance_to_jgct: Describes an unusual presentation (fever, delayed rather than precocious puberty) linked to elevated serum IL-6 in JGCT.
