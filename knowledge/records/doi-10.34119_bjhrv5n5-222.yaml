key_findings:
- A 6-year-old girl had non-specific, progressive abdominal pain for one month.
- Imaging showed a suspicious hypogastric mass of probable right adnexal origin with free fluid in the abdominal cavity.
- After surgery, pathology and immunohistochemistry showed a juvenile granulosa cell tumour.
- The authors state that JGCT has a good prognosis at early stages but a risk of metastatic malignant progression when advanced or diagnosed late.
relevance_to_jgct: Brazilian paediatric JGCT case (age 6) with abdominal pain, adnexal mass and free fluid.
