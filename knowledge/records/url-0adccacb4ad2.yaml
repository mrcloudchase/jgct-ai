key_findings:
- 14-year-old with a pelvic mass and masculinizing symptoms; histopathology showed both juvenile granulosa cell and Sertoli-Leydig differentiation, diagnosed as gynandroblastoma.
- 'Primary surgery: laparotomy with left salpingo-oophorectomy, retroperitoneal lymph node dissection and omentectomy.'
- Recurrence after a disease-free interval of 23 months; secondary cytoreductive surgery histology was embryonal rhabdomyosarcoma (heterologous differentiation in sex cord stromal tumor).
- Authors note adjuvant chemotherapy regimens changed based on the dominant tumor component.
relevance_to_jgct: Gynandroblastoma with a JGCT component; relevant to differential diagnosis and to the DICER1-associated mixed sex cord-stromal tumor spectrum.
