key_findings:
- 'Immunopanel on 53 ovarian sex cord-stromal tumors including 4 JGCT: calretinin positive in all but one metastatic SLCT, inhibin in 85%, WT1 in 74%, cytokeratin cocktail in 43%, EMA in only one tumor (1+ in a JGCT), CK5/6 in none; calretinin is at least as sensitive as inhibin.'
relevance_to_jgct: 'Panel behaviour of JGCT: calretinin and inhibin positive, EMA essentially negative.'
