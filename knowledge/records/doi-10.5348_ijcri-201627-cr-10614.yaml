notes: 'Labeling inconsistency: the abstract and conclusion call the tumor a juvenile granulosa cell tumor, but the case pathology text says only ''androgen secreting granulosa cell tumor, stage IA''; the patient was 30 at diagnosis, which is atypical for juvenile type and no histologic or IHC detail is given for the primary tumor. Laterality inconsistency: text says right salpingo-oophorectomy for a left adnexal mass, while Figure 1 legend says right adnexal mass. Pelvic mass in 2014 was not a recurrence. Single author.'
