key_findings:
- 'Retrospective series of 10 ovarian granulosa tumors treated at the gynaecology-obstetrics department of Mohammed VI University Hospital, Oujda, Morocco (September 2016 to September 2021): 6 adult type and 4 juvenile type (40%).'
- The ages of the juvenile-type patients are listed as 18, 19, 22 and 31 years (the text gives the mean as 18.6 years, which does not match these four values, whose mean is 22.5); adult-type ages 35, 38, 52, 57, 66, 81.
- 'For the whole series (not separated by type): all had palpable pelvic masses, mean tumour size 141.5 mm (63-220 mm), 80% conservative and 20% radical surgery, 60% received chemotherapy, none radiotherapy, one recurrence and all patients alive after surgical treatment.'
- The text does not link treatment, stage, recurrence or outcome to the juvenile-type patients individually; the one recurrence may or may not have been in a juvenile case.
- The authors cite the literature for juvenile granulosa tumor presenting before age 20 (peak 0-10 years) and for chemotherapy being unnecessary in stage I except with large size, capsular rupture or high mitotic index.
relevance_to_jgct: Mixed adult/juvenile Moroccan series; only 4 labelled juvenile type, all aged 18-31, with no individual detail.
