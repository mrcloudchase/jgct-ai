notes: 'Per-type data are limited to ages. ''Juvenile'' label at ages 18-31 is by the authors'' histology; no immunohistochemistry or FOXL2 testing reported. Internal inconsistencies: adult mean age stated as 58.4 in the abstract and 54.8 in the results (54.8 matches the listed ages); the juvenile mean 18.6 does not match the listed ages; the text refers to ''GIST'' and ''GERD'' where granulosa tumor and ovarian cancer are meant. Figure 4 is a juvenile-tumour photograph credited to reference 1. The series may include patients also reported elsewhere from Oujda.'
