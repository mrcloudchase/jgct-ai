key_findings:
- 'Radiology review of ovarian sex cord-stromal and steroid cell tumors (about 8% of ovarian neoplasms): clinical and radiologic clues include a large hemorrhagic multicystic mass in a child with pseudoprecocious puberty (juvenile granulosa cell tumor) and associated Ollier disease or Maffucci syndrome, and fibrous content for fibrothecoma.'
