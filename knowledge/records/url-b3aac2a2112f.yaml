key_findings:
- Forty-two individuals with ovarian JGCT enrolled; median age at diagnosis 9 years (range 0-27).
- 'Stage: Ia=16, Ib=1, Ic=16, II=2, III=5; unknown for 2.'
- Three-year OS 88% (CI 77%, 100%); EFS 69% (CI 54%, 88%).
- At median follow-up of 25 months (range 0-416), 9 patients (Stage Ia=1, Stage Ic=5, Stage III=3) recurred; median time to recurrence 11.5 months (range 3-19).
- 'Stage Ic: 2/7 with preoperative rupture and 3/9 with intraoperative rupture recurred.'
- Four of 9 with recurrence survived; all who died presented with extrapelvic recurrence; median time from recurrence to death 10 months (range 2-53); three-year OS after recurrence 57% (CI 30%, 100%).
- Recurrence outside the tumor bed (HR Infinity; p-value 0.048) and advanced stage at diagnosis (HR 5.1; p-value 0.087) associated with inferior OS among those with recurrence.
relevance_to_jgct: Interim International OTST Registry JGCT analysis; superseded by the full 70-patient registry report (pmid-40267023) but documents early rupture-specific recurrence counts and the extrapelvic-recurrence finding.
