presentation:
- incidental adnexal cyst found during ultrasound for a missed period
key_findings:
- A 35-year-old had a multilocular cystic left adnexal lesion with thick irregular enhancing septa and restricted diffusion (O-RADS intermediate risk) and normal tumor markers; laparoscopic cystectomy showed a cystic JGCT.
- The abstract repeats that about 97% of JGCTs occur before age 30 and that imaging cannot reliably separate cystic JGCT from other ovarian neoplasms.
relevance_to_jgct: Late-onset purely cystic JGCT with nonspecific MRI features; treated by cystectomy alone.
