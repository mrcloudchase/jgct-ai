notes: 'Full text read via Europe PMC (PMC12682638) on 2026-10-30. n_jgct_patients is the 94 literature cases in the systematic review (the index case is described separately); these published cases overlap with case reports elsewhere in the base, so do not sum. Survival percentages are from case reports with publication bias and short follow-up (24.6% of 69 had <1.5 years). Conflict: authors call adjuvant chemotherapy for FIGO IC2 jGCT ''questionable'', whereas the European standard clinical practice recommendations (pmid-42504512) recommend adjuvant cisplatin-based chemotherapy for IC2 jGCT.'
