presentation:
- 'index case: bilateral breast enlargement (Tanner B3PH1A1), estrogenized genitalia and clitoromegaly; estradiol 195 pg/mL, testosterone 1.64 ng/mL, suppressed gonadotropins; elevated inhibin B'
- isosexual precocious puberty in 43/57 (75.4%) reviewed girls aged <=8 years
- heterosexual precocious puberty in 20/57 (35.1%) girls aged <=8 years
- menstrual irregularities in 11/27 (40.7%) post-pubertal patients
- any abdominal symptoms 53/94 (56.4%); acute abdomen due to tumor rupture 5/94 (5.3%)
key_findings:
- Case report of a 10-month-old girl with an estrogen- and androgen-secreting left ovarian jGCT, FIGO/WHO IA, treated with salpingo-oophorectomy without chemotherapy; inhibin B normalized after surgery; no recurrence at 15 months; overgrowth NGS panel and PTEN MLPA negative.
- 'Systematic review of 94 pediatric jGCT cases (<18 years) from 65 articles: mean age 7.2 years (range 0-17); 15 (15.9%) infants, 42 (44.7%) aged 1-8 years.'
- 71.2% of 66 patients with known stage had FIGO/WHO I disease; 95.7% of 47 stage I patients were alive at last follow-up; overall 92.7% of 69 patients alive (mean follow-up 4.8 years); 81.2% of 16 advanced-stage patients alive (mean follow-up 4.4 years).
- 17.0% of the 94 patients relapsed and 43.7% of these died of disease; mean time to recurrence 1.4 years (range 0.12-8 years); contralateral ovarian tumor in 4.3% at median 2.3 years.
- 21/94 (22.3%) had a genetic or systemic condition, including Ollier disease 14 and Maffucci syndrome 1; also single cases of DICER1 syndrome, Li-Fraumeni plus PTEN hamartoma tumor syndrome, Beckwith-Wiedemann, NF1, tuberous sclerosis, ovotesticular DSD.
- Inhibin A/B and AMH were constantly elevated preoperatively in published cases where measured; authors recommend follow-up every 3 months during the first 3 years with markers if elevated preoperatively (AMH, inhibin A/B, estradiol, testosterone) and pelvic/abdominal ultrasound.
- Authors question adjuvant chemotherapy for FIGO IC2 (recommended by EXPeRT/PARTNER) because three of five IC2 patients in the review did not receive it and were alive at 3-8 years; cisplatin-based PEB or PEI, four cycles (six if metastatic), is cited for advanced disease.
- Central precocious puberty secondary to sex-steroid exposure developed in 2 reviewed girls; authors advise avoiding hormone replacement therapy immediately after surgery because sex steroids serve as tumor markers.
relevance_to_jgct: Case report plus systematic review of 94 pediatric jGCTs with presentation, stage, relapse, survival and genetic-syndrome frequencies, and a multidisciplinary (oncology, endocrinology, gynecology/surgery, genetics) management flowchart.
