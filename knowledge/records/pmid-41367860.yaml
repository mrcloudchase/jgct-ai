notes: 'The index case report has an internal laterality inconsistency: MRI described a right iliac fossa mass ''originating from the contralateral ovary'' and the figure legend says right pelvic mass originating from the left adnexa, while surgery was a left salpingo-oophorectomy. n_jgct_patients is the 94 literature cases (the index case is additional). Supplementary Tables S1-S5 and Supplementary Figure S1 were not in the text; figures were not available. Review percentages use varying denominators; its cases come from case reports (publication bias). Likely overlap with other case reports in the knowledge base cited in the review.'
