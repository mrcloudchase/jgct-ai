presentation:
- complicated fetal ovarian cyst at 32 weeks with increasing intra-abdominal mass and labial oedema
- 9x9x5 cm multichambered inhomogeneous fetal ovarian tumour at 33+5 weeks
key_findings:
- 'Case 1 of two: a fetal ovarian tumour seen at 32 weeks as a complicated ovarian cyst with increasing intra-abdominal mass and labial oedema; a multichambered inhomogeneous tumour of 90x90x50 mm was shown at 33+5 weeks.'
- Delivery was by primary repeat caesarean section at 34+1 weeks; the tumour had to be removed surgically because of its size and displacement of abdominal organs.
- Histology gave a juvenile granulosa cell tumour; karyotyping of the child and tumour was 45,X/46,X mar(Y), described as pseudohermaphroditism verus.
- The definitive diagnosis of granulosa cell tumour could only be made histologically after birth.
- Case 2 (not JGCT) was a congenital adrenal neuroblastoma that regressed spontaneously.
- The authors conclude that prenatal differential diagnosis of fetal tumours is difficult in individual cases, especially echogenic or inhomogeneous tumours.
relevance_to_jgct: Ultrasound-focused report of the fetal ovarian JGCT with 45,X/46,X mar(Y) karyotype also described in the Geburtshilfe und Frauenheilkunde abstract; adds the prenatal ultrasound size and timing.
