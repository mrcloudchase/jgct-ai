key_findings:
- Among 70 sex cord-stromal tumors with at least 20% sclerosis, 20 were JGCT; sclerotic zones (20 to 95% of the tumor) often obscured diagnostic features, 19 JGCT showed sclerosis enveloping tumor nodules in a pseudolobular pattern, and 5 JGCT also had staghorn vessels resembling sclerosing stromal tumor.
- Correct diagnosis depends on examining the cellular zones, especially on limited intraoperative material.
relevance_to_jgct: Sclerosis in JGCT as a diagnostic pitfall, from the largest such series.
