key_findings:
- 70 ovarian sex cord-stromal tumors with at least 20% sclerosis, including 20 JGCT and 20 thecomas.
- 19 of the 20 JGCT showed sclerosis around tumor-cell nodules creating a pseudolobular pattern; 5 JGCT also had prominent staghorn vessels, mimicking sclerosing stromal tumor at low power.
- Paucicellular sclerosis (20% to 95% of the tumor) often obscured diagnostic features; diagnosis depends on the cellular zones, especially in limited or intraoperative material.
relevance_to_jgct: Documents sclerosis as a diagnostic pitfall in JGCT, which can mimic sclerosing stromal tumor.
