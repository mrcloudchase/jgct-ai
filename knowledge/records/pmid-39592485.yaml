key_findings:
- The cohort is 37 ovarian Sertoli-Leydig cell tumours (SLCT) (9 well, 25 moderately, 3 poorly differentiated; median age 43, range 14-76), studied by 28 IHC markers and DNA and RNA targeted sequencing.
- 'During central expert review, 5 cases submitted as SLCT were reclassified and excluded: 1 adult granulosa cell tumour, 1 juvenile granulosa cell tumour, 1 sex cord tumour with annular tubules (STK11 mutation) and 2 sex cord-stromal tumours NOS. No clinical, histological or molecular details of the juvenile granulosa cell tumour are given.'
- SLCT expressed sex cord markers (FOXL2 97%, SF1 97%, inhibin A 94%, CD99 81%, calretinin 58%); the authors conclude these markers are sensitive but of limited use for distinguishing SLCT from other sex cord-stromal tumours, and that molecular testing should be used in problematic cases.
- DICER1 mutation was found in 54.5% of SLCT and FOXL2 p.C134W in 2 of 33; no tumour showed aberrant p53 or HER2 positivity, all were mismatch-repair proficient and PD-L1 negative.
- The authors state that finding a DICER1 mutation supports SLCT while AKT1 or GNAS mutations would support juvenile granulosa cell tumour (citing a review), and that TERT promoter mutation, found in 2 DICER1-mutant SLCT, has been described in rare cases of JGCT (their citation).
- The authors list JGCT and AGCT first among the sex cord-stromal tumours in the differential diagnosis of SLCT, alongside hypercalcemic-type small cell carcinoma, endometrial stromal sarcoma and undifferentiated or endometrioid carcinoma.
relevance_to_jgct: This paper is about a mimic (Sertoli-Leydig cell tumour), not JGCT. JGCT appears as one case reclassified out of the SLCT series without details, and in the authors' discussion of differential diagnosis (DICER1 favours SLCT, AKT1 or GNAS favours JGCT). It reports no JGCT clinical or molecular data of its own.
