- 'Transvaginal ultrasound of 27 granulosa cell tumors (24 adult, 3 juvenile) at primary diagnosis: mean size 103.8 mm; multilocular solid in 48%, solid in 36%, multilocular in 16%; cyst content low-level or anechoic in 56.3%, mixed 31.2%, hemorrhagic 12.5%; moderate to high color Doppler score in 45.1%; relapses looked like primaries.'
