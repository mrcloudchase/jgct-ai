key_findings:
- 'Nationwide Turkish study of 129 children (102 girls) with non-CAH gonadotropin-independent precocious puberty (estimated prevalence 14 per million): functional ovarian cyst 37%, McCune-Albright syndrome 26%; ovarian tumors included mature cystic teratoma, dysgerminoma, juvenile granulosa tumor and steroid cell tumor.'
relevance_to_jgct: Places JGCT among the rarer causes of peripheral precocious puberty in girls.
