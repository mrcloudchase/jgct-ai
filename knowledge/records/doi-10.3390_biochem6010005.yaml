- 'Pathology-oriented review of pediatric ovarian neoplasms: sex cord-stromal tumors (Sertoli-Leydig, juvenile granulosa cell, adrenal-like stromal tumors) present nonspecifically or with endocrine signs; diagnosis integrates imaging, markers and immunohistochemistry; treatment prioritizes fertility-sparing surgery with selective adjuvant chemotherapy by histotype and stage; referral centers and multicenter studies are urged.'
