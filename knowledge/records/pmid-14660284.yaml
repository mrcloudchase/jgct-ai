key_findings:
- Testicular JGCT in a 4-year-old boy with highly undifferentiated appearance and robust mitotic activity, initially suggesting a small round cell tumor.
- Immunocytochemistry and ultrastructure excluded small round cell tumors and led to the diagnosis.
- Described as the oldest reported patient with testicular JGCT at the time and the first with clinical evidence of hormonal activity.
relevance_to_jgct: Pathologic mimicry of testicular JGCT; hormonal activity.
