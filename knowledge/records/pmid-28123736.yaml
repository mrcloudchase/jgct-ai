notes: Source text is a PDF extraction. The ultrasound text reports a 12x12 mm mass within a 23x16 mm ovary but MRI and surgery found 36x42x45 mm and 5x4 cm masses, a size discrepancy within the paper. The paper terms the tumour 'juvenile-type GCT' while citing the adult/juvenile split; follow-up was only 4 months. Author name from the PDF header (Dorottya Bus).
