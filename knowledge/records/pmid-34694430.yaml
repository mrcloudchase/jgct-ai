key_findings:
- Four JGCTs diagnosed during pregnancy, with a literature review.
- One ruptured tumor required emergency cesarean section at 38 weeks; the others were treated at full term.
- No recurrence during 13 to 57 months follow-up and no newborn abnormalities.
- Authors suggest surgery can be delayed to term absent an emergency, and that the value of chemotherapy in FIGO stage I needs further study.
relevance_to_jgct: Describes JGCT presentation and management during pregnancy, a setting relevant to its young-adult age range.
