key_findings:
- 'Pregnancy-associated JGCT cases: two presented with abdominal pain, two were incidental (one by ultrasonography, one at caesarean section).'
- One emergency caesarean section at 38 weeks for tumor rupture; others treated at full term; no newborn abnormalities.
- Three had further staging surgery, two received adjuvant chemotherapy; no recurrence at 13 to 57 months.
