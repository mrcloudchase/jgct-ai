key_findings:
- 34 year-old transgender male with Ollier disease (diagnosed at 1 year; prior low-grade chondrosarcoma) on long-term testosterone therapy since 2016, presenting with one month of left lower quadrant pain.
- CA-125 198 U/mL, LDH 426 U/L, inhibin A 473 pg/mL, inhibin B 23,419 pg/mL; 15 cm cystic and solid right ovarian mass on CT.
- Exploratory laparotomy, total abdominal hysterectomy, bilateral salpingo-oophorectomy, omentectomy to no gross residual; mass 3340 g; final pathology Stage IA JGCT.
- 'Tumor IHC: estrogen receptor weakly to moderately positive (40 %), progesterone receptor (90 %), androgen receptor strongly positive (>90 %).'
- A pleural nodule regressed spontaneously; no evidence of metastatic disease four months post-surgery; testosterone therapy discontinued on the authors' recommendation pending evidence.
- Authors raise the question whether exogenous testosterone contributed to JGCT growth and suggest prescreening for hormonally responsive conditions.
relevance_to_jgct: Adult JGCT in Ollier disease; raises the unanswered question of exogenous androgen exposure and hormone-receptor-positive JGCT.
