key_findings:
- A 25-year-old woman presented with several weeks of lower and upper abdominal pain and increasing abdominal girth; ultrasound showed a 14 cm cystic-solid mass of the right ovary with ascites and a thick endometrium. A PCOS diagnosis had been made 12 months earlier during amenorrhoea work-up.
- Preoperative CA-125 was 100 kU/l, inhibin B 4496 ng/l, testosterone 0.29 ug/l and estradiol 279 ng/l; postoperatively CA-125 was 34 kU/l, inhibin B < 10 ng/l, testosterone 0.24 ug/l and estradiol 62 ng/l.
- At laparotomy 5 l of yellowish-bloody ascites were drained and a multichambered cystic adnexal tumour was found without peritoneal carcinomatosis; unilateral adnexectomy, peritoneal biopsies, appendectomy, omentectomy and hysteroscopy with fractional curettage were done.
- Histology showed a 15 cm juvenile granulosa cell tumour, pT1a R0; peritoneal lavage cytology was negative, but the surgeons had the impression of an in situ rupture, and no tumour was found on the ovarian surface.
- 'Immunohistochemistry: oestrogen and progesterone receptor both IRS 1 (weakly positive), Ki67 11%.'
- The discrepancy between clinical FIGO IC2 and pathological pT1a was discussed at the national tumour board, which recommended cisplatin-containing chemotherapy because of the intraoperative rupture; the patient took part in FertiPROTEKT. Follow-up and whether chemotherapy was given are not stated.
relevance_to_jgct: Adult-age (25 years) ovarian JGCT with ascites and a rupture-based stage question (pT1a vs IC2) that led to a tumour-board recommendation for adjuvant platinum chemotherapy.
