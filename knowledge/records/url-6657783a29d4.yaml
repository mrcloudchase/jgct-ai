notes: 'Counts are tallies of API rows retrieved on 2026-10-30 at https://www.cbioportal.org/api, not numbers published by authors, and will change. n_jgct_patients=1 counts only the explicitly labeled patient. Reading unlabeled young-patient GRCT samples as JGCT is an inference. IMPORTANT TOOL BUG: tools/cbio_grct_scan.py swallows request errors silently; two runs of it this session returned only 1 and 77 hit rows because requests failed (the first run omitted msk_impact_50k_2026 entirely), whereas a scan with retries (/tmp/scripts/scan2.py, 0 failures) returned 278 rows across 8 studies matching the counts above; the tool should retry and report failures. The msk_ch_2023 study was not in the previous version of this record. Panel sequencing (MSK-IMPACT) does not detect all alterations; ''no mutations called'' does not exclude other events.'
