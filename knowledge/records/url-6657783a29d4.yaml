key_findings:
- 'A scan of all 551 public cBioPortal studies (ONCOTREE_CODE, CANCER_TYPE_DETAILED, CANCER_TYPE sample attributes) found the label ''Juvenile Granulosa Cell Tumor'' on exactly one sample: P-0013654-N01 in msk_ch_ped_2021 (a blood/normal sample from a clonal hematopoiesis study; patient AGE 6.611909866, female, CHEMO_TX Yes, CISPLATIN_TX Yes, TOPO_II_TX Yes; no clonal hematopoiesis mutations listed).'
- 'The same patient''s tumor, P-0013654-T01-IM5 in msk_impact_50k_2026, is labeled only ''Granulosa Cell Tumor'' (GRCT): AGE_AT_DX 6, primary ovary, IMPACT410 panel, MUTATION_COUNT 0, TMB_SCORE 0, FRACTION_GENOME_ALTERED 0.0956, OS_STATUS 0:LIVING, OS_MONTHS 50.597.'
- msk_impact_50k_2026 returned 58 GRCT samples from 56 patients; FOXL2 C134W was present in 47 samples (adult-type signature). No juvenile subtype code exists in OncoTree, so juvenile and adult cases share the GRCT label.
- 'Other GRCT samples from young patients in msk_impact_50k_2026 (all labeled GRCT, not juvenile): P-0039024-T01-IM6 AGE_AT_DX 7, ovary, AKT1 R76_C77insLKTERPRPNTFIIR and TP53 X293_splice, FOXL2 wild-type, OS_STATUS 0:LIVING; P-0064771-T01-IM7 AGE_AT_DX 1, ovary, no mutations called; P-0061283-T01-IM7 AGE_AT_DX 16, ovary, no mutations called; P-0022880-T01-IM6 AGE_AT_DX 7, PRIMARY_SITE Skin, PTPRD T1450R; P-0021806 AGE_AT_DX 22, ovary metastases, BMPR1A G298D and AXIN1 R723*, FOXL2 wild-type.'
- 'Other studies with GRCT-labeled samples: msk_impact_2017 (14 samples, 13 patients; FOXL2 C134W in 12), pog570_bcgsc_2020 (2), pan_origimed_2020 (4, ''Ovarian Granulosa Cell Tumor''), and cell-line studies ccle_broad_2019 (2), ccle_broad_2025 (1), ccle_genentech_2014 (1).'
- AACR GENIE cBioPortal (genie.cbioportal.org/api) returned HTTP 401 (login required); not queried.
relevance_to_jgct: 'Public genomic database view of granulosa cell tumors: only one patient is explicitly labeled JGCT; a FOXL2-wild-type, AKT1 in-frame insertion GRCT in a 7-year-old is consistent with the JGCT molecular profile but is not labeled juvenile by the database.'
