key_findings:
- 18 testicular JGCTs evaluated with DNA and RNA sequencing panels; median patient age <1 month (newborn to 5 months); all underwent radical orchiectomy (17 unilateral, 1 bilateral); median size 1.8 cm.
- Tumors expressed SF-1 (11/12), inhibin (6/7), calretinin (3/4), keratins (2/4); nuclear atypia mild or absent; median mitoses 0.4/mm2.
- No recurrent single-nucleotide variants; no gene fusions in 3 cases successfully RNA-sequenced.
- Recurrent monosomy 10 in 8 of 14 cases (57%) with interpretable copy-number data; multiple whole-chromosome gains in the 2 cases with significant spindle cell components.
- Testicular JGCTs lack the GNAS and AKT1 variants described in ovarian JGCT.
relevance_to_jgct: Shows testicular JGCT is molecularly distinct from ovarian JGCT (monosomy 10, no AKT1/GNAS).
