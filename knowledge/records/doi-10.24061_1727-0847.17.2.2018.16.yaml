key_findings:
- A clinical case of juvenile-type granulosa cell tumour of the ovary in a 17-year-old girl is presented.
- Tumour markers CA-125 and HE-4 were in the normal range, whereas anti-Mullerian hormone was 15 times the maximal reference value.
- The authors recommend measuring anti-Mullerian hormone, and serum inhibin B when JGCT is suspected, for ovarian masses with a solid component, and consider CA-125 and HE-4 non-specific for GCT.
- The authors state that the main treatment is surgical and recommend online communication with oncologists when malignancy is suspected.
relevance_to_jgct: Ukrainian adolescent JGCT case with markedly raised AMH and normal CA-125/HE-4.
