key_findings:
- SATB2 showed cytoplasmic staining in ovarian Leydig, luteinized stromal and steroid cells and in the Leydig component of Sertoli-Leydig cell tumors and gynandroblastomas, while adult (14) and juvenile (3) granulosa cell tumors and other sex cord tumors were negative apart from associated luteinized stromal cells.
relevance_to_jgct: JGCT are SATB2-negative; staining marks luteinized or Leydig cells.
