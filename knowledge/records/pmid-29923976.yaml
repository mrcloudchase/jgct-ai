key_findings:
- 19-year-old woman with progressive painless abdominal distention for 1 week and massive ascites; serum and ascites CA125 markedly elevated, other markers normal.
- Ascites cytology negative; CT showed a left adnexal teratoma and a right solid-cystic lesion; about 1200 mL ascites drained; right tumor capsule ruptured and omental/peritoneal nodules seen.
- Left oophorectomy and right salpingo-oophorectomy with omental and peritoneal biopsies.
- Immunohistochemistry positive for inhibin-a, CD99, vimentin, calretinin; Ki-67 >5%; stage IC.
- Six courses of adjuvant nedaplatin and paclitaxel liposome; CA-125 normalized and complete remission without residual tumor at 6-month follow-up.
relevance_to_jgct: Reports massive ascites with high CA125 as the first sign of JGCT in a young woman, treated with surgery and platinum-taxane chemotherapy.
