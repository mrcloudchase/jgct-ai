alterations: []
treatments:
- regimen: Left oophorectomy plus right salpingo-oophorectomy with omental and peritoneal biopsies (no lymph node dissection), then 6 courses nedaplatin + paclitaxel liposome
  setting: Stated FIGO stage IC with malignant ascites; ruptured right-sided tumor
  n: 1
