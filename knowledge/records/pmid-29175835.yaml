- Review of pediatric ovarian tumors and their cancer susceptibility syndromes, covering juvenile granulosa cell tumours, Sertoli-Leydig cell tumours, sex cord tumours with annular tubules, Sertoli cell tumours, germ cell tumours and small cell carcinoma of hypercalcaemic type, detailing the history, presentation and pathology features pointing to a predisposition syndrome; specialized pathology review is stressed.
