key_findings:
- A 7-year-old premenarchal girl (height 131 cm, weight 31 kg) presented in May with small vaginal bleeding, slight breast enlargement, no pubic or axillary hair and a mildly enlarged clitoris; a firm fist-sized lower abdominal mass was palpable.
- Pelvic ultrasound and CT showed an 11.0 x 9.3 x 6.0 cm mostly solid tumour with some cystic parts, a 5.1 cm uterus with thickened endometrium and no ascites. Estradiol was 87.4 pg/ml, testosterone 59.7 ng/ml (as printed), LH 7.5 mIU/ml, FSH 2.7 mIU/ml, AFP 7 ng/ml.
- At laparotomy in June about 30 ml of clear yellow ascites was present; the left ovary was a fist-sized solid tumour without adhesion. The surgeons removed only the left ovary because of her age. The resected tumour measured 12 x 7.5 x 5 cm with an intact capsule.
- Histology showed follicular and solid areas with granulosa-type cells (mitoses 16-18 per 10 HPF in follicular parts, 7-11 per 10 HPF in solid parts, no abnormal mitoses, no Call-Exner bodies) surrounded by spindle theca-type cells (1-5 mitoses per 10 HPF); estradiol was positive and prolactin negative by enzyme-antibody staining. Tumour cells were present in ascites and the authors call the case stage Ic.
- Postoperatively she received cisplatin 100 mg, cyclophosphamide 1000 mg and mitomycin 8 mg i.v.; estradiol fell to 10.0 pg/ml or below, and there was no sign of recurrence more than 3.5 years after surgery.
- The paper emphasises the cytology of ascites and imprint smears (two cell types, moderate N/C ratio, mildly enlarged nucleoli) and states, citing others, that JGCT recurrences occurred within 3 years; the authors consider the cisplatin-containing chemotherapy to have been meaningful, an inference rather than something shown.
relevance_to_jgct: Early Japanese JGCT with detailed histology and the first ascitic-fluid cytology the authors found in the literature; stage Ic, unilateral oophorectomy plus platinum chemotherapy, NED at 3.5 years.
