key_findings:
- In the SWXJ-9 mouse model of juvenile-onset granulosa cell tumors, a backcross of 1,968 females (81 tumor-bearing) confirmed Gct1 on chromosome 4 as a fundamental susceptibility locus and revealed Gct7 to Gct9 on chromosomes 1, 2 and 13 plus interacting loci on 17/18 and 2/10.
