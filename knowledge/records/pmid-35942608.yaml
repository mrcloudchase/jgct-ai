key_findings:
- Fine-needle aspiration cytology of a JGCT in a 4-year-old with a large abdominal mass and vaginal bleeding showed thick colloid-like fluid with apparent bubbles and small clusters of uniform cells with eosinophilic, finely vacuolated cytoplasm; histology confirmed juvenile type.
- Only two prior reports of JGCT cytology existed, both from recurrent disease at metastatic sites; the secretions corresponding to macrofollicles had not been described before.
relevance_to_jgct: One of three published descriptions of JGCT cytology, the first from a primary tumor.
