key_findings:
- Narrative review of management controversies in adult and juvenile granulosa cell tumors and Sertoli-Leydig cell tumors, focused mainly on adult granulosa cell tumors.
- Up to 30% of historical adult GCT diagnoses were reassigned on contemporary review; the FOXL2 c.402C>G mutation improved diagnostic accuracy from 2009.
- Fertility-sparing surgery is recommended for younger patients with stage 1 sex cord-stromal tumors; the role of adjuvant chemotherapy in high-risk stage I disease is controversial, with conflicting guideline recommendations.
- Calls for international collaboration, prospective data and randomized trials.
relevance_to_jgct: Gynecologic-oncology perspective on the limited evidence base shared by JGCT, notably for adjuvant chemotherapy in stage I disease.
