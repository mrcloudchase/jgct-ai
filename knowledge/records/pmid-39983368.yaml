key_findings:
- 'Review of controversies in ovarian granulosa cell and Sertoli-Leydig cell tumors: up to 30% of historical adult granulosa cell tumors were reassigned on contemporary review; surgery is the mainstay with fertility-sparing surgery for stage I in the young; adjuvant chemotherapy for high-risk stage I and surveillance schedules, marker use and imaging remain contested with conflicting guidelines; international prospective collection and randomized trials are called for.'
relevance_to_jgct: Frames the stage I adjuvant chemotherapy and surveillance questions for JGCT as unresolved.
