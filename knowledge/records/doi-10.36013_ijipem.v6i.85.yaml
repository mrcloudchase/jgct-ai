key_findings:
- A 3-year-old with vaginal bleeding, breast development, low FSH, high estradiol and a right ovarian cyst was suspected of JGCT and underwent oophorectomy; cafe-au-lait macules appeared months later and polyostotic fibrous dysplasia was found, establishing McCune-Albright syndrome, so the oophorectomy had been unnecessary.
relevance_to_jgct: McCune-Albright syndrome mimicking JGCT; a cause of avoidable oophorectomy.
