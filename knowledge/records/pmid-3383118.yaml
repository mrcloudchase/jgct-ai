key_findings:
- Six-year-old girl with Ollier's disease (right hemicorporal deformity from enchondromas) and precocious pseudopuberty from JGCT.
- After removal of a Stage Iai JGCT hormonal symptoms disappeared; no recurrence and no sarcomatous change of enchondromas after 7 years.
- Review found five previous cases (three Ollier, two Maffucci); ovarian tumors were homolateral to the side involved by enchondromatosis.
relevance_to_jgct: Ollier-associated JGCT; laterality concordance observation.
