key_findings:
- 11-year-old girl treated at 8 months of age for stage III Wilms tumor (right radical nephrectomy, chemotherapy, whole-abdomen radiotherapy) presented 8 years later with abdominal distension and a midline mass.
- 'Ultrasound: 75 x 130 mm heterogeneous cystic-solid mass with vascular solid areas; AFP and beta-hCG normal. CT: well-defined heterogeneously enhancing solid mass from the right ovary with cystic and necrotic regions, ascites and peritoneal metastases.'
- The case section states histopathology after excision confirmed a juvenile granulosa cell tumor of the ovary and in the same sentence calls it a stage III ovarian germ cell tumor, a secondary malignancy; the title, abstract and discussion call it a germ cell tumor. No immunohistochemistry, mitotic count or molecular data are given.
- 'Family history: breast cancer in mother and grandmother, brain tumors (fatal) in a brother. The patient did not attend follow-up; a year later she had supracervical hysterectomy, left salpingo-oophorectomy, right salpingectomy and chemotherapy for metastasis to the right adnexa, omentum and lungs.'
- Authors conclude survivors of Wilms tumor need surveillance beyond five years for late secondary malignancy, and suggest genetic testing in survivors with a family history; no genetic testing was done in this patient.
relevance_to_jgct: Single case in which the pathology is described as juvenile granulosa cell tumor, a possible second malignancy after Wilms tumor with radiotherapy and chemotherapy, but with contradictory histologic labelling and no supporting pathology detail.
