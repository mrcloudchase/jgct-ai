notes: 'Diagnosis is internally inconsistent: JGCT in the Case report text versus ''germ cell tumor'' in title, abstract, discussion and conclusion; normal AFP and hCG, and no pathology details to resolve it. Treat the JGCT label with caution. Chemotherapy regimens and outcome after relapse not reported. A tumor of this kind arising 8 years after abdominal radiotherapy and chemotherapy may be treatment related, but the authors do not analyse this for the ovarian tumor.'
