key_findings:
- A 5-year-old girl in Bobo-Dioulasso, Burkina Faso had an abdominal mass for about 2 to 4 months (the text gives both), intermittent abdominal pain and breast enlargement noted earlier but not brought to medical attention; examination showed Tanner stage II.
- Ultrasound showed a heterogeneous left ovarian mass of 206 x 145 mm and CT 162 x 153 x 100 mm; the uterus was enlarged for age (64 x 18 x 28 mm); no ascites; HCG, AFP, LH, FSH and estradiol were normal for age; inhibin could not be measured; bone age was not assessed.
- Left salpingo-oophorectomy without chemotherapy was done; the tumour was classified FIGO stage Ia and pathology concluded juvenile granulosa tumor.
- Secondary sexual characteristics began to regress about two months after surgery; hormone assays were not repeated for lack of funds; there was no event at a current follow-up of 3 years.
- The authors note that estradiol was normal despite precocious pseudopuberty and suggest circadian variation or assay limits, and cite literature that large size, ascites and capsule rupture are poor prognostic factors.
relevance_to_jgct: Resource-limited-setting case of a 5-year-old with a 16-20 cm JGCT, stage Ia, with precocious pseudopuberty and normal measured estradiol; surgery alone, disease free at 3 years.
