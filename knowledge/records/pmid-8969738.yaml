key_findings:
- Two girls with ovarian JGCT in whom serum inhibin and mullerian inhibitory substance were used as tumor markers.
- JGCT described as a rare cause of sexual precocity; traditionally detected by examination, serum estradiol, and pelvic imaging.
- Immunoassays for MIS and inhibin noted to provide a more sensitive means of tumor detection in adults.
relevance_to_jgct: Early report of inhibin and MIS (AMH) as JGCT tumor markers in children.
