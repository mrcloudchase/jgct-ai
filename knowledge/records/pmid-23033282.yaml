key_findings:
- 'Forty-three ovarian granulosa cell tumors (1990 to 2007, Turkey): 39 stage I; radical surgery in 37, conservative in 6; chemotherapy in 18; 8 recurrences, one of them a juvenile-type tumor, at a mean 55 months (15 to 122); 5-year survival 96.8% for local and 66.7% for advanced disease.'
