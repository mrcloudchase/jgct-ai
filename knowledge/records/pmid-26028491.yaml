key_findings:
- 'French review of pediatric sex cord-stromal tumors (under 5% of gonadal tumors): testicular tumors occur mostly under 6 months, present as swelling, are mainly juvenile granulosa type, and have excellent prognosis after inguinal orchiectomy, with testis-sparing surgery possible under defined conditions; ovarian tumors present with abdominal symptoms or estrogenic or androgenic signs and are mainly juvenile granulosa.'
- Oophorectomy may cure localized disease, but adjuvant cisplatin-based chemotherapy is described as mandatory after tumor rupture or peritoneal dissemination to prevent recurrence; multidisciplinary planning before surgery is advised.
relevance_to_jgct: 'French pediatric guidance: cisplatin chemotherapy after rupture or peritoneal spread.'
