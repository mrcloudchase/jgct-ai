key_findings:
- A 64-year-old phenotypic female with 46,XY complete androgen insensitivity syndrome (testosterone 1,980 ng/dL, estradiol 1,380.8 pg/mL) had a gonadal tumor composed primarily of juvenile-type granulosa cells with a Sertoli component under 50% (gynandroblastoma), plus vulvar leiomyomas; the authors advise monitoring AIS patients for gonadal tumors.
relevance_to_jgct: Juvenile-type granulosa cells in a gonadal tumor of androgen insensitivity syndrome.
