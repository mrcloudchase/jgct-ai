key_findings:
- Thesis summary (Rabat, Morocco) of two juvenile granulosa cell tumors diagnosed at the Rabat children's hospital; the patients were aged 3 and 14 years.
- Main revealing signs were precocious pseudopuberty and increased abdominal volume; tumour diameter was 20 and 6 cm on ultrasound.
- Abdominal CT in both patients and MRI in one confirmed the ovarian origin; estradiol was normal while FSH and LH were low; inhibin and anti-Mullerian hormone were not measured.
- By FIGO the patients were classified IIIb and Ia respectively; pathology of both specimens showed juvenile-type granulosa tumors.
- Both patients had unilateral oophorectomy removing the tumour; chemotherapy was indicated in one patient and neither had radiotherapy; one case relapsed after surgery and received chemotherapy, first adjuvant and then palliative.
relevance_to_jgct: Two-patient Moroccan thesis series; the repository offers only the summary page, so this is an abstract-level record. Which patient received chemotherapy and relapsed is not stated in the summary.
