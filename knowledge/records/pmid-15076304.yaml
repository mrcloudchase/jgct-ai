key_findings:
- Of 77 testicular tumors in males younger than 18 at Children's Hospital of Philadelphia (1976-2002), 3 (3.9%) were JGCTs.
- All 3 had a testis mass noted soon after birth; ultrasound showed complex, multiseptated, hypoechoic mass.
- Two underwent radical orchiectomy; one had testis sparing mass excision.
- Inhibin-alpha positive and AFP negative immunostaining reliably differentiated JGCT from yolk sac tumor.
- At mean follow-up 8.5 years (range 5 to 14) no metastases or local recurrences; first reported testis-sparing enucleation with 5-year recurrence-free follow-up.
relevance_to_jgct: Testicular JGCT series supporting testis-sparing surgery and inhibin/AFP immunostaining for diagnosis.
