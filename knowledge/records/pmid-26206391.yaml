key_findings:
- French TGM-95 prospective registration 1995-2005 of gonadal sex-cord stromal tumors in children <18 years.
- '38 ovarian SCT (median age 10.7y): 23 juvenile and 3 adult granulosa cell tumors, 11 Sertoli-Leydig, 1 mixed; endocrine symptoms in 21.'
- 'Complete initial resection without adjuvant treatment in 23: two relapsed (one second CR, one died).'
- '15 had tumor rupture and/or malignant ascites: 11 received chemotherapy (VIP) and did not relapse; four did not receive chemotherapy and relapsed, with two deaths.'
- Ovarian 5-y EFS 85% and OS 94% (median follow-up 5.9y).
- 11 localized testicular SCT (median age 0.83y), including 4 JGCT; inguinal orchiectomy alone; none relapsed (median follow-up 5.4y).
relevance_to_jgct: French national pediatric cooperative series including 23 ovarian and 4 testicular JGCT; supports adjuvant chemotherapy after tumor rupture.
