key_findings:
- Recurrent JGCT in a 40-year-old woman 5 years after initial presentation.
- Histology and lack of the FOXL2 402C>G missense mutation allowed differentiation from adult GCT.
- Authors state most JGCTs (~97%) occur in individuals <30 years old and suggest long-term surveillance because late recurrence can occur.
relevance_to_jgct: Late recurrence of JGCT (5 years) in an older woman, contrasting with the usual early-recurrence pattern.
