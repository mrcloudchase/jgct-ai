notes: The recurrence arose in the contralateral (left) ovary with peritoneal and omental disease, so the authors' 'recurrence' versus a metachronous contralateral primary is an interpretation (the paper itself notes that a 126-month event in another series was regarded as metachronous contralateral). Original diagnosis five years earlier was serous cystadenoma, reclassified on review. Age at presentation of 35 versus 40 at recurrence.
