key_findings:
- Androgen receptor splice variants were detected in 46 of 5,573 solid tumors profiled with a 515-gene DNA and 55-gene RNA panel, enriched in prostate (18.2%), breast (8.2%) and salivary duct carcinoma, with rare occurrences in a lacrimal gland carcinoma and a juvenile granulosa cell tumor; AR-V7 was present in all 46.
relevance_to_jgct: A single JGCT with androgen receptor splice variants in a pan-cancer screen.
