key_findings:
- 13-year-old girl with androgenic manifestations, increased abdominal size and elevated plasma testosterone.
- Pelvic ultrasound showed a left adnexal cyst 14.4 x 9.1 x 9.7 cm; laparotomy found a left ovarian cystic tumor diagnosed as JGCT.
- Androgen production by JGCT described as rare; these tumors are usually solid or predominantly solid.
