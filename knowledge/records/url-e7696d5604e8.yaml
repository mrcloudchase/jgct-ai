key_findings:
- Neonate 10 days of age with an enlarged descended right testis; alpha-fetoprotein slightly increased; ultrasound showed a multicystic mass with internal vascular flow replacing the testicle.
- Right radical inguinal orchiectomy; 2.2 x 1.5 x 1.0 cm mass with multiple cysts.
- Tumour cells positive for inhibin, WT1 and calretinin; negative for panCK, AFP, CD30, CD117, PLAP, D2-40 and OCT3/4.
- 'Authors: JGCT ''is the most common testicular tumour in infants < 6 months''; main differential is yolk sac tumour.'
relevance_to_jgct: Neonatal testicular JGCT with immunoprofile; notes differential with yolk sac tumour when AFP is raised.
