notes: Abstract retrieved from the PubMed page via WebFetch (model-assisted extraction); not open access. Abstract substage counts use a denominator of 26 while stage I is 24/30, an internal inconsistency in the source. Fertility outcomes named in the title are not reported in the abstract. Conflict noted with pmid-40272823 on prognostic weight of stage (here all deaths were advanced stage; there stage was not significantly associated with outcome and 3 of 4 relapses were stage IA).
