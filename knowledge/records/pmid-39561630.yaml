key_findings:
- Retrospective single-centre series of 30 ovarian JGCT patients treated 1980 to 2024 at IRCCS San Gerardo dei Tintori, Monza, Italy.
- 'Stage I 24/30 (80%; reported as IA 16, IB 1, IC 7 of 26), stage II 2/30, stage III 4/30.'
- Fertility-sparing surgery in 26/30 (86.7%); adjuvant chemotherapy in 6/30 (20%), surveillance in 24/30.
- Three of 30 (10%) relapsed and died of disease despite multimodal therapy; all three had advanced stage at diagnosis.
- Authors conclude stage I JGCT has a good prognosis while advanced stage carries high relapse and mortality.
relevance_to_jgct: Adult-centre series with an older median age than pediatric registries, supporting fertility-sparing surgery in early stage and identifying advanced stage as the main adverse factor.
