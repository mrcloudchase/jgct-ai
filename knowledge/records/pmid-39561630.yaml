key_findings:
- 30 ovarian JGCT patients treated at IRCCS San Gerardo dei Tintori, Monza, 1980-2024; median age at onset 21.5.
- 80.0% (24/30) stage I (16/26 IA, 1/26 IB, 7/26 IC), 6.7% (2/30) stage II, 13.3% (4/30) stage III.
- Fertility-sparing surgery in 86.7% (26/30); radical surgery in 13.3% (4/30).
- Adjuvant chemotherapy in 20.0% (6/30); 80.0% (24/30) surveillance only.
- Three of thirty (10.0%) relapsed and died of disease; all had advanced stage at diagnosis.
relevance_to_jgct: Adult/adolescent-focused single-centre series showing good prognosis in stage I and poor outcome in advanced stage.
