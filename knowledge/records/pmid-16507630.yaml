key_findings:
- 30 children with juvenile ovarian GCT from the malignant germinal tumor protocol of the French Society for Childhood Cancer; nested PCR, laser microdissection, direct sequencing.
- Galphas (GNAS) activating mutations at hotspot position 201 found in nine patients (30%); R201C and R201H localized exclusively to tumoral granulosa cells, absent from ovarian stroma.
- 'Patients with a hyperactivated Galphas had significantly more advanced tumors (P < 0.05): seven of them (77.7%) were stage Ic or had a recurrence.'
- Galphai showed no mutation.
relevance_to_jgct: First report of recurrent somatic GNAS activating mutations in JGCT and their association with advanced stage or recurrence.
