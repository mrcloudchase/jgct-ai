key_findings:
- A 12-year-old girl, menarche two weeks earlier, presented to the emergency department of a hospital in Mila, Algeria with severe right lower abdominal pain, tachycardia (120 bpm), blood pressure 90/60 mmHg, temperature 38.2 C and abdominal distension for three months.
- Examination found a pelvic mass of nearly 15 cm in the right adnexal region; haemoglobin was 9 g/dl; ultrasound and CT showed a right adnexal mass of 13 x 12 x 8 cm without septations and free fluid.
- Haemoglobin fell 1 g/dl in three hours, so emergency laparotomy was done; a large mass arising from the right ovary was ruptured and actively bleeding and 2700 cc of blood was found; the left ovary, uterus and omentum were normal.
- Right salpingo-oophorectomy was performed; histology confirmed juvenile granulosa cell tumor, cystic, evaluated as 'at least stage 1'; no chemotherapy was given.
- Recovery was uneventful and she was completely asymptomatic one year after surgery. The patient had no secondary sexual characteristics beyond menarche reported.
- The authors cite the literature for FOXL2 402C>G mutation, inhibin and other background; none of this was tested in the patient.
relevance_to_jgct: Case of spontaneous rupture of a large ovarian JGCT with 2.7 litre haemoperitoneum in a 12-year-old, treated by emergency salpingo-oophorectomy without chemotherapy.
