key_findings:
- 37-year-old woman with recurrent JGCT received paclitaxel-carboplatin then single-agent docetaxel, but progressed with multiple abdominal masses and ascites.
- Whole-abdominal external beam radiotherapy with pelvic boost was delivered as palliation and was well tolerated.
- After radiotherapy, ultrasonography showed tumor shrinkage and the ascites disappeared.
- Authors suggest considering palliative radiation for recurrent JGCT with abdominal complaints.
relevance_to_jgct: Radiotherapy response in chemotherapy-refractory recurrent JGCT.
