presentation:
- enormous right ovarian tumor within a year of delivery
key_findings:
- A 24-year-old had an enormous right ovarian JGCT found 3 months before surgery and within the first year after her first delivery; ultrasound before and during pregnancy had shown no tumor, so the authors infer rapid growth after delivery or masking by the gravid uterus.
- 'Background figures given: granulosa cell tumors are 1 to 2% of ovarian malignancies; juvenile type 5% of them, 90% before age 30.'
relevance_to_jgct: Postpartum JGCT with apparent rapid growth.
