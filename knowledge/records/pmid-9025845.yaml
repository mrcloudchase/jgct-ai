key_findings:
- 'Sixteen testicular sex cord-stromal tumors in children: 4 juvenile granulosa cell tumors and 5 Sertoli or incompletely differentiated tumors had high mitotic rates and/or sarcomatoid areas suggesting malignancy, yet none recurred or metastasized; some had been misdiagnosed as yolk sac tumor or rhabdomyosarcoma, and negativity for AFP, muscle-specific actin and desmin helps exclude those.'
relevance_to_jgct: High mitotic activity in testicular JGCT does not predict malignant behavior.
