key_findings:
- 'Case from University of Occupational and Environmental Health, Japan: a 12-year-old girl (history of epilepsy on valproate; menarche at 11 years 3 months; Tanner breast III, pubic hair II; 166 cm, 47 kg) presented with menstrual irregularity; ultrasound and MRI showed a 5 x 6 cm solid-cystic right ovarian tumor with rich blood flow and a thickened endometrium.'
- 'Preoperative labs: estradiol 136.8 pg/mL, FSH 0.1 and LH 0.8 mIU/mL, CA125 38.0 U/mL; AFP 2.0 ng/mL, hCG 1.0 mIU/mL and LDH 191 U/L normal, so germ cell tumors were considered unlikely and teratoma or sex cord-stromal tumor suspected.'
- Laparoscopic ovarian tumor enucleation was done with endometrial sampling; ascites cytology negative; intraoperative frozen section and imprint cytology suggested a sex cord-stromal tumor without clear malignancy. The tumor was cut up in a retrieval bag and removed through the umbilicus, with capsule rupture during enucleation.
- 'Pathology: diffuse and cord-like growth with irregular rosette-like structures, eosinophilic cytoplasm, pleomorphic nuclei with some mitoses, no nuclear grooves or Call-Exner bodies; CD99 and alpha-inhibin positive; diagnosis juvenile granulosa cell tumor. Endometrium showed simple hyperplasia.'
- 'One week after surgery estradiol fell to 6.7 pg/mL with FSH 5.0 and LH 5.9 mIU/mL. After explaining that the tumor was of borderline/low-grade malignant type, the family chose completion surgery: laparoscopic right adnexectomy 2 months later, with no adhesions, ascites or suspicious findings; no residual tumor on pathology; omentectomy omitted. Final diagnosis: JGCT stage Ic1 (pT1c1NxM0).'
- Menses resumed 6 months after surgery and no recurrence at the time of reporting. Authors argue that preoperative diagnosis of JGCT is difficult, a second-stage operation can be needed, laparoscopic completion is an option for young patients without evidence of metastasis if consent is thorough, and omentectomy would have been desirable to exclude microscopic spread; they cite TGM-95 that most JGCT are stage IA.
relevance_to_jgct: Single pediatric JGCT case with full hormonal, pathologic and surgical details and a discussion of two-stage laparoscopic management after intraoperative rupture; Japanese-language source.
