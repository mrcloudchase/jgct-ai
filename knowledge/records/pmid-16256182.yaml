key_findings:
- 31-year-old pregnant woman with a 9.5 cm adnexal mass detected at 34 weeks of gestation.
- At 37 + 5 weeks a cesarean section with right salpingo-oophorectomy and tumor removal was performed; histology and IHC gave JGCT.
- Background states JGCT account for about 5% of all granulosa cell tumors and nearly 80% are diagnosed in the first two decades; only 10% of granulosa cell tumors present during pregnancy.
- Authors state JGCT confined to the ovary appears to have an excellent prognosis and can be treated by unilateral salpingo-oophorectomy.
