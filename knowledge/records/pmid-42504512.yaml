key_findings:
- European Cooperative Study Group for Paediatric Rare Tumours (EXPeRT) standard clinical practice recommendations for pediatric ovarian sex cord-stromal tumors, based on cohort analyses, literature review, and expert consensus conference.
- Complete tumor resection is the cornerstone of treatment, with meticulous attention to preventing tumor spillage.
- Adjuvant chemotherapy decisions are risk-stratified by tumor stage plus histological differentiation and mitotic rate.
- Recommends treatment within cooperative networks with centralized histopathology review, comprehensive genetic testing, multidisciplinary tumor board, and prospective registry enrollment.
relevance_to_jgct: Current European pediatric consensus recommendations covering ovarian JGCT management.
