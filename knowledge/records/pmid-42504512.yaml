key_findings:
- European standard clinical practice recommendations for pediatric and adolescent ovarian sex cord-stromal tumors (including granulosa cell and Sertoli-Leydig cell tumors), developed within the European Cooperative Study Group for Paediatric Rare Tumours (EXPeRT) initiative from national and international cohort analyses, literature review and an expert consensus conference.
- Complete resection without spillage is described as the cornerstone of treatment.
- Adjuvant chemotherapy decisions are to be risk-stratified using stage plus histological differentiation and mitotic rate.
- Recommends care within cooperative networks with centralized histopathology review, comprehensive genetic testing, multidisciplinary tumor boards and prospective registry enrollment.
relevance_to_jgct: Most recent European consensus guidance covering pediatric ovarian JGCT management; adds mitotic rate to stage for risk stratification, consistent with the STEP registry findings.
