key_findings:
- EXPeRT/ERN PaedCan European Standard Clinical Practice recommendations for pediatric ovarian SCSTs, built on national/European cohort analyses, systematic review and expert consensus; most recommendations Level III evidence, graded A-E.
- 'JGCT: bimodal age (children vs adolescents/young adults), estrogen-producing, favorable prognosis in stage Ia-Ic1; ovarian small cell carcinoma, hypercalcemic type is the most important differential diagnosis (check calcium). Mitotic rate per 10 HPF is of prognostic relevance in JGCT (Level III, Grade B).'
- 'Workup: AFP, beta-HCG/total HCG, inhibin (Level III, Grade B), estrogen, testosterone, DHEAS, LH, FSH, CA125; ultrasound plus pelvic/abdominal MRI from pelvic floor to diaphragm; chest imaging, PET/CT and cranial MRI not routinely recommended. Staging by FIGO; reference pathology review required.'
- 'Surgery: open approach recommended to avoid rupture (laparoscopy only if rupture can be safely avoided); peritoneal cytology, inspection and biopsy of suspicious areas; unilateral oophorectomy usually sufficient for organ-confined tumors; no biopsy of a normal contralateral ovary, no systematic lymph node dissection, hysterectomy avoided. After ovary-sparing excision with high mitotic count in JGCT, re-excision with oophorectomy recommended.'
- 'Chemotherapy: IA/IB none unless high-risk histology; IC1 JGCT no adjuvant chemotherapy (Level III, Grade D); IC2 JGCT four cycles cisplatin-based (Level III, Grade A), three cycles may be considered with low mitotic index; stages II-III at least four cycles; 5-6 cycles may be considered for JGCT with high mitotic index. Regimens PEB or PEI/VIP; carboplatin/paclitaxel data in adults included no JGCT.'
- 'Genetics: DICER1 testing advised in anaplastic JGCTs (Level IV, Grade B); germline testing considered if history suggests multiple endocrine lesions or JGCT; in Ollier/Maffucci, tumor tissue should be analyzed for IDH1/IDH2 variants; McCune-Albright (somatic GNAS) also described with JGCT.'
- 'Follow-up: tumor markers (inhibin, estrogen/testosterone, CA125) if elevated; examination plus abdominal/pelvic ultrasound every 3 months for the first 2 years after therapy, then extended intervals; no routine chest imaging; advice on earlier menopause and family planning.'
- Relapse mostly within the first 2 years, mostly peritoneal; once relapse occurs long-term survival is approximately 20% or lower; options used include platinum chemotherapy, high-dose chemotherapy with autologous stem cell rescue, cytoreduction with HIPEC, regional hyperthermia, radiotherapy and GnRH antagonists (GnRH inhibition Level V, Grade C as add-on for relapse). Radiotherapy not routinely recommended first line.
relevance_to_jgct: Current European pediatric consensus with stage- and mitotic-index-based JGCT management (surgery, chemotherapy indications and regimens, markers, follow-up).
