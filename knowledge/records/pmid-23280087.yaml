key_findings:
- States FOXL2 is near absent in juvenile-type GCTs and investigates miRNAs as a suppression mechanism using cell lines COV434 (juvenile-type) and KGN (adult-type).
- COV434 expressed miR-17 family miRNAs, KGN let-7 family; miRNA binding to FOXL2 3'UTR confirmed by luciferase assays.
- Knockdown of miR-17 family increased FOXL2 mRNA but not protein; authors propose another miRNA represses FOXL2 translation.
relevance_to_jgct: In vitro study of FOXL2 suppression in a JGCT-derived cell line.
