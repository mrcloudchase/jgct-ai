notes: COV434 is described as juvenile-type; its origin has been questioned elsewhere (not verified this run). Statement that FOXL2 is near absent in JGCT is consistent with pmid-17430735 and differs from IHC positivity reported in pmid-39773640 and testicular JGCT in pmid-26076062.
