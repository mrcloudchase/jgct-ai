notes: Abstract only (English abstract of Chinese article). Unusual immunoprofile (calretinin negative, inhibin positive in only 1) relative to most JGCT literature. Conflicts with pmid-12411036, which reports high mitotic index associated with progression and death. Written from the abstract only (restored 2026-10-31 under the abstract rule); full text not obtainable by any open route.
