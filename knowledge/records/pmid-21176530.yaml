key_findings:
- 7 cases; mean age 24 years (range=6 to 53 years). Four presented with hormonal disturbance, 3 with abdominal pain or swelling.
- Six cases stage IA, one stage IC; six underwent unilateral salpingo-oophorectomy.
- 'Follow-up 1 to 10 years (mean=4.3 years) in 6: five healthy without recurrence; one died of tumor metastasis one year after diagnosis.'
- Tumors 7 to 20 cm (average=13.4 cm); 4 of 7 mixed solid-cystic, 2 unilocular cystic.
- No nuclear grooves or Call-Exner bodies (6/7); one case had minor foci resembling adult granulosa cell tumor; mitotic count 1 to more than 5 per 10 HPF.
- 'IHC: vimentin 6/6 positive; cytokeratin (AE1/AE3) and calretinin negative; CD99 positive in 4; inhibin positive in 1.'
- Authors conclude nuclear atypia, mitotic activity and tumor size do not correlate with risk of recurrence or aggressive behavior.
relevance_to_jgct: Chinese pathology series including adult-age JGCT; reports immunoprofile and argues atypia/mitoses are not prognostic.
