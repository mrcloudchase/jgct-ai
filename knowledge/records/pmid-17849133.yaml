alterations: []
treatments:
- regimen: unilateral salpingo-oophorectomy + BEP x3
  setting: primary, stage IC
  n: 1
  outcome: disease-free at 10 months
presentation:
- ovarian mass
- hypercalcemia
- suppressed PTH
key_findings:
- 25-year-old woman with unilateral ovarian mass, profound hypercalcemia and suppressed intact PTH.
- After correction of hypercalcemia, unilateral salpingo-oophorectomy showed Stage IC JGCT; three courses of adjuvant BEP given.
- Disease-free, eucalcemic and menstruating normally ten months after surgery.
- Described as the second reported case of ovarian JGCT with hypercalcemia; attributed to tumor PTH-related protein because PTH was suppressed and hypercalcemia did not recur (PTHrP not stated as measured in abstract).
relevance_to_jgct: Paraneoplastic hypercalcemia in JGCT; fertility-sparing surgery plus BEP for stage IC.
