key_findings:
- A 20-year-old presented with acute anemia, abdominal pain and a large pelvic mass that proved to be a JGCT; postoperative course was unremarkable and she was referred to oncology.
- The authors note that JGCT can mimic benign ovarian masses on imaging and advise preoperative inhibin and testosterone measurement.
