key_findings:
- A 25-year-old woman (gravida 1 para 1) presented in September 1988 with lower abdominal pain; a right ovarian tumour measuring 17 x 11 x 10 cm, mixed solid and cystic with haemorrhagic, necrotic cystic areas, was removed with both adnexa and the uterus.
- At surgery there were about 3000 ml of ascites and about 600 ml of pleural effusion, both cytology Class I; preoperative CA125 was 1700 U/ml. The tumour touch imprint was read as Class IV (suspicious for malignancy).
- Her course was good after surgery until November, when her general condition deteriorated; in early December a left supraclavicular lymph node metastasis was found, and she died on 27 December, about three months after surgery.
- 'Histology: diffuse growth with follicles of various sizes containing eosinophilic fluid, Graafian-follicle-like areas, intermingled theca cells and luteinized cells; 51 mitoses per 10 fields at x200 across the tumour.'
- Touch cytology showed cohesive small round granulosa cells and scattered spindle theca cells, few nuclear grooves, no Call-Exner bodies and frequent mitoses, which the authors give as the cytological differences from adult-type GCT. Cells were vimentin and desmin positive, CEA negative; a few eccentric-nucleus cells were estradiol positive.
- Electron microscopy identified granulosa cells (desmosomes, basement-membrane-like material), theca cells with lipid droplets, cells intermediate between the two, luteinized cells and fibroblast-like cells.
- The authors read the size (17 cm), marked nuclear atypia and the mitotic rate (51/10 HPF) as histological signs of malignancy consistent with the clinical course, citing Young 1984's adverse factors (size 16 cm or more, nuclear atypia grade 1-2, 10 or more mitoses per 10 HPF).
relevance_to_jgct: Japanese cytology case of a fatal adult JGCT with very high mitotic count, with cytological criteria distinguishing JGCT from adult GCT on touch imprints.
