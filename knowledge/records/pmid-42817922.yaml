key_findings:
- DICER1 alterations have been identified, less consistently, in rare examples of juvenile and adult granulosa cell tumor among gynecologic neoplasms.
- Shared DICER1-associated morphologic hallmarks include primitive mesenchyme, fetal-type epithelium and cartilage, rhabdomyosarcomatous and neuroectodermal differentiation, and anaplasia; recognition should prompt DICER1 testing and genetic counseling.
relevance_to_jgct: Review placing JGCT at the margin of the DICER1-associated tumor spectrum.
