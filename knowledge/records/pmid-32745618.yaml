key_findings:
- 7 year-old girl, one year after left ovariectomy for JGCT, found on ultrasound follow-up to have an 18-mm right ovarian cyst.
- Six months later the mass had grown with multivacuolar features and inhibin A was mildly elevated.
- Laparoscopic-assisted cystectomy sparing healthy ovarian tissue; pathology benign mucinous cystadenoma.
relevance_to_jgct: Benign metachronous contralateral tumor with mildly elevated inhibin A after JGCT; relevant to surveillance interpretation.
