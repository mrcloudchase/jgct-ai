key_findings:
- '34 JGCT patients diagnosed 2000-2021 from the SEER database; median age 19.5 years (1-48): 3 aged <=10, 16 aged 11-20, 11 aged 21-30, 4 >30.'
- Unilateral in 33; median maximum diameter 12.4 cm (3.5-40.0) in 26 recorded.
- 'FIGO 2014: stage I 19 (Ia 10, Ic 9), II 4, III 8, IV 3; two did not undergo resection.'
- 'Propensity-matched cohort of 32 JGCT and 64 AGCT: among JGCT 13 died and 19 survived (59%, 19/32), significantly different from AGCT (P<0.001); median survival 126 months for JGCT vs not reached for AGCT.'
- 'Multivariate Cox: histology and stage significant for overall survival.'
relevance_to_jgct: US population-registry (SEER) analysis reporting worse survival for JGCT than matched adult GCT; differs from most institutional and registry series.
