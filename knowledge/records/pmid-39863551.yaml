key_findings:
- SEER database analysis of 34 ovarian JGCT patients diagnosed 2000 to 2021, median age 19.5 years.
- 'FIGO stage: I 19 (Ia 10, Ic 9), II 4, III 8, IV 3; lymph node metastasis in 1 of 10 dissected.'
- 'Overall survival 59% (20/34): stage I 16/19 vs stage II-IV 4/15 (P = 0.002); median survival 126 months.'
- In a propensity-matched comparison, JGCT survival (59%) was worse than adult GCT (92%), P < 0.001; histology and stage were independent prognostic factors.
- Authors favor fertility-preserving surgery in stage I and caution against it in stage II-IV.
relevance_to_jgct: Population-registry outcome data that portray JGCT as more lethal than adult GCT, in contrast with pediatric registry and pathology series.
