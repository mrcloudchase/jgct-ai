notes: Chinese-language article; English abstract read. Stage distribution (15/34 stage II-IV) is far more advanced than in clinical registry series, which may explain the difference. Survival 59% contrasts with 92% alive and disease-free in pmid-6465418 and 97% OS in pmid-40272823.
