notes: 'Units are inconsistent in the source (20 x 15 x 6 mm tumour vs 45 x 43 mm CT mass; 4 x 3 ''milimeter'' incision mass): likely centimetres but recorded as printed. Chemotherapy is described only as ''expected'', so whether it was given is unconfirmed. The incision recurrence is labelled cutaneous metastasis by the authors; it could also be tumour implantation from the ruptured tumour. Authors are from Ningxia People''s Hospital.'
