key_findings:
- A 12-year-old post-menarchal girl presented with 2 months of abdominal distension and heavy periods with intermittent bleeding; ascites and a pelvic mass were found; tumour markers (AFP, LDH, CA125, CEA, CA199) were normal.
- Laparoscopy collected about 8,000 ml of green ascites (cytology negative) and showed a ruptured right ovarian tumour of '20 x 15 x 6 mm' (CT earlier showed a 45 x 43 mm solid-cystic mass); unilateral salpingo-oophorectomy was done and pathology confirmed juvenile-type GCT, FIGO stage IC2 because of preoperative capsule rupture.
- At least 6 cycles of chemotherapy were 'expected'; the text does not say what was given.
- Five years later she found a mass in the surgical incision (4 x 3 'milimeter' on CT); it was incised and pathology showed recurrence of juvenile-type GCT; tumour markers were normal; 6 cycles of chemotherapy were expected after surgery and she had no recurrence during follow-up (length not stated).
- The authors state that cutaneous metastasis of juvenile-type GCT has never been reported; they cite ESMO, ESGO and NCCN positions on stage I treatment and state BEP or taxane-carboplatin is recommended for stage IC.
relevance_to_jgct: Case of a stage IC2 JGCT in a 12-year-old with a late (5-year) recurrence in the abdominal wall incision.
