key_findings:
- 'Systematic review of 60 articles on granulosa cell tumor management: granulosa cell tumors are 70% of sex cord-stromal tumors; adult-type 5-year survival 97 to 98% with relapses beyond 20 years; juvenile GCT survival 97% at stage I and 5-year survival 0 to 22% at advanced stage with earlier recurrence.'
- Young women having fertility-sparing surgery had reproductive and survival outcomes comparable to radical surgery.
relevance_to_jgct: Review figures for JGCT survival by stage and support for fertility-sparing surgery.
