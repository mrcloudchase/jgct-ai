  outcome: authors describe excellent prognosis; follow-up not detailed in abstract
presentation:
- scrotal swelling
- multicystic testicular enlargement
key_findings:
- Two newborns with scrotal swelling and multicystic testicular enlargement on sonography without distinguishable parenchyma.
- 'Case 1: normal testosterone, beta-HCG and inhibin-B; alpha-fetoprotein 35.350 ng/dl; right inguinal orchiectomy.'
- 'Case 2: normal testosterone, beta-HCG and inhibin-B; alpha-fetoprotein 9.038 ng/dl, LDH 768 U/I; left inguinal orchiectomy.'
- Authors state the juvenile type is the most common reason for scrotal swelling in newborns under six months and fewer than fifty cases had been reported.
- Authors conclude it is benign with excellent prognosis; inguinal orchiectomy is the therapy of choice with no further management required.
relevance_to_jgct: Two neonatal testicular JGCTs managed by inguinal orchiectomy.
