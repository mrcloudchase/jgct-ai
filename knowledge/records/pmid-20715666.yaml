key_findings:
- Ascitic fluid from two young women (23 and 25) was read as adenocarcinoma but histology showed yolk sac tumor and juvenile granulosa cell tumor; on review the JGCT fluid showed distinct tubular structures, and the authors urge a combined clinical and cytologic approach in young patients.
relevance_to_jgct: JGCT cells in ascitic fluid can be misread as adenocarcinoma.
