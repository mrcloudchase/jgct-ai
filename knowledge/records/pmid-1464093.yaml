key_findings:
- Three-month-old girl with a 13 x 8 x 6 cm right ovarian JGCT causing isosexual precocious pseudopuberty that resolved after surgery; focal Sertoli cell differentiation.
- Despite radiotherapy and chemotherapy, lung metastases appeared one and a half years after onset and were successfully treated with further radiotherapy and chemotherapy.
- Between ages 6 and 15 she developed gastrointestinal polyposis, subcutaneous lipomatosis and nodular goiter.
- Surviving 15 years after operation; authors suggest a possible genetically conditioned association.
relevance_to_jgct: Infant JGCT with lung metastases salvaged; later polyposis, lipomatosis and goiter suggest a possible tumor predisposition syndrome (e.g., PTEN-like phenotype not named by authors).
