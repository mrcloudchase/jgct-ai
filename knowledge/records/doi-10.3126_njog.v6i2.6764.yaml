key_findings:
- Letter from two Welsh hospitals (Nevill Hall, Prince Charles) describing one JGCT and one adult GCT. The JGCT patient was 17, known to have polycystic ovarian disease and taking Dianette, and presented with acute abdominal pain and vomiting and a tender left pelvic mass.
- Ultrasound showed a normal uterus and an 8 cm cystic-solid mass without ascites; CT and tumour markers were normal. At laparotomy a 9 cm left ovarian cyst with a solid area, twisted twice on its pedicle, was enucleated, preserving the same-side tube and the normal right tube and ovary. Histology confirmed JGCT.
- The authors counted 16 granulosa cell tumours over a decade at their hospital, one juvenile and 15 adult type, and argue that unilateral resection suits adolescents with JGCT, including when the tumour is torted.
relevance_to_jgct: Adolescent JGCT presenting as torsion, treated by cyst enucleation (ovary-sparing); one-in-sixteen local frequency among GCTs.
