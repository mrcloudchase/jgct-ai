key_findings:
- 'Seventeen androgenic granulosa cell tumors (11 adult, 6 juvenile), ages 2 to 58, two pregnant: 14 masculinized, plasma testosterone elevated in 9; all stage IA; 7 were thin-walled cysts 23 to 36 cm and 9 solid averaging 7 cm; the only clinically malignant tumor was a cystic adult-type tumor fatal within 4 years.'
relevance_to_jgct: Six androgenic JGCT in the classic series of virilizing granulosa cell tumors, often large and cystic.
