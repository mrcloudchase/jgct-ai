key_findings:
- Gynandroblastoma in which the ovarian-type element resembled JGCT; testicular-type elements accounted for 20% and resembled intermediate-grade Sertoli-Leydig cell tumor.
- Sertoli cells stained for cytokeratin CAM 5.2 and estrogen/progesterone receptor; JGCT-like areas were negative for these.
- Ultrastructurally JGCT-like areas had basal lamina-invested cell groups, low N:C ratios, lipid droplets, and simple junctional complexes.
- Prognosis of gynandroblastoma described as favorable and similar to that of individual components, with limited follow-up.
