key_findings:
- 'Nine infants operated for ovarian cysts over 10 years: 6 diagnosed antenatally had complex cysts with torsion; of 3 diagnosed postnatally (1 day to 7 months), two had tubo-ovarian torsion and one a juvenile granulosa cell tumor; the authors recommend removing all complex ovarian cysts in infancy.'
