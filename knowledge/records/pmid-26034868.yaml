- 'Nuclear beta-catenin staining in 87 testicular sex cord-stromal tumors: positive in 64% of Sertoli cell tumors NOS, 60% of sclerosing Sertoli cell tumors and 67% of Sertoli-stromal tumors, and negative in all 7 juvenile granulosa cell tumors, 4 adult granulosa, 10 Leydig cell, 5 large cell calcifying Sertoli and 12 unclassified tumors.'
