key_findings:
- All 11 JGCTs were CD99 positive and Fli-1 positive, so these markers overlap with Ewing sarcoma.
- None of the 11 had an EWSR1 rearrangement by FISH.
- Authors suggest EWSR1 FISH as a useful adjunct when JGCT and Ewing sarcoma cannot be separated by morphology and immunohistochemistry.
relevance_to_jgct: Diagnostic pitfall, as JGCT expresses CD99 and Fli-1, so EWSR1 testing helps exclude Ewing sarcoma.
