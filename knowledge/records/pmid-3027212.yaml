key_findings:
- Nine granulosa-theca cell tumors studied endocrinologically, including two juvenile granulosa-theca tumors that caused precocious pseudopuberty; ovarian-to-peripheral vein ratios were 8.8 to 28.6 for estradiol, 2.7 to 16.9 for estrone, 3.6 to 4.7 for progesterone and 1.6 to 6.6 for testosterone; estradiol localized to granulosa and theca cells (Japanese).
relevance_to_jgct: Direct evidence of tumor steroid secretion in juvenile granulosa-theca tumors.
