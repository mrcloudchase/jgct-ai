key_findings:
- 7 patients with FIGO stage >= II JGCT documented in German MAKEI trials 1988-2000 (age 4;2 - 18;11 years, median 14;8); stage IIc 3, IIIa 1, IIIc 3.
- Resection complete in only two of five laparotomies; both laparoscopic resections incomplete.
- All received 4 or 6 cycles of adjuvant cisplatin-based three-agent chemotherapy; one also received 40 Gy abdominal irradiation.
- All achieved complete clinical remission; 4 of 7 in first continuous CR at 15 to 111 months; one metachronous contralateral tumor at 126 months; one recurrence at 12 months with second CR; one died of diffuse peritoneal recurrence. 6 of 7 alive at median 47 (15-138) months.
relevance_to_jgct: Early evidence that cisplatin-based adjuvant chemotherapy can control advanced JGCT.
