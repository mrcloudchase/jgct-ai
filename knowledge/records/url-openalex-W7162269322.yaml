key_findings:
- Hungarian pathology review (14 pages, 10 authors, National Institute of Oncology Budapest and others) of testicular sex cord-stromal tumors, with a dedicated section on juvenile-type granulosa cell tumor; illustrations come from the authors' own diagnostic material.
- The authors state that testicular juvenile-type granulosa cell tumor appears in 90% of cases before 6 months of age, may be associated with cryptorchidism and other gonadal developmental disorders, is mostly hormonally inactive and is 'without exception benign'.
- 'Histology as described: small round cells in nests or follicles with eosinophilic or basophilic secretion, voluminous fibrous or fibromyxoid stroma, brisk mitotic activity, and no coffee-bean nuclei or Call-Exner bodies; most express SF1, calretinin, inhibin, SOX9, WT1 and FOXL2.'
- The authors cite that the GNAS and AKT1 variants of the ovarian form are absent in testicular tumors, whereas monosomy of chromosome 10 is frequent (60%); for adult-type testicular GCT they cite FOXL2 p.C134W in 10-40%.
- 'Differential diagnosis from yolk sac tumor: JGCT may have mildly raised AFP but not the pathological elevation of yolk sac tumor, has follicular, solid or cystic structure, and is mostly negative for SALL4, AFP and glypican-3; Schiller-Duval bodies indicate yolk sac tumor.'
- For the group overall the authors state that about 90% of testicular sex cord-stromal tumors are indolent and about 10% aggressive and resistant to systemic therapy (BEP, VIP, PVB); aggressive histology is practically absent at ages 13-21; features suggesting aggressive disease are size over 5 cm, mitoses, positive margins, rete testis or lymphovascular invasion, atypia and necrosis. These are group-level statements, not JGCT-specific.
relevance_to_jgct: Review chapter on testicular JGCT pathology, immunophenotype, molecular features and differential diagnosis from yolk sac tumor, stated as benign in infants.
