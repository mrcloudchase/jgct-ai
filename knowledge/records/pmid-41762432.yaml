notes: Mostly off-topic for JGCT; read in full but only the testicular tumor section (and its single JGCT mention) is summarized. The 10-13% sex cord-stromal tumor proportion and the claim that 10% of sex cord-stromal tumors are malignant are the guideline's citations to other work (refs 285-287, 312), and the context there is mixed pediatric and adolescent testicular tumors. Guidance is tailored to Italy. Compare with testicular JGCT sources pmid-33201299 and pmid-40272823.
