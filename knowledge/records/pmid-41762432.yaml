key_findings:
- Sex cord-stromal tumors, including juvenile granulosa cell, Leydig, and Sertoli cell tumors, are described as rare (10-13%) and usually benign in children, though malignancy is occasionally observed in adolescents and young adults.
- At least abdomen MRI is recommended in sex cord-stromal tumors as 10% are malignant with poor prognosis.
- 'R6.4: in pre-pubertal patients alpha-FP is sufficient to discriminate between malignant and benign tumors.'
- 'R6.9: testis-sparing surgery with intraoperative frozen-section examination recommended in pre-pubertal tumors if serum tumor markers are negative (1, moderate quality).'
relevance_to_jgct: Italian GRADE guideline on pediatric testicular tumors; general testicular SCST statements applicable to infant testicular JGCT.
