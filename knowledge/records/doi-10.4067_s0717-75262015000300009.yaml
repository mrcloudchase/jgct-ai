presentation:
- 'prenatal ultrasound at 35 weeks: right testis 24 mm with multiple anechoic areas (left 13 mm)'
- enlarged heterogeneous right testis (30 x 20 mm) at birth
- AFP 45,836.5 ng/ml and beta-hCG 59.61 mIU/ml at birth
key_findings:
- In a 39-year-old woman (fourth pregnancy, three previous miscarriages) the third-trimester scan at 35 weeks showed a male fetus with a normal 13 mm left testis and a 24 mm right testis containing multiple anechoic, dysplastic-looking areas.
- The boy was born at 39+2 weeks weighing 2910 g with normal male genitalia and no dysmorphic features; the right testis was enlarged (30 x 20 mm). Scrotal ultrasound showed a 24 x 17 mm solid mass with multiple cystic areas and increased vascularity.
- Tests were normal except AFP 45,836.5 ng/ml and beta-hCG 59.61 mIU/ml. At 24 hours of life a right inguinal orchiectomy with the spermatic cord was done; no normal testicular tissue was identified at surgery.
- The 7 g specimen held a 2.5 cm multicystic tumour with solid tracts. Cysts with basophilic content were lined by large round, partly vacuolated cells with some mitoses. Tumour cells expressed vimentin, alpha-inhibin, CD99, S100 and cytokeratin AE1/AE3 and not AFP, PLAP, D2-40, glypican-3, CD117 or CD30; Ki-67 was 20%. The diagnosis was JGCT.
- The baby went home at 36 hours; two months after surgery he was healthy with progressively falling AFP.
- The authors state that only three other prenatally diagnosed cases had been published (Peterson and Skoog 2008 at 35 weeks, Bulotta 2012 at 36 weeks, Illescas 2014), and that orchiectomy is curative and chemotherapy and radiotherapy are not indicated.
relevance_to_jgct: Fourth prenatally detected testicular JGCT (by the authors' count), with neonatal AFP elevation that did not reflect tumour (AFP-negative on immunohistochemistry).
