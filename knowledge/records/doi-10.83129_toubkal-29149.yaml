key_findings:
- Thesis summary (Rabat, Morocco; supervisor Kouach Jaouad) reporting two pregnancies complicated by juvenile granulosa cell tumor managed in the authors' department, compared with the literature.
- The authors state that juvenile granulosa tumors occur mainly in the first two or three decades of life, so rarely coincide with pregnancy, and that fewer than 10 cases in pregnancy have been reported.
- The authors state that the lack of data on maternal and fetal outcomes calls for more clinical studies balancing oncologic prognosis, fetal well-being and fertility preservation.
- The summary gives no ages, stages, treatments or outcomes for the two patients.
relevance_to_jgct: Thesis on JGCT in pregnancy (two cases); only the summary page is available, with no patient-level data.
