presentation:
- precocious pseudopuberty (bilateral breast development, Tanner stage III)
- hypertrophy of labia majora
- vulvar discharge
- Ollier's disease (multiple enchondromas)
- estradiol 1,211 pmol/L and prolactin 43.99 ng/ml before surgery
key_findings:
- 4-year-old girl with Ollier's disease presented about 9 months after enchondroma resection with breast development (Tanner III), estradiol 1,211 pmol/L (reference <=115.6) and prolactin 43.99 ng/ml; ultrasound showed an 81 x 76 x 57 mm multilocular-solid right ovarian tumor.
- Right salpingo-oophorectomy; JGCT FIGO stage IA; no adjuvant therapy. Estradiol (70.83 pmol/L) and prolactin (20.54 ng/ml) normalized within 1 week; pseudo-pubertal changes fully remitted; hormones normal until 2 years of follow-up.
- IDH1 c.394C>T (p.Arg132Cys) in both the JGCT and enchondroma but not in blood, skin, muscle, oral mucosa or parental blood, consistent with a somatic mosaic mutation.
- 'IHC: inhibin single positive, CD99 positive, ER negative, PR positive, Ki-67 approximately 30%; SALL4 and OCT3/4 negative.'
- R132C reduced S6 ribosomal protein phosphorylation in transfected HeLa cells.
- 'Literature review of 11 JGCT plus Ollier''s disease cases (including this one): onset age 6 months to 36 years; eight underwent salpingo-oophorectomy and two received postoperative chemotherapy; no recurrences over follow-up of 6 months to 7 years.'
relevance_to_jgct: Links JGCT in Ollier's disease to a somatic mosaic IDH1 R132C mutation shared with enchondromas; summarizes 11 JGCT-Ollier cases.
