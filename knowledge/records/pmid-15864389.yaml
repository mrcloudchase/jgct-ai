key_findings:
- Fetus aborted because of cytogenetically confirmed complete XXY triploidy, with female external genitalia and short patent vagina.
- Tumor presented as an abdominal multicystic mass with typical JGCT histology and immunohistology, connected to a tubular uterus-like structure.
- Other gonad was an inguinal testis with a Sertoli cell adenoma.
- Described as the first testicular JGCT in a triploid fetus.
relevance_to_jgct: Testicular JGCT associated with sex chromosome/ploidy abnormality and disorder of sex development.
