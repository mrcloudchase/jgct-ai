key_findings:
- 'German MAKEI and STEP registries, prospective registration 2001 to 2015: 69 ovarian JGCT, median age 9.3 years (range 0 to 30), described by the authors as the largest pediatric series to date.'
- 'Risk stratification by stage: PEI chemotherapy recommended for malignant ascites, preoperative rupture and/or metastases; watch and wait for all others.'
- 'FIGO stage: Ia 38, Ic 29, IIa 1, incomplete data 1. All had ovariectomy or adnexectomy. Cisplatin-based chemotherapy given to 2/11 with intraoperative spillage, 11/12 with preoperative spontaneous rupture or malignant ascites, and the stage II patient.'
- 'Median follow-up 5.6 years; two events, both in patients presenting with stage Ia: one metachronous contralateral JGCT followed by several relapses, ultimately fatal; one highly anaplastic tumor (67 mitoses/10 HPF) with vascular invasion that reached second continuous remission after salvage including high-dose chemotherapy and irradiation.'
- Interim estimated event-free survival 0.96 +/- 0.26 and overall survival 0.98 +/- 0.23 (as printed).
- 'Background stated by the authors: earlier analyses showed about 50% poor outcome with spontaneous preoperative rupture, malignant ascites or peritoneal metastases. Authors conclude central registration, reference pathology and risk-stratified cisplatin-based chemotherapy for stage Ic with preoperative rupture or malignant ascites improved prognosis compared with historic cohorts.'
relevance_to_jgct: Interim report of the German MAKEI/STEP prospective JGCT registry (69 patients) with stage distribution, risk-adapted chemotherapy and outcome; an earlier snapshot of the cohort published in full later.
