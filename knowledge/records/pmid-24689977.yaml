key_findings:
- Among 114 Japanese ovarian tumors, FOXL2 p.C134W was found in 27 of 44 adult-type granulosa cell tumors (61.4%) and in none of the other tumors, including 2 juvenile-type GCT.
- Inhibin-alpha was positive in all adult-type tumors; BMP2 in 14 of 44.
relevance_to_jgct: No FOXL2 mutation in 2 Japanese JGCT; lower adult-type mutation rate than elsewhere.
