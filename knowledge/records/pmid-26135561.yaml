title: 'SMARCA4 (BRG1) loss of expression is a useful marker for the diagnosis of ovarian small cell carcinoma of the hypercalcemic type (ovarian rhabdoid tumor): a comprehensive analysis of 116 rare gynecologic tumors, 9 soft tissue tumors, and 9 melanomas'
