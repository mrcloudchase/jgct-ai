key_findings:
- 'BRG1 (SMARCA4) immunohistochemistry in 12 small cell carcinomas of the ovary, hypercalcemic type, and 122 mimics including 9 juvenile and 47 adult granulosa cell tumors: all 12 SCCOHT lacked BRG1 and retained INI1, while all 119 interpretable mimics, the 9 JGCT included, were BRG1 positive (10 to 100% of cells, mean 77%), sometimes heterogeneously.'
relevance_to_jgct: All 9 JGCT retained SMARCA4; loss identifies SCCOHT.
