key_findings:
- 18-year-old with intermittent vaginal bleeding; right adnexal mass identified a year later.
- Laparoendoscopic single-site ovarian tumorectomy; histology gynandroblastoma composed of juvenile granulosa and Sertoli-Leydig cells.
- Upstaged to stage Ic because of intraoperative cyst rupture; three cycles of adjuvant carboplatin and paclitaxel.
- No signs of recurrence three years after surgery.
relevance_to_jgct: Mixed tumor with a JGCT component in an adolescent managed with ovary-sparing tumorectomy and platinum-taxane chemotherapy.
