notes: The abstract and title call it juvenile granulosa cell tumor in the abstract, but the Discussion says the histology was too compatible with adult GCT; the subtype is therefore uncertain. Stage and follow-up duration are not reported. The tumor was an almost entirely cystic variant. Journal and DOI not stated in the retrieved text.
