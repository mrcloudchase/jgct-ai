key_findings:
- Pedunculated intra-abdominal mass resected from a 1-month-old boy with 45,X/46,X,iso(Yq) mosaicism.
- Extensive degenerative changes with large cysts mimicking multicystic mesothelioma, cystic lymphangioma and cystic dysplasia.
- Granulosa cells identified only in rare cysts and smaller cysts near the pedicle, permitting diagnosis.
relevance_to_jgct: Diagnostic pitfall in degenerated testicular JGCT with sex chromosome mosaicism.
