key_findings:
- 'French TGM13 registry 2014-2021, patients <19 years: 63 ovarian SCST (34 juvenile granulosa tumors, 17 SLCT, 12 other) and 15 testicular SCST (5 JGT).'
- 'Ovarian: 61 FIGO stage I (IC n = 14); adjuvant chemotherapy for 15; seven recurrences (IA n = 3, IX n = 2, III n = 2), one death; 3-year PFS 89%.'
- 'Testicular: 8 tumorectomy, 7 orchiectomy; no recurrence.'
- Endocrine symptoms at diagnosis in 29/34 females and 2/7 males with endocrinological data; after median 11 months, 15 had persistent endocrine abnormalities including precocious/advanced puberty in 4 prepubescent females.
relevance_to_jgct: Recent French national registry with endocrinological outcomes; relevant to long-term follow-up of JGCT survivors.
