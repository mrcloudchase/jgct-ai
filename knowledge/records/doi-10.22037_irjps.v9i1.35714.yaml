key_findings:
- 2.5-year-old girl with 2 months of abdominal distension and signs of precocious puberty (breast development, pubic hair, vaginal bleeding; Tanner stage 2-3); firm, mobile 9 cm abdominal mass and brown freckling spots on the right thigh.
- 'Ultrasound: left adnexal solid and cystic lesion with Doppler vascularity; MRI: 12 cm cystic and solid abdominopelvic mass reaching the subrenal aorta, probably of left ovarian origin. Serum beta-hCG, AFP, CA19-9 and CA125 normal; chest X-ray and thoracoabdominal CT showed no secondary tumors.'
- 'Laparotomy found a very vascular 15 cm left ovarian mass weighing about 650 g; left adnexectomy performed. Pathology: JGCT of the left ovary, FIGO stage IA, diffuse inhibin immunoreactivity. Uneventful course at 18 months.'
- Authors conclude early diagnosis (at early signs of puberty) is a key prognostic factor, although the tumor in this child was already very large at diagnosis; discussion (literature-based) states most JGCTs are stage IA, surgery is primary management, unilateral salpingo-oophorectomy suffices for stage IA, adjuvant chemotherapy benefit is unclear and may be indicated in higher stages, and inhibin B may help detect recurrence.
relevance_to_jgct: Very young girl with isosexual precocious puberty and a large stage IA ovarian JGCT cured by adnexectomy; supports surgery alone for stage IA.
