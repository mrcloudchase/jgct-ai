key_findings:
- Retrospective series of 9 pediatric sex cord-stromal tumors (8 female, 1 male Leydig cell tumor) addressing limited data on these tumors in African children.
- JGCT was the most prevalent ovarian subtype; precocious puberty was a common presentation.
- The abstract does not give the JGCT count, treatment, or outcomes.
relevance_to_jgct: One of few reports of pediatric JGCT from an African population.
