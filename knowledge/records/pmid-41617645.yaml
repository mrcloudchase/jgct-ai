key_findings:
- 'Nine pediatric sex cord-stromal tumors (8 girls, 1 boy) from an African center: girls had JGCT, fibroma and mixed tumors, with precocious puberty a common presentation; the boy had a Leydig cell tumor; the largest tumor was in a 3-year-old.'
- JGCT was the most prevalent ovarian subtype; incidence in African children is largely unknown.
relevance_to_jgct: Pediatric SCST series from Africa in which JGCT predominated.
