notes: 'Internal data inconsistencies: the age-group counts and percentages in Results do not add up (e.g. ''<20 (n=35, 46.8%)'') and Table 1 gives 21 neoplasms under 20, while the text gives 565 specimens overall; Table 1 shows 4 sex cord tumors under 20. Specimens included referrals from other hospitals, so counts are not population incidence.'
