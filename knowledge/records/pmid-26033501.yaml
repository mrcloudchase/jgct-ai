key_findings:
- DICER1 and FOXL2 mutation analysis in 156 ovarian sex cord-stromal tumours (French GINECO group).
- FOXL2 mutations in 94% of adult GCTs (95/101), in one of eight juvenile granulosa cell tumours, and in two of 19 SLCTs.
- DICER1 RNase IIIb mutations in six of 19 SLCTs, two of eight J-GCTs, and one of 12 undifferentiated SCSTs.
relevance_to_jgct: Reports FOXL2 and DICER1 mutations each in a minority of JGCTs in a mixed SCST cohort.
