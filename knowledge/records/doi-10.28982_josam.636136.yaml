notes: Read in full from the journal PDF (CC BY-NC-ND). The text says the capsule had ruptured but the gross description calls the tumor 'intact'; it does not say whether rupture was preoperative or intraoperative. Pelvic fluid cytology was positive. 'Response to treatment was good after 18 months' is the authors' wording; follow-up length beyond that is not given.
