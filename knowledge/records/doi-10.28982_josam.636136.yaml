  outcome: no recurrence 18 months after surgery; breast regression, CA-125 fell, ultrasound normal
presentation:
- breast enlargement (Tanner B3) and areolar pigmentation for 2 months; pubic/axillary hair Tanner 1
- large abdominal mass without abdominal pain
- bone age 6 years; height 90th percentile
- estradiol 65 pg/mL with suppressed FSH 0.23 and LH 0.29 mIU/mL; no LH/FSH rise on LHRH test
- CA-125 213 U/mL; AFP and hCG normal
- enlarged uterus and free pelvic fluid
key_findings:
- 'Turkish case (Adana): 4-year-4-month-old girl with 2 months of breast development and areolar pigmentation, advanced bone age and a large abdominal mass; hormone profile of peripheral precocious puberty (estradiol 65 pg/mL, suppressed gonadotropins, flat LHRH test).'
- CA-125 213 U/mL with normal AFP and hCG; ultrasound and MRI showed a 12 x 9 x 5 cm cystic-solid pelvic mass of unclear origin; chest CT and PET showed no metastases; brain/pituitary MRI normal.
- 'Laparotomy: 12 x 9 cm left ovarian mass resected with the ovary; right ovary normal; no pelvic lymphadenopathy. Specimen 14 x 8 x 6 cm, 560 g, solid and small cystic areas.'
- 'Histology: sex cord-stromal proliferation with 7 to 8 mitoses/10 HPF and high-grade atypia; no Call-Exner bodies; inhibin, calretinin, CD99 and SMA positive, pancytokeratin focal; EMA, CD10, AFP, hCG negative. Capsule ruptured and malignant cells in pelvic fluid: FIGO IC.'
- Four cycles of BEP; 18 months after surgery breast size had regressed, CA-125 had fallen and there was no sign of recurrence. Inhibin A measured on postoperative day 3 was normal (1 pg/mL); it was not measured before surgery.
- Authors note imaging cannot reliably distinguish JGCT from other ovarian tumors and that sex hormones and tumor markers were more helpful than imaging here.
relevance_to_jgct: Pediatric ovarian JGCT with peripheral precocious puberty and raised CA-125, stage IC with malignant pelvic fluid, treated with oophorectomy and BEP.
