key_findings:
- Girl aged 2 years 2 months with premature sexual development, Tanner B3P2A1, bone age 5 yrs, single cafe au lait patch; bilateral enlarged multicystic ovaries; McCune-Albright syndrome considered and tamoxifen started.
- 'After 7 weeks: rapid growth, breast B3-4, menorrhagia, bone age 6.5 yrs; ultrasound showed a left vascular solid/cystic ovarian tumour 10x8x6 cm with normal right ovary.'
- Tumour underwent torsion and was removed; 850 g; juvenile granulosa cell tumour FIGO stage IA; GNAS mutational analysis negative; AKT1 testing planned.
- 'Authors: ''The aetiology in this case remains unclear, with MAS unproven, and evolution towards JGCT.'''
relevance_to_jgct: Case linking a McCune-Albright-like bilateral ovarian presentation to later JGCT; illustrates diagnostic overlap in peripheral precocious puberty.
