key_findings:
- A 15-year-old nulligravid girl (menarche at 14 years) was referred with 9 days of heavy menstrual bleeding with clots, after menses had lengthened from 3 to 5-6 days over two months; an outside ultrasound reported leiomyomas; examination found a mobile, non-tender abdominal mass of about 15 cm.
- MRI showed an oval heterogeneous multicystic mass measuring 71.1 x 224.7 x 183 mm (text) or 196.8 x 172.3 x 96.5 mm (figure legend), dependent on an adnexum; CA 125 was 17.10 UI/mL, AFP 1.76 UI/mL, beta-hCG < 2.39 mU/mL and LDH 210.03 U/L (all described as negative).
- A staging laparotomy was done with oophorectomy and ipsilateral salpingectomy plus bilateral pelvic lymphadenectomy, preserving the contralateral ovary for future fertility.
- Pathology reported juvenile granulosa cell tumour weighing 2,897 g, lymph nodes with hyperplasia and no malignancy, and a negative peritoneal-wash smear; no FIGO stage, mitotic count or immunohistochemistry is given.
- The patient was referred to the paediatric oncology unit of Centro Medico Nacional Siglo XXI, where a protocol for 'prophylactic chemotherapy' was started with pre-treatment organ assessments; inhibin A and B, AFP and CA-125 with CT and pelvic ultrasound are used for follow-up, and she had not yet been discharged from paediatric oncology (no follow-up duration or outcome stated).
- The authors cite in their discussion another case series and reports (for example a 10-year-old with stage IV disease who died 9 months after surgery, described by the cited authors as a mixed germ cell tumour) and state that stage is the most important prognostic factor.
relevance_to_jgct: Case report of a 15-year-old with a very large (2,897 g) ovarian JGCT found through abnormal menstrual bleeding, treated with fertility-sparing surgery with lymphadenectomy and referred for adjuvant chemotherapy; no stage or outcome.
