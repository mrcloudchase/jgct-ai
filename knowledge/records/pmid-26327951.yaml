key_findings:
- 8-year-old girl with 15 days of pelvic pain, abdominal enlargement and weight loss; abdominopelvic mass about 25 x 20 cm without signs of hormone hypersecretion.
- AFP and beta-HCG normal; multiseptated cystic mass on ultrasound and CT; small peritoneal effusion.
- Left adnexectomy; histology and immunostaining consistent with JGCT, strong vimentin positivity.
- Multidisciplinary meeting decided no chemotherapy or radiotherapy; uneventful clinical and radiological surveillance.
relevance_to_jgct: Pediatric JGCT without endocrine signs presenting as a very large cystic mass, treated by surgery alone.
