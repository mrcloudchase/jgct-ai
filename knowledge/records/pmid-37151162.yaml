presentation: []
key_findings:
- A 7-year-old's ruptured ovarian tumor was diagnosed as JGCT at two hospitals, treated with six cycles of bleomycin-etoposide-carboplatin, relapsed with extensive seeding, and was finally reclassified as ovarian epithelioid malignant peripheral nerve sheath tumor with EWSR1-CREM fusion, NF2 deletion, H3K27me3, SOX10 and S-100 positivity; markers and sex hormones were never raised.
- Poor response to JGCT treatment should prompt molecular re-evaluation.
relevance_to_jgct: A sarcoma mimicking JGCT through two consultations; molecular testing resolved it.
