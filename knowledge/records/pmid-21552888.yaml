key_findings:
- Interphase in situ hybridization for chromosomes 12 and X and flow cytometric DNA analysis on seven JGCTs (five primary ovarian tumors, two metastatic lesions).
- Four tumors exhibited polysomy 12 and four had monosomy X; only two displayed concurrent aberrations of both.
- Of six tumors with interpretable histograms, three were DNA aneuploid and three DNA diploid; all three aneuploid tumors had polysomy 12.
- Of the three diploid tumors, two showed monosomy X and one disomy for chromosomes 12 and X.
- No apparent correlation between numerical chromosomal abnormalities and biological course in this small cohort.
relevance_to_jgct: Early cytogenetic evidence that chromosomes 12 and X are frequently altered in JGCT.
