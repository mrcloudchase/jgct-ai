title: 'Congenital juvenile granulosa cell tumor of the testis: case report and review of the literature (SIOP 2014 abstract EP-686)'
journal: Pediatric Blood & Cancer (SIOP 2014 Toronto abstract supplement)
year: 2014
first_author: Aranha A Jr
study_type: case_report
tumor_site: testis
