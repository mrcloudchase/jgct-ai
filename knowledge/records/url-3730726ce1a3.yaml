age_range: diagnosed on the first day of life
alterations: []
treatments:
- regimen: Inguinal exploration, frozen section (excluded yolk sac tumor), orchiectomy with high cord ligation
  setting: congenital testicular JGCT; no normal testicular tissue identified
  n: 1
  outcome: asymptomatic 6 months after surgery
presentation:
- painless left scrotal mass in a full-term neonate, about twice the volume of the other testis
- multicystic testicular mass on Doppler ultrasound with normal flow; no normal testis seen
- normal beta-hCG and AFP
key_findings:
- 'Brazilian case (Hospital Pequeno Principe, Curitiba): full-term healthy neonate with a painless left scrotal mass on day 1, firm, about twice the contralateral testis volume.'
- Doppler ultrasound showed a multicystic testicular mass with normal blood flow and no recognizable normal testis; beta-hCG and AFP normal.
- Inguinal approach with cord clamping; frozen section excluded yolk sac tumor, but because no normal testicular tissue was found an orchiectomy with high ligation was done. The specimen was multicystic and filled with yellow fluid. Uneventful course; asymptomatic at 6 months.
- Authors state JGCT is the most common stromal tumor of the infant testis yet accounts for 1.2% of prepubertal testicular tumors, presents as a painless scrotal mass with normal markers, may be diagnosed prenatally, and can be treated with testis-sparing surgery when normal parenchyma is identified; adjuvant therapy is not indicated.
relevance_to_jgct: Neonatal testicular JGCT with typical multicystic imaging and normal markers, treated by inguinal orchiectomy.
