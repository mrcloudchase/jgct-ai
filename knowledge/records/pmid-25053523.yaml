key_findings:
- Bilateral synchronous testicular JGCT in a 6-month-old treated with testis-sparing surgery.
- Authors state testicular JGCT accounts for 1.2%-3.9% of prepubertal testicular tumors, is considered benign and is usually unilateral.
- Authors state testis-sparing surgery is now recommended in all cases where applicable, replacing radical surgery.
relevance_to_jgct: Rare bilateral testicular JGCT managed with testis-sparing surgery; argues for organ-sparing approach.
