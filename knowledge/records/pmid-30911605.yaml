notes: 'Systematic review whose 19 patients are almost all adult-type; JGCT data are 2 patients drawn from two source papers (Gouy 2013; Hayes-Jordan 2015). Internal inconsistencies: abstract says one JGCT, text/table say two; oxaliplatin dose given as 460 or 360 mg/m2 in different places; the 6 recurrences among 19 are computed from the table, whose recurrence counts (5+0+0+1+0) include the JGCT death. Table 1 follow-up for Hayes-Jordan is 12 months. Figure 2 (images) shows adult tumors. Authors report a case (Dogan et al., AGCT) as part of the pool.'
