key_findings:
- Systematic search (PubMed 3 March 2016, plus Cochrane CENTRAL; one in-press article by personal communication) found 5 reports of cytoreductive surgery (CRS) plus hyperthermic intraperitoneal chemotherapy (HIPEC) in recurrent granulosa cell tumor; no report in a first diagnosis.
- 'Pooled in the Results text and Table 1: 19 patients, of whom 2 had recurrent JGCT and 17 recurrent adult GCT (AGCT). The abstract says 19 recurrent AGCT and one JGCT; the review''s own table and discussion give 2 JGCT among 19.'
- 'JGCT patient 1 (Gouy et al., 7 patients with 6 AGCT and 1 JGCT): oxaliplatin 360 mg/m2 + irinotecan 360 mg/m2 HIPEC for 30 min; complete cytoreduction in all 7, no grade 4 morbidity or procedure mortality; 5/7 relapsed (3 peritoneal carcinomatosis, 2 liver) during median 32 months (range 25-56). The JGCT patient''s individual outcome is not given.'
- 'JGCT patient 2 (Hayes-Jordan et al., pediatric ovarian tumors; 8 of 101 children undergoing CRS/HIPEC had ovarian primaries with multifocal peritoneal disease, one a JGCT): cisplatin 100 mg/m2 for 90 min; this girl had multiple recurrences over 8 years, prior high-dose total abdominal radiation and a ''frozen abdomen'', developed an enterocutaneous fistula and died of disease 12 months after the procedure.'
- 'Pooled for all 19: complete cytoreduction 95% (18/19), severe morbidity 16% (3/19), no procedure-related mortality; median follow-up 30 months (range 3-72); recurrence 6/19 (31%), disease-related death 2/19 (10%).'
- Authors conclude CRS plus HIPEC is a feasible, potentially effective option for selected women with recurrent GCT limited to the abdomen, and that prior abdominal radiotherapy appears to be a contraindication, citing the JGCT patient with a frozen abdomen. They note no standardized HIPEC regimen and no randomized data; they recommend the approach mainly for recurrent adult-type disease because most reports concern that group.
relevance_to_jgct: Only two JGCT patients are covered (one with outcome not separated), so this gives almost no efficacy evidence for JGCT; it records that HIPEC after prior abdominal radiation ended in fistula and death in a child with multiply recurrent JGCT.
