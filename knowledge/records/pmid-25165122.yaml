key_findings:
- 'Model system: Smad1 Smad5 conditional double knockout mice (JGCT model) and the COV434 cell line (described as a human JGCT cell line).'
- Dietary soy could not initiate JGCT development in mice but had dramatic effects on GCT growth and tumor progression compared to a soy-free diet.
- Loss of Smad1 and Smad5 altered estrogen receptor alpha (Esr1) expression in granulosa cells.
- Genistein modulated estrogen receptor expression in COV434 and promoted cell growth partly by suppressing caspase-dependent apoptosis.
- Authors conclude dietary soy consumption has deleterious effects on GCT development.
relevance_to_jgct: Model-system (mouse and cell line) study of dietary soy/genistein in JGCT-like tumors. No patients studied; human relevance unknown.
