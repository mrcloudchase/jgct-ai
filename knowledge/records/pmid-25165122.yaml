key_findings:
- 'Mouse JGCT model (Smad1/Smad5 conditional dKO): all 15 of 15 dKO mice on a soy-based diet died within 47 weeks; dKO mice on a soy-free diet (n = 10) survived significantly longer (up to 68 weeks); 50% survival rose from 39 weeks (soy) to 62 weeks (soy-free). Diet did not affect survival or tumor formation in control mice.'
- At 9 months, metastasis was present in 9 of 12 (75%) dKO mice on soy versus 6 of 16 (37.5%) on soy-free diet (P < 0.05). Tumor histology was the same on both diets, and tumor foci appeared at similar early ages (8 and 12 weeks), so authors conclude soy affects tumor growth and progression, not initiation.
- Esr1 expression in dKO granulosa cells was significantly higher on soy, the opposite of the effect in control mice; serum estradiol did not differ by genotype or diet.
- 'COV434 (derived from a primary human JGCT): genistein at 5, 25 or 50 μM increased viable cells by 3-9% at 24 h, 20-34% at 48 h and up to 51% at 72 h; the effect was reduced by ICI 182,780 and tamoxifen.'
- Genistein (50 μM, 30 min) decreased caspase 3/7 activity by 55%, restored by ICI 182,780 or tamoxifen pretreatment, and down-regulated proapoptotic genes BAD, BAK1, BAX, BOK in COV434.
- Authors conclude dietary soy, and genistein in particular, has deleterious effects on GCT development and call for investigation of dietary soy in children and women with JGCT; this is based on mouse and cell-line data only, with genistein concentrations (50 μM) higher than typical infant plasma levels (authors note 5 μM is representative of soy-formula-fed infants).
relevance_to_jgct: Mouse JGCT model and COV434 data suggesting soy isoflavone genistein promotes JGCT growth and progression via estrogen receptor signaling and suppressed apoptosis; no human patient data.
