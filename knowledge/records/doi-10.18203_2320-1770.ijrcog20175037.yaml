notes: 'Internal inconsistencies: mean tumor size 9.6 cm in abstract/Table 3 versus 9.8 cm in text; abstract says relapse ''average 29.6 months''. Table 4 lists case 4 (age 19, stage Ia, tumor 10 cm, FSO, relapse 13 months omentum+pelvis) which matches the JGCT death; case 1 (age 21, liver relapse at 12 months) is described as adult GCT. The conclusion that JGCT has worse prognosis is not supported statistically (n=2). Table 1 age range includes one patient under 10 and one aged 10-19, matching the two JGCT patients.'
