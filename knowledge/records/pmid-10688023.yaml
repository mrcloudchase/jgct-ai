key_findings:
- 'Review of cystic testicular lesions in children: the differential includes epidermoid and dermoid cysts, prepubertal teratoma, juvenile granulosa cell tumor, cystic dysplasia of the rete testis, cystic lymphangioma, simple cyst and post-torsion degeneration; age, examination, markers and sonography allow a presumptive diagnosis, and enucleation or partial orchiectomy with frozen section is often feasible.'
relevance_to_jgct: Testis-sparing approach to cystic lesions including JGCT.
