key_findings:
- 'Czech review of genetic causes of rare pediatric ovarian tumors: juvenile granulosa cell tumors occur in Ollier disease and Maffucci syndrome, caused by postzygotic IDH1 and IDH2 mutations; Sertoli-Leydig cell tumors with DICER1 syndrome; sex cord tumors with annular tubules with Peutz-Jeghers syndrome (STK11); small cell carcinoma hypercalcemic type with SMARCA4 loss; germ cell tumors with gonadal dysgenesis.'
