presentation:
- precocious puberty
- abdominal mass
- Ollier disease (incidental enchondromas)
key_findings:
- 2.5-year-old girl with precocious puberty (Tanner stage 2) and a 10 x 5 x 11 cm right ovarian mass with cystic and necrotic areas.
- Lesions in the right femur and iliac blade on MRI were initially reported as metastases; biopsy showed enchondromas, leading to a diagnosis of Ollier disease.
- 'Tumor expressed inhibin, calretinin, melan-A (focal) and cytokeratin; peritoneal aspirate positive for malignant cells, omentum uninvolved: FIGO IC3.'
- Breast size and pubic hair regressed weeks after surgery; patient given chemotherapy per germ cell tumor protocol.
- Maternal history of ovulation-inducing drug intake for 2 years before conception noted by authors.
relevance_to_jgct: Shows enchondromas of Ollier disease can mimic bone metastases during JGCT staging.
