key_findings:
- Transcriptomes of four JGCTs sequenced and compared with controls; only private variants were found, suggesting AKT1 tandem duplications are the best candidate drivers in the absence of GNAS alterations.
- Screening of eight adult GCTs without FOXL2 mutation found one AKT1 duplication (a case also having a stromal luteoma).
- Differentially expressed genes involved cytokine and hormone signaling and cell division; data suggest a possible dedifferentiation process mediated by a limited set of transcription factors perturbed by AKT1 activation.
- Commercially available AKT inhibitors modulated in vitro activity of various mutated AKT1 forms.
relevance_to_jgct: Functional and transcriptomic follow-up of AKT1-duplicated JGCT with in vitro evidence that AKT inhibitors act on the mutant proteins.
