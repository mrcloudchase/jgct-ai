key_findings:
- AKT1 in-frame duplications were present in over 60% of JGCTs studied.
- Transcriptome sequencing of 4 JGCTs found only private alterations besides AKT1, suggesting AKT1 duplication as the main driver when GNAS is unaltered.
- Dysregulated genes involved cytokine and hormone signaling and cell division, with evidence of possible dedifferentiation, mediated by a limited set of transcription factors perturbed by AKT1 activation.
- Commercially available AKT inhibitors modulated the activity of mutated AKT1 forms in vitro, suggesting therapeutic leads.
relevance_to_jgct: Key study establishing AKT1 in-frame duplication as the dominant JGCT driver and a candidate therapeutic target.
