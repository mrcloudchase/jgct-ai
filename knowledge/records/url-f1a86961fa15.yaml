key_findings:
- 'Case 1: 3-year-old girl with progressive bilateral breast enlargement over 1 year, irregular vaginal bleeding for 10 months, pubic hair for 2 months; Tanner B3P3; bone age 8yr 10months.'
- LH <0.1 mIU/ml, FSH <0.1 mIU/ml, estradiol >1000 pg/ml; CT showed a heterogeneously enhancing abdomino-pelvic mass.
- Resection of right tubo-ovarian mass suggestive of juvenile granulosa cell tumor; estradiol fell to 17 pg/ml; no vaginal bleeding at one-year follow-up.
- Case 2 (6-year-old) was a mixed germ cell sex cord stromal tumor, not JGCT.
relevance_to_jgct: Meeting case report of JGCT with very high estradiol presenting as peripheral precocious puberty in a 3-year-old.
