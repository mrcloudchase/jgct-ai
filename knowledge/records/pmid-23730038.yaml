presentation:
- hirsutism and clitoromegaly were present in 2 of the 37 women (text does not say these were the JGCT patients)
key_findings:
- 'Retrospective review (1990 to 2006, one Indian cancer institute, GCRI) of 37 women with granulosa cell tumours: 35 adult-type (median age 48.6 years) and 2 juvenile-type (median age 17.5 years, text). By histology the authors list 28 adult, 7 granulosa-theca, 1 granulosa-Sertoli and 2 juvenile granulosa cell tumours.'
- 'The two JGCT patients appear in the fertility-preserving surgery table (Table 2): age 11, unilateral salpingo-oophorectomy plus omentectomy and retroperitoneal lymph node dissection, JGCT stage Ia, observation only, disease-free 24 months; and age 24, unilateral salpingo-oophorectomy, JGCT with mitosis 9-14 per 10 HPF, observation only, disease-free 12 months.'
- Authors state both JGCT were well differentiated, one stage Ia and the other stage Ic, and neither relapsed; they note the sample is too small for conclusions and cite Schneider et al. that two of three poorly differentiated juvenile tumours relapsed but none of the intermediate or well differentiated ones.
- 'Whole-series results (mostly adult GCT): 5-year overall survival 93% and disease-free survival 63%; stage and residual disease were prognostic (stage I, III and unstaged 5-year survival 80, 50 and 25%), mitotic rate and tumour grade were not; 5 recurrences (13.5%); frozen section agreed with final histology in only 7 of 11 cases (63.6%), so authors caution against relying on it for fertility-preserving surgery.'
relevance_to_jgct: An adult granulosa cell tumour series that includes only two JGCT patients (ages 11 and 24), each with stage, surgery and outcome; useful mainly as a small additional outcome datum, not as JGCT-specific evidence.
