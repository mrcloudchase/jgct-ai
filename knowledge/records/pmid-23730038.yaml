notes: 'Only 2 of 37 patients had JGCT; nearly all conclusions concern adult GCT. The age-24 patient labelled JGCT is an adult-age diagnosis; the text gives no diagnostic criteria. Stage of the age-24 patient is inferred only from the Discussion (one Ia, one Ic): Table 2 gives stage Ia only for the age-11 patient. Table 1 symptom ''hirsutism, clitoromegaly'' (n=2) is not attributed to specific patients. Follow-up of the JGCT patients is short (24 and 12 months).'
