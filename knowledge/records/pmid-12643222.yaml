key_findings:
- 6-year-old girl with breast development, clitoral enlargement and an abdominopelvic tumor; elevated testosterone and estradiol.
- Right salpingo-oophorectomy; frozen section suggested dysgerminoma, prompting surgical staging; final diagnosis JGCT limited to the ovary.
- Estradiol and testosterone normalized and pseudopuberty reverted postoperatively.
- No adjuvant treatment; no recurrence after three years of follow-up.
relevance_to_jgct: Mixed iso/heterosexual precocity; frozen-section misdiagnosis as dysgerminoma.
