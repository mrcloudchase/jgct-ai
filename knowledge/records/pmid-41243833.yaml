key_findings:
- Reviews gynecologic tumors arising with germline or somatic DICER1 mutations; embryonal rhabdomyosarcoma and moderately to poorly differentiated Sertoli-Leydig cell tumor are most common.
- JGCT is listed among less frequent DICER1-associated gynecologic tumors, with gynandroblastoma, adenosarcoma and Sertoli cell tumor.
- Proposes the umbrella term DICER1-related primitive polyphenotypic neoplasm and recommends genetic testing when characteristic features are seen, to enable surveillance of patients and families.
relevance_to_jgct: Places JGCT within the DICER1 tumor predisposition spectrum, supporting consideration of DICER1 testing in selected patients.
