key_findings:
- In the gynecologic tract, DICER1-associated neoplasms most commonly include embryonal rhabdomyosarcoma and moderately to poorly differentiated Sertoli-Leydig cell tumor, and less frequently juvenile granulosa cell tumor among others.
- In syndromic patients a germline loss-of-function DICER1 mutation is usually followed by a somatic hotspot mutation in the tumor as a second hit.
relevance_to_jgct: Lists JGCT as a less frequent DICER1-associated gynecologic neoplasm.
