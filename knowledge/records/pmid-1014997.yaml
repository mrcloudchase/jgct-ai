key_findings:
- A 3-year-old with sexual precocity and adult luteal-phase estradiol and progesterone had a 12 cm encapsulated left ovarian tumor removed; ovarian vein estradiol 3,450 pg/mL and progesterone 70,000 pg/mL; histology with nests, bizarre nuclei, abundant mitoses, calcification and follicle-like structures was diagnosed as juvenile granulosa cell tumor (Scully); precocity regressed and she was well at 3 years (German).
relevance_to_jgct: A 1976 case documenting ovarian-vein hormone levels in JGCT.
