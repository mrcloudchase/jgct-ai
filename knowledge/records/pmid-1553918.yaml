key_findings:
- 15-year-old girl with Maffucci's syndrome (enchondromatosis + hemangiomas) developed JGCT presenting with abdominal mass and progressive anemia.
- Stage Ic JGCT removed and adjuvant chemotherapy given; no recurrence at 4 years.
- 'Literature review found 10 previous cases of JGCT associated with enchondromatosis: two with Maffucci''s syndrome, the rest with Ollier''s disease.'
- Authors suggest ovarian JGCT may occur not infrequently in females with enchondromatosis in the first or second decades; supports generalized mesodermal dysplasia concept.
relevance_to_jgct: Key early review of the enchondromatosis (Ollier/Maffucci)-JGCT association.
