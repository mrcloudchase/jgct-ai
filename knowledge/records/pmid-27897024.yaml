key_findings:
- 'Czech review of peripheral precocious puberty (1 in 400 to 1,000 girls): autonomous ovarian cysts are the main cause, with McCune-Albright syndrome, juvenile granulosa cell tumor and primary hypothyroidism among others; initial treatment is conservative except for JGCT, where surgery is warranted; long-term follow-up is needed for progression to central puberty.'
relevance_to_jgct: JGCT as the surgical exception among causes of peripheral precocious puberty.
