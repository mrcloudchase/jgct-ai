key_findings:
- 3-month-old male infant with testicular JGCT initially evaluated by fine needle biopsy showing vimentin, alpha-inhibin and S-100-positive spindle cells.
- Orchiectomy performed; histology confirmed JGCT.
- Authors state testicular JGCT is the most common testicular neoplasm in the first 6 months of life and found no prior reports of its cytologic features.
- Orchiectomy alone described as recommended because no metastasis or recurrence had been reported.
