  outcome: Hormone levels normalized after 2 months without right-sided surgery
presentation:
- prenatal macrosomia, clitoromegaly, labial hypertrophy and left ovarian cyst
- isosexual precocious puberty after hCG stimulation test
- high AMH and testosterone
key_findings:
- A 46,XX neonate with prenatal clitoromegaly and an ovarian cyst, high AMH and testosterone, developed isosexual precocious puberty and bilateral ovarian enlargement after an hCG test; left tumorectomy showed fibrothecoma, relapse 6 weeks later was a juvenile granulosa cell tumor, and a right JGCT was then diagnosed by hormone rise and enlargement; the parents declined surgery and hormones normalized after 2 months.
- The authors describe the overlap between developmental and neoplastic biology in neonates.
relevance_to_jgct: Neonatal bilateral ovarian JGCT with apparent spontaneous resolution on one side.
