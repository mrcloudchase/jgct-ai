key_findings:
- A 15-year-old girl (never pregnant) with Maffucci syndrome diagnosed at age 2, with left lower-leg amputation and haemangioma excision at age 11, presented in September 1987 with an abdominal tumour and anaemia; CA125 and LDH were high and general serum and hormone tests were otherwise normal.
- At surgery the left ovary carried a child-head-sized tumour with granular deposits on surrounding peritoneum and 1,800 ml of serous yellow ascites; the right ovary and uterus were unremarkable. The tumour measured 28 x 15 x 9.5 cm and weighed 3,940 g, solid with cystic parts.
- 'Histology: follicular arrangement areas and spindle stromal areas, medium-sized nuclei with size variation, bright cytoplasm with a tendency to luteinisation, marked mitoses reaching 20 in a x100 field at times (as printed), no clear Call-Exner bodies; electron microscopy showed both granulosa and theca cells; diagnosis JGCT. Ascitic cytology showed atypical cells.'
- No recurrence was seen 5 months after surgery. The authors cite that Maffucci and Ollier disease are associated with non-epithelial neoplasms in 20-30% and that 8 ovarian sex cord-stromal tumours have been reported, 3 with Maffucci syndrome, 2 of which look like JGCT, and consider this a rare association.
relevance_to_jgct: JGCT with peritoneal deposits and ascites in a 15-year-old with Maffucci syndrome (enchondromatosis with haemangiomas); the authors point to a link between Ollier/Maffucci disease and ovarian sex cord-stromal tumours.
