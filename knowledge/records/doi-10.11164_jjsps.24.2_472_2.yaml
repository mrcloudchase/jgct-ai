notes: Meeting abstract (page 472 of the journal also contains abstract P-19, an unrelated 46,XY ovarian teratoma case, which is not JGCT). Stage, the extent of surgery and any chemotherapy are not stated; peritoneal deposits plus ascites suggest advanced disease but the abstract gives no stage. Follow-up only 5 months. Likely to have a full paper by the same Kanagawa Children's Medical Center authors; not checked.
