key_findings:
- 63-year-old postmenopausal woman with abdominal distension and postmenopausal bleeding; 18 x 15 x 14 cm right ovarian solid mass.
- 'Pathology: diffuse adult GCT with Call-Exner bodies and nuclear grooves, plus minor foci resembling JGCT (well-defined margins, follicular-like structures).'
- Bilateral salpingo-oophorectomy with total hysterectomy; no recurrence at three months.
- Authors describe it as the first case of AGCT accompanied by focal JGCT in a postmenopausal woman.
relevance_to_jgct: Mixed adult/juvenile granulosa histology; relevant to the pathologic distinction between subtypes.
