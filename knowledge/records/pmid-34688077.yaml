notes: Not a juvenile-age or clinically juvenile GCT; JGCT component is a minor focus within an adult GCT, diagnosed by H&E morphology only. Follow-up 3 months. Clinically staged FIGO 1C in text, table lists 1C. Use cautiously in any JGCT outcome statistics.
