key_findings:
- A 15-year-old with an enlarging abdominal mass and pain had a 20.4 x 19.8 cm multiloculated right ovarian mass with bilateral hydroureteronephrosis; beta-hCG, AFP and testosterone were normal.
- The tumour (22.5 x 8.5 x 7 cm, 1782 g, intact) was removed by what the authors call right ovarian cystectomy. It had sheets of polygonal cells with alveolar, macrofollicular and focal glandular patterns, hyaline globules, brisk mitoses, extensive necrosis, and cystic areas with bizarre uninucleate and multinucleate syncytiotrophoblast-like giant cells.
- Non-anaplastic areas were diffusely CD99 positive and focally inhibin positive; CK7 was negative. Omental deposits were present and the diagnosis was JGCT, anaplastic variant, stage III.
- She received four cycles of BEP, which she tolerated well; a recent scan showed no abnormality in the abdomen or pelvis, with a normal left ovary and uterus.
- The authors' differential-diagnosis table compares JGCT with adult GCT, embryonal carcinoma, yolk sac tumour, melanoma, small cell carcinoma and surface epithelial carcinoma; they state that almost all clinically malignant JGCT recur within 3 years.
relevance_to_jgct: Anaplastic JGCT with syncytiotrophoblast-like giant cells and omental spread (stage III) in an adolescent, treated with BEP and disease-free on imaging.
