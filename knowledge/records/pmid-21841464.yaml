key_findings:
- 24-year-old woman at 12 weeks and 3 days of pregnancy with a pelvic mass.
- Surgical exploration revealed a smooth, solid, mobile, well-encapsulated left ovarian mass; histology well-differentiated JGCT.
- Pregnancy continued uncomplicated with delivery of a healthy baby at 37 weeks gestation.
- No evidence of disease about 9 months after diagnosis.
relevance_to_jgct: JGCT diagnosed and resected in early pregnancy with an uncomplicated pregnancy outcome.
