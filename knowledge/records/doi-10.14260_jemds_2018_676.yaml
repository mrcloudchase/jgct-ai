notes: 'Internally inconsistent: premenopausal 53 (42%) vs 58 in the table; study period 1993 vs 1995-2015; complete staging 84 vs 85; fertility-sparing 7 vs 10; cut-off ''>9 cm'' in abstract vs ''>10 cm'' in conclusion; histology column mixes AGCT, SCST, JGCT and ''androgen secreting''. The text states chemotherapy benefit without a formal comparison reported for JGCT.'
