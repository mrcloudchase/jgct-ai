alterations:
- gene: AKT1
  alteration: in-frame tandem duplications in exon 3 affecting the pleckstrin-homology domain (6th beta strand)
  frequency: 10/16 JGCTs
  notes: All but two duplications were different; somatic status confirmed in the 2 tumors with peritumoral DNA available; none found in 10 adult GCTs, 15 colorectal carcinomas or 59 NCI cell lines; no duplications in AKT2 exon 3
- gene: AKT1
  alteration: point mutations at highly conserved residues (e.g. Q79K and W80R on the same allele in T2; E91N, M458I, T21I, P348S; P24L, G232W, D274H, S378F in T4)
  frequency: 10/16 tumors carried point mutations; 14/16 JGCTs had putative driver AKT1 alterations
