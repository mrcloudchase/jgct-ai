key_findings:
- 16 histologically proven JGCTs in girls under 15 years (Necker-Enfants Malades Paris and Montpellier repositories, 1994-2014).
- In-frame tandem duplications in exon 3 of AKT1, affecting the pleckstrin-homology domain, were found in more than 60% of tumors (10 duplications; all but two different); somatic status proven for the two with peritumoral DNA available.
- AKT1 point mutations altering highly conserved residues were identified in 10 tumors (somatic status confirmed for seven); tumors without duplications often carried two or more point mutations. In total, 14 out of 16 JGCTs harbored putative driver alterations of AKT1.
- No GNAS R201 mutation was found in this cohort; PIK3CA exons 9, 18, 20 were unmutated in 7 tumors; no AKT2 exon 3 duplications.
- Duplications were not found in 10 adult GCTs, 15 colorectal carcinomas, or 59 NCI cell lines.
- Duplicated AKT1 proteins localized almost exclusively at the plasma membrane, showed strong S473 phosphorylation and FOXO3a repression insensitive to serum deprivation; phospho-AKT confirmed on tumor sections.
- Authors propose AKT1 alterations as driver events, useful for molecular diagnosis, and note PI3K-AKT-mTOR inhibitors as a targeted therapy perspective.
relevance_to_jgct: Foundational genomic study identifying AKT1 in-frame duplications as the major recurrent driver alteration in ovarian JGCT.
