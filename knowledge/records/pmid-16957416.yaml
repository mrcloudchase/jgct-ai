key_findings:
- 16-year-old girl with secondary amenorrhea for 4 years after menarche at 12, without virilization.
- High DHEA, 17-hydroxyprogesterone, insulin and prolactin; exaggerated DHEA response to ACTH; low FSH and high LH after GnRH.
- Right ovarian mass removed laparoscopically; JGCT diagnosed. Menses resumed ten days after surgery.
- Postoperatively 17OH-P, insulin, FSH and LH normalized; DHEA fell to upper normal range; prolactin unchanged.
relevance_to_jgct: Androgen-secreting JGCT presenting as secondary amenorrhea rather than precocious puberty.
