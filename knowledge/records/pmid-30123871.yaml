- inhibin more than 3000 pg/mL
key_findings:
- 31-year-old, secondary infertility for 4 years, one child, candidate for IVF; one cycle of ovarian stimulation (metformin, Gonal-f 75 IU) was cancelled for poor response; progressive abdominal distension followed and she was treated as possible ovarian hyperstimulation syndrome (GnRH antagonist, then agonist).
- 'Imaging 4 months later: multiple multiloculated cystic masses with predominantly solid components in both adnexa extending to the xiphoid, massive peritoneal and pleural effusion; inhibin more than 3000 pg/mL.'
- 'Laparotomy with complete resection; frozen section could not confirm malignancy; permanent histology: juvenile granulosa cell tumor (round-ovoid nuclei, vacuolated cytoplasm, microfollicular and trabecular patterns, Call-Exner bodies reported in most areas, inhibin positive). A second surgery one month later found omental tumor (stage IIIC) and repeated cytoreduction.'
- Three cycles of BEP were given; the patient developed pelvic and abdominal metastases in under 6 months and was on second-line chemotherapy.
- Authors cannot establish whether the tumor was pre-existing or caused by ovarian stimulation, and state no relationship was found between stimulation and the tumor; they recommend careful ovarian monitoring and attention to persistent enlargement or ascites during or after infertility treatment.
relevance_to_jgct: Aggressive stage IIIC JGCT with early relapse in a 31-year-old discovered after an aborted IVF stimulation cycle; no causal link is claimed.
