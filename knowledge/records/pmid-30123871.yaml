notes: 'Adult-age (31 years) diagnosis labelled juvenile granulosa cell tumor; the histology description includes Call-Exner bodies, which is atypical for JGCT, so the juvenile classification is not independently supported in the text. Tumor markers other than inhibin and any molecular testing not reported. Abstract says second and third line chemotherapy; case section says second line. Staging details differ: abstract says stage III at first laparotomy and case text says stage IIIC found at second surgery.'
