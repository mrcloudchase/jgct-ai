key_findings:
- CD56 was positive in all but one of 85 ovarian sex cord-stromal tumors including all 8 juvenile granulosa cell tumors, usually diffusely and membranous; it cannot separate sex cord-stromal from neuroendocrine neoplasms but is a sensitive marker when inhibin or calretinin are negative.
relevance_to_jgct: CD56 stains JGCT; useful when inhibin or calretinin fail.
