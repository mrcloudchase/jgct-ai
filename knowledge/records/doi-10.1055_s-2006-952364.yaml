key_findings:
- A 23-year-old nullipara with 3 months of secondary amenorrhoea and persistent lower abdominal pain had a distended abdomen with abundant ascites and a 6x4x3 cm cystic-solid right ovarian tumour on vaginal ultrasound.
- Laparoscopy yielded a tumour biopsy and more than 5 l of ascites; neither cytology nor frozen section showed malignancy, and immunohistochemistry raised suspicion of a granulosa cell tumour.
- A second operation with unilateral oophorectomy found an otherwise normal genital tract and abdomen; final histology confirmed a granulosa cell tumour (the title calls it juvenile; the abstract text does not repeat the subtype).
- Repeated ascites examinations showed no malignant cells, so adjuvant chemotherapy was omitted.
- The authors highlight the discrepancy between an early tumour stage and the huge ascites, whose cause is unknown, and advise short-interval follow-up with systemic chemotherapy as a therapeutic option; follow-up results are not reported.
- The authors cite general figures (granulosa cell tumours 70% of sex cord tumours; about 5% recurrence within 3 years; adverse factors of higher stage, size over 10-15 cm, high mitotic index and higher age); these are not findings of the case.
relevance_to_jgct: Adult-age (23 years) ovarian JGCT presenting with amenorrhoea and massive benign-cytology ascites, managed by unilateral oophorectomy without chemotherapy.
