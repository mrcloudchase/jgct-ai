key_findings:
- A 43-item online survey of members of the closed multinational GCT Survivor Sisters Facebook group, collected 2014 to 2019, had 744 respondents on average 4.4 years (SD 5.9) after diagnosis, including 52 with juvenile GCT.
- Across the sample 67% reported stage I and 8% stage III-V at diagnosis; 30% of adult-type and 25% of juvenile-type respondents reported recurrent disease at survey completion.
- Recurrence was more frequent when the tumour was ruptured (p<.001) or cut (p=.01).
- Among adult-type respondents 48% had laparoscopic surgery and 19% had chemotherapy (most often for stage II-III); BEP use fell from 47% before 2015 to 21% after.
- The authors conclude that treatment patterns reported by members are generally in line with clinical audits and that social-media communities are feasible research partners.
relevance_to_jgct: Patient-reported survey that includes 52 survivors with JGCT and reports a 25% self-reported recurrence rate for them; most other figures are for adult-type or the combined sample.
