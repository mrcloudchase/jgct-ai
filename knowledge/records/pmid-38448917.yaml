notes: 'Internal inconsistencies: abstract states 91% adult versus 19% juvenile (sums above 100%; text and Table 1 give 6/65 = 9.2% JGCT); JGCT mean age is 21 years in Table 1 but 13 in the Discussion; the p-value cited for recurrent-case predictors is given as 0.09 in the same sentence as ''significant''. Table 3 inhibin counts imply 3 JGCT positive and 2 negative (the percent columns in the paper are mislabeled). No survival data. No FOXL2 testing. Journal and first author not stated in the retrieved full text.'
