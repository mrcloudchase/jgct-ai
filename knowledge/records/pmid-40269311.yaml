key_findings:
- 'Single-cell RNA sequencing of 66,919 cells from 12 ovarian germ cell and sex cord-stromal tumors (7 adult granulosa, 1 juvenile granulosa, 1 Sertoli-Leydig, 2 immature teratoma, 1 dysgerminoma): dysgerminoma showed an immune-activated microenvironment; adult granulosa cell tumors a fibroblast-rich immune-desert phenotype with immunosuppressive macrophages; the juvenile tumor''s profile is not described in the abstract.'
relevance_to_jgct: One JGCT in the first single-cell atlas of ovarian stromal tumors.
