notes: Upgraded on 2026-11-01 from an abstract record; full text (PMC12152133) read in full this run. n_jgct_patients is 9, the number of juvenile granulosa tumours in the CPS cohort; the single-cell patient P11 may be one of them but the paper does not say, so the total could be up to 10. Only P11 has individual data. Supplementary tables (S1-S5, Table S2 listing the cohort) were not available in the text. Cohort also contributed treatment-naive and recurrent adult-type samples whose data are not extracted as patients here. The full text does not report FOXL2 or other mutation status.
