key_findings:
- A 6-year-old with early breast development and vaginal bleeding had an encapsulated ovarian tumor with adult-type granulosa cell histology, an extremely rare cause of precocious pseudopuberty at this age where the juvenile type is expected; malignant ovarian tumors cause 2 to 3% of pseudopuberty in girls.
relevance_to_jgct: Adult-type tumor in a young child, a differential for JGCT.
