key_findings:
- Two-year-old girl with JGCT, precocious pseudopuberty, elevated serum estradiol, and acutely progressive hydrothorax and ascites.
- Sudden respiratory distress led to emergency laparotomy; unilateral salpingo-oophorectomy led to a rapidly favorable course.
- No evidence of invasion or peritoneal metastasis on histology.
