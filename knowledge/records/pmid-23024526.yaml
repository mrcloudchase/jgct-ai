presentation:
- 'isosexual precocious pseudopuberty: Tanner III breasts, hypertrophied labia majora, axillary and pubic hair'
- large abdominal mass reaching the xiphisternum
key_findings:
- 'Delhi single-department series, January 2001 to December 2005: 10 sex cord-stromal tumors among 73 malignant (312 operated) ovarian tumors; ages 4 to 70 years; 7 granulosa cell tumors, 1 gynandroblastoma, 2 thecomas (text says 10% fibromas and 20% thecomas); 9 stage I, 1 stage IV; surgery in all, BEP in 2.'
- One JGCT in a 4.5-year-old girl with isosexual precocious pseudopuberty (Tanner III breasts, hypertrophied labia majora, axillary and pubic hair) and a large abdominal mass up to the xiphisternum.
- The JGCT progressed from stage IA to stage IV within 8 months and the child died of disease. The text does not give treatment details, histology, markers or whether she received chemotherapy.
- Authors describe JGCT as characteristically aggressive with short time to relapse and death, and state that a few patients, especially with JGCT or Sertoli-Leydig cell tumors, may need chemotherapy.
relevance_to_jgct: Single fatal pediatric JGCT that progressed from stage IA to IV within 8 months, within a small Indian sex cord-stromal tumor series.
