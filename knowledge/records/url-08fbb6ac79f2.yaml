key_findings:
- A girl in Hamburg with neonatal McCune-Albright syndrome presented at 6 weeks with ACTH-independent Cushing syndrome, hypertrophic obstructive cardiomyopathy, hyperthyroidism, hepatopathy, bilateral nephrocalcinosis, autonomous ovarian cysts and cafe-au-lait pigmentation.
- Metyrapone controlled the hypercortisolism but caused hypertension and hyperandrogenaemia; she developed hypercalcaemia at 3 months, treated with a bisphosphonate.
- At 4 months she had an acute abdomen from a ruptured large juvenile granulosa cell tumour of the ovary; the tumour cells highly expressed androgen receptors.
- The activating GNAS mutation c.602G>A (p.R201H) was found in the ovarian tumour cells and in the adrenal glands. Bilateral adrenalectomy was performed at 5 months to stop the hyperandrogenaemia.
- The authors state that JGCT had not been described in McCune-Albright syndrome, and suggest that high androgen levels under metyrapone may have driven rapid growth of the tumour.
relevance_to_jgct: 'Ruptured JGCT at 4 months in an infant with neonatal McCune-Albright syndrome and a GNAS R201H mutation in the tumour: a direct syndromic link between GNAS-activated McCune-Albright syndrome and JGCT.'
