key_findings:
- 'Review of sex cord-stromal tumor genetics: about 30% of juvenile GCT carry the gsp (GNAS) oncogene mutation and a further 60% an activating AKT mutation; FOXL2 C134W is found in almost all adult GCT.'
- Sex cord-stromal tumors occur in Peutz-Jeghers syndrome, Ollier disease and Maffucci syndrome, and DICER1 syndrome.
