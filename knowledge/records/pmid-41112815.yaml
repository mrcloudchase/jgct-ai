notes: 'Case report with sparse pathology detail and no follow-up duration. Size discrepancy: MRI 41 x 57 x 48 mm vs 6 cm at surgery. Authors used ChatGPT for language editing. Statements on prognosis, IHC (inhibin, calretinin, FOXL2) and FOXL2 402C>G are general literature in the discussion, not findings in this patient.'
