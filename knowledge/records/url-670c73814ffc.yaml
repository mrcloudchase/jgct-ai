key_findings:
- A national multicentre study with the Societe Francaise des Cancers de l'Enfant and 8 paediatric endocrinology centres included 46 patients.
- Laser microdissection, selective amplification and sequencing found activating Gsα mutations (R201H, R201C) in 30% of the tumours, which the author describes as a major prognostic factor for recurrence and locoregional extension.
- A PNA-clamping method for detecting these mutations was shown to be efficient and reliable, and was also applied to a series of 150 DNAs from McCune-Albright syndrome.
- Loss of FOXL2 expression occurred in tumours with aggressive behaviour.
- SOX9 and FOXL2 expression was dysregulated, with possible transdifferentiation of Sertoli cells into tumour granulosa cells in 3 XY patients with testicular granulosa cell tumour.
relevance_to_jgct: Thesis behind the first French paediatric JGCT Gsα (GNAS) mutation series (30%), including testicular cases and the FOXL2 loss in aggressive tumours.
