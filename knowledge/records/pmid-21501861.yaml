key_findings:
- 'Among 325 patients from 296 families with PPB enrolled in the IPPBR, 9 patients or close relatives had an OSCST: seven Sertoli-Leydig tumors, one juvenile granulosa cell tumor and one gynandroblastoma (the pathology section classifies these as five SLCT, two Sertoli cell tumors, one jGCT and one gynandroblastoma).'
- 'Three additional OSCST cases without PPB family history were referred for suspected genetic predisposition: two sisters (one jGCT at 16 with a lung cyst, one gynandroblastoma) and one SLCT.'
- 'Table 1 lists two jGCTs: case 8 (second-degree relative of a PPB patient, diagnosed at 2 years, surgery only, NED at 33 years) and case 11 (16 years, NTH and lung cyst, surgery plus chemotherapy, NED at 1.5 years).'
- Germline DICER1 mutations were found in 6 of 8 patients with germline samples; Table 2 lists c.3073G>T; p.Glu1025X in the juvenile granulosa cell tumor patient and in a gynandroblastoma patient.
- Authors conclude germline DICER1 mutations may occur in OSCST including SLCT, juvenile granulosa cell tumor and gynandroblastoma when clinical presentation suggests predisposition; a lung cyst or PPB-related tumor in a patient or relative with OSCST should suggest germline DICER1 mutation.
- All OSCST patients were alive without evidence of disease at last follow-up (family members at median 20.5 years, range 13-45 years).
relevance_to_jgct: Registry evidence placing (rare) juvenile granulosa cell tumor within the DICER1/pleuropulmonary blastoma familial tumor spectrum, including a germline DICER1 nonsense variant in a jGCT patient.
