notes: Registry report; only 2 of 12 OSCST patients had jGCT, so findings are mainly about SLCT. Genetic results are aggregated by the authors so a patient-level jGCT genotype for case 8 is unknown. The same family/sisters (cases 11 and 12) may be reported again in later DICER1 or OSCST series.
