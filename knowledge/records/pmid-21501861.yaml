key_findings:
- Among 296 kindreds including 325 children with PPB, three children had both PPB and Sertoli-Leydig/Sertoli cell tumors.
- 'Among family members of PPB patients: six ovarian sex cord-stromal tumors, including one juvenile granulosa cell tumor.'
- Germline DICER1 mutations in four of six OSCST patients from PPB kindreds and two of three OSCST children without PPB history.
relevance_to_jgct: Places JGCT (rarely) within the DICER1/pleuropulmonary blastoma familial tumor spectrum.
