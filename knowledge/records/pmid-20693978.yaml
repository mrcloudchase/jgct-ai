key_findings:
- FOXL2 C134W was present in 52 of 56 adult granulosa cell tumors from Melbourne and Helsinki (3 hemi/homozygous); 3 of the 4 wild-type cases may have been misclassified.
- KGN cells were heterozygous for the mutation and COV434 cells wild type; COV434 and two of three juvenile granulosa cell tumors lacked FOXL2 expression.
