presentation:
- incidental swollen left ovary found during work-up of CA19-9 elevation and gastrointestinal cancers
key_findings:
- The English abstract states a woman (age digits lost in the extracted text) was diagnosed with double cancers of the esophagogastric junction and rectum and had a swollen left ovary suspected to be a Krukenberg tumour, which would have meant inoperable progression.
- A laparoscopic bilateral salpingo-oophorectomy for histology showed the ovarian tumour was juvenile granulosa cell tumour, not Krukenberg tumour, so curative surgeries (thoracolaparotomy for the esophagogastric junction cancer, robot-assisted rectal surgery) were done.
- Immunostaining showed CA19-9 strongly in the esophagogastric junction tumour but not in the rectal or ovarian tumours, and serum CA19-9 dropped sharply after resection of the esophagogastric junction cancer; the authors call it a CA19-9-producing gastric-type cancer by the criteria of Okinaga et al., and note JGCT is a borderline malignant sex cord-stromal tumour rarely found in adults.
relevance_to_jgct: Rare adult-age 'juvenile' granulosa cell tumour found as an unexpected ovarian mass beside two gastrointestinal cancers; no stage, size, hormone or outcome data available.
