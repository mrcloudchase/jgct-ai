key_findings:
- 42 testicular SCST patients reported 1993-2009 to the German MAHO and MAKEI studies.
- Juvenile granulosa cell tumors (n = 16) and Sertoli cell tumors (n = 15) were the leading subtypes; JGCTs were diagnosed in the first weeks of life (median 6 (0-162) days).
- All tumors limited to the testis; treatment surgical only; no relapse after median 3.8 years.
- One patient showed a 45X/46XY mosaic; authors advise considering associated tumor predisposition syndromes.
relevance_to_jgct: German registry data confirming testicular JGCT is a neonatal tumor cured by orchiectomy.
