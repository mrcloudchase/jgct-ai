- precocious puberty
key_findings:
- Of 18 girls aged 0 to 19 with an ovarian mass and abnormal secondary sexual development at Peking Union Medical College Hospital (2012 to 2019), 7 developed sexual signs before puberty, including 2 with juvenile granulosa cell tumor presenting with precocity (Chinese).
- The authors advise sex hormone testing, imaging and karyotyping where needed, and that sex cord-stromal tumor be considered first in such patients.
relevance_to_jgct: JGCT as a cause of precocity in a Chinese pediatric gynecology series.
