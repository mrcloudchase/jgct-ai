key_findings:
- Unlike ovarian JGCT, testicular JGCTs are described as an infantile disease that appears to be invariably benign, presenting largely during the first year of life (90% in infants <= 6 months), mostly as testicular masses, with gynecomastia in rare patients.
- Macroscopically well-circumscribed, multicystic or solid and cystic; follicles lined by small round to oval cells; some show microcystic (reticular) architecture mimicking yolk sac tumour.
- Some show prominent mitotic activity (>5-10 mitoses per 10 high-power fields), but this is stated not to be associated with aggressive clinical behaviour in the testis.
- Ovarian JGCTs show recurrent AKT1 pleckstrin-homology domain internal tandem duplications and hotspot (codon 201) GNAS mutations; these have not been identified in testicular counterparts, which show monosomy 10 (~60%).
- Reports the recommendation to reclassify the entity as 'benign juvenile granulosa cell tumour of the testis'.
relevance_to_jgct: Pathology review contrasting testicular and ovarian JGCT clinically and molecularly.
