key_findings:
- Multilobular cystic JGCT in a 33-year-old pregnant woman removed at cesarean section at 38 weeks.
- Three intermingled histological patterns (diffuse, trabecular/cord-like, microfollicular) plus numerous luteinized stromal cells.
- Steroidogenic enzymes (P450scc, 3beta-HSD, 17alpha-hydroxylase) detected only in luteinized stromal cells; Ad4BP present in almost all tumor cells.
- Authors suggest the pregnancy hormonal environment altered histological and biological features.
