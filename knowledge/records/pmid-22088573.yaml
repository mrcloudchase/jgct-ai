key_findings:
- Neonate with a left-sided abdominal mass and empty left scrotum.
- Ultrasonography showed a well-defined cystic formation; laparotomy revealed a tumor arising from an intra-abdominal left testis.
- CEA and NSE normal; beta-HCG and AFP within age-related normal values; immunochemistry confirmed the diagnosis.
