key_findings:
- Retrospective single-institution series of consecutive pediatric testicular tumors (November 2016 to June 2024) with preoperative scrotal ultrasound correlated with histology; 118 lesions, peak incidence within the first 3 years of life.
- Benign tumors (e.g., teratoma, epidermoid cyst) constituted 71.2% of cases.
- 'Cystic or cystic-dominant pattern: PPV 96.1% for benignity, NPV 47.8%; solid or solid-dominant: NPV 91.5% for malignancy, PPV 49.2%.'
- '''Uncommon entities like juvenile granulosa cell tumors exhibited pathognomonic "swiss-cheese" morphology'' on ultrasound.'
- 'Solid pattern combined with AFP >300 ng/mL: PPV 94.7% and NPV 97.0% for yolk sac tumor.'
relevance_to_jgct: Describes a 'swiss-cheese' ultrasound appearance for testicular JGCT within a prepubertal testicular tumor series; number of JGCT cases not stated in the abstract.
