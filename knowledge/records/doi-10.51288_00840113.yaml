- 'A juvenile-type granulosa cell tumor after menopause (Venezuelan journal, Spanish): the abstract repeats that juvenile tumors are 5% of granulosa cell tumors and 3% occur over age 30, that intraoperative diagnosis is difficult, that stage and complete resection are the main prognostic factors, and that the role of adjuvant therapy is not established.'
