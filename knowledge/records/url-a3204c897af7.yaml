presentation:
- 'pseudo-precocious puberty in all 9: breast enlargement with extensive suprapubic hair (6), suprapubic hair with enlarged clitoris (1), suprapubic hair with huge abdominal swelling (1), vaginal bleeding (1)'
- AFP and hCG negative in all
key_findings:
- 'Single institution (Alexandria University, Egypt), 15 years: 9 juvenile granulosa cell tumors (5 retrospective, 4 prospective); 8 aged 4 to 6 years and one 7 months old.'
- All presented with pseudo-precocious puberty; AFP and hCG negative in all.
- 'Ultrasound: unilateral solid ovarian tumor in 7, a huge mixed solid-cystic ovarian mass in 1, a small ovarian cyst in 1.'
- Treatment unilateral oophorectomy in 8 and partial oophorectomy in 1; histopathology reported all as benign granulosa cell tumors; signs of pseudo-precocious puberty regressed over 10 to 120 days.
- Authors conclude JGCT should be considered in prepubertal girls with pseudo-precocious puberty and negative AFP/hCG, and that unilateral oophorectomy is curative because the tumors are mostly benign.
relevance_to_jgct: Small Egyptian pediatric series of 9 ovarian JGCT, all presenting with pseudo-precocious puberty, treated by oophorectomy.
