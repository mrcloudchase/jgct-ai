key_findings:
- A 35-year-old woman (IV gravida, II para, DCDA twin pregnancy, two previous caesarean sections and a 13 cm paracervical myoma) was seen at 33+3 weeks; ultrasound showed a 17x15 cm cystic-solid, smooth, hypervascularised ovarian tumour, and CA-125 was only slightly raised at 46.9 U/ml.
- At rupture of membranes and onset of labour a planned repeat caesarean section with left adnexectomy was done at 34+2 weeks (live, eutrophic girls); the tumour was soft but intact, and the left ovary weighed 1336 g (18x15x10 cm); cytology and biopsy were taken from the right ovary.
- Histology showed a juvenile granulosa cell tumour, pT1a R0; the patient declined guideline-recommended completion of surgery.
- The authors state that the sonographic change during pregnancy delayed suspicion of malignancy, and that timing the operation at the advanced gestational age gave the best situation for mother and children without worsening of prognosis.
- The authors cite from the literature that juvenile GCT in pregnancy is very rarely described, is almost always FIGO stage I and mostly found before the third trimester (91%), and that the tumour has an increased rupture risk; these are not findings of the case.
- Follow-up after surgery is not reported.
relevance_to_jgct: Ovarian JGCT diagnosed in a 35-year-old at caesarean section in a twin pregnancy; adult-age, pregnancy-associated presentation with fertility-sparing surgery only.
