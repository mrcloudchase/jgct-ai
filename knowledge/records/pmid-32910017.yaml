key_findings:
- Cohort of 50 tumors submitted as JGCT, 47 confirmed on pathology review, tested for FOXL2 and DICER1 mutations.
- No confirmed JGCT carried a FOXL2 hotspot mutation; the two FOXL2-mutant tumors were reclassified as adult GCT.
- DICER1 RNase IIIb mutations in 3 of 47 (6%) confirmed JGCT.
relevance_to_jgct: Establishes FOXL2 mutation absence as a JGCT feature (useful against adult GCT) and quantifies DICER1 mutation as uncommon in JGCT.
