key_findings:
- Cohort of 50 JGCTs tested for FOXL2 and DICER1 mutations.
- FOXL2 hotspot mutation found in 2/50; on review both were reclassified as adult granulosa cell tumors, so FOXL2 mutation was absent in JGCT.
- DICER1 RNase IIIb mutations found in 4 cases; one was reclassified as gynandroblastoma with prominent JGCT component, leaving DICER1 mutations in 3/47 (6%) of pathologically confirmed JGCTs.
relevance_to_jgct: Largest FOXL2/DICER1 mutation survey in JGCT; shows FOXL2 mutation is absent and DICER1 mutation rare, informing differential diagnosis from adult GCT and Sertoli-Leydig cell tumor.
