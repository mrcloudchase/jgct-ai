notes: 'Mismatches between abstract and text: abstract reports mitotic rate P=0.005 and stage P=0.0001 (Kaplan-Meier) whereas the Results text reports univariate P=0.021 and 0.001. Table 3 column headings label recurrent n=12 but IHC counts total 10. Authors and journal not stated in the retrieved text. The relationship between recurrence and chemotherapy likely reflects stage (chemotherapy given for higher stage, residual disease), as the authors discuss.'
