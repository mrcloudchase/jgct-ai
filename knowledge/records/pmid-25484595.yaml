alterations: []
treatments:
- regimen: Cesarean section at 32 weeks with fertility-preserving surgery (right adnexectomy, partial omentectomy, pelvic lymph node dissection, peritoneal biopsies), then 3 cycles of BEP (bleomycin, etoposide, cisplatin) plus leuprolide (to preserve ovarian function), starting 10 days after surgery
  setting: adjuvant after surgery in pregnancy
