notes: The text says the male patient was 'Index case 4' in the surgical review, but the only male described is index case 1 (a 5-month-old boy; case 4 is a 64-year-old woman), an internal inconsistency. Unclear whether the 4 juvenile-type cases include index case 1 or 2. Index case 2 is described as histologically between adult and juvenile GCT, not definitively JGCT; n_jgct_patients=4 follows the survey count. Review literature claims (percentages, survival) are cited secondary data, not original.
