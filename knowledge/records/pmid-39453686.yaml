notes: 'Internal inconsistencies in the paper for AGCT: abstract reports recurrence in 19 (23.9%) and 5 deaths (5.4%), whereas the results give 19 (22.1%) and 4 (4.7%); the discussion also quotes a 7.9-fold stage IV risk versus HR 7.62 in the results. The JGCT group age is a mean only (no range). Journal and first author not in cached text.'
