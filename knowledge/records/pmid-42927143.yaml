key_findings:
- Previously healthy two-year-nine-month-old girl with progressive breast development, persistent leukorrhea, and vaginal bleeding.
- Suppressed LH and FSH with markedly elevated inhibin B (>5000 pg/mL).
- CT and pelvic MRI showed a large complex left ovarian mass with imaging features suggestive of malignancy.
- Fertility-sparing left oophorectomy with comprehensive surgical staging; FIGO stage IA JGCT; no adjuvant chemotherapy, active surveillance.
- Hormonal abnormalities normalized within two months after surgery; no recurrence after 12 months of follow-up.
- Authors propose inhibin B as an individualized biomarker for postoperative surveillance when elevated at diagnosis.
relevance_to_jgct: Typical early-childhood presentation of ovarian JGCT with peripheral precocious puberty, stage IA, surgery alone.
