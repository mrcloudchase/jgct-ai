key_findings:
- DICER1 IHC and mutation status evaluated in 267 AGCTs, 38 SLCTs, 5 JGCTs, and 21 Leydig cell/steroid cell tumors.
- No JGCT demonstrated a DICER1 mutation or expression.
- DICER1 positivity in 21 of 38 (55.3%) SLCTs and 16 of 21 (76.2%) SCTs; 4 of 267 (1.5%) AGCTs.
- Using a cutoff of >=10% positive tumor cells, IHC matched mutational status with sensitivity of 90.5%, specificity of 92.1%.
relevance_to_jgct: Small JGCT subset (n=5) negative for DICER1 mutation and DICER1 protein expression.
