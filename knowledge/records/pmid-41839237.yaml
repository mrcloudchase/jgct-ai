key_findings:
- 'Ovarian sex cord-stromal tumors tested for DICER1 by immunohistochemistry and sequencing: 267 adult GCT, 38 SLCT, 5 JGCT, 21 steroid/Leydig cell tumors.'
- No JGCT showed a DICER1 mutation or DICER1 expression.
- Using a 10% cutoff, IHC had 90.5% sensitivity and 92.1% specificity for DICER1 mutation overall, best suited to SLCT and adult GCT.
- In steroid cell tumors DICER1 expression was common but unrelated to mutation.
relevance_to_jgct: Adds a small series in which JGCT were DICER1 wild-type and IHC-negative, relevant to how often DICER1 drives JGCT.
