key_findings:
- Five adult granulosa cell tumors with high-grade transformation whose high-grade areas closely resembled JGCT (abundant eosinophilic cytoplasm, high mitotic activity, intermediate follicles); FOXL2 C134W in both components in 4 of 4 tested proved transformation of AGCT rather than a coexisting JGCT.
- TP53 mutations were found in the high-grade component of 2 cases and mutation-type p53 staining in 3 of 4; one patient developed mediastinal, peritoneal and pulmonary metastases 17 months after diagnosis.
relevance_to_jgct: High-grade AGCT can mimic JGCT; FOXL2 mutation analysis separates them.
