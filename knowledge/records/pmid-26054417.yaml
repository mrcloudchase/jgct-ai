key_findings:
- Radiology review of ovarian sex cord-stromal tumors using the 2014 WHO classification, in which adult and juvenile granulosa cell tumors are grouped among pure sex cord tumors.
- GCT are low-grade malignant tumors under 5% of malignant ovarian tumors; adult type accounts for 95%. The juvenile form occurs predominantly in children and young women (under 30 years). In the pediatric population isosexual pseudoprecocity is common.
- 'Authors state adult and juvenile GCT have similar imaging features despite different ages, clinical and histologic findings: usually unilateral (average about 12 cm), ranging from solid to multilocular cystic masses with solid components to purely cystic, usually without intracystic papillary projections and rarely calcified; on MRI often sponge-like multilocular cystic masses.'
- 'Illustrative case (Figure 9): a 17-year-old girl with a right ovarian JGCT; ultrasound showed a multilocular cystic mass and contrast CT a multiloculated low-attenuation mass with thin septa and abundant ascites. No other clinical data given.'
- 'Most JGCT present at stage I and are less likely to recur after simple resection, but occasional clinically malignant tumors usually grow fast and spread early within the abdomen (statement attributed to the cited literature). GCT overall: more than 80% detected at stage I with 5-year survival above 90%; recurrence is late.'
- Sclerosing stromal tumor, an estrogenic SCST of young women, is discussed as a differential entity with a characteristic spoke-wheel MRI pattern; Sertoli-Leydig tumors tend to recur early in contrast to the late recurrences of GCT.
relevance_to_jgct: Imaging-oriented review with a short adult-plus-juvenile GCT section and one illustrative JGCT case; useful for the statement that JGCT and adult GCT look alike on ultrasound, CT and MRI.
