key_findings:
- 'Of 338 tumors in the Prepubertal Testis Tumor Registry, 22 occurred in neonates under 1 month, 7 diagnosed at birth: 6 yolk sac tumors, 6 gonadal stromal tumors, 6 juvenile granulosa cell tumors, 2 gonadoblastomas, 1 teratoma, 1 hamartoma; preoperative AFP in 10 ranged from 23 to 61,700 ng/mL, within normal limits for age; no metastases at presentation and 17 of 18 followed were disease free.'
relevance_to_jgct: JGCT was one of the three commonest neonatal testis tumors; AFP uninterpretable in this age group.
