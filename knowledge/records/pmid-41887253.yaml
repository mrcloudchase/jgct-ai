key_findings:
- Fifty-five ovarian tumors with an embryonal carcinoma component (ages 3 to 57), all within malignant mixed germ cell tumors; the authors note that purported pure embryonal carcinomas are often undersampled mixed tumors or other types including yolk sac tumor, dysgerminoma, small cell carcinoma of hypercalcemic type and juvenile granulosa cell tumor.
