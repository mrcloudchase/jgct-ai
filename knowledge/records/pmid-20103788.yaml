- 'High-resolution sonography of 16 granulosa cell tumors (13 adult, 3 juvenile; 2.0 to 15.4 cm): solid and cystic in 10, solid with sponge-form appearance in 4 (hemorrhagic necrosis), entirely solid in 2; resistive index of solid parts 0.23 to 0.5; patterns correlated with macro- and microfollicular histology.'
