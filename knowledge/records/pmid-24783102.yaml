presentation:
- lower abdominal pain
- sclerosing peritonitis (abdominal cocoon)
key_findings:
- 18-year-old with one month of lower abdominal pain.
- At surgery an ovarian mass with bowel loops enclosed in a diffusely thickened peritoneal membrane forming a cocoon; adhesions suggestive of metastatic deposits.
- Ovarian histology JGCT; peritoneal process was sclerosing peritonitis.
- Authors stress sclerosing peritonitis in JGCT should not lead to over-staging.
relevance_to_jgct: 'Staging pitfall: sclerosing peritonitis associated with JGCT can mimic peritoneal metastasis.'
