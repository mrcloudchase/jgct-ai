key_findings:
- Clinical features table lists, under female reproductive tract, 'Ovarian sex cord-stromal tumors (e.g., Sertoli-Leydig cell tumor [moderately and poorly differentiated], gynandroblastoma, juvenile granulosa cell tumor [especially if anaplasia and/or high mitotic index])' as features suggestive of DICER1-related tumor predisposition.
- 'Penetrance table: ovarian sex cord-stromal tumors ~10%; ''Up to 60% of persons w/SLCT or gynandroblastoma have DICER1. Juvenile granulosa cell tumor is rarely assoc w/DICER1.'''
- '''JuvGCT, especially anaplastic juvGCT, may be associated with DICER1.'' Presentation may include abdominal pain, distention or mass; precocious puberty, secondary amenorrhea, or virilization; markers variable (inhibin A, inhibin B, CA125, testosterone); inhibin B may be elevated at diagnosis and with recurrence.'
- '''JuvGCT generally have a favorable prognosis if identified at stage 1A or 1C1, though high mitotic index, anaplastic features, or higher-stage tumors are associated with a worse prognosis.'''
- '''The World Health Organization (WHO) classifies juvGCT as having borderline malignant potential. However, malignant behavior has been described in older children and adolescents and those with higher-stage tumors or tumors with higher mitotic index.'''
- 'Management section: EXPeRT/PARTNER consensus ''suggest adjuvant chemotherapy for all children and adolescents with higher than stage IC1 disease''; ''High mitotic index (MI >=20 per 10 high power field) is a strong predictor of worse prognosis''; adjuvant chemotherapy for high MI but low-stage disease ''could be considered on an individual basis.'''
- Sporadic juvenile granulosa cell tumor (and other DICER1-spectrum tumors) occurring alone 'frequently contain biallelic somatic pathogenic variants in DICER1 that may not be present in the germline'; JGCT 'rarely' may secrete AFP, typically <500 ng/mL with sex cord-stromal tumors.
- 'Surveillance in DICER1 carriers: pelvic ultrasound for gynecologic tumors in females every six months until at least age 40 years; pelvic ultrasound described as more sensitive than biochemical surveillance.'
relevance_to_jgct: Expert-authored, peer-reviewed NCBI GeneReviews chapter (Schultz KAP et al., International PPB/DICER1 and OTST Registries) placing JGCT within the DICER1 tumor spectrum as a rare association, stronger for anaplastic or high-mitotic-index JGCT, and restating EXPeRT/PARTNER adjuvant-therapy thresholds.
