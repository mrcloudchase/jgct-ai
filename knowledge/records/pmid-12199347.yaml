key_findings:
- PCR and DNA sequencing screened children with premature thelarche and pathologic specimens of juvenile and adult granulosa cell tumors for activating mutations of Gs-alpha and of the FSH receptor, because both disorders involve overactive FSH signalling.
- No mutation was detected in either the Gs-alpha or the FSH receptor fragment studied.
- Previously reported FSH receptor polymorphisms (Ser680Asn and Ala307Thr) were found in 25 of 27 tumor samples and 9 of 9 premature thelarche samples.
- The authors conclude that activating mutations in the known hot-spots of Gs-alpha and the FSH receptor are probably not a major cause of premature thelarche or granulosa cell tumors.
relevance_to_jgct: Negative genetic screen (GNAS/Gs-alpha and FSHR hot-spots) in a set of juvenile and adult granulosa cell tumors; the number of juvenile specimens is not given in the abstract.
