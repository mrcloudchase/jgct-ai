age_range: 5 to 13 years in the case
alterations:
- gene: DICER1
  alteration: germline c.1376+1G>A (canonical splice site, exon 8 boundary), loss of function
  frequency: 1 patient
  notes: 'Somatic RNase IIIb hotspot hits in exon 25: c.5428G>T (PPB), c.5438A>T (thyroid carcinoma), c.5439G>T (nasal chondromesenchymal hamartoma and ovarian SLCT)'
