key_findings:
- Three childhood ovarian JGCT cases; main causes of hospitalization were abnormal abdominal signs and syndromes.
- Imaging showed masses with multiple cysts and solid components.
- Tumors excised completely; all had good outcome at follow-up (2 to 13 y) without adjuvant chemotherapy or radiotherapy.
relevance_to_jgct: Small pediatric series supporting surgery alone for completely excised early-stage JGCT.
