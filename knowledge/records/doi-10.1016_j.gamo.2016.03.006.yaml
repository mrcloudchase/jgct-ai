key_findings:
- Two women younger than 30 years with juvenile granulosa cell tumour are presented.
- Case 1 had a 20 cm tumour in the left iliac fossa extending to the left hypochondrium and underwent exploratory laparotomy with left salpingo-oophorectomy and intraoperative study.
- Case 2 received care outside the hospital, so only close surveillance was carried out; one year into oncological follow-up she delivered a live, healthy baby without complications.
- The authors state that JGCT is about 5% of granulosa cell tumours and usually occurs in premenarchal women and those under 30, and conclude that unilateral adnexectomy is feasible for women of reproductive age when disease is confined to the ovary and endometrial cancer is excluded, with excellent survival because most are early stage.
relevance_to_jgct: Two Mexican young-adult JGCT cases, one with a later successful pregnancy after conservative management; the abstract gives no ages, stage or outcome for case 1.
