key_findings:
- Of 257 ovarian sex cord-stromal tumors at MD Anderson (1985 to 2005), 178 were adult granulosa, 27 juvenile granulosa, 31 Sertoli-Leydig; of 58 patients with lymph nodes removed at staging, none had positive nodes; of 117 recurrences, 6 (5.1%) involved nodes, 3 of them after negative initial nodes.
- The authors conclude lymphadenectomy may be omitted when staging sex cord-stromal tumors.
relevance_to_jgct: Evidence base (27 JGCT included) for omitting lymphadenectomy.
