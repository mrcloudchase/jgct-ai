notes: Tier set to registry because the data come from a national study-group collation (South African Children's Tumour Registry acknowledged). The abstract says 3 patients were lost to follow-up whereas Table 1 shows 2 'Lost' and the text says 2 girls were lost (18 of 23 had documented follow-up). Text says 21 primary resections but 17 + 4 incomplete; the text reports mean estradiol '11,1134 IU/L' (typo). JGCT counts per stage/outcome were counted by this record's author from Table 1. Possible small overlap with other SCST reports cited in the paper (MAKEI, TGM-95) is not expected.
