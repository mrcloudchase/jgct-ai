key_findings:
- Testicular JGCT in a newborn presenting with testicular torsion; no malformations; normal karyotype.
- Initial tumoral lesions in adjacent seminiferous tubules suggest origin from immature Sertoli cells.
- Described as the tenth reported newborn case and second with torsion.
