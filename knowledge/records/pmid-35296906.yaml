key_findings:
- 15-year-old female with abnormal vaginal bleeding, several months of irregular menses, and a large multicystic adnexal mass.
- Somatic IDH1 mutation identified in the ovarian JGCT tissue.
- Mixed lytic and sclerotic pelvic bone lesions initially presumed skeletal metastases; biopsy showed hyaline cartilage neoplasm; imaging classic for Ollier disease.
- 'Authors: when a patient with JGCT has skeletal lesions, they should be scrutinized for features of a hyaline cartilage neoplasm to avoid misdiagnosing metastases.'
- Described as the second reported confirmed case of an IDH1 somatic mutation in JGCT tissue in a patient with Ollier disease.
relevance_to_jgct: Molecular link between Ollier disease and JGCT (somatic IDH1) and a practical warning about mistaking enchondromas for bone metastases.
