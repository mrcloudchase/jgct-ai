key_findings:
- Conditional deletion of Smad1 and Smad5 in mouse granulosa cells produces metastatic granulosa cell tumors whose histology and hormone profile most resemble juvenile GCT; human JGCT samples expressed anti-Mullerian hormone and showed activation of TGF-beta/SMAD2/3 signaling but not Wnt/beta-catenin.
- The authors propose that disruption of SMAD1/5 or activation of SMAD2/3 contributes to human JGCT.
relevance_to_jgct: The Smad1/5 knockout mouse as a JGCT model; TGF-beta pathway active in human JGCT.
