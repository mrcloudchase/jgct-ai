key_findings:
- 'Review of DICER1-associated tumors of the female genital tract: germline DICER1 mutations are associated with Sertoli-Leydig cell tumor, cervical embryonal rhabdomyosarcoma, gynandroblastoma and juvenile granulosa cell tumor, typically in childhood, adolescence or early adulthood.'
- Genetic counseling is suggested for patients with a personal or family history of these rare DICER1-associated gynecologic tumors.
relevance_to_jgct: Lists JGCT among germline DICER1-associated gynecologic tumors and advises counseling.
