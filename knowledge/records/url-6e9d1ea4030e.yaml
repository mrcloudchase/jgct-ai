key_findings:
- Full-term newborn with a left scrotal mass from birth; ultrasound on day 2 showed a well-defined, large, complex cystic mass with significant septal blood flow.
- Surgical resection; histology juvenile granulosa cell tumour; karyotype normal; serum tumour markers not elevated per authors.
- Authors describe JGCT as 'a benign, rarely diagnosed subset of testicular sex-stromal tumours' with most cases in the first 6 months of life, and associated with chromosome X abnormalities.
relevance_to_jgct: Neonatal testicular JGCT with cystic ultrasound appearance.
