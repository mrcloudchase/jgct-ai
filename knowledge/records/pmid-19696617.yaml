key_findings:
- 36-year-old woman with Ollier disease developed an ovarian tumor found at a routine MRI scan.
- Stage IIc granulosa cell tumor removed at surgery; pathology showed juvenile type.
- Literature review showed 8 previous cases of (juvenile) granulosa cell tumor associated with Ollier disease.
- Authors suggest coexistence is more frequent than expected by chance and that patients with Ollier disease should undergo regular gynecological investigation.
relevance_to_jgct: Ollier disease-associated JGCT in an adult; supports the enchondromatosis association.
