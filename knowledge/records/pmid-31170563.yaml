key_findings:
- French national rare gynaecological cancer network guidelines on fertility preservation, contraception and menopause hormone therapy after rare ovarian tumours including sex-cord tumours.
- Panel of 35 experts using DELPHI formal consensus; thirty-five recommendations.
- Caution recommended for potentially hormone-sensitive tumours such as sex-cord tumours.
relevance_to_jgct: Guideline relevant to fertility preservation and hormone use after sex cord tumours (including granulosa cell tumours); JGCT not named in abstract.
