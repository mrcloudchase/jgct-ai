key_findings:
- 18 JGCT patients, Fudan University Obstetrics and Gynecology Hospital, Feb 2009-Jul 2025; median age 14 years (5-30).
- 'Presentation (17 first diagnosed there): abnormal vaginal bleeding 8/17, abdominal pain and distension 6/17, pelvic mass 3/17; median tumor diameter 10 cm (5-37); CA125 >35.0 kU/L in 7.'
- All had fertility-preserving surgery; all FIGO stage I (Ia 10/18, Ic 8/18); 6 received platinum-based adjuvant chemotherapy (5 BEP, 1 PVB).
- 'Ki-67 index 5%-60%. Abstract states: ''Molecular analysis identified wild-type FOXL2 and DICER1 hotspot mutations in seven cases.'''
- One recurrent patient had TP53 nonsense and CDKN2A missense mutations, confirming anaplastic JGCT. One patient (1/18) developed pelvic and abdominal metastasis 23 months after surgery (median follow-up 75.6 months).
- Two patients gave birth after surgery; 4 of 6 premenarchal patients had regular menstruation after surgery.
relevance_to_jgct: Recent Chinese single-centre series with molecular and fertility follow-up.
