key_findings:
- Single-centre Chinese series of 18 JGCTs (2009 to 2025), all unilateral and FIGO stage I (IA 10, IC 8), median diameter 10 cm.
- All tumors expressed more than one sex cord-stromal marker and were EMA negative; Ki-67 ranged 5% to 60%.
- FOXL2 and DICER1 hotspots were wild-type in all 7 tested cases.
- One patient recurred at 23 months and carried TP53 nonsense and CDKN2A missense mutations, interpreted as anaplastic JGCT.
- After fertility-preserving surgery, 4 of 6 premenarchal patients had regular menses, 2 patients later gave birth.
relevance_to_jgct: Recent Asian JGCT series supporting fertility-sparing surgery in stage I and linking recurrence with TP53-mutant anaplastic histology.
