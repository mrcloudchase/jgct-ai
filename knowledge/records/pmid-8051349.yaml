key_findings:
- A JGCT in a pregnant woman with a rapidly fatal outcome (French).
- 'Review statements: the juvenile form occurs before age 30 in 97% of cases; the tumor stays confined to the ovary for a long time and may be treated by conservative surgery; relapse may occur early and then carries a very poor prognosis; pregnancy does not change the prognosis.'
