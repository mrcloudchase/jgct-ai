key_findings:
- Thirteen JGT examined by flow cytometry of paraffin material; ages stillborn to 16 years; unilateral salpingo-oophorectomy the most common therapy.
- Eleven patients with follow-up were free of disease.
- Marked nuclear atypia in three cases and high mitotic counts in six; only marked atypia correlated with DNA content.
- 46% of JGT had abnormal DNA content and increased average growth fraction; highest DNA indices found predominantly in postmenarchal girls.
- JGT may exhibit abnormal DNA content, atypia and numerous mitoses yet behave benignly.
relevance_to_jgct: Ploidy and atypia do not predict behavior in low-stage pediatric JGCT.
