key_findings:
- 9-month-old girl with bloody vaginal secretions, bilateral breast development and fine pubic hair from about 7 months of age.
- Elevated estradiol, AMH, inhibin A and B, and androstenedione; suppressed LH and FSH; bone age advanced.
- 5.4 x 4.0 x 5.4 cm solid left adnexal mass; left total salpingo-oophorectomy; tumor 6.5 x 4 x 6.5 cm, 75 grams; JGCT FIGO stage 1a; no chemotherapy or radiotherapy.
- Estradiol prepubertal and AMH/inhibin decreased at 1 week and 1 month; breast development regressed within 6 months; no recurrence after 12 months.
- Includes a literature table of JGCT in infants under 1 year reported 1998-2021; cites Bouffet 1997 review of 36 cases before age 2 years, 21 younger than 1 year.
relevance_to_jgct: Infant JGCT with endocrine follow-up showing AMH and inhibin normalization after surgery; literature compilation of infant cases.
