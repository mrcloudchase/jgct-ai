key_findings:
- 34 adult and 20 juvenile GCTs examined for FOXL2 C402G mutation, with expression by quantitative PCR and immunohistochemistry.
- FOXL2 (C402G) mutation present in 19/27 (70%) adult-type tumors but none of the juvenile tumors (0/18).
- FOXL2 mRNA expression levels had an impact on disease-free survival in both adult and juvenile GCTs.
- Patients with JGCT and higher FOXL2 protein expression had worse overall and disease-free survival than those with negative or weakly immunoreactive tumors.
relevance_to_jgct: Confirms absence of FOXL2 C402G mutation in JGCT and reports FOXL2 expression level as prognostic in JGCT.
