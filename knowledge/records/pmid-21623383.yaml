key_findings:
- FOXL2 C402G mutation found in 19 of 27 adult GCT and none of 18 JGCT tested.
- FOXL2 mRNA and protein expression correlated in both adult and juvenile tumors.
- In JGCT, higher FOXL2 protein expression was associated with worse overall and disease-free survival; FOXL2 mRNA expression was associated with disease-free survival in both types.
relevance_to_jgct: Confirms FOXL2 mutation absence in JGCT and proposes FOXL2 expression level as a JGCT prognostic marker.
