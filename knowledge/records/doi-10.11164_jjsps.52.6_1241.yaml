key_findings:
- A 7-year-old girl had breast development noticed at school entry and vaginal bleeding about half a year before referral; height was 132.8 cm (+2.5 SD), weight 25.4 kg (+0.5 SD), Tanner breast stage II and pubic hair stage II.
- 'Ultrasound and MRI showed a mixed solid and cystic tumour of 14 x 10 x 7 cm filling most of the abdomen. Blood tests: LH 0.0 mIU/ml, FSH below 0.1 mIU/ml, estradiol 61.6 pg/ml, testosterone 2.72 ng/ml, GH 56.04 ng/ml, hCG-beta 0.0 mIU/ml, AFP 2 ng/ml.'
- The preoperative diagnosis was juvenile granulosa cell tumour or dysgerminoma. At laparotomy a capsule-covered 15 x 10 x 6 cm yellow-brown soft solid tumour with cystic spaces was removed with the right adnexa; ascites was scanty and cytology showed no malignant cells, the contralateral adnexa looked normal and no peritoneal dissemination was seen.
- 'Histology: juvenile granulosa cell tumour with an intact capsule, no capsular invasion, 4 mitoses in 20 fields at x200 as the text is read, inhibin alpha weakly positive. FIGO stage Ia.'
- No adjuvant chemotherapy was given. At 12 months after surgery the estradiol, testosterone and GH that were high before surgery were within reference range and there was no recurrence on imaging.
- In their discussion the authors cite reports that stage and mitotic activity drive prognosis, that recurrence in stage I has been reported after 4 years, and that periodic follow-up is needed; they favour adnexectomy rather than tumour-only removal to avoid residual tumour.
relevance_to_jgct: Japanese stage Ia JGCT in a 7-year-old presenting with precocious puberty and high estradiol, treated by unilateral salpingo-oophorectomy alone with 12 months NED.
