key_findings:
- '80 cystic GCTs: 24 AGCT and 56 JGCT; average age 22 years for JGCT (range 3 to 83 overall).'
- Androgenic manifestations in 19 of 43 with clinical information (16 JGCT).
- All >8 cm (average 17 cm); invagination of epithelium into cyst walls a key diagnostic feature (45 JGCTs); 14 JGCTs had moderate to severe bizarre atypia.
- Main differential diagnosis is follicle cyst.
relevance_to_jgct: Describes the cystic JGCT variant, often androgenic and easily misdiagnosed as a follicle cyst.
