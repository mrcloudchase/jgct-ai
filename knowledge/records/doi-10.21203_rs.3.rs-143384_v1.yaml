key_findings:
- A 10-year-old girl (menarche one year earlier) at Peking Union Medical College Hospital had 2 weeks of abdominal pain; ultrasound showed a 23.0 x 16.4 x 7.2 cm hypoechoic mass with honeycomb-like anechoic areas and MRI a giant multilocular solid-cystic mass; the right ovary looked normal.
- Serum progesterone was above 40.00 ng/ml, estradiol 514.00 pg/ml, LDH 335 U/L and neuron-specific enolase 26.8 ng/ml; laparotomy led to left adnexal resection; pathology showed JGCT, stage IC, and postoperative chemotherapy was given.
- Two years later ultrasound found a 4.8 x 3.5 x 3.5 cm anechoic right ovarian mass with smooth wall and normal oestrogen and progestin; it was followed as a physiological cyst and in 6 months grew to a unilocular cyst of 21.3 x 18.1 x 9.9 cm with estradiol 171 pg/ml.
- Right adnexal resection showed a unilocular cystic JGCT; she received postoperative chemotherapy and had no recurrence in the following 15 months.
- The authors state that this is the first reported bilateral JGCT with completely inconsistent imaging on the two sides and that only 4 bilateral and 2 unilocular cystic JGCTs had been reported (citing the literature), and recommend laparotomy for persistent enlarging cystic lesions.
relevance_to_jgct: Metachronous bilateral JGCT in a 10-year-old; second tumour was a giant unilocular cyst that mimicked a benign cyst.
