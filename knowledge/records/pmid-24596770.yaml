notes: 'Juvenile label rests on morphology only (macrofollicular pattern, mucinous secretion, theca cells, 4 mitoses/10 HPF, nuclear grooving); no immunohistochemistry, FOXL2 or inhibin, so the label is plausible given age 15 but not confirmed; an androgen-secreting tumor with free testosterone 460 ng/dl is atypical for typical JGCT. Whether the tumor pre-existed the initial normal ultrasound is not excluded; a causal link to metformin or hormone treatment is the authors'' hypothesis, unsupported by data. Stage not reported. Histology figures were images and not read. Dates: presentation Feb 2012.'
