title: Can treatment for polycystic ovarian disease induce ovarian tumour? A case report.
journal: 'Journal of clinical and diagnostic research : JCDR'
year: 2014
first_author: Dorairajan G
study_type: case_report
tumor_site: ovary
n_jgct_patients: 1
age_range: 15 years
alterations: []
treatments:
- regimen: Right ovariotomy (right ovary removed)
  setting: surgery by exploratory laparotomy
  n: 1
  outcome: uneventful postoperative period; spontaneous periods every 6-8 weeks; left ovary followed by ultrasound; follow-up duration not stated
presentation:
- severe hirsutism (Ferriman-Gallwey 11)
- oligomenorrhoea
- later lower abdominal heaviness and frequent micturition
- 30 x 25 cm mobile cystic pelvic mass
key_findings:
- 15-year-old girl (menarche 3 years earlier) with severe hirsutism and oligomenorrhoea; BMI 20, Tanner IV; normal testosterone, androstenedione, DHEAS, 17-OHP, thyroid, prolactin and glucose tolerance; free testosterone 46.2 ng/dl; ultrasound showed polycystic ovaries and no tumor. Treated for polycystic ovarian disease with metformin 1000-1500 mg/day and a combined oral contraceptive for 6 months, then periodic progesterone withdrawal.
- 'Returned 18 months later with lower abdominal heaviness and frequent micturition: 30 x 25 cm mobile non-tender cystic mass; ultrasound showed multiloculated cystic mass of the right ovary, no solid areas, no free fluid, normal left ovary. Free testosterone now 460 ng/dl; alpha-fetoprotein and LDH marginally elevated.'
- 'Laparotomy: large cystic tumor replacing the right ovary with thick smooth capsule; no free fluid; other organs, omentum and peritoneum normal; right ovariotomy done.'
- 'Pathology: multiloculated, yellow fluid and gelatinous myxoid areas, thickened septa with grey-white areas; macrofollicular pattern and solid sheets, hyperchromasia and mild atypia, 4 mitoses/10 HPF, occasional nuclear grooving, eosinophilic mucinous luminal secretion, foci of extensive theca cells; reported as juvenile granulosa cell tumour. No immunohistochemistry or stage reported in the text.'
- Authors suggest, citing prior literature, that insulin at high concentration may act through IGF-I receptors to promote such tumors, and recommend continued ovarian surveillance of adolescents treated for polycystic ovarian disease; they state theirs is probably the third such case reported (the earlier one was a Sertoli-Leydig tumor).
relevance_to_jgct: Single adolescent (age 15) ovarian JGCT with marked hyperandrogenism, diagnosed after treatment for presumed polycystic ovarian disease; illustrates an androgenic presentation mimicking PCOS.
