key_findings:
- 'A term newborn with ambiguous genitalia and 45,X/46,X,idic(Y) mosaicism had both gonads removed at 2 months (incarcerated hernia): each contained testicular and ovarian tissue, with a fallopian tube on the left and an incipient juvenile granulosa cell tumor on the right; diagnosed as ovotesticular disorder of sex development and raised as a boy.'
