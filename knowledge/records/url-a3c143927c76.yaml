key_findings:
- 16-year-old girl with irregular cycles and a 12 cm right ovarian cyst; ovary-sparing cystectomy with morcellated fragments.
- 'First specimen: up to 8 mitoses/10HPF; vimentin, CD99, CD56 positive; inhibin and calretinin positive only in larger cells; initially interpreted as luteinized granulosa cell tumour.'
- 'Salpingo-oophorectomy specimen: macrofollicular and solid pattern, some solid areas with 40 mitoses/10HPF and proliferative activity up to 50%; small area with classic AGCT morphology.'
- 'Conclusion: ''JGCT and AGCT share some morphologic characteristics, and diagnostic difficulty may result when JGCT contains elements of AGCT.'''
relevance_to_jgct: Adolescent case illustrating JGCT/AGCT morphologic overlap and high mitotic activity; FOXL2 status not reported.
