notes: Full text read from Ovid-hosted open article; figures and tables (Tables 1-5) were not present as text, so tabulated staging and PEB schedule were not read. Prognostic figures are cited from Schneider 2003 and are not new data; a possible overlap with the MAKEI/German cohort papers in the knowledge base. Some recommendations rest on personal communication (D. Schneider, 2009). Authors are the COG/MAKEI-affiliated group; they state it is guideline-style, not formal evidence grading.
