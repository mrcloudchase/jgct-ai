key_findings:
- 19-year-old with right abdominal pain, menstrual irregularity since 14, hirsutism with male-pattern pubic hair, and a 27 x 21 x 15 cm (3482 g) right ovarian cystic and solid mass with ascites.
- Full staging (pelvic and periaortic nodes, omentum, ascites) negative; right salpingo-oophorectomy; FIGO Stage IC based on surface tumor. No adjuvant treatment given.
- 3-month surveillance CT showed two new liver lesions (3.4 and 4 cm) and splenic hilum soft tissue masses consistent with metastases.
- Despite numerous cycles of varying chemotherapy regimens, liver lesions and peritoneal implants enlarged and recurrent pelvic disease appeared; serum inhibin remained elevated.
- 'Pathology: frequent mitoses, some nuclear anaplasia, extensive necrosis; IHC positive for inhibin, focally cytokeratin AE1/AE3.'
- Authors note hormone levels were not obtained, so possible androgen secretion could not be confirmed.
relevance_to_jgct: Documents rapid (3-month) hematogenous-pattern relapse of a fully staged stage IC JGCT not given adjuvant therapy, with progression on chemotherapy.
