notes: 'Abstract says 5 patients (and ''one of whom was premenarcheal''); methods state 8 were identified and 3 excluded for lost follow-up. Inconsistencies: Patient 3''s follow-up appears as 84 months in Table 1 while the text gives 49 months after secondary surgery; recurrent tumor in Patient 3 had final histopathology of gynandroblastoma, not JGCT, which the authors still count as a JGCT recurrence. The text states mean age 17 years, which was not recomputed here; the authors also say only one patient was over 20 years. Discussion statements on stage distribution (88% IA, 2% IB, 8% IC, 3% II), 5-year survival in advanced stage 25-50%, and recurrence timing are literature citations, not data from this series. The mitotic index for Patient 3 is unspecified.'
