key_findings:
- A young woman with secondary amenorrhoea and primary infertility had a juvenile-type granulosa cell tumour suspected from clinical and paraclinical tests, with MRI describing the ovarian tumour.
- Because she wished to conceive, fertility-sparing surgery was performed.
- Chemotherapy and radiotherapy were discussed in the multidisciplinary meeting, but as no adjuvant therapy was found effective they were reserved for recurrence and palliation of advanced disease; follow-up is clinical plus pelvic/abdominal MRI.
- The authors emphasise multidisciplinary care involving gynaecology, fertility, oncology and radiology.
relevance_to_jgct: Romanian young-woman JGCT case managed with fertility-sparing surgery and surveillance only.
