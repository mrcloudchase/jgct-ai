key_findings:
- JGCT presenting with ascites and pleural effusion (Meigs' syndrome); preoperative diagnosis of fibroma/thecoma was considered.
- Retroperitoneal lymph node sampling was not performed in this patient.
- Authors state the majority (90%) of juvenile GCT occur in the prepubertal or under-30 age group and have a lower risk of late recurrence than adult type.
- Authors advocate lymph node sampling for complete staging since a significant number of recurrences are reported in the retroperitoneum and in incompletely staged patients; inhibin described as still investigational.
