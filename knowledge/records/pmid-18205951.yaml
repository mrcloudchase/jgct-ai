presentation:
- ovarian tumor discovered during pregnancy (stage I at diagnosis per table)
key_findings:
- 'Retrospective series from Vali-e-Asr Hospital, Tehran (1991-2002): 23 ovarian malignancies detected in pregnancy or puerperium, ages 20-40: 11 malignant germ cell tumors, 5 low malignant potential tumors, 4 invasive epithelial tumors and 3 sex cord-stromal tumors (SCST). 17 were stage I; five of six advanced-stage patients died; 5-year survival 61%.'
- All 3 SCST patients were stage I; adjuvant chemotherapy was given to 1 of 3. One SCST, a juvenile granulosa cell tumor (JGCT), recurred; the authors state that this patient recurred multiple times and died 48 months after diagnosis.
- Authors note that SCST diagnosed during pregnancy are reported to behave like non-pregnancy SCST and conclude that pregnancy does not necessarily worsen ovarian malignancy prognosis, yet cite this JGCT as a recurrence and death.
- No age, stage detail, treatment details or timing of the recurrence are given for the JGCT patient beyond Table 1 (stage I) and the discussion sentence; the two other SCST are not histologically specified.
relevance_to_jgct: Single JGCT patient with ovarian tumor in pregnancy who had stage I disease, repeated recurrences and died at 48 months; useful as a rare outcome data point but sparsely documented.
