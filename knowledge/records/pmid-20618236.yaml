key_findings:
- 'Review of granulosa cell tumours (Medline and Cochrane 1999 to 2010): most present early because of hormone production; the juvenile form in young girls may be managed by unilateral salpingo-oophorectomy as 95% are unilateral; poor prognostic factors listed are advanced stage, size over 5 cm, more than 10 mitoses per high-power field, nuclear atypia and absence of Call-Exner bodies; inhibin and estradiol are useful in follow-up.'
relevance_to_jgct: General review restating conservative surgery for the juvenile form.
