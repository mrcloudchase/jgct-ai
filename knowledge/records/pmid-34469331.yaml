key_findings:
- In 150 ovarian yolk sac tumors (ages 1 to 61, mean 21.5), many consultation cases caused diagnostic difficulty, with juvenile granulosa cell tumor among the tumors in the differential diagnosis alongside clear cell carcinoma, embryonal carcinoma and Sertoli-Leydig cell tumor; patient age and marked AFP elevation help.
- Yolk sac tumors were all unilateral, 70% at least 15 cm, with reticular and cystic patterns dominant; endocrine manifestations occurred in only 2 cases.
relevance_to_jgct: Defines the yolk sac tumor features that separate it from JGCT.
