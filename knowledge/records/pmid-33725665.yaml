key_findings:
- 15 JGCTs among 115 GCTs (13%) reported 2011-2019 at one Indian center; mean age 17 years.
- Five patients pre-menarchal, 3 with precocious puberty; abdominal pain and distension most common.
- Tumors 4 to 20 cm; macrofollicular architecture in 12 (80%); mitotic activity 1 to 10/10HPFs; 12 (80%) stage I.
