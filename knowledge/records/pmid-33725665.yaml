presentation:
- abdominal pain and distension (most common)
- precocious puberty (3 of 5 premenarchal)
key_findings:
- JGCT made up 15 of 115 (13%) granulosa cell tumors reported 2011 to 2019; mean age 17, 80% stage I.
- Tumors were mostly unilateral, solid-cystic, 4 to 20 cm, with macrofollicular architecture in 80% and 1 to 10 mitoses per 10 HPF.
- Less common features included microcystic and tubulo-cystic patterns, myxoid change, bizarre giant cells, hobnailing and hyaline globules, which can look alarming.
- Authors note good outcome when diagnosed at an early stage.
relevance_to_jgct: Describes the morphologic variability of JGCT, a source of diagnostic difficulty.
