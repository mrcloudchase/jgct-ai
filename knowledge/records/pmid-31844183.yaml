notes: 'Internal inconsistencies: adult GCT 34 (Methods) vs 37 (Table 1), DSRCT 1 vs 2, PNET 12 vs 13; sensitivity 88%/89%; misclassification 43% vs 44%. The claim that all 10 JGCT retained SMARCA4 is inferred from the listed SMARCA4-negative mimickers, not stated outright.'
