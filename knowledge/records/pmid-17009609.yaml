key_findings:
- 'Of 34 Serbian girls aged 6 months to 9 years evaluated for precocious puberty (1995 to 2004), 7 had pseudoprecocious puberty: unilateral ovarian cysts in 6 and a granulosa cell tumor in 1, treated surgically; autonomous follicle cysts are the commonest cause and may resolve, whereas JGCT should be removed promptly (Serbian).'
relevance_to_jgct: JGCT as one of 7 pseudoprecocity cases among 34 girls.
