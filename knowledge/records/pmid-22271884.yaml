key_findings:
- Nodular histiocytic aggregates of the greater omentum, a benign process that can mimic metastasis, were found in 3 of 53 gynecologic neoplasm patients, one with a juvenile granulosa cell tumor, and in none of 96 gastrointestinal cancer patients; the lesion also appeared in peritoneal washings in one patient.
relevance_to_jgct: A benign omental lesion that can be mistaken for peritoneal spread of JGCT.
