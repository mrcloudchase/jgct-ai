key_findings:
- Review of clinical and genetic aspects of granulosa tumors based on a series of 40 children from a French national collaborative study (French Society of Children Cancer and eight pediatric endocrinology departments).
- Early diagnosis of a tumor, revealed by clinical signs of hyperoestrogeny, is reported as an important prognostic factor.
- A constitutionally activated Galphas (FSH signaling-transduction pathway) is proposed as implicated in granulosa cell proliferation and seems to modulate tumor invasiveness.
- Low expression or extinction of FOXL2 is described as related to a worse prognosis.
- Authors state reliable prognostic factors have not yet been defined and the role of MAP kinase signaling is still discussed.
relevance_to_jgct: French-language review summarizing the Kalfa/French pediatric JGCT series (n=40) on prognostic factors, GNAS (Galphas) and FOXL2.
