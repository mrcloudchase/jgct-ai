key_findings:
- A 35-year-old woman with hirsutism and severe obesity (menarche at 18, frequent heavy periods) was admitted to a haematology clinic in Kragujevac, Serbia, for extreme fatigue and dizziness; blood count showed severe anaemia (Er 1.97, Hgb 36 as printed).
- Plasma testosterone was high (198 ng/ml as printed); karyotype was 46,XX; examination showed clitoral hypertrophy and a uterus about 20 cm across with fibroids; CA 125 and HE4 were normal.
- Ultrasound and MRI showed both ovaries of normal size (right 45 x 25 mm) and a uterus of about 18 cm with multiple fibroids; she underwent total abdominal hysterectomy with bilateral salpingo-oophorectomy for suspected uterine neoplasm.
- Histology found uterine fibroids (uterus 1880 g), follicular cysts in both ovaries and a juvenile type granulosa cell tumor in the right ovary (one solitary brown node 30 mm).
- Testosterone one week after surgery was 0.6 ng/ml (within reference range); no further follow-up, staging or adjuvant treatment is reported.
- The authors attribute the virilization to intratumoral aromatase deficiency with androgen overproduction, citing the literature.
relevance_to_jgct: Adult (35-year-old) patient labelled juvenile-type GCT with virilizing presentation; the tumor was an incidental 30 mm node found at hysterectomy for fibroids.
