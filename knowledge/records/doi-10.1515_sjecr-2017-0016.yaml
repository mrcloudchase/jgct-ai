notes: Unusual age for the juvenile type (the authors cite juvenile type as usually under 30). Classification rests on a one-sentence histology statement; no immunohistochemistry, mitoses, FOXL2 or stage are given, so the juvenile label is unverified. Units for testosterone and haemoglobin appear garbled in the source (198 ng/ml; Hgb 36). Bilingual English/Serbian article; the DOI carries 2017 but the issue is 19(4), 2018.
