key_findings:
- Joint European Society of Gynaecological Oncology and European Society for Paediatric Oncology guidelines for adolescents and young adults aged 15 to 25 with non-epithelial ovarian cancers, including sex cord-stromal tumours.
- Developed by systematic literature review and critical appraisal by an international multidisciplinary group; fertility-sparing surgery and reduction of acute and long-term toxicity were important criteria.
- Reviewed before publication by 54 independent international practitioners.
relevance_to_jgct: Society guideline covering the adolescent/young adult age band of ovarian JGCT.
