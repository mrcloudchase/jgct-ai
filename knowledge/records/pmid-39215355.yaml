key_findings:
- Stathmin immunohistochemistry on tissue microarrays from 390 ovarian sex cord-stromal tumors, including 5 JGCT and 281 adult GCT.
- All JGCT (and all adult GCT, SLCT, SCST-NOS and Sertoli cell tumors) showed strong stathmin expression (over 50% of cells).
- Stathmin was not prognostic and not useful for differential diagnosis among difficult sex cord-stromal tumors; authors note a theoretical predictive role for chemotherapy response.
relevance_to_jgct: Shows stathmin is uniformly expressed in JGCT but does not distinguish it from other sex cord-stromal tumors.
