key_findings:
- 17-year-old Chinese girl, menarche at 14 with regular cycles, presented with 1 day of lower abdominal pain after defecation with nausea and vomiting; abdomen bulging, huge tender pelvic mass.
- 'Ultrasound: mixed echo mass about 152 x 112 mm; CT: mass about 122 x 106 mm in the pelvis; imaging showed suspected torsion but could not determine benign versus malignant.'
- 'Emergency laparotomy: left ovary purple-black, about 150 x 130 mm, smooth surface, twisted 720 degrees clockwise; detorsion and left ovarian cystectomy without capsule rupture.'
- 'Pathology: juvenile granulosa cell tumor with infarction. IHC: vimentin+, CD99+, CD56+, p53 focal+, Ki-67 20%; S-100, inhibin, CD34, calretinin and WT1 negative.'
- Authors state they found no previous reports of torsion of a granulosa cell tumor and conclude imaging was non-specific and diagnosis depended on pathology, advocating careful capsule protection and fertility-preserving surgery; they state a good prognosis with fertility preserved.
relevance_to_jgct: Giant JGCT presenting as ovarian torsion in a 17-year-old, with an unusual immunoprofile (inhibin and calretinin negative) and fertility-sparing surgery.
