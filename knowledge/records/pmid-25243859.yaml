key_findings:
- 'Model system: granulosa-cell deletion of Smad1 and Smad5 in mice causes metastatic granulosa cell tumors that phenocopy human JGCT (prior work by the same group).'
- Additional deletion of Smad4 (Smad1/5/4 triple knockout) gave sterile mice with significantly increased survival and delayed tumor development versus Smad1/5 double knockouts.
- The few tumors in triple knockouts were smaller, showed no metastasis, and had increased apoptosis.
- In the COV434 cell line (described by the authors as a human JGCT cell line), TGFbeta1 increased viability by inhibiting apoptosis via TGFbeta type I receptor-dependent repression of caspase activity and inhibition of PARP cleavage.
- Authors state the TGFbeta-SMAD2/3 pathway is active in JGCTs.
relevance_to_jgct: Model-system (mouse and cell line) evidence that TGFbeta-SMAD signaling promotes JGCT-like tumor growth by suppressing apoptosis. No patients studied.
