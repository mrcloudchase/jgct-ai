key_findings:
- Neonatal testicular JGCT with no genital ambiguity, anatomic abnormalities, or sex chromosome aneuploidy.
- Tumor stained positive for alpha-fetoprotein (most consistent with yolk sac tumor), but all clinical, gross, histologic and other immunohistologic features were consistent with JGCT.
- The AFP positivity remains unexplained.
relevance_to_jgct: 'Diagnostic pitfall: AFP immunopositivity in testicular JGCT, which could suggest yolk sac tumor.'
