key_findings:
- A 25-year-old with a bilobed solid-cystic ovarian JGCT showing a high mitotic index and necrosis had radical surgery and BEP, recurred within 6 months with widespread peritoneal and visceral metastases, and died within weeks of salvage chemotherapy.
- The authors contrast this course with the usually favorable prognosis in children.
relevance_to_jgct: A fatal adult-onset JGCT despite BEP; high mitotic index and necrosis preceded early relapse.
