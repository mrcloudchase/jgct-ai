key_findings:
- Ultrastructure and immunohistochemistry of seven testicular JGCTs in infants aged 1 day to 11 months.
- All tumors showed a mixture of spindle smooth-muscle and theca cells and polygonal granulosa cells; granulosa cell clusters invested by continuous basal lamina with smooth muscle-like filaments with dense bodies.
- Mitochondria had laminated cristae; tubulovesicular cristae characteristic of steroid-secreting cells were rare.
- Tumor cells stained focally for low-molecular-weight cytokeratins (8, 18, 19), smooth-muscle actin, desmin, and more noticeably vimentin.
- Dual epithelial-mesenchymal differentiation described as characteristic of infantile testicular JGCT.
relevance_to_jgct: Largest pre-2000 pathology series of infantile testicular JGCT (n=7).
