key_findings:
- A girl with Ollier disease diagnosed at 12 developed a secreting JGCT revealed by ascites some years later; the tumor was on the same side as the enchondromatosis.
- Five earlier cases of the association were known; the authors warn of recurrence of the ovarian tumor in the year after oophorectomy as well as chondrosarcomatous change.
relevance_to_jgct: Sixth reported Ollier-JGCT association, with the tumor ipsilateral to the enchondromas.
