key_findings:
- '11 testicular SCST in children, 6 Italian centers, 2000-2008: 4 Leydig, 4 juvenile granulosa cell tumors, 1 Sertoli, 2 other.'
- Orchiectomy with high ligation in 7, enucleation in 4; 10 stage I, 1 stage II.
- All patients in first complete remission (mean follow-up 59 months) after surgery alone; sparing surgery was a choice in selected cases.
relevance_to_jgct: Italian pediatric registry series of testicular SCST including JGCT, all cured by surgery.
