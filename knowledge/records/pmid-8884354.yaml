key_findings:
- Ovarian gynandroblastoma in a 15-year-old girl; predominant component was JGCT, with areas of adult GCT, Sertoli cell elements and heterologous intestinal-type glands.
- Juvenile and adult granulosa areas stained for inhibin and MIC2.
- Electron microscopy suggested granulosa and Sertoli components derive from a single cell of origin.
