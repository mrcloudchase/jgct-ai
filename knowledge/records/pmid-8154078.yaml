key_findings:
- 'Of 21 patients with disorders of sexual differentiation who had bilateral gonadectomy (1982 to 1990), 9 (44%) had gonadal tumors: 4 gonadoblastomas, 2 dysgerminomas, and one each teratocarcinoma, seminoma, cystadenofibroma and juvenile granulosa cell tumor; risk was highest in mixed and pure gonadal dysgenesis.'
relevance_to_jgct: JGCT among gonadal tumors in disorders of sex development.
