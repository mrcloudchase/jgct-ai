key_findings:
- Complicated fetal ovarian cyst with labial edema and ascites detected at 32 weeks of pregnancy; neonate had ambiguous genitalia with clitoromegaly.
- Oophorectomy showed JGCT FIGO Ia; karyotype mosaic 45,X/46,X mar(Y) in blood and tumor; later gonadal tissue showed testicular and dysplastic ovarian tissue.
- Elevated androgens attributed to the tumor.
relevance_to_jgct: Prenatally detected JGCT in a fetus with a disorder of sex development.
