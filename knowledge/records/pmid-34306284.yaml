notes: Adjuvant chemotherapy was given for stage IC disease but regimen is unspecified. The Discussion states juvenile GCT has 'an increased risk of recurrence compared with adult GCT', which differs from other sources in this repository that describe late recurrence as characteristic of adult GCT; this is the authors' statement. Follow-up duration beyond about 1.5 years is not given.
