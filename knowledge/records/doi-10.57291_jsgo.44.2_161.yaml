notes: 'Japanese with English synopsis, read in full. IMPORTANT: the authors diagnose the age-40 tumour as adult-type GCT lacking FOXL2 mutation; only the age-12 tumour (28 years earlier, slides re-reviewed) is called juvenile-type, so n_jgct_patients counts that tumour and it carries no stage, size, hormone or mitosis data. The authors'' own classification of the whole case is ''adult-type granulosa cell tumor, FOXL2-negative'' and they discuss late recurrence. Authors'' literature claims (JGCT 5% of GCTs, DICER1 in 5-10%) are theirs. Patient outcome after the age-12 treatment is not documented beyond the second tumour.'
