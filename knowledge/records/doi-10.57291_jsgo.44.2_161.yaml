key_findings:
- A 40-year-old woman (G5P3) had had an open left oophorectomy at age 12 for an ovarian tumour (28 years earlier; the outside hospital had discarded the paper chart) and the patient recalled about 3 months of inpatient infusions causing nausea, so chemotherapy was presumed.
- At 40 a right pelvic mass grew from 45 mm to 56 mm over 6 months; tumour markers were normal (LD 191 U/L, CA125 8 U/L, HE4 43.1 pmol/L, AFP 2.7 ng/mL) and estrogen was not measured. Surgery found a 15 mm lesion on the sigmoid mesocolon and a 50 mm mass on the right pelvic sidewall peritoneum adherent to the right ovary, so the operation became hysterectomy, right adnexectomy, left tubectomy and omentectomy.
- 'The age-40 tumour was judged adult-type granulosa cell tumour: Call-Exner bodies, coffee-bean nuclei, mitoses 3-5/HPF, calretinin positive, NCAM partly positive, inhibin positive; ascitic cytology showed atypical cells. She received DC therapy (regimen abbreviation not expanded in the text) for four courses and was recurrence-free at the time of writing.'
- The age-12 slide, recovered from the outside hospital, showed pseudopapillary growth, indistinct nuclear grooves and mildly eosinophilic cytoplasm, calretinin partly positive, NCAM and inhibin positive; it had been diagnosed juvenile-type GCT because of age 12, and the authors' hospital pathologist agreed.
- FOXL2 c.402C>G was not found in either specimen and DICER1 was not mutated in either. The authors conclude the age-40 tumour is an adult-type GCT lacking FOXL2 mutation and say FOXL2 negativity does not exclude adult-type GCT.
- 'The authors say two explanations remain: the age-12 tumour was a true JGCT and a new FOXL2-negative adult-type tumour arose at 40, or the age-12 tumour was a FOXL2-negative adult-type GCT that recurred 28 years later; they say the age-12 tumour was morphologically JGCT but possibly adult-type clinically, and that morphology, genetics and clinical course must be weighed together.'
relevance_to_jgct: Case where a morphologic JGCT at age 12 and an adult-type GCT at age 40 in the same patient were both FOXL2 and DICER1 negative; the authors assign adult type to the second tumour and leave the type of the first open.
