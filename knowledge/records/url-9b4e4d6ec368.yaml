key_findings:
- The thesis states that FOXL2 p.C134W is found in 95% of adult-type GCT and that no genetic marker was defined for JGCT.
- Using a global tumour characterisation and a candidate-gene approach aimed at the PI3K/AKT/mTOR pathway, the author found in-frame duplications in AKT1 in more than 60% of the JGCT samples.
- The mutant AKT1 proteins are enriched at the membrane, hyperphosphorylated and hyperactive, and give cells a 'hirsute' membrane phenotype.
- Point mutations that differ from tumour to tumour were also found; their activity, and why the duplications are specific to JGCT, remain to be determined.
- A second axis built a cell tool carrying wild-type or mutant FOXL2 at a fixed locus to test whether C134W alters DNA binding or partner interaction.
relevance_to_jgct: Doctoral thesis behind the AKT1 in-frame duplication finding in JGCT; the number of tumours is not given in the abstract.
