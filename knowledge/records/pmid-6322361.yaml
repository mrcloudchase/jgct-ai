key_findings:
- A young girl with a juvenile-type granulosa theca cell tumor presented with pain, vaginal bleeding, abdominal distension, breast enlargement and pubic and axillary hair, with both estrogenic and androgenic effects and overproduction of luteinizing hormone, described as unusual.
- Unilateral salpingo-oophorectomy is recommended; a recurrence many years after surgery had been reported, so long-term follow-up was planned.
relevance_to_jgct: 1984 South African case with combined estrogenic and androgenic signs.
