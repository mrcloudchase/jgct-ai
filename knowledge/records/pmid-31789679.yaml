key_findings:
- A 46-year-old's sex cord-stromal tumor NOS was composed predominantly of juvenile granulosa cell tumor histology with thecoma, adult granulosa, Sertoli, epithelioid and sarcomatoid components, and carried FOXL2 C134W, TP53 V172F and TERT promoter -124C>T mutations.
- It recurred rapidly with distant metastases that responded to 4 cycles of BEP.
relevance_to_jgct: JGCT-like morphology with a FOXL2 C134W mutation in an adult, illustrating the limits of morphology alone.
