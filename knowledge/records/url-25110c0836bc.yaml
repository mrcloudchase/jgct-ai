key_findings:
- A 3-year-old girl presented with rapidly progressive isosexual precocious puberty and a palpable hypogastric mass.
- Oestradiol was high, 17-OH-progesterone was 13.44 ng/ml, FSH and LH were suppressed and alpha-fetoprotein was normal; imaging confirmed a right ovarian mass.
- The right ovarian tumour (about 10-12 cm, solid, well delimited, granular surface) was removed together with the involved tube; histopathology showed juvenile granulosa cell tumour.
- After surgery the patient evolved satisfactorily with no signs of metastasis and hormone levels in the normal range.
relevance_to_jgct: Classic JGCT presentation with isosexual precocious puberty at age 3 in a Spanish-language report, treated by surgery alone.
