key_findings:
- Of 47 tumours first called granulosa cell tumours, 41 including both juvenile tumours were vimentin positive and keratin and EMA negative; 6 vimentin-negative, keratin- and EMA-positive tumours were reclassified as undifferentiated carcinomas with much worse survival; AFP, hCG, PLAP and hPL were negative in all.
relevance_to_jgct: Intermediate filament and EMA staining reclassifies carcinomas misdiagnosed as granulosa cell tumours.
