key_findings:
- 'Eleven girls aged 9 to 22 with ovarian small cell carcinoma of the hypercalcemic type in the German MAKEI studies and Kiel registry (1994 to 2005): 8 had been misdiagnosed as germ cell tumor or juvenile granulosa cell tumor before review; all 4 followed without adjuvant therapy relapsed at 3 to 11 months; 4 given high-dose chemotherapy in first complete remission stayed in remission 7 to 73 months; 5 of 11 alive without disease.'
relevance_to_jgct: SCCOHT is often first called JGCT; its management (multiagent and high-dose chemotherapy) differs sharply.
