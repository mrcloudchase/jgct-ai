key_findings:
- 'Review comparing sex cord-stromal tumors of ovary and testis: granulosa cell tumors in both gonads divide into adult and juvenile forms; the juvenile granulosa cell tumor of the testis tends to occur in the first 6 months of life and must be distinguished from yolk sac tumor, which occurs slightly later; sex cord tumors are EMA-negative and inhibin- and calretinin-positive, the converse of endometrioid carcinoma.'
relevance_to_jgct: Expert comparison of ovarian and testicular JGCT and the yolk sac differential.
