key_findings:
- A 20-year-old at 22 weeks 6 days of gestation presented with severe left lower quadrant pain from ovarian torsion caused by a 1157 g, 19 x 16 x 9 cm JGCT with hemorrhagic necrosis; after resection she went home on day 3 with a viable pregnancy.
- The authors describe it as the only reported JGCT presenting as torsion in pregnancy.
