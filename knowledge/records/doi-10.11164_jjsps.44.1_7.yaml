key_findings:
- 'Retrospective single-centre study (Kanagawa Children''s Medical Center, 1970-2005): 11 of 90 paediatric ovarian tumour operations (age 0-18 years) were bilateral, aged 10 days to 16 years (mean 11.4); 10 synchronous and 1 metachronous; 6 bilateral benign, 4 bilateral malignant, 1 benign plus malignant.'
- The pathology column of the cases table lists one 'juvenile granulosa cell tumor (malignant)' among the malignant diagnoses, with a unilateral right ovary preserved and chemotherapy in the same row run; the table is scrambled in the extracted text so which patient, her age, stage and fate cannot be assigned.
- 'Series context: no recurrences; one death (case 5, heart failure from doxorubicin); malignancy rate 22% (20/90) overall, 19% (15/79) unilateral, 45% (5/11) bilateral; no ovary was preserved in bilateral malignant cases (4); the authors suggest chemotherapy first for bilateral germ cell tumours. The paper says nothing further about JGCT in its text.'
relevance_to_jgct: Paediatric bilateral ovarian tumour series that includes one JGCT labelled malignant; the JGCT patient cannot be characterised from the legible text.
