key_findings:
- Case of an 11-year-old girl who developed a secondary juvenile granulosa cell tumor of the ovary eight years after treatment for stage III Wilms tumor.
- Initial Wilms tumor treatment included nephrectomy, chemotherapy, and radiation.
- The secondary tumor was identified through imaging and surgery; authors argue for extended follow-up of Wilms tumor survivors beyond the typical five-year surveillance period.
relevance_to_jgct: Preprint case of JGCT as a second neoplasm after treated Wilms tumor; note the title says 'germ cell tumor' while the abstract says juvenile granulosa cell tumor.
