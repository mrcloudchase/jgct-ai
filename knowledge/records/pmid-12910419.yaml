key_findings:
- 72 pediatric ovarian SCSTs over 20 years in the Kiel registry; JGCT (n=48) the most frequent subtype.
- FIGO Ia 39, Ic 17, II 3, III 1 (60 with complete data).
- JGCT mean mitotic activity 9.8 mitoses/10 HPF, significantly higher than other subtypes (2.7/10 HPF, P=0.001).
- Vimentin 52/52, cytokeratin 27/33, inhibin 19/20 positive.
- '10-year EFS 0.88 +/- 0.05 (38/43); <20 vs >=20 mitoses/10 HPF: EFS 1.0 vs 0.48 +/- 0.05 (P=0.0001).'
relevance_to_jgct: Pathology registry study first quantifying the >=20 mitoses/10 HPF threshold as prognostic in pediatric ovarian SCST (mostly JGCT).
