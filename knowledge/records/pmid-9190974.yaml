key_findings:
- 33 prospectively registered patients with ovarian JGCT; median age 7.6 years (range 6 months to 17.5 years).
- 14 patients had pseudo-precocious puberty; 1 had premenarcheal bleeding only; pelvic tumor or abdominal distention in 6, with signs of acute abdomen in 3.
- FIGO stage Ia 20, Ic 8, IIc 4, IIIc 1.
- All 33 underwent tumor resection and oophorectomy, complete in 28.
- Adjuvant combination chemotherapy in 1 FIGO Ia patient with high mitotic index and in 8 children with stage Ic to IIIc.
- After follow-up of 168 months, event-free survival was 0.75 +/- 0.07.
- Authors conclude cisplatin-based multidrug chemotherapy may be useful, especially in advanced stages.
relevance_to_jgct: Early prospective German cooperative-study cohort of pediatric ovarian JGCT; precursor of the MAKEI/STEP registry series.
