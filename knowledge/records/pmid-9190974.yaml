key_findings:
- Prospective German cooperative-study cohort of 33 pediatric ovarian JGCT, median age 7.6 years.
- 'FIGO stage Ia 20, Ic 8, IIc 4, IIIc 1; complete resection in 28.'
- Event-free survival 0.75 at 168 months of follow-up.
- Authors suggest cisplatin-based multidrug chemotherapy may improve results, particularly in advanced stages.
