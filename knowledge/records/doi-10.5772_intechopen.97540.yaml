key_findings:
- This review chapter states that ovarian sex cord-stromal tumours are about 8% of ovarian malignancies, of which granulosa cell tumours are about 90%.
- The authors state that approximately 30% of juvenile GCT contain a somatic gsp mutation and a further 60% have activating mutations or duplications in AKT.
- For adult GCT the authors describe FOXL2 C134W as present in the majority of tumours, arguably defining the disease, and a TERT promoter mutation as a driver of recurrence.
- SCSTs also occur in Peutz-Jeghers syndrome, Ollier disease and Maffucci syndrome, and DICER1 syndrome.
relevance_to_jgct: Review chapter summarising the mutation landscape of JGCT (gsp about 30%, AKT about 60%) alongside adult GCT.
