key_findings:
- Full-term male neonate (2,260 g) with massive scrotal mass; right testis showed a 6x6x4 cm multiseptate cystic mass with Swiss cheese appearance.
- Testosterone, beta-HCG and inhibin B normal; alpha-fetoprotein 35,350 ng/ml (described as physiologically elevated).
- High inguinal orchiectomy performed because hardly any testicular parenchyma remained.
- Authors state congenital granulosa cell tumors usually exhibit benign behavior in the neonatal period.
relevance_to_jgct: Neonatal cystic testicular JGCT; normal inhibin B at presentation.
