key_findings:
- Twenty-six adult and juvenile granulosa cell tumours expressed cytokeratins as well as vimentin, matching non-neoplastic granulosa cells of adult and fetal ovaries; thecomas and fibromas expressed vimentin only; both filaments also occur in some carcinomas, limiting diagnostic value.
