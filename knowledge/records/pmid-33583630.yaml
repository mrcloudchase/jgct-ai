key_findings:
- Italian multicentre MITO-9 analysis of 17 stage I ovarian JGCTs.
- Fertility-sparing surgery in 15 (88%), laparoscopic approach in 7 (41%); 2 received adjuvant chemotherapy.
- No recurrences at a median follow-up of 80 months.
- Authors conclude minimally invasive and fertility-sparing surgery appear safe in stage I, the role of cystectomy needs validation, and data do not seem to favor adjuvant chemotherapy over surveillance in stage I.
relevance_to_jgct: Supports fertility-sparing and minimally invasive surgery without routine adjuvant chemotherapy for stage I JGCT.
