key_findings:
- 17 stage I JGCT patients from the Italian MITO group, retrospective.
- Laparoscopic approach in 7 (41%), open in 10 (59%).
- 'Fertility-sparing surgery in 15 (88%): USO 11, cystectomy then USO 2, cystectomy alone 2. Adjuvant chemotherapy in 2.'
- After median follow-up of 80 months, no recurrences.
- Authors conclude minimally invasive surgery is safe in stage I JGCT, FSS can be chosen in most cases, and data do not seem to support adjuvant chemotherapy over surveillance in stage I.
relevance_to_jgct: Multicentre series supporting fertility-sparing and minimally invasive surgery for stage I ovarian JGCT.
