key_findings:
- Bilateral cystic ovarian JGCT in a 4-month-old infant from a consanguineous pregnancy with poor growth, relative microcephaly, facial asymmetry and malformed left ear.
- No abnormal endocrine activity; serum alpha-fetoprotein mildly elevated (AFP not found in tumor by immunoperoxidase).
- No recurrence during 16-month follow-up; serial AFP in reference range.
- Comparison with two prior bilateral cases suggests bilateral JGCT occurs in young infants and is amenable to conservative therapy.
relevance_to_jgct: Bilateral infantile JGCT with dysmorphism (possible syndromic association).
