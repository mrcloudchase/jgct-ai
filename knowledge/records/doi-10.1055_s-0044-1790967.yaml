key_findings:
- A 28-year-old woman with a history of polycystic ovaries, metabolic syndrome and laparoscopy for torsion of the left ovary presented with a suspected malignant ovarian tumour and incipient abdominal compartment syndrome; ultrasound showed a multicystic-solid tumour up to 25 cm without ascites or hydronephrosis.
- CA-125 was 251 kU/L and AMH above 23 ug/L; staging CT showed no evidence of metastasis.
- At laparotomy a tumour conglomerate of both adnexa and uterus adherent to both pelvic walls, omentum and sigmoid colon, with peritoneal carcinomatosis, was found; frozen section suggested a sex cord tumour, and total hysterectomy, bilateral adnexectomy, omentectomy and resection of peritoneal deposits achieved macroscopic tumour freedom.
- 'Final histology: malignant juvenile granulosa cell tumour, pT3b, L0, V0, Pn0, involving both adnexa, pelvic peritoneum and omentum; no FOXL2 or DICER1 mutation was found.'
- Adjuvant platinum-based combination chemotherapy was recommended (6 cycles carboplatin/paclitaxel, to start 4 weeks after surgery), with bone-health follow-up and gynaecological oncology aftercare; hormone replacement was discussed with weighing of risks.
- Outcome and follow-up length are not reported.
relevance_to_jgct: Advanced (pT3b) adult-age JGCT without FOXL2 mutation (and without DICER1 mutation), treated with complete debulking and recommended adjuvant carboplatin/paclitaxel.
