notes: 'Review pooling published series and case reports; patient overlap with the included primary reports (e.g. Lee 2011, Bergamini 2021 MITO-9, Wu 2016, Zhao 2019, Powell 2014) is certain. Internal inconsistency: Table 1 lists 10 JGCT patients from Lee 2011 with 4 pregnancies, whereas Lee et al. report 11 JGCT; the abstract gives adult-type pregnancy rate as 28.5% and the discussion as 28/98 (28.6%). The full text was a publisher PDF from an institutional repository.'
