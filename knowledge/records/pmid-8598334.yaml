key_findings:
- Interphase FISH on 19 ovarian granulosa cell tumors (17 adult, 2 juvenile) showed trisomy 12 in 12 of 19 (63%), usually in a minority of nuclei; trisomy 17 in one and trisomy X in two.
- Trisomy 12 is a common but not defining anomaly of granulosa cell tumors.
relevance_to_jgct: Early cytogenetic study including 2 JGCT; trisomy 12 common across GCT.
