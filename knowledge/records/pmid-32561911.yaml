key_findings:
- '7 JGCT cases: abdominal distension and pain (5), precocious puberty (1), pelvic mass (1); stage I in 6, stage IV in 1.'
- 'Rare patterns: reticular-cystic mimicking yolk sac tumor (2), sclerosing-stromal-like (1), pseudopapillary (2), spindle, microcystic, hobnail, rhabdomyoid cells.'
- No FOXL2 mutation encountered.
- After median 53 months, only 1 patient, with a strongly diffuse TP53-positive tumor, died of disease; 2 had babies.
relevance_to_jgct: Pathology series documenting JGCT morphologic mimics and a fatal TP53-positive case.
