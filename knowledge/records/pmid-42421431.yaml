key_findings:
- Expert pathology group (TESST, GUPS/ISUP) proposes a hierarchical classification of testicular sex cord-stromal tumours (group, category, entity, histological pattern).
- '''Juvenile granulosa cell tumour'' of the testis is renamed ''benign juvenile granulosa cell tumour''.'
- 'Rationale: unlike ovarian JGCT, testicular tumours are largely infantile (>90% occur within the first year of life), hormonally inactive and have not been reported in adult patients.'
- Molecular alterations described in ovarian JGCT have not been identified in testicular counterparts, which instead show monosomy 10 as a recurrent finding (~60%).
- Testicular JGCTs appear to be invariably indolent and cured by surgical resection; authors state they do not require aggressive treatment or long-term follow-up after complete resection.
- Authors note a subset of ovarian JGCTs shows malignant clinical behaviour, so shared terminology may lead to overtreatment of testicular cases.
relevance_to_jgct: Expert consensus classification formally separating testicular JGCT (benign, infantile, monosomy 10) from ovarian JGCT.
