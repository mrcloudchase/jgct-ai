key_findings:
- Testicular JGCT of an infant showed follicles, cysts and solid nodules with an inner layer of polyhedral cells expressing cytokeratin and vimentin.
- Outer layer of spindle cells reacted to muscle-specific actin, vimentin, and focally desmin; compared with 6 normal infantile testes and 6 ovaries.
- Authors favor origin from primitive gonadal stromal cell with bidirectional epithelial-like and smooth muscle-like differentiation; possibility of immature Sertoli and peritubular myoid cells discussed.
