key_findings:
- 'Review of ovarian sex cord-stromal tumours and their mimics: diagnostically challenging juvenile granulosa cell tumour variants include those with a macronodular pattern and scant follicular differentiation, those with marked sclerosis, and those that are unusually pleomorphic; adult granulosa cell tumour may simulate endometrioid carcinoma; the luteinised thecoma with sclerosing peritonitis shows brisk mitoses without metastatic potential.'
relevance_to_jgct: Names the three JGCT variants most likely to be misdiagnosed.
