key_findings:
- Of 22 granulosa cell tumor patients in Szczecin, 4 had juvenile tumors at ages 4 to 7, all treated with sparing surgery; the 4-year-old with atypia and many mitoses received chemotherapy and died 18 months after diagnosis of a dynamic recurrence; the other 3 were alive without disease, one followed 36 years; adult-type recurrences came at a mean 11.7 years; inhibin B tracked disease status (Polish).
relevance_to_jgct: Early fatal relapse of a mitotically active JGCT versus very long disease-free survival in three others.
