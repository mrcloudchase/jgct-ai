key_findings:
- 9-month-old girl with bloody vaginal secretions, bilateral breast enlargement (Tanner 2) and fine pubic hair; bone age 1.8 years (+4.3 SDS).
- 'Labs: estradiol 1091 pmol/l, AMH >1714.0 pmol/l, inhibin A 385 pg/ml, inhibin B 3805 pg/ml, AFP 6 kIU/l, LH and FSH suppressed.'
- Left salpingo-oophorectomy; 75 g encapsulated mass 100 x 50 x 40 mm; histopathology GCT, juvenile type, stage pT1a; inhibin A positive.
- No chemotherapy or radiation; at 1 month estradiol 62 pmol/l and AMH 9 pmol/l.
relevance_to_jgct: Infant JGCT case documenting very high inhibin B and AMH at diagnosis with normalization after surgery.
