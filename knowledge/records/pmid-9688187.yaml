- 'Inhibin-alpha immunostaining in 203 ovarian lesions: present in all 10 primary juvenile granulosa cell tumors plus 1 metastatic, all 14 adult tumors, most thecomas and sex cord tumors, and absent from 12 small cell carcinomas of hypercalcemic type, 24 germ cell tumors and 17 carcinomas; inhibin negativity does not exclude a sex cord tumor.'
