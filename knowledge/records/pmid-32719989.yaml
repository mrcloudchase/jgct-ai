title: 'Risk factors and treatment outcomes of 239 patients with testicular granulosa cell tumors: a systematic review of published case series data.'
journal: Journal of Cancer Research and Clinical Oncology
year: 2020
first_author: Grogg J
study_type: review
tumor_site: testis
n_jgct_patients: 166
age_range: Juvenile tGrCT mean 1.5 years (SD 5), single reports at 27 and 34 years
