key_findings:
- A 23-year-old woman with abdominal pain had a right ovarian cyst excised; pathology was first reported as a malignant mixed germ cell tumour. Three weeks later she had emergency surgery for a 5 cm right ovary twisted twice.
- At the second operation (right salpingo-oophorectomy, bilateral pelvic and para-aortic lymphadenectomy, omental biopsy, left ovarian biopsy, washings) all nodes were reactive and omentum and washings tumour-free. Two centres could not distinguish endometrial stromal sarcoma, JGCT and rhabdomyosarcoma, so the exact stage could not be given.
- On review at the authors' centre the tumour had cystic and solid areas of small and medium cells in a myxoid stroma with scattered multinucleated giant cells and frequent mitoses. It was diffusely WT-1 positive with focal paranuclear desmin, and negative for inhibin, calretinin, PLAP, EMA, pan-cytokeratin, MyoD1, myogenin, CD99, LCA, caldesmon and actin; on these results JGCT was diagnosed.
- Two months after surgery MRI and PET-CT showed coalescing intra-abdominal recurrent masses up to 12 cm (largest conglomerate at the pelvic inlet 8.5 cm, SUVmax 9.76); the authors stage the relapse as IIIC.
- After three cycles of BEP her pain and distension improved and CA125 fell from 106 to 22 U/ml, though MRI showed the masses slightly larger (12 cm). After a fourth cycle she underwent debulking with the left ovary and uterus preserved; residual tumour with extensive chemotherapy effect was found in bladder, sigmoid, rectum, omentum and right ovarian vessel and ureter regions, and 0 of 15 nodes; an LHRH analogue was started as adjuvant therapy.
- The authors call the tumour stage IA at diagnosis and state that they found no early-stage JGCT in the literature that relapsed this soon; they cite earliest relapses of 3 months (Zaloudek and Norris), 6 months (Vassal) and 7 months (Young).
relevance_to_jgct: Adult JGCT diagnosis made on an inhibin- and calretinin-negative tumour after a differential with endometrial stromal sarcoma and rhabdomyosarcoma; relapse 2 months after surgery treated with BEP, debulking and an LHRH analogue.
