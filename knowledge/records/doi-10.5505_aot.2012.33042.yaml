notes: 'Turkish, read in full. The JGCT diagnosis is doubtful by current criteria: inhibin and calretinin were negative, the first pathology was a mixed germ cell tumour, and two centres could not separate ESS, JGCT and rhabdomyosarcoma. The first operation was a cystectomy, so ''stage IA'' rests on the second operation. Outcome after debulking not reported. Treat as classification-uncertain.'
