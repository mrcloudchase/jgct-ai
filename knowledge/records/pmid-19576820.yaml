key_findings:
- 10-month-old infant presented with both premature thelarche and adrenarche due to JGCT.
- Laboratory evaluation showed elevation of estradiol and inhibin B, and less classic elevation of total and free testosterone.
- Oophorectomy and staging gave a diagnosis of Stage IA JGCT.
- Review states survival rates are >95% among patients diagnosed under 10 years of age; recurrence is rare but can occur as late as 48 months.
- Authors advise surveillance even for Stage IA with serial inhibin B and intermittent imaging.
relevance_to_jgct: Infant JGCT with mixed estrogenic/androgenic presentation; inhibin B as surveillance marker.
