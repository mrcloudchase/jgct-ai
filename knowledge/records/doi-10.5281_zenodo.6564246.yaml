notes: 'Language read: Spanish; extraction has odd line breaks. The English abstract wrongly says ''ophthalmectomy'' for oophorectomy. This Zenodo deposit (record 6564247) is a copy of the journal article Rev Inf Cient 2020;99(5):478-486, which the Mexican case report in doi:10.62954/t96nbw45 cites; no other record of it is in the base. Stage is not stated and the paper does not say whether chemotherapy was given. Hormonal activity (precocious puberty, oestrogen) was not documented, which is unusual for JGCT; ''juvenile'' rests on the pathologist''s report.'
