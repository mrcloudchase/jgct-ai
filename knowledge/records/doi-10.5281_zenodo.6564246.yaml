key_findings:
- A 14-year-old girl in Guantanamo, Cuba, with no relevant history had gradual enlargement of the whole abdomen over a year (faster in the last 6 months) and, a month before admission, sudden moderate diffuse abdominal pain.
- A firm, round, poorly mobile, non-tender mass was visible and palpable in the lower abdomen, lateralised to the left; ultrasound showed a heterogeneous echogenic mass of 145 x 83 mm and CT a 152 x 92 mm pelvic mass with central necrosis and no calcification; uterus was normal; beta-hCG was 9.4 mIU/mL ('doubtful range') and AFP 4.54 IU/mL (normal); thyroid ultrasound showed mild heterogeneity.
- Left oophorectomy found a 13 cm tumour with intact smooth capsule, not adherent to other structures, with normal uterus and right ovary and no lymph node enlargement.
- 'Pathology: 13 x 7 cm tumour, more than 90% solid with variably sized cysts; microscopically nests and cords with nuclear variability, more than five atypical mitoses per high-power field, extensive necrosis and haemorrhage, minimal vascular invasion, no capsular infiltration, and structures resembling Call-Exner bodies.'
- She was transferred to paediatric oncology (treatment not described) and postoperative markers fell (beta-hCG 6.7 mIU/mL, AFP 3.53 IU/mL); thyroid changes were followed with favourable evolution.
- No stage, immunohistochemistry, hormone levels (oestradiol, inhibin) or follow-up duration is reported; the discussion (literature-based) says presentation with abdominal enlargement is generally stage II or III.
relevance_to_jgct: Case of a 14-year-old with a 13 cm ovarian JGCT with high mitotic activity (>5 atypical mitoses per HPF), necrosis and minimal vascular invasion, treated by oophorectomy and referred to oncology; no stage or outcome beyond falling markers.
