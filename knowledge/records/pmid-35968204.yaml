key_findings:
- Female infant with Ollier's disease (multiple enchondromas of lower limbs and right upper limb) and triple X syndrome (47 XXX) detected on fetal karyotype; born preterm at 32 weeks.
- At 18 months sudden progressive ascites; large multilocular solid-cystic abdominal mass.
- Laparotomy; histology irregular cells in myxoid background with basophilic secretions and high mitotic count; tumor expressed cytokeratin, calretinin, ki-67, inhibin, and WT1; diagnosis ovarian JGCT.
- Authors report the association of triple X syndrome with Ollier's disease and JGCT for the first time.
relevance_to_jgct: Adds triple X syndrome to the reported constitutional associations of JGCT, alongside Ollier disease.
