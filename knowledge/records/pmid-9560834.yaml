key_findings:
- 'Emil Novak Ovarian Tumor Registry: 17 children aged 12 or under with granulosa or theca cell tumors, including 6 juvenile and 5 adult-type granulosa cell tumors; precocious pseudopuberty in 70%, abdominal pain in 24%, ascites in 18%.'
- A literature review of 163 granulosa cell tumors in children (juvenile type included) gave a tumor-related mortality of 9%; prognosis is good, particularly with precocious puberty, and treatment can be conservative.
relevance_to_jgct: Registry and literature review of childhood granulosa cell tumors with a 9% mortality figure.
