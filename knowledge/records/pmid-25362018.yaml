key_findings:
- Four girls with precocious pseudopuberty had low basal and GnRH-stimulated FSH and LH with high estradiol; ultrasound showed an ovarian cyst in three and a juvenile granulosa cell tumour in one, which was removed surgically; pubertal signs regressed in all.
relevance_to_jgct: GnRH stimulation, bone age and ultrasound separate JGCT-driven pseudopuberty from central puberty.
