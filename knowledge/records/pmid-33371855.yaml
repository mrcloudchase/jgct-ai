key_findings:
- 'MRI series of 4 granulosa cell tumors (3 adult, 1 juvenile): heterogeneous solid-cystic masses in 3 and a multiseptated cystic mass in 1, all ovoid or round with smooth margins; T1 hyperintensity not suppressed on fat saturation in 3, representing hemorrhage; one patient had bone and one liver metastases.'
