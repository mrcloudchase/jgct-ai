key_findings:
- Observational registry, sponsor Children's Hospitals and Clinics of Minnesota; status RECRUITING; start 2016-12-06; estimated completion 2036-12-06; estimated enrollment 3400; ages 0 minutes to 100 years.
- Inclusion includes 'Known or suspected sex-cord stromal tumor including Sertoli-Leydig cell tumor and gynandroblastoma (males or females)' and individuals with known or suspected DICER1 pathogenic variation.
- 'Primary outcome: event-free survival.'
- Registry entry lists 33 reference PMIDs, including GeneReviews (24761742) and 33760357.
relevance_to_jgct: Companion registry to the International OTST Registry (NCT01970696); enrolls sex cord-stromal tumors including JGCT-component tumors and DICER1 carriers, and is a source of registry JGCT reports.
