key_findings:
- 7-year-old girl with 18 months of progressive breast development, menarche 1 year earlier, Tanner IV breast and III pubic hair.
- Serum estradiol 414 pg/ml with FSH <1 IU/L; bone age 8.5 years at chronological age 7 years 2 months; 6 x 7 x 9 cm right adnexal mass; beta-HCG, CEA, AFP negative; inhibin not measured.
- Presented with ovarian torsion before planned surgery; emergency laparotomy and right salpingo-oophorectomy.
- Encapsulated 450-gram tumor without capsular breach; histology noted nuclear grooving and extensive luteinisation; FIGO Stage IA.
- Breast size regressed, bleeding stopped, estradiol normalized; no recurrence after 3 and half years.
relevance_to_jgct: Classic isosexual precocity from stage IA JGCT, complicated by torsion, with no recurrence at 3.5 years after surgery alone.
