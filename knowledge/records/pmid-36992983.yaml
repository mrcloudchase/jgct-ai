key_findings:
- 33 y.o. gravida 3, para 1 with an 8 cm left ovarian mass at 22 weeks gestation, initially misdiagnosed as degenerating fibroid; MRI showed 15 cm mass with ascites and omental implants.
- Pre-op inhibin B elevated; exploratory laparotomy, left salpingo-oophorectomy, omental biopsy, small bowel resection at 25 weeks; ruptured tumor and metastases; cytoreduction to R0; JGCT FIGO stage IIIB.
- Chemotherapy delayed until after delivery with monthly MRI surveillance; vaginal delivery at 37 weeks.
- 3 cycles of bleomycin, etoposide, and cisplatin starting six weeks postpartum.
- No evidence of recurrent disease at last contact over five years after diagnosis.
- Authors state 3% of JGCTs are diagnosed after age 30 and 90% are stage I at diagnosis.
relevance_to_jgct: Advanced-stage (IIIB) JGCT in pregnancy with long disease-free survival after R0 surgery and postpartum BEP.
