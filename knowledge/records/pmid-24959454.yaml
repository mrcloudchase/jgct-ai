notes: No testosterone or inhibin measurements, no staging statement and no follow-up duration reported; diagnosis rests on morphology alone. The paper's discussion calls the adult type 'Adult juvenile granulosa cell tumour (AGCT)', a wording slip. Age 17 is at the upper edge of 'juvenile'.
