key_findings:
- A girl aged 2 years 8 months (Pune, India) presented with thelarche; her bone age matched her chronological age, which the authors read as peripheral precocious puberty.
- Ultrasound showed a solid pelvic mass, probably right ovarian; MRI confirmed it and showed multiple bone lesions in the right hemipelvis, on the same side as the tumour.
- Histopathology showed JGCT in the pelvic mass and multiple enchondromas in the bone lesions (Ollier disease).
- The poster's teaching point is that the bone lesions should not be mistaken for metastases; the authors suggest that ipsilateral hemiskeletal distribution may point to a generalised mesodermal dysplasia.
- The authors state that their literature review found 11 previous JGCT cases with enchondromatosis, three with Maffucci syndrome and the rest with Ollier disease.
relevance_to_jgct: Imaging poster of a toddler with JGCT and ipsilateral enchondromas (Ollier disease), warning that enchondromas can mimic bone metastases on staging MRI.
