key_findings:
- 71-year-old woman with right upper quadrant abdominal pain; 13-cm multilocular cystic mass in the right ovary.
- Total abdominal hysterectomy with bilateral salpingo-oophorectomy.
- Solid component showed both Sertoli-Leydig cell and juvenile granulosa cell differentiation, diagnosed as gynandroblastoma.
- Authors state only six cases of gynandroblastoma with a JGCT component had been reported in the English literature; this is the first in an elderly patient.
relevance_to_jgct: Rare mixed sex cord-stromal tumor containing a JGCT component, here in a postmenopausal woman; relevant to the morphologic spectrum of JGCT.
