notes: 'Not a pure JGCT: mixed gynandroblastoma (40% JGCT, 60% Sertoli-Leydig). Internal inconsistencies: abstract says right upper quadrant pain while case text says right lower quadrant; follow-up is stated as two years and as 26 months. Figure legend for Fig 3 describes nuclei as lacking grooves ''characteristic of adult GCT'' (wording appears reversed). The molecular statements (gsp 30%, AKT1 60%) are the authors'' citations, not their own data.'
