title: Biallelic MAD2L1BP (p31comet) mutation is associated with mosaic aneuploidy and juvenile granulosa cell tumors.
journal: JCI insight
year: 2023
first_author: Abdel-Salam GMH
study_type: genomic
tumor_site: both
n_jgct_patients: 2
age_range: ovarian JGCT surgery at 14 months; testicular JGCT orchiectomy at 11 months
alterations:
- gene: MAD2L1BP
  alteration: homozygous nonsense NM_014628.3:c.757C>T p.(Arg253*) (R253*)
  frequency: 2/2 siblings with JGCT (family 1)
  notes: Germline; consanguineous Egyptian parents (first cousins); gnomAD allele frequency 3/248,598, no homozygotes; hypomorphic with partial NMD and residual unstable truncated protein
- gene: MAD2L1BP
  alteration: homozygous nonsense c.679C>T p.(Arg227*) (R227*)
  frequency: 1 patient (family 2), no tumor
  notes: Boy with microcephaly, epileptic encephalopathy, low-level aneuploidy (10% of 200 metaphases), died at 23 months
- gene: MAD2L1BP
