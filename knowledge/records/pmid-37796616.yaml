key_findings:
- Homozygous MAD2L1BP nonsense variant R253* in 2 siblings with microcephaly, epileptic encephalopathy, and juvenile granulosa cell tumors of ovary and testis.
- Patient cells showed high-grade mosaic variegated aneuploidy; truncated p31comet was defective in Trip13, Mad2 and Rev7 binding and in SAC silencing and HDR.
- Links human p31comet mutations to aneuploidy and tumor predisposition.
relevance_to_jgct: Describes a germline recessive predisposition (MAD2L1BP) for JGCT.
