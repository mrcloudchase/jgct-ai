key_findings:
- Homozygous MAD2L1BP nonsense variant R253* in 2 siblings of consanguineous Egyptian parents with microcephaly, brain malformations, seizures, developmental delay and JGCT of the ovary (girl, surgery at 14 months, then tamoxifen for 12 months, complete remission) and testis (boy, radical orchiectomy at 11 months).
- Both siblings had high-grade mosaic variegated aneuploidy in lymphocytes and fibroblasts; a second family's boy with homozygous R227* had moderate aneuploidy (10% of cells), no tumor, and died at 23 months.
- No MAD2L1BP mutations in 23 unrelated nonsyndromic patients with sporadic JGCT (1 testicular, 22 ovarian; age at diagnosis 1 month to 22 years).
- Sibling tumors had low TMB and were microsatellite stable, with no specific mutational signature; truncated p31comet was defective in Trip13 binding, SAC silencing and HDR, and lost interaction with tp53.
- No history of aggregated tumor incidence in either family, so no indication of elevated tumor risk for heterozygous carriers.
relevance_to_jgct: Describes a germline autosomal recessive predisposition (biallelic MAD2L1BP, mosaic variegated aneuploidy) for infantile ovarian and testicular JGCT; not found in sporadic JGCT.
