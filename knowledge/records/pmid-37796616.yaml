title: Biallelic MAD2L1BP (p31comet) mutation is associated with mosaic aneuploidy and juvenile granulosa cell tumors
journal: JCI Insight
year: 2023
first_author: Abdel-Salam GMH
study_type: case_series
n_jgct_patients: 2
age_range: null
alterations:
- gene: MAD2L1BP
  alteration: homozygous germline p.R253* nonsense
  frequency: 2 siblings
  notes: Both siblings had JGCT (ovary and testis), microcephaly, epileptic encephalopathy and high-grade mosaic variegated aneuploidy
- gene: MAD2L1BP
  alteration: homozygous p.R227* truncation
  frequency: 1 patient
  notes: Early-deceased patient with low-level aneuploidy and epileptic encephalopathy; JGCT not reported
treatments: []
presentation:
- microcephaly and epileptic encephalopathy (syndromic)
key_findings:
- Two siblings homozygous for MAD2L1BP R253* had mosaic variegated aneuploidy, microcephaly, epileptic encephalopathy and JGCT of the ovary and testis.
- The truncated p31comet protein failed to bind Trip13, Mad2 and Rev7, could not support spindle assembly checkpoint silencing or homology-directed repair, and lost an interaction with TP53.
- Authors conclude human p31comet mutations are linked to aneuploidy and tumor predisposition.
relevance_to_jgct: Identifies biallelic germline MAD2L1BP loss as a rare JGCT predisposition syndrome affecting both ovarian and testicular JGCT.
