key_findings:
- 'International PPB/DICER1 Registry, International Ovarian and Testicular Stromal Tumor Registry and NCI DICER1 study: 713 participants with a germline DICER1 P/LP variant from 38 countries.'
- Authors state that although SLCT is the most common ovarian tumor with germline DICER1 P/LP variants, other ovarian tumors including DICER1-related ovarian sarcoma and JGCT have been reported.
- Table 2 lists 'Ovarian juvenile granulosa cell tumor (especially if anaplasia and/or high mitotic index)' as an indication for germline DICER1 testing.
- For SLCT, JGCT, and sarcomas, stage at diagnosis is stated to impact both treatment and prognosis.
- 103 individuals with germline P/LP variants developed ovarian SLCT at median age 14 years; 13% before 8 years of age; Registry now recommends pelvic ultrasound every 6 months beginning at detection of a germline DICER1 P/LP variant.
relevance_to_jgct: Registry surveillance guidance that names JGCT (especially with anaplasia or high mitotic index) as an indication for germline DICER1 testing.
