key_findings:
- Four XP-C patients aged 11 to 19 developed five early-onset gynecological tumors, including one ovarian JGCT in a 19-year-old who also had a poorly differentiated stage IA Sertoli-Leydig cell tumor.
- Tumors carried somatic DICER1 mutations; XP-C ovarian tumors had 4.4 times more single base substitutions than sporadic tissue-matched cancers, with an XP-C-specific signature.
- Authors recommend considering XP-C status in prevention and treatment and avoided chemotherapy, which is toxic in XP patients.
relevance_to_jgct: Identifies xeroderma pigmentosum group C as a possible predisposition context for JGCT, with treatment implications because chemotherapy is toxic in XP.
