notes: 'Discrepancies inside the paper: the text states FIGO stage IC2 for the JGCT while the abstract does not name a stage for it; the abstract says 13 years for the IC1 SLCT patient whereas tumor diagnosis was at 11 (13 is her age at reporting). Table 1 lists ''progression after 4 cycles chemo'' for the JGCT, but text describes paclitaxel without serious adverse events and gives no explicit response assessment. Which tumor (JGCT or SLCT) carried each DICER1 variant is shown only in a figure not readable in the text. Journal and first author not in cached text.'
