key_findings:
- 32-year-old woman with hyperandrogenism and concurrent ovarian and renal masses.
- Ovarian mass was gynandroblastoma with 45% juvenile granulosa cell tumor and 55% intermediately differentiated Sertoli-Leydig tumor.
- Renal mass was conventional clear cell renal cell carcinoma.
- Authors state concurrent gynandroblastoma with another malignant neoplasm had not been reported.
relevance_to_jgct: Mixed tumor with substantial JGCT component, with a concurrent renal cell carcinoma.
