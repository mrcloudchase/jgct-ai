key_findings:
- Four ovarian SCSTs in patients with proven or likely germline DICER1 mutations (3 from one family).
- Three tumors showed sertoliform, juvenile granulosa cell tumor-like, and unclassifiable elements; all positive for SF-1 and FOXL2.
- Suggests germline DICER1-associated SLCT may show admixed Sertoli and JGCT-like features.
relevance_to_jgct: Shows JGCT-like morphology within DICER1-associated Sertoli-Leydig tumors, a diagnostic pitfall.
