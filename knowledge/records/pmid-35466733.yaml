key_findings:
- A 75-year-old with Peutz-Jeghers syndrome had a gastric-phenotype mucinous carcinoma of the fallopian tube with ovarian involvement; one daughter with confirmed Peutz-Jeghers syndrome had tubal mucinous metaplasia, and another daughter, without a genetic diagnosis, died of an ovarian juvenile granulosa cell tumor.
relevance_to_jgct: A fatal JGCT in the daughter of a Peutz-Jeghers family, without confirmed STK11 status.
