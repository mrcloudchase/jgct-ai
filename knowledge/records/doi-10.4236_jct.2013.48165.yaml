notes: 'Text is internally inconsistent about timing: abstract says relapse after chemotherapy; discussion says surgery twice and 5 courses of BEP; stage IIIC is given at relapse, not at initial diagnosis, although the abstract says diagnosed at IIIC. The authors'' background statement that juvenile type has poor prognosis compared with adult type contrasts with other sources.'
