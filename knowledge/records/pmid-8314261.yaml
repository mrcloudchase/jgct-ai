key_findings:
- 'Immunophenotype of 52 granulosa cell tumors including 5 juvenile: cytokeratin AE1/AE3 in 32.7%, EMA in none, vimentin in 100%, desmin none, smooth muscle actin 92.3%, S-100 in 50%; absence of EMA and presence of actin distinguish granulosa cell tumors from carcinomas, and S-100 from Sertoli-stromal tumors.'
relevance_to_jgct: EMA negativity has diagnostic value for JGCT against carcinoma mimics.
