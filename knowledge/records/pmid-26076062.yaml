key_findings:
- 70 testicular JGCTs; patients 30 weeks gestational age to 10 years; 60 of 67 (90%) aged 6 months or younger.
- 62 gonadectomy, 6 wedge excision, 2 biopsy only. Six in undescended testis, 2 in dysgenetic gonads.
- 'Presentation: testicular mass (65%), enlarging testis (25%); 6 of 14 had elevated serum AFP, likely physiologic; 1 gynecomastia.'
- Tumors 0.5 to 5 cm (median 1.5 cm); about 2/3 had a cystic component.
- 'Immunohistochemistry: inhibin 16/18, calretinin 8/9, WT1 6/7, FOXL2 12/12, SF-1 12/12, SOX9 6/11 positive; SALL4 and glypican-3 consistently negative; 1 of 10 focally AFP positive.'
relevance_to_jgct: Largest pathology series of testicular JGCT, defining morphologic spectrum and immunoprofile.
