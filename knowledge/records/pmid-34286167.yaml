key_findings:
- 15-year-old girl with secondary oligomenorrhea; suppressed LH and FSH, estradiol 1074 pg/mL (immunoassay), inhibin B >4325 pg/mL, prolactin 56.67 ng/mL, low IGF-I.
- 12-cm heterogeneous right adnexal mass; MRI/PET showed bone lesions initially concerning for metastases but pattern characteristic of polyostotic fibrous dysplasia (McCune-Albright syndrome).
- Right salpingo-oophorectomy; 14.5 cm JGCT (inhibin, calretinin, SF1 positive); rupture noted, staged FIGO Ic2.
- 'Targeted NGS (447 genes): GNAS c.601C>T (p.R201C) in 42% of 478 reads, no other tier 1-3 mutations or copy number variants; same variant in tibial bone biopsy; wild-type in peripheral blood.'
- 4 cycles of bleomycin, cisplatin, and etoposide; hormones normalized; in remission 16 months after therapy.
- First report of the same GNAS mutation in both JGCT and MAS tissue in one patient; authors question whether MAS patients should be surveilled for JGCT and vice versa.
relevance_to_jgct: Direct molecular evidence linking McCune-Albright syndrome mosaic GNAS mutation with JGCT; relevant to germline/syndromic evaluation and surveillance.
