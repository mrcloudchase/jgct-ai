key_findings:
- 'Molecular profiling of 50 problematic ovarian sex cord-stromal tumours: 16 of 17 adult granulosa cell tumours had a FOXL2 variant, all 6 Sertoli-Leydig cell tumours had DICER1 hotspot variants, and 4 tumours classified as JGCT included one with a GNAS variant.'
- All 8 unclassified tumours were FOXL2-negative; TP53 variants accompanied high-grade transformation in one AGCT and one SLCT.
relevance_to_jgct: GNAS variant in 1 of 4 JGCT in a consultation series; molecular analysis changed some provisional diagnoses.
