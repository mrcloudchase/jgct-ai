key_findings:
- Testicular JGCT in the left abdominal testis of a 7-month-old infant with 45,X/46,XY karyotype and ambiguous genitalia.
- Preoperatively testosterone and estradiol rose after hCG and hMG respectively, suggesting functional testicular and ovarian elements.
- Some tumor cells immunoreactive for estradiol; right gonad was a streak gonad.
- Described as the fifth reported testicular JGCT with abnormal sex chromosomes and first with functional granulosa cell characteristics.
