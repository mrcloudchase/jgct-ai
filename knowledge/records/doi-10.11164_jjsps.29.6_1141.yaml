key_findings:
- A girl aged 3 years 3 months had vaginal discharge from 3 years 2 months, then vaginal bleeding and breast enlargement; height 101.3 cm (+1.93 SD), weight 18 kg (+15.1%), breasts Tanner II-III, no pubic hair, a firm smooth lower abdominal mass.
- Tumour markers (CEA 1.5 ng/ml, AFP 5 ng/ml or below, CA125 9 U/ml or below, CA19-9 15 U/ml) were normal. Blood estradiol was high at 183 pg/ml and progesterone high at 3.1 ng/ml; LH and FSH were below 0.5 mIU/l throughout the LHRH test.
- Ultrasound showed a 7.5 x 4.8 x 7.5 cm mass with cystic parts; CT showed an 8 x 7 cm well-enhancing mass with a hypodense centre. The tumour alone was removed on 17 December, preserving the adnexa. Histology was juvenile granulosa cell tumour, mainly diffuse, with granulosa-type and spindle theca-type cells, occasional fat and visible mitoses (no count given).
- Bloody ascites taken at surgery contained cells suspicious for tumour cells, so a right adnexectomy was added 2 months later as a second look; the ascitic cells were finally judged to be peritoneal epithelium, and the authors staged the case FIGO Ia.
- No chemotherapy was given; ultrasound, CT and hormone tests showed no recurrence at 1 year. The authors conclude that tumour removal alone would have been enough, and recommend conservative surgery for stage I cases, citing that stage II and above usually respond poorly.
relevance_to_jgct: 3-year-old stage Ia JGCT with precocious puberty; conservative two-step surgery, no adjuvant therapy, NED at 1 year; shows suspicious ascitic cells later judged benign.
