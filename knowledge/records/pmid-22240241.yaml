key_findings:
- 'Review of granulosa cell tumor pathogenesis: about 97% of adult GCT harbor the somatic FOXL2 c.402C>G (p.C134W) mutation, which is absent from juvenile GCT and other malignancies and so is considered pathognomonic for adult GCT.'
- GCT secrete estrogen, inhibin and Mullerian inhibiting substance, which serve as tumor markers.
relevance_to_jgct: States that FOXL2 C134W is absent from juvenile GCT.
