key_findings:
- 33-year-old G1P0 asymptomatic woman with Maffucci syndrome; left adnexal mass found on routine ultrasonography at 13 weeks gestation.
- Follow-up ultrasound 3 weeks after initial diagnosis demonstrated marked growth in size and vascularity of the tumor, prompting unilateral salpingo-oophorectomy.
- Histopathology confirmed JGCT; the report documents sonographic and MRI features and the natural progression of the tumor during pregnancy.
- Authors state JGCT both secretes hormone and has been postulated to grow in response to hormone.
relevance_to_jgct: Adds to the reported association of JGCT with enchondromatosis (Maffucci syndrome) and documents rapid tumor growth during pregnancy in an adult.
