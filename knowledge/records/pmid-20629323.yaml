key_findings:
- Of 38 newly diagnosed ovarian granulosa cell tumors in Chengdu (2001 to 2009; 3.13% of ovarian cancers), 29 were adult type (median age 53) and 9 juvenile (median age 25); stage I 73.7%, II 23.7%, III 2.6%; 10 had conservative surgery; no deaths in 7 to 175 months of follow-up (14 lost); inhibin, calretinin and vimentin were useful markers (Chinese).
relevance_to_jgct: Nine JGCT in a Chinese series with no deaths over follow-up.
