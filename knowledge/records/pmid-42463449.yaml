title: 'Pregnancy-Associated Small Cell Carcinoma of the Ovary, Hypercalcaemic Type Initially Misdiagnosed as Granulosa Cell Tumour: Diagnostic Pitfalls, Treatment Challenges, and Molecular Confirmation by Next-Generation Sequencing.'
