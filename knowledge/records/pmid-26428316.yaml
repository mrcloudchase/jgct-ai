alterations:
- gene: DICER1
  alteration: RNase IIIb hotspot mutations (E1705K, D1709N, E1813Q, G1809R)
  frequency: ovarian Sertoli-Leydig cell tumor 20/32 (63%); Sertoli cell tumor 5/8 (63%); gynandroblastoma 2/5 (40%); testicular sex cord-stromal tumors 0/15
