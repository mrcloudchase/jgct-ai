notes: 'IMPORTANT: this paper contains no juvenile granulosa cell tumor cases; n_jgct_patients is 0. JGCT is mentioned only in the introduction as a sex cord-stromal subtype. Earlier abstract-based records may have implied JGCT content. Tumor site ''both'' because ovarian and testicular tumors were studied. The Figure 1 legend says ''FOXL1'' where FOXL2 is meant. The paper compares its 63% SLCT rate with 26/43 (60%) from Heravi-Moussavi (pmid-22187960) and 6/19 (32%) from Goulvent et al.'
