key_findings:
- DICER1 hotspot mutations in 20 of 32 (63%) ovarian Sertoli-Leydig cell tumors (80% p.E1705K), 2/5 gynandroblastomas, 5/8 ovarian Sertoli cell tumors.
- No DICER1 mutations in 15 testicular sex cord-stromal tumors.
- Two DICER1 wild-type gynandroblastomas had FOXL2 p.C134W in both components.
