key_findings:
- Two ovarian neoplasms in women aged 58 and 69 years composed of adenosarcoma admixed with a predominant stromal component morphologically and immunohistochemically in keeping with JGCT.
- Authors believe this association had not been reported previously.
- Authors speculate the JGCT component arose from the adenosarcoma as an unusual form of sarcomatous overgrowth of sex cord elements.
relevance_to_jgct: 'Pathology: JGCT-like component arising in ovarian adenosarcoma in older women; a diagnostic consideration rather than classic JGCT.'
