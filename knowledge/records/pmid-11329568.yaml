key_findings:
- Of 102 girls (2 days to 20 years) operated on for ovarian pathology over 15 years, 10 had malignant tumors including 2 juvenile granulosa cell tumors; all malignant cases had unilateral salpingo-oophorectomy, 4 received chemotherapy, and all were disease free at 8.4 years; only 1 of 59 presenting with acute pain had a malignancy versus 6 of 23 presenting with a mass.
relevance_to_jgct: Two JGCT among 102 pediatric ovarian operations, both disease free long term.
