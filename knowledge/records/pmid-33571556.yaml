key_findings:
- A mixture of persistent organic pollutants at follicular-fluid concentrations increased migration and spheroid invasion of KGN (adult-type model) cells through MMP2 and IGF1R; COV434, used as the juvenile-type model, lacked migration and invasion potential and had lower mesenchymal gene expression.
relevance_to_jgct: Cell-line study using COV434 as a JGCT model; COV434 has since been reclassified as SCCOHT (see pmid-33328126).
