key_findings:
- 'Three children with granulosa cell tumors and a review: granulosa cell tumors are prepubertal in 5% of patients, and 80% of those under 20 are juvenile type, usually benign; young children present with precocious pseudopuberty and adolescents with menstrual irregularity, virilization, swelling and pain; outcome is excellent with salpingo-oophorectomy when confined to the ovary, while spread disease is hard to treat; estrogens and inhibin are useful in follow-up.'
relevance_to_jgct: Finnish case series and review of childhood granulosa cell tumors.
