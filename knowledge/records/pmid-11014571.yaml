key_findings:
- 'Immunostaining of 115 testicular tumors: inhibin-alpha in 4 of 5 juvenile granulosa cell tumors, all 27 Leydig cell tumors and 6 of 20 Sertoli cell tumors, absent from germ cell tumors other than trophoblastic elements; CD99 in 3 of 5 JGCT; HEA125 and PLAP negative in sex cord-stromal tumors but present in most germ cell tumors.'
relevance_to_jgct: Marker profile that separates testicular JGCT from yolk sac tumor.
