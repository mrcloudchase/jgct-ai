key_findings:
- Ovarian JGCT in a 15-year-old girl with enchondromatosis (Ollier's disease).
- Literature review revealed two previous reports linking enchondromatosis with ovarian sex-cord stromal tumors.
- Association supports a generalized mesodermal dysplasia in enchondromatosis and draws attention to ovarian neoplasms in addition to chondrosarcomas.
