key_findings:
- A 4-year-4-month-old girl developed rapid abdominal distension with pain and vomiting in late February 1983, bilateral breast enlargement from mid-February, and genital discharge; an outside appendicitis laparotomy found a huge tumour and was limited to exploration.
- On transfer there was an adult-head-sized mass in the right lower abdomen, 1,000-1,500 cc/day of bloody ascites by drain, white cells 17,200, low potassium, raised serum and ascitic LDH; CEA and AFP normal; ascites cytology Pap class II (English abstract; the Japanese OCR is ambiguous).
- Serum estradiol was 578 pg/ml (reference 10-150), urinary estradiol 78.9 ug/day and urinary estriol 424 ug/day, all very high. Hormone results were available only after surgery.
- At surgery on 9 March 1983 a 23 x 16 x 12 cm, 1,615 g encapsulated tumour from the right ovary with extensive haemorrhage and necrosis was removed with the right adnexa; the left ovary had two 1 cm follicular cysts (wedge-resected, benign), no metastases were found.
- 'Histology showed fibrous theca-like cells with diffuse growth and follicle-like lumina lined by luteinised granulosa cells, moderate atypia and frequent mitoses; silver staining showed reticulin around cell groups. The diagnosis of JGCT was confirmed by Scully according to the authors. Tumour tissue estrogen: estrone 2,925 ng/g, estradiol 2,849 ng/g.'
- She received no adjuvant therapy; estradiol fell right after surgery with withdrawal bleeding, breast enlargement regressed, and at 2 years 2 months after surgery estradiol was normal with no sign of recurrence. FIGO stage Ic is given in the authors' table of Japanese cases.
relevance_to_jgct: Giant estrogen-producing JGCT in a 4-year-old, FIGO Ic with bloody ascites, treated conservatively by unilateral adnexectomy; NED at 26 months.
