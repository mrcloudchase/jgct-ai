key_findings:
- 35 early-stage JGCT patients with fertility-sparing surgery, 1995-2017; median age 17 years (4-30); 10 premenarchal; FIGO IA 9, IC 26.
- 14 of 16 completely staged patients had lymphadenectomy and none had lymph node metastasis.
- 31 patients received adjuvant chemotherapy.
- 8 recurrences after median follow-up 51 months; median time to recurrence 4.5 months (2-52); six died of disease. 5-year DFS 74.8% and OS 84.3%.
- Incomplete staging surgery associated with increased recurrence risk (P = 0.029); adjuvant chemotherapy not associated with DFS.
- Four patients had 6 pregnancies resulting in 6 live births.
relevance_to_jgct: Single-center Chinese series reporting substantial recurrence risk in early-stage JGCT after fertility-sparing surgery and the importance of complete staging.
