key_findings:
- Ten cases of hyperreactio luteinalis in pregnancy (ages 22 to 30; ovaries 8.5 to 29 cm, bilateral in 8) with multiple cystic follicles lined by granulosa and theca cells and granulosa mitoses averaging 2.6 per high-power field; the differential includes cystic granulosa cell tumors, especially the juvenile type, which can also present in pregnancy.
- Absence of pale or vacuolated cytoplasm and of solid granulosa growth distinguishes hyperreactio luteinalis from JGCT.
relevance_to_jgct: A benign pregnancy mimic of JGCT and how to tell them apart.
