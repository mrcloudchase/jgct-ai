key_findings:
- 'Sixty-eight granulosa cell tumor patients at Memorial Sloan-Kettering (64 adult, 4 juvenile; median age 49): 81% incompletely staged; no nodal metastases in the 16 with pelvic sampling; 34 recurrences (31 adult, 3 juvenile) at a median 63 months, first sites pelvis 70%, with about 15% involving the retroperitoneum.'
relevance_to_jgct: Three juvenile recurrences among 34; no nodal metastases at staging.
