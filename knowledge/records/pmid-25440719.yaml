key_findings:
- 'Review of ovarian tumors in the first three decades: juvenile granulosa cell tumor preponderantly occurs in the first two decades, the retiform Sertoli-Leydig cell tumor peaks at about 15 years, small cell carcinoma of hypercalcemic type in the early 20s, and neonatal follicular cysts can be large with dramatic manifestations; the varied differential diagnosis of JGCT is emphasized, with gross pathology stressed.'
relevance_to_jgct: Age-distribution context and differential diagnosis of JGCT from an expert review.
