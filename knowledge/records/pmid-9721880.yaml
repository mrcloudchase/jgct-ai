key_findings:
- In SWR-derived mice, whose spontaneous juvenile granulosa cell tumors resemble those of young girls, tumor susceptibility mapped to Gct1 (chromosome 4, dominant), Gct2 (chromosome 12), suggestively Gct3 (chromosome 15) and Gct4 (X chromosome) with a paternal parent-of-origin effect; imprinting and interactions among the loci set tumor probability.
relevance_to_jgct: Multigenic and imprinted control of a mouse model of JGCT.
