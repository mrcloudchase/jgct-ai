key_findings:
- EXPeRT consensus recommendations (EU-funded PARTNER project) for diagnosis and treatment of pediatric testicular and ovarian sex cord stromal tumors.
- Approach depends on histological differentiation and tumor stage. Virtually all testicular SCSTs are localized with excellent prognosis after complete resection.
- Ovarian SCST prognosis may be adversely affected by tumor spillage during surgery or metastases; in these cases cisplatin-based chemotherapy is recommended.
- Recommends reference pathology, genetic testing for tumor predisposition syndromes (e.g., DICER1) in selected cases, stratified adjuvant chemotherapy for unfavorable risk profiles, and enrollment in prospective registries.
relevance_to_jgct: International (European) consensus guideline covering pediatric JGCT; cited by IOTSTR as recommending chemotherapy above stage IC1.
