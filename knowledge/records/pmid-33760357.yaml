key_findings:
- Consensus of the EXPeRT and EU-funded PARTNER groups to harmonize diagnosis and treatment of pediatric testicular and ovarian sex cord-stromal tumors.
- Management depends on histological differentiation and tumor stage; diagnosis should include reference pathology and, in selected cases, genetic testing for predisposition syndromes such as DICER1, with specific follow-up for carriers.
- Virtually all testicular SCST are localized with excellent prognosis after complete resection; ovarian SCST prognosis may be worsened by surgical spillage.
- Stratified adjuvant chemotherapy is recommended for unfavorable risk profiles, with cisplatin-based chemotherapy for ovarian SCST with spillage or metastases; patients should enroll in prospective registries.
relevance_to_jgct: The 2021 pan-European consensus underpinning pediatric JGCT management in registries such as STEP.
