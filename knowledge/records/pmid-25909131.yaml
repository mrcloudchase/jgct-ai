key_findings:
- A 16-year-old with abdominal pain, virilization and irregular menses had a 73 x 42 x 36 mm cystic left ovarian gynandroblastoma composed of juvenile granulosa cell nodules admixed with Sertoli-Leydig tubules; the intraoperative diagnosis had been adenocarcinoma; a year after salpingo-oophorectomy menses were regular but virilization persisted (Bulgarian).
