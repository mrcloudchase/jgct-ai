key_findings:
- A 25-year-old with DICER1 syndrome had a metastatic ovarian sex cord-stromal tumor with Sertoli-Leydig and juvenile granulosa cell tumor-like features and a primitive multilineage sarcoma of the liver; despite extensive surgery and chemotherapy she died, and autopsy showed a large abdominopelvic mass with hemoperitoneum and extensive organ involvement.
relevance_to_jgct: JGCT-like component in a fatal DICER1-syndrome mixed stromal tumor.
