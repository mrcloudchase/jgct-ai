key_findings:
- 28-year-old primigravida at 22 + 5 weeks' gestation with abdominal pain; 15 cm x 11 cm right adnexal predominantly solid lesion with mild ascites and left mild pleural effusion.
- Preoperative CA-125 785 U/ml, AFP 51 ng/ml, beta HCG 33547 mIU/ml (pregnancy).
- 'Fertility-sparing staging laparotomy at 23 + 4 weeks: right salpingo-oophorectomy, infracolic omentectomy, left ovarian biopsy, paracolic gutter biopsies; IHC inhibin and calretinin positive; final diagnosis JGCT stage 1A.'
- Inhibin B 86.5 at 32 weeks, rose to 118 at 36 weeks; repeat MRI showed no recurrence.
- Elective cesarean at 37 weeks with re-exploration and pelvic/para-aortic lymphadenectomy; nodes negative; no adjuvant chemotherapy; disease-free at 24 months.
- Literature table compiles 12 prior reports (15 patients) of JGCT in pregnancy since 1993, stages IA to IIIB.
relevance_to_jgct: Adds an adult pregnancy-associated JGCT case and a compiled table of published JGCT in pregnancy with management and outcomes.
