- regimen: Fertility-sparing staging laparotomy at 23+4 weeks (right salpingo-oophorectomy, infracolic omentectomy, left ovarian biopsy, paracolic gutter biopsies); at 37 weeks elective cesarean with re-exploration and pelvic/para-aortic lymphadenectomy
