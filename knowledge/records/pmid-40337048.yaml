notes: 'Narrative review with a short JGCT paragraph and no cited primary source for JGCT statements in that paragraph; the statement that JGCT ''predominantly affect adolescents'' and the claim ''late recurrences are common'' are generalizations by the authors. Wording slips: ''menstrual irregularities ranging from precocious puberty to irregular bleeding''. Possible mismatch with other literature: JGCT is more typically a tumor of children and young adults, with many prepubertal cases.'
