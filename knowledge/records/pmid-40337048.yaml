key_findings:
- Narrative review of adolescent ovarian cancer (germ cell tumors, sex cord-stromal tumors, small cell carcinoma hypercalcemic type) from an Indian standpoint; the authors state there are no India-specific adolescent guidelines.
- 'JGCT section (literature-based, no new data): juvenile granulosa cell tumors are described as low-grade malignant tumors predominantly affecting adolescents, estrogen-secreting, presenting with menstrual irregularity or precocious puberty as unilateral solid-cystic masses; about 80% are stage I at presentation with good overall survival.'
- 'Adverse prognostic factors listed for JGCT: size above 5 cm, high mitotic index, sarcomatoid foci; late recurrences, sometimes decades later, so long-term surveillance is advised.'
- 'Management of sex cord-stromal tumors per the review: comprehensive surgical staging (peritoneal cytology, unilateral salpingo-oophorectomy, peritoneal biopsies, infracolic omentectomy), no lymphadenectomy unless nodes enlarged, fertility-sparing surgery standard, early-stage disease cured by surgery alone, platinum-based chemotherapy for advanced disease.'
- 'General recommendations: avoid diagnostic punctures (spill and upstaging), laparotomy preferred, MRI over CT, tumor markers AFP, beta-hCG, inhibin B, LDH; sex cord-stromal tumors recur late (5-10 years) compared with germ cell tumors (first 2 years); follow-up every 3 months for 2 years then every 6 months for 3 years.'
relevance_to_jgct: Brief secondary summary of JGCT clinical behavior and management in adolescent ovarian cancer; useful as a statement of one regional expert view, not as primary evidence.
