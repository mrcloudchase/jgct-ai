key_findings:
- 38-year-old woman with abdominal distension and frequent urination; approximately 12 cm right ovarian multiloculated cystic mass with hemorrhagic foci on MRI.
- Bilateral ovaries were macroscopically normal at laparoscopic myomectomy about one year before, so rapid enlargement was suspected.
- Serum estradiol elevated to 214.5 pg/ml with FSH less than 0.1 mIU/ml; CA 125 slightly elevated to 39.2 U/ml.
- Intraoperative differential included GCT, yolk sac tumor or malignant mucinous tumor because of cytologic atypia and lack of nuclear grooves and Call-Exner bodies; mitotic activity focally brisk, average 10 mitoses per 10 high-power fields.
- Total hysterectomy, bilateral salpingo-oophorectomy, partial omentectomy and appendectomy; definitive diagnosis JGCT, FIGO Stage IA, with no additional treatment.
- Authors suggest rapid growth may relate to nuclear atypia and high mitotic rate.
relevance_to_jgct: Documents JGCT in an adult with evidence of rapid growth within about one year, and imaging features that may help distinguish JGCT from adult GCT.
