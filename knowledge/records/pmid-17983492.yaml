key_findings:
- 'Ten JGCT (ages 7 to 31, average 20.5, 90% under 30; tumors 5.5 to 15 cm, average 9.8) compared with 10 adult GCT: JGCT showed nodular growth, irregular mucin-containing follicles, luteinization, atypia and high mitotic activity with absent grooves and Call-Exner bodies; p53 positive in 70% and PCNA in 90% of JGCT versus 10% and 20% of AGCT; 5-year survival 90% for JGCT and 100% for AGCT (Chinese).'
relevance_to_jgct: 'Chinese comparison of 10 JGCT with 10 AGCT: higher proliferation, p53 and worse survival.'
