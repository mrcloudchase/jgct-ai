key_findings:
- A girl aged 1 year 2 months was noticed to have breast swelling corresponding to Tanner 2 and labial hyperplasia; ultrasound showed an enlarged uterus and a solid, well-vascularised left ovarian tumour of 5 cm.
- Estradiol was 960 pmol/l, LH < 0.3 IU/l, FSH < 1.2 IU/l, inhibin B 8497 ng/l and CA-125 71.9 U/ml.
- After interdisciplinary discussion of laparoscopy versus laparotomy, a longitudinal laparotomy with left adnexectomy was done in January 2006 according to the MAKEI protocol.
- Histology showed a sex cord-stromal tumour with a dominant juvenile granulosa cell tumour component; close follow-up is under way.
- The authors advise that clinically visible pubertal signs in a toddler call for paediatric gynaecology referral as well as endocrine work-up, and that transabdominal ultrasound with colour Doppler is essential.
relevance_to_jgct: Infant (14 months) ovarian JGCT with isosexual precocious puberty and very high inhibin B, treated by adnexectomy per the German MAKEI protocol.
