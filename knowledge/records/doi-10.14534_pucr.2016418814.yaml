presentation:
- painless left scrotal mass at birth
key_findings:
- A full-term neonate had a painless left scrotal mass about twice the volume of the other testis; Doppler ultrasound showed a multicystic mass with normal flow and no normal testis; hCG and AFP were normal; frozen section excluded yolk sac tumor and orchiectomy was done because no normal testis could be found.
- The abstract states that JGCT accounts for 1.2% of prepubertal testicular tumors.
relevance_to_jgct: Congenital testicular JGCT managed by orchiectomy when no testis could be spared.
