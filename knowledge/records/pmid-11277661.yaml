key_findings:
- Diagnosed at age 17 with FIGO stage IIIC JGCT; right salpingo-oophorectomy, debulking and staging followed by six cycles of carboplatin and etoposide.
- Recurrence in the liver and adjacent to the spleen 13 months after completion of primary therapy.
- Aggressive surgical removal followed by six cycles of bleomycin and taxol as salvage gave 44 months of disease-free survival.
- Subsequent cesarean delivery of a 2335-g normal male; exploration showed no evidence of tumor.
- Described as the second report of a patient with advanced JGCT becoming pregnant after apparently successful chemotherapy.
relevance_to_jgct: Fertility-sparing management of stage IIIC JGCT with salvage after hepatic/perisplenic recurrence and later pregnancy.
