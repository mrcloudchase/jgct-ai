key_findings:
- Advanced JGCT recurred in the liver and near the spleen 13 months after carboplatin/etoposide.
- Salvage surgery and six cycles of bleomycin plus paclitaxel gave 44 months disease-free survival, followed by a successful pregnancy.
- Authors state the best treatment for extensive and recurrent JGCT is undetermined.
relevance_to_jgct: Single-patient evidence on salvage therapy for recurrent JGCT and fertility after treatment.
