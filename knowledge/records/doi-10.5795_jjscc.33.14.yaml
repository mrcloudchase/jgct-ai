key_findings:
- 'Single-institution series (Jichi Medical School, 17 years to March 1991): 10 granulosa cell tumours among 592 ovarian tumours (1.7%), ages 6 to 76 years (mean 44), 4 premenopausal (including 1 premenarchal), 5 postmenopausal, 1 unknown.'
- 'The authors state that the juvenile type was seen in 40% of their cases (that is 4 of the 10), versus about 90% adult type in the literature they cite. In the legible text two juvenile cases are described: case 1, a 6-year-old with irregular genital bleeding and breast swelling, and case 2, a 17-year-old whose juvenile-type histology is illustrated (diffuse growth, size-variable atypical nuclei, a central follicle).'
- Across all 10 patients, 8 were stage I and 2 stage IIIc (one tumour matted with small bowel, one with omental metastasis); 9 were unilateral (one case ended in exploratory laparotomy only); 7 were alive and 3 died, 2 of tumour and 1 of acute promyelocytic leukaemia. The text does not say which patients had which stage, although the authors state one juvenile-type patient died and an adult-type patient recurred at 67 months and died at 71 months.
- Estradiol was high in 4 of 6 measured (2 premenopausal, 4 postmenopausal) and fell markedly after surgery in the 3 measured; associated endometrial adenocarcinoma in 2, atypical hyperplasia in 1, breast cancer, cervical carcinoma in situ and leukaemia in 1 each. These are series-wide, not JGCT-specific, since the patient table is not legible.
relevance_to_jgct: Japanese granulosa cell tumour series in which 4 of 10 were juvenile type (including a 6-year-old with precocious puberty); the JGCT-specific data are thin because the case table is not legible in the extracted text.
