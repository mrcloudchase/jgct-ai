notes: Japanese with English summary. Table 1 and the figures are not legible in the extracted text, so ages, stages and outcomes of the 4 juvenile cases cannot be assigned individually; only cases 1 (6 years) and 2 (17 years) are identified. The paper's main focus is estrogen production and cytology of granulosa cell tumours; the 'adult type' cytology reported was from an adult patient (case 10, 76 years). Series-level figures are context, not JGCT findings.
