key_findings:
- A neonate with Donohue syndrome (the most severe insulin-receptor defect, autosomal recessive, gene on 19p13) had congenital bilateral ovarian JGCT, treated surgically and with metformin, and died on day 30 of necrotizing enterocolitis.
- The authors suggest the tumors are part of the natural course of the syndrome rather than a complication of treatment, and that surgery is needed when ovarian enlargement causes respiratory distress or threatens torsion.
relevance_to_jgct: Congenital bilateral JGCT in Donohue syndrome, a second report of this association.
