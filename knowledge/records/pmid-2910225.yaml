key_findings:
- 13 JGCT cases; ages 6 months to 56 years (median 17 years); only one postmenopausal.
- Three premenarchal patients had isosexual development; five of seven postmenarchal patients had menstrual abnormalities; two showed virilization; ascites in two.
- All had unilateral stage I tumors, 2.5 to 24.5 cm (mean 12.2 cm).
- 'Histology: nodular architecture, follicles, hyaluronic acid-rich interstitial fluid, microcysts, individual cell necrosis, high mitotic activity (mean 11 mitoses per 10 HPF).'
- 'IHC in five: vimentin positive (four), isolated cytokeratin AE1/3-positive cells (two), CEA and MFG-2 negative.'
- 'Follow-up of ten patients: no recurrences from six months to 33 years (mean 9.5 years).'
relevance_to_jgct: Clinicopathologic series of stage I JGCT with long follow-up and no recurrences.
