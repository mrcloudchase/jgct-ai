- Review of molecular advances in ovarian sex cord-stromal tumours covering adult and juvenile granulosa cell tumours and Sertoli-Leydig cell tumours, with emphasis on the clinical significance of FOXL2 and DICER1 mutations; inhibin, calretinin, SF-1 and FOXL2 confirm sex cord-stromal lineage but do not separate the tumour types.
