key_findings:
- Twenty-one granulosa cell tumors (15 adult, 6 juvenile), all FIGO stage I; 4 recurrences (19%) during a median 36 months of follow-up; inhibin positive in 12 of 12, vimentin 11 of 12, Ki-67 under 5% in all 12 tested, p53 in 2 of 12; no marker predicted outcome.
relevance_to_jgct: Six JGCT among 21 stage I granulosa cell tumors; Ki-67 low in all tested.
