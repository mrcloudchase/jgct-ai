key_findings:
- 2-year and 2-month-old girl with suspected ovarian cancer, dysfunctional uterine bleeding, and precocious puberty.
- Ultrasound showed a solitary anechoic cystic lesion; MRI confirmed solid components on its walls.
- JGCT confirmed by immunohistochemistry.
- Authors state JGCT imaging features were nonspecific and histopathology with IHC is mandatory.
relevance_to_jgct: Documents a unilocular cystic imaging appearance of JGCT, which can mimic benign cysts.
