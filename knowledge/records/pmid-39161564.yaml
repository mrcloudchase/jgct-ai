notes: Hyperprolactinemia is reported but its cause is not established. The note about 'JGCT in males' (Swiss cheese pattern, gubernaculum continuation) is from a cited paper, not this patient. Text calls the lesion a purely cystic unilocular lesion despite a solid mural component seen on MRI. No molecular data.
