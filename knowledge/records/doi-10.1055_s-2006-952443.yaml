key_findings:
- A prenatally diagnosed complicated fetal ovarian cyst (labial oedema, ascites) was seen at 32 weeks; the newborn had abnormal genitalia with clitoral hypertrophy.
- After birth the very large ovarian tumour displacing abdominal organs was removed; a small uterus and tubes on both sides were seen, and histology showed a juvenile granulosa cell tumour.
- Karyotyping of the child and of the tumour gave 45,X/46,X mar(Y).
- At a further operation for right inguinal hernia, tissue from a second intra-abdominal gonad and from the inguinal canal was dysplastic ovarian tissue and testicular tissue.
- High androgen levels in the child's blood were thought most likely to be produced by the granulosa cell tumour.
- The authors conclude this is a newborn with true hermaphroditism and a juvenile granulosa cell tumour; follow-up, adjuvant treatment and outcome are not given.
relevance_to_jgct: Congenital ovarian JGCT with androgen production in a child with true hermaphroditism and a sex-chromosome mosaic (45,X/46,X mar(Y)).
