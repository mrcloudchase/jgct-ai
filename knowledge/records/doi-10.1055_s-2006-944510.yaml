key_findings:
- A 17-year-old virgo intacta with normal cycle and secondary sexual characteristics presented with severe left lower abdominal and flank pain; ultrasound showed a 7-8 cm polycystic paravesical structure with normal endometrial echo and no abnormal Doppler.
- At laparoscopy on 02.11.2005 a smooth cystic tumour of the left ovary with partial torsion and a hydropic tube was removed with the whole left adnexa; frozen section suggested a malignant germ cell tumour.
- Definitive histology and immunohistochemistry (negative for neuron-specific enolase, chromogranin, EMA and cytokeratin; positive for vimentin, S100 and CD56) were read as a malignant adult-type granulosa cell tumour; second review at the AGO reference centre for ovarian tumours in Mannheim confirmed a malignant granulosa cell tumour.
- Restaging laparotomy on 16.11.2005 (inguinal lymphadenectomy, peritoneal biopsies, partial omentectomy, lavage cytology) found no further tumour; stage pT1a, R0.
- The authors state that, because of R0 resection, no further treatment is indicated according to the current literature, and agreed 3-monthly follow-up with interval CT imaging with the patient.
- The title names a simultaneous juvenile and adult type, but the abstract text itself describes and diagnoses only an adult-type malignant granulosa cell tumour and gives no juvenile component.
relevance_to_jgct: Ovarian granulosa cell tumour in a 17-year-old whose title claims a combined juvenile and adult type but whose abstract diagnoses adult type only; classification is therefore uncertain and not counted as a confirmed JGCT.
