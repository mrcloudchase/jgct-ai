key_findings:
- 38 ovarian Sertoli-Leydig cell tumors containing follicles; in 33, follicles resembled juvenile granulosa cell tumor.
- JGCT-like follicles accounted for about 5% to 40% of tumor volume; average age 28; androgenic manifestations 40%.
- Authors argue such tumors belong in the Sertoli-Leydig category rather than mixed sex cord-stromal tumor (gynandroblastoma).
relevance_to_jgct: 'Key differential-diagnosis paper: JGCT-like areas occur within Sertoli-Leydig cell tumors, relevant to DICER1-associated cases labelled JGCT.'
