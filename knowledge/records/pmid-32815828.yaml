title: 'Sertoli-Leydig Cell Tumors of the Ovary With Follicular Differentiation Often Resembling Juvenile Granulosa Cell Tumor: A Report of 38 Cases Including Comments on Sex Cord-Stromal Tumors of Mixed Forms (So-called Gynandroblastoma).'
