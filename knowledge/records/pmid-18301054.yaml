key_findings:
- 'Fourteen granulosa cell tumors with a pseudopapillary pattern (10 juvenile, 4 adult), 12 received in consultation: referring pathologists favored transitional cell neoplasm in 3 and retiform Sertoli-Leydig cell tumor in 2; all were unilateral, mostly cystic, with papillary projections 0.1 to 1.5 cm lining the cyst wall.'
- Thorough sampling showed typical granulosa cell areas in all; the pattern seems related to cystic change.
relevance_to_jgct: Pseudopapillary JGCT can be mistaken for transitional cell or retiform tumors.
