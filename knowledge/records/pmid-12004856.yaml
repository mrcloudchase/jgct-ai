key_findings:
- Testicular JGCT usually appears as a scrotal mass and less frequently as an abdominal or inguinal mass.
- May be associated with ambiguous genitalia and/or abnormal sex chromosomes.
- Authors state recommended treatment is orchiectomy alone because local recurrence or metastasis have never been observed.
