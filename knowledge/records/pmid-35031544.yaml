key_findings:
- Largest comprehensive molecular study of JGCT to date, 31 tumors with 580-gene DNA panel, targeted RNA sequencing and EPIC methylation array
- Genome-wide DNA methylation cleanly separates JGCT from adult granulosa cell tumor, supporting diagnostic use
- Recurrent TERT rearrangements in 13 percent, a mechanism distinct from the TERT promoter mutations seen in adult tumors
- Findings suggest possible targeted therapy avenues, including FGFR1 and AKT pathway
relevance_to_jgct: Defines the current reference genomic and epigenomic landscape of JGCT and the main candidate drivers.
