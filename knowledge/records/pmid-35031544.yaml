key_findings:
- Tumor-only integrated genomic (580-gene NGS panel), targeted transcriptomic, and genome-wide DNA methylation (EPIC array) analysis of 31 JGCTs.
- Frequent KMT2C-truncating mutations and other mutations in SWI/SNF chromatin-remodeling genes, plus previously reported hotspot AKT1 and DICER1 mutations.
- Recurrent TERT rearrangements (13%) with partners CLPTM1L or DROSHA; FGFR1 upregulation in TERT non-rearranged JGCTs.
- Genome-wide DNA methylation clearly separated adult GCTs from JGCTs, supporting diagnostic use.
relevance_to_jgct: Largest multi-omic molecular study of JGCT; adds KMT2C, SWI/SNF and TERT rearrangements to the AKT1/DICER1 landscape and a methylation-based diagnostic signature.
