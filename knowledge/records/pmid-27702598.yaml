key_findings:
- Eight patients with ovarian JGCT diagnosed between 1990 and 2016; median age at presentation 3 years (range, 0.7-14 years).
- Precocious puberty was the presenting symptom in all five prepubertal children; abdominal distension in three children older than 9 years.
- Estradiol (n = 3) and inhibin (n = 3) were elevated in patients with preoperative testing.
- Five patients had stage I disease (salpingo-oophorectomy only) and three had stage III (adjuvant chemotherapy).
- After median follow-up of 6.2 years, six patients (75%) were alive without evidence of disease.
- One stage I patient with germline p53 mutation and PTEN mutation died of subsequent liposarcoma; one stage IIIB patient recurred (detected by elevated inhibin) and died of progressive disease despite multiple chemotherapy regimens.
relevance_to_jgct: Single-institution pediatric series with stage-specific outcomes; supports favorable prognosis of stage I disease after surgery alone and documents poor outcome in a stage III recurrence.
