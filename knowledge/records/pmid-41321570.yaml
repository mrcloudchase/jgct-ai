notes: 'Concerns horses only. Juvenile-type here is a histologic label in adult mares, not a young-age tumor; ages by histotype are not given. Inconsistencies in the text: odds ratio 13.21 is the Wald statistic in the regression table (Exp(B) 8.768); the t-test comparison of testosterone p = 0.001 appears at odds with the overlapping ranges and means (13.2 vs 11.25) and the small numbers. Percent figures for histotypes use 17 specimens.'
