key_findings:
- Multicenter, prospective, randomized phase 3 trial comparing paclitaxel plus carboplatin with bleomycin, etoposide and cisplatin (BEP) after surgery in newly diagnosed ovarian malignant sex cord-stromal tumors; sponsor Beihua Kong; status RECRUITING; start 2015-04; estimated completion 2030-05; estimated enrollment 132.
- 'Eligibility: female Chinese women, ages 14 to 65 years, stage IIA-IVB, initial surgery within the past 8 weeks; histologies include granulosa cell tumor, Sertoli-Leydig cell tumor, gynandroblastoma, steroid cell tumor, unclassified sex cord-stromal tumor and sex cord tumor with annular tubules.'
- 'Primary outcome: progression-free survival.'
relevance_to_jgct: Only identified randomized chemotherapy trial for ovarian sex cord-stromal tumors whose age range reaches adolescents (from 14 years); juvenile granulosa cell tumor is not named separately.
