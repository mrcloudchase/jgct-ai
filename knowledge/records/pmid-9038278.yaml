key_findings:
- Two teenagers with Stage III JGCT treated with aggressive debulking and thorough staging but conservative surgery relative to uterus and contralateral adnexa, plus carboplatin and etoposide.
- Short-term disease-free survival reported in both.
- Abstract states about 90% are diagnosed in FIGO I; FIGO II-IV have poor clinical outcome.
relevance_to_jgct: Fertility-sparing surgery plus carboplatin/etoposide in stage III JGCT.
