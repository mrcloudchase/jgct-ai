key_findings:
- 'A prospective three-center Indian series (April 2017 to March 2020) of 11 girls aged 5 to 13 with JGCT presenting with precocious puberty: 7 aged 5 to 8, 3 aged 9 to 12, 1 aged 13; all had elevated estradiol with low LH and FSH, raised T3 with normal TSH and T4, and histology confirmed by immunohistochemistry; most presented at an early stage.'
- All underwent resection of the ovarian mass; surgery is described as the primary treatment.
relevance_to_jgct: An 11-patient pediatric series with uniform precocious-puberty presentation and hormone profile.
