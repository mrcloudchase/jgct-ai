  outcome: vaginal delivery at 31w2d of a healthy 1830 g girl; no recurrence 1 year after surgery
presentation:
- incidental 12 cm adnexal mass at 28 weeks
- acute abdomen with hypotension and hemoperitoneum at 31 weeks
- ruptured tumor capsule
key_findings:
- 28-year-old G2P1 (BMI >30, prior cesarean) with an incidental 12 x 12 cm left adnexal mass at 28 weeks; at 31 weeks presented with acute abdomen, hypotension and suspected hemoperitoneum.
- 'Laparotomy: 20 x 25 cm left ovarian neoplasm with ruptured capsule, about 500 mL clotted blood; left salpingo-oophorectomy with all visible tumor removed; FIGO stage 1C2 because of preoperative rupture.'
- 'Pathology: tumor 18 x 14 x 9 cm, 1395 g, sex cord-stromal tumor with variably sized follicles, vacuolated cytoplasm, immature nuclei, basophilic myxoid background and luteinized aggregates; 11 mitoses per 10 HPF; inhibin, calretinin, CD99 and S100 positive; SALL4 and AFP negative.'
- She went into labour after surgery and delivered vaginally at 31 weeks 2 days; 6 cycles of paclitaxel and carboplatin were given, no recurrence at 1 year; she desired fertility preservation.
- Authors state (literature-based) that over 90% of JGCT are diagnosed at FIGO stage I with 5-year survival over 90%, that adjuvant chemotherapy is recommended for stage IC or higher or mitotic index above 20 per 10 HPF, and propose surveillance every 2-3 months for 2 years, every 4-6 months for the next 3 years, then annually for 5 years.
relevance_to_jgct: Rare JGCT in pregnancy presenting as a ruptured mass, managed with fertility-sparing surgery, delivery and adjuvant carboplatin-paclitaxel.
