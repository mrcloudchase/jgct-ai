title: 'Anaplastic Juvenile Granulosa Cell Tumor: A Report of 10 Cases of an Unemphasized Variant With Adverse Prognostic Features Characterized by TP53 Inactivation With MYC Family Amplifications'
journal: The American Journal of Surgical Pathology
year: 2026
