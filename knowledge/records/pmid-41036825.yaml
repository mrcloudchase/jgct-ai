treatments: []
presentation:
- large tumors, 8.3 to 28 cm (median 21 cm)
key_findings:
- Describes 10 anaplastic JGCTs with conventional solid or nodular areas plus effaced areas (median 50% of tumor) of diffuse growth, marked atypia and up to 40 mitoses per 10 HPF.
- 'FIGO stage: IA 3, IC3 2, II 1, IIIA 3, unknown 1.'
- TP53 inactivation was found in every tumor (mutation in 7/7 sequenced, aberrant p53 staining in the other 3); MYC or MYCN amplification in 4/10, concentrated in advanced-stage tumors.
- 'At median 22 months follow-up (9 patients): 4 died of disease (all stage II/III with MYC family amplification), 1 alive with disease (IA), 4 alive and well (IA/IC).'
- Authors propose anaplastic JGCT be distinguished from conventional JGCT for prognostic reasons and note patients with MYC family amplification might benefit from MYC inhibitors, while stating independence of MYC amplification as a predictor could not be determined.
relevance_to_jgct: Defines a molecularly distinct, aggressive anaplastic JGCT variant with TP53 inactivation and MYC family amplification, a candidate high-risk subgroup.
