key_findings:
- 10 anaplastic JGCTs, patients 7 to 44 (median 13) years; tumors 8.3 to 28 (median 21) cm; FIGO IA (3), IC3 (2), II (1), IIIA (3), unknown (1).
- All had conventional JGCT areas plus areas (median 50%) of diffuse growth, marked cytologic atypia and brisk mitoses (up to 40/10 HPFs).
- All 7 sequenced tumors had TP53 mutations; the other 3 had aberrant p53 immunohistochemistry. MYC/MYCN amplification in 4; AKT1 in-frame duplications in 4; DICER1 mutations in 2.
- 'Of 9 with follow-up (median 22 months): 4 died of disease (all stage II/III with MYC/MYCN amplifications), 1 alive with disease (stage IA), 4 alive and well (stages IA/IC).'
- Authors argue anaplastic JGCT should be distinguished from conventional JGCT for prognostic reasons and note possible relevance of MYC inhibitors.
relevance_to_jgct: Defines an anaplastic JGCT variant with TP53 inactivation and MYC-family amplification associated with adverse outcome.
