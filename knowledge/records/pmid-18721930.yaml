key_findings:
- 3 boys with testicular JGCT (1990-2004) from French TGM95 database and 8 pediatric endocrinology centers; orchiectomy in all.
- Tumor cells showed aberrant nuclear FOXL2 expression resembling ovarian granulosa cells; SOX9 was sequestered in cytoplasm or markedly under-expressed; FOXL2 and SOX9 mutually exclusive where SOX9 residual.
relevance_to_jgct: Shows testicular JGCT cells express the ovarian determinant FOXL2, supporting transdifferentiation.
