key_findings:
- Two girls aged 16 and 15 with stage IC ovarian JGCT in Armenia had surgery and 4 cycles of PEI chemotherapy chosen through the EXPeRT online advisory board (vrt.cineca.it).
- The authors conclude that international collaboration with EXPeRT helps physicians with limited experience of very rare tumors.
relevance_to_jgct: Shows how the EXPeRT virtual consultation system is used for JGCT treatment decisions in a low-resource setting; both stage IC patients received PEI.
