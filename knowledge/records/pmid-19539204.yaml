presentation:
- precocious puberty (4/4)
key_findings:
- Four JGCT patients aged 2.4 to 7.2 (median 2.9) years, all with signs of precocious puberty; FSHR exon 10 from peripheral blood sequenced.
- No activating FSHR mutations; polymorphisms Ser680Asn and Ala307Thr in three of four patients and three of five controls.
- One patient with accelerated growth and advanced bone age developed central precocious puberty after tumor removal; follow-up 4.5 to 8.8 years.
relevance_to_jgct: Reports central precocious puberty developing after JGCT removal, relevant to endocrine follow-up.
