key_findings:
- First reported case of an 8-year-old girl with tuberous sclerosis and ovarian JGCT.
- Presented with a 20 x 22 cm pelvic mass; right salpingo-oophorectomy.
- Recurred three months later; underwent left salpingo-oophorectomy, lymphadenectomy and omentectomy followed by four cycles of BEP.
- Free of disease 8 years after recurrence.
relevance_to_jgct: JGCT with tuberous sclerosis; early recurrence salvaged with surgery plus BEP.
