notes: The conclusion refers to XP type C, but the case itself does not report the complementation group or mutation. Histology noting 'coffee-bean' nuclei and no Call-Exner bodies is unusual for classic JGCT description; diagnosis rests on inhibin/calretinin positivity and morphology. Follow-up duration not stated. Literature in the discussion (Tunisian XP-C series, Bradford 2011, Kraemer 2003, Yurchenko 2023) is cited, not independently read.
