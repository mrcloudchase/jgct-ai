notes: 'Internal inconsistency: the discussion says the solid component was seen in the tumor and adenoma patients, but also reports a solid component in the patient with endometrioma. The abstract says the study evaluated outcomes, but only a roughly 9-month cyst recurrence statement is given and nothing JGCT-specific.'
