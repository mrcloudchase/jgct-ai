key_findings:
- Six ovarian JGCT patients (mean age 20.5) all had fertility-sparing surgery with complete staging.
- Five received 3 to 6 courses of adjuvant chemotherapy (BEP or paclitaxel/carboplatin).
- No stage I patient recurred (52 to 155 months); the stage IIIB patient recurred at 55 months and was salvaged.
- Authors call fertility-sparing surgery the treatment of choice.
relevance_to_jgct: Small series supporting fertility-sparing surgery in young-adult ovarian JGCT.
