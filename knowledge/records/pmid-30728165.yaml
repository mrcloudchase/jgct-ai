key_findings:
- Six patients, mean age 20.5 years (12-33); all had fertility-sparing surgery with complete staging; mean tumor size 15.3 cm (5-35); two had ascites.
- Five received 3-6 courses of adjuvant chemotherapy (3 BEP, 2 paclitaxel/carboplatin).
- Five stage I patients had no recurrence at 52 to 155 months; the stage IIIB patient recurred at 55 months and was disease-free 30 months after reoperation and chemotherapy.
relevance_to_jgct: Small series supporting fertility-sparing surgery in JGCT.
