key_findings:
- 19 JGCT patients from two Wuhan centers, 1999-2019; median age 8.25 years (0.25-28).
- Abdominal pain most common; five out of 10 prepubertal children had precocious puberty.
- Radical surgery in 3, fertility-sparing in 16; FIGO stage I 18, stage II 1; 12 received adjuvant chemotherapy.
- 'Median follow-up 35 months: one relapse with death at 32 months; 18 alive without recurrence.'
relevance_to_jgct: Chinese two-centre series with mostly stage I disease and favorable outcome.
