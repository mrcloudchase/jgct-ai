presentation:
- abdominal pain (most common)
- precocious puberty (5 of 10 prepubertal)
key_findings:
- Two Wuhan, China centres, 19 ovarian JGCT (1999 to 2019); 18 stage I, 1 stage II.
- Fertility-sparing surgery in 16; 12 received adjuvant chemotherapy.
- At median 35 months, 18 alive without recurrence; 1 relapsed and died 32 months after diagnosis.
- Authors note the value of adjuvant chemotherapy in stage Ic is unknown and favor fertility-sparing surgery in young patients.
relevance_to_jgct: Chinese two-centre series with favorable stage I outcomes and frequent adjuvant chemotherapy use.
