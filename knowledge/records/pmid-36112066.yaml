key_findings:
- 4-year-old girl with acanthosis nigricans and hyperinsulinism, mimicking hyperandrogenism, insulin resistance and acanthosis nigricans (HAIR-AN) syndrome.
- Elevated insulin, inhibin A and B, and total testosterone.
- All laboratory results normalized after unilateral salpingo-oophorectomy; final diagnosis Stage 1A JGCT.
- Authors suggest hyperandrogenemia may promote hyperinsulinism.
