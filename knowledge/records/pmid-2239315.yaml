key_findings:
- Three-year-old girl with ovarian JGCT, precocious pseudopuberty and elevated serum and urinary estrogen.
- Estradiol, estriol, progesterone and testosterone localized mainly in stromal cells and some follicular cells.
- Electron microscopy showed polygonal, spindle and transitional cells; steroid-synthesis features mainly in transitional cells, which corresponded to steroid-positive cells.
- Some spindle cells had myofibroblast features; authors suggest a common ovarian mesenchymal progenitor.
relevance_to_jgct: Steroidogenic cell populations in JGCT.
