notes: 'Original in Turkish; read in Turkish. Internal discrepancy: the abstract says the patient was 20 years old with a 17 cm mass during pregnancy, but the case text says the tumor was found 3 years earlier at age 17 (38 weeks) and she was 20 at the follow-up pregnancy. Statement that JGCT incidence among ovarian tumors in pregnancy is 10% is the authors'' citation and appears implausible. Title translation is the English title given on the article.'
