key_findings:
- Two juvenile granulosa cell tumors in the testes of two newborns are described.
- The lesion should be considered whenever a cystic testicular mass is encountered in newborns or young infants.
- Authors state orchidectomy is the only treatment required because local recurrence or metastases have never been observed.
- Karyotyping of the patient is described as essential when the external genitalia are abnormal.
relevance_to_jgct: Neonatal testicular JGCT; supports cystic testicular mass presentation and the view (as of 1997) that testicular JGCT does not recur or metastasize.
