key_findings:
- A girl aged 1 year 6 months came to the Morozov children's hospital gynaecology department (Moscow) with a month of intermittent lower abdominal pain and breast swelling; examination showed slight breast enlargement (Ma 1), an estrogenised vulva, and a rectally palpable pelvic mass up to 10 cm.
- 'Ultrasound showed an enlarged uterus (like age 10-12 years, endometrium 5-6 mm) and a solid-cystic mass of 98 mm with blood flow; hormones: estradiol 1841.00 pmol/L, progesterone 17.18 nmol/L, 17-OH-progesterone 14.05 nmol/L, testosterone 0.82 ng/ml, prolactin 20.83 ng/ml; bone age 2 years; AFP 4.40 IU/ml, beta-hCG 0.27 mIU/ml, CA-125 34 U/ml; height SDS +2.8.'
- Laparoscopy found an 85-90 mm right adnexal mass, no free fluid and a normal left ovary (20 x 18 x 25 mm); one fluid cavity was punctured inside an endobag and sealed, and right adnexectomy was done.
- 'Histology: diffuse growth with solid fields and many follicular structures, uneven mitotic activity up to 6 mitoses per high-power field (x400) in foci, expression of calretinin, inhibin and S100; diagnosis juvenile-type granulosa cell tumor, ICD-O 8622/1; isosexual precocious pseudopuberty.'
- No stage, adjuvant treatment or follow-up is reported; the authors state in the discussion, citing the literature, that stage I disease needs adnexectomy with contralateral ovary revision and surgical staging, and stages II-IV need postoperative chemotherapy.
relevance_to_jgct: Toddler with a hormone-producing JGCT (estradiol 1841 pmol/L) and isosexual precocious puberty treated by laparoscopic adnexectomy.
