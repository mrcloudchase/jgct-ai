key_findings:
- PDQ states juvenile granulosa cell tumor is the most common sex cord-stromal tumor subtype in girls younger than 18 (median age 7.6 years; range birth to 17.5 years) and represents about 5% of ovarian tumors in children and adolescents.
- 'Risk factors listed: reported in children with Ollier disease and Maffucci syndrome.'
- 'Presentation listed: precocious puberty (most common; estrogen secretion), abdominal pain, abdominal mass, ascites.'
- States as many as 90% of children have FIGO stage I disease, usually curable with unilateral salpingo-oophorectomy alone.
- States patients with spontaneous rupture or malignant ascites (FIGO IC2, IC3), stages II-IV, or tumors with high mitotic activity have a poorer prognosis and require chemotherapy; cisplatin-based regimens used with some success in adjuvant and recurrent settings.
- Notes US patients may be registered in the International Ovarian and Testicular Stromal Tumor Registry and that European PARTNER/EXPeRT recommendations exist; recommendations harmonized between registries.
relevance_to_jgct: US National Cancer Institute's physician-oriented summary of pediatric JGCT management.
