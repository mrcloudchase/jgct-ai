key_findings:
- Among 114 children (2 days to 19 years) with operatively proven ovarian torsion, 4 malignancies (3.5%) included one stage IA juvenile granulosa cell tumor cured by resection alone; in 593 literature cases of torsion there were 9 malignancies (1.5%), 4 of them juvenile granulosa cell tumors.
- Combined malignancy rate of 1.8% in 707 torsion patients supports detorsion with surveillance rather than oophorectomy.
relevance_to_jgct: JGCT is the commonest malignancy presenting as pediatric ovarian torsion, but torsion rarely signals malignancy.
