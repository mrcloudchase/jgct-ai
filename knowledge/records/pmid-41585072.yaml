key_findings:
- IPSO minimally invasive surgery guideline chapter on fertility preservation in paediatric cancer.
- In asymptomatic girls, imaging and tumour markers (alpha-fetoprotein, human chorionic gonadotrophin, Inhibin B, anti-Mullerian hormone and calcemia) are described before surgery; laparoscopic exploration recommended as first step.
- Laparoscopic ovarian tumour resection is not recommended by the authors; laparotomy via a supra-pubic approach remains preferred.
- Rationale includes potential malignancy even in cystic lesions (e.g., rare cases of juvenile granulosa cell tumours), where intraoperative rupture would significantly worsen prognosis.
- Ovarian and genital tract-sparing surgery should be prioritised for benign ovarian tumours, which constitute 90% of childhood ovarian lesions.
relevance_to_jgct: Paediatric surgical guidance noting that cystic-appearing ovarian masses may be JGCT and favoring open resection to avoid rupture.
