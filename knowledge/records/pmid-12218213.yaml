key_findings:
- 'CGH, FISH, DNA cytometry and immunohistochemistry on 20 granulosa cell tumors (17 adult, 3 juvenile): 80% diploid; monosomy 22 in 40%, trisomy 12 in 25%, monosomy X in 10% by FISH; gains of 12 and 14 and loss of 22 by CGH; inhibin in 100% and p53 in 95%; Ki67 0 to 61%; none of the findings carried prognostic information.'
relevance_to_jgct: Cytogenetic pattern of granulosa cell tumors with 3 JGCT; monosomy 22 commoner than trisomy 12.
