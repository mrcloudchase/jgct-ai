key_findings:
- 'Cytology of recurrent or metastatic granulosa cell tumors (6 adult, 1 juvenile; ages 22 to 72): the JGCT showed monolayers, loosely cohesive sheets, pleomorphic cells with nuclear clefting and protrusions, vacuolated cytoplasm, finely granular chromatin and frequent mitoses; inhibin staining of cell blocks helped.'
