notes: The JGCT statement is a brief citation-based claim; its wording ('benign and hormonally inactive') conflicts with the usual description of JGCT as potentially hormone-active in the ovary but is consistent with infantile testicular JGCT, and the review does not specify the site. tumor_site recorded as testis on that inference. Journal, first author and DOI not stated in the fetched text.
