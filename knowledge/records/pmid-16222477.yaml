presentation:
- nonspecific abdominal complaints
- 4.5 kg, 25 x 23 x 15 cm pelvic mass
- retroperitoneal and mesenteric lymphadenopathy
- raised CA-125 and inhibin B
key_findings:
- A 12-year-old with developmental delay and a family history of gynecologic cancers had a 4.5 kg mixed sex cord-stromal tumor with adult granulosa, juvenile granulosa (with marked atypia) and intermediate- to high-grade Sertoli cell areas, positive for calretinin, CD99, S100, PGP 9.5 and NSE, with Charcot-Bottcher filaments on electron microscopy.
relevance_to_jgct: Composite pediatric sex cord-stromal tumor with a markedly atypical JGCT component.
