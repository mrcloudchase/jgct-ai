key_findings:
- Four JGCT patients treated at Peking Union Medical College Hospital from 1983 to 2002.
- Solid pelvic mass with ascites and pleural effusion were the main clinical features; estrogen levels were normal in all four.
- All 4 were stage I and treated with surgery and combined chemotherapy.
- Two patients with high mitotic index progressed and died after 10 and 14 months; the two without high mitotic index had complete remission for 25 and 32 months.
- Authors conclude prognosis is poor with high mitotic index.
relevance_to_jgct: Small series suggesting mitotic index as a prognostic factor even in stage I; deaths despite chemotherapy.
