key_findings:
- 'Ki67 and p53 immunostaining of 68 granulosa cell tumors (53 primary, 15 recurrent) including 7 juvenile tumors: p53 staining was associated with juvenile type (p<0.001) and higher Ki67 index; the 7 juvenile GCT were the most proliferative type and none recurred.'
- Recurrence of adult tumors was associated with stage above I, capsular vessel invasion, rupture and older age; paired primaries and recurrences showed a striking rise in Ki67 and mitotic activity.
relevance_to_jgct: JGCT showed the highest proliferation and p53 positivity yet no recurrences in this series.
