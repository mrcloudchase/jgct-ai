key_findings:
- 14 testicular tumors in infants under 6 months resembling ovarian JGCT; seven diagnosed in the first days of life; one at autopsy at 30 weeks' gestation.
- Usually enlargement of a scrotal testis; 0.8 to 5.0 cm, cystic or partly cystic; mitotic rate <1-24/10 HPF.
- Limited follow-up revealed no recurrence.
relevance_to_jgct: Original description establishing testicular JGCT as an entity.
