notes: Original read in German. Three cases from one German center; case B was first diagnosed abroad in the EU. Follow-up for case B is not stated beyond discharge. Recommendations are the authors' synthesis, not a guideline. The full text states no recurrences described in the literature, which can be compared with the STEP registry report (pmid-40272823).
