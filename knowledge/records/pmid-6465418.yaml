title: Juvenile granulosa cell tumor of the ovary. A clinicopathological analysis of 125 cases.
journal: The American journal of surgical pathology
year: 1984
first_author: Young RH
study_type: case_series
n_jgct_patients: 125
age_range: newborn-67 years (average 13)
alterations: []
treatments: []
presentation:
- isosexual pseudoprecocity (82% of prepubertal)
- abdominal pain or swelling
- menstrual irregularities or amenorrhea
- Ollier's disease (2)
- Maffucci's syndrome (2)
key_findings:
- 125 ovarian JGCTs; age newborn to 67 years (average 13); 44% aged 10 or younger, 34% 11-20, 18% 21-30, 3% over 30.
- 82% of prepubertal patients presented with isosexual pseudoprecocity; others mostly with abdominal pain or swelling; 15 reproductive-age patients had menstrual irregularities or amenorrhea.
- Two patients had Ollier's disease and two had Maffucci's syndrome.
- Unilateral in 122; bilateral in two (plus one at autopsy). Stage IIb in two, IIc in one, the rest stage I. Rupture in 13 (11%); ascites in 11 (9%).
- Tumors 3 to 32 cm (average 12.5 cm); 49% solid and cystic, 37% solid, 14% cystic. Mitotic rate <1 to 32/10 HPF (average 7).
- 'Follow-up (1 to 21 years, average 5) for 95 patients: 87 (92%) alive and free of disease; seven died of tumor 7 months to 3 years postoperatively; one Maffucci patient died of chondrosarcoma (corrected survival 93%).'
relevance_to_jgct: Classic defining clinicopathologic series of ovarian JGCT (Young and Scully), establishing presentation, morphology, association with Ollier/Maffucci, and generally favorable prognosis.
