title: G-protein coupled estrogen receptor (GPER) agonist G-1 inhibits growth of human granulosa cell tumor cells via blocking microtubule assembly (AACR 2013 abstract B82)
journal: Clinical Cancer Research (AACR Ovarian Cancer conference 2013)
