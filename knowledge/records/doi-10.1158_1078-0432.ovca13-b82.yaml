key_findings:
- The GPER agonist G-1 suppressed proliferation of KGN (adult-type) and COV434 (then used as juvenile-type) granulosa cell tumor cells in a concentration- and time-dependent manner, arrested cells in G2/M, disrupted chromosome segregation and inhibited tubulin polymerization in vitro, without affecting cyclins D1, D2, E or G2/M checkpoint kinases.
- The authors propose G-1 as a candidate drug for granulosa cell tumors.
relevance_to_jgct: Preclinical result in COV434, which has since been reclassified as SCCOHT (pmid-33328126), so it may not apply to JGCT.
