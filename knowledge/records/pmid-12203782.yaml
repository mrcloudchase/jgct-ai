key_findings:
- Of 13 adult and 2 juvenile granulosa cell tumors, 7 of 12 adult tumors lacked INK4A and/or INK4B expression (one homozygous deletion, the rest promoter hypermethylation), while neither juvenile tumor showed altered expression of RB1, INK4A, INK4B, INK4C, INK4D or ARF.
relevance_to_jgct: INK4 inactivation found in adult but not juvenile tumors.
