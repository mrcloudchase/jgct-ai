key_findings:
- Retrospective series of 7 granulosa cell tumors treated at department C of Gynecology and Obstetrics, Center of Maternity and Neonatology, Tunis (French article, English abstract).
- Mean age of the 7 patients was 40 years; final pathology showed 6 adult-type tumors and one juvenile-type tumor.
- 'Whole-series data, not given by type: 5 tumors stage Ia, one Ic and one IIa; treatment conservative in most; ilio-obturator and para-aortic lymphadenectomy in 3; adjuvant chemotherapy in 2; 6 patients in complete remission at last follow-up; two pregnancies carried to term after surgery.'
- The abstract gives no age, stage, treatment or outcome for the single juvenile-type patient.
relevance_to_jgct: Mostly adult-type series containing one juvenile-type tumor with no individual detail.
