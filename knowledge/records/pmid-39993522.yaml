key_findings:
- A 15-year-old with primary amenorrhea had suppressed FSH, raised LH, normal estradiol and markedly raised inhibin B; imaging showed only a 1.6 cm "follicle" in a mildly enlarged ovary; salpingo-oophorectomy revealed JGCT and menarche followed 2 months later.
relevance_to_jgct: An isolated inhibin-producing JGCT too small to look like a tumor, causing primary amenorrhea.
