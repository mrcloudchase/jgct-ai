presentation:
- precocious/irregular pubertal development with menarche at 13 years
- abdominopelvic mass found on examination
- elevated estradiol
key_findings:
- A 13-year-old girl from Hidalgo, Mexico, with Maffucci syndrome (diagnosed in 2003 from soft-tissue haemangiomas, limb deformity and multiple enchondromas; cavernous haemangiomas of both hands resected in 2004) had menarche in November 2009 with irregular, frequent cycles and Tanner stage II breast and pubic hair.
- In December 2009 an abdominopelvic mass was found; estradiol was 671 pg/mL with LH < 0.10 mU/mL and FSH < 0.10 mU/mL, AFP 4.6 UI/mL and beta-hCG 3.8 UI/mL; ultrasound showed a heterogeneous pelvic mass of 135 x 62 x 133 mm with marked vascularity, and CT a predominantly cystic lesion of 16.3 x 14.2 cm with multiple bone enchondromas.
- Laparotomy on 11 December 2009 found a left ovarian tumour and two right paratubal cysts; pathology reported cystic granulosa cell tumour, with no tumour in the left tube, paratubal region, colonic gutters, diaphragms or omentum; the abstract states complete resection and stage IA (staging system not named).
- Histology figure legend describes medium-sized cells with scant eosinophilic cytoplasm, ovoid nuclei with prominent nucleoli and grooves ('coffee beans').
- At the time of writing she was alive and free of disease after a little over 3 years of follow-up; no adjuvant therapy is described.
- The authors state that this was the only one of 5 granulosa cell tumours treated at their hospital in 10 years with this association, and cite roughly 10 reported cases of Maffucci syndrome with ovarian stromal tumour.
relevance_to_jgct: 'Documented JGCT in a 13-year-old with Maffucci syndrome: stage IA, estradiol 671 pg/mL, complete resection, disease-free at just over 3 years; no molecular work-up.'
