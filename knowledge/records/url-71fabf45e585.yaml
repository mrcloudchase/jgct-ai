notes: 'Language read: Spanish. The cached text is the publisher''s HTML page with full article text. Side is inconsistent in the text: CT describes a lesion in the right iliac fossa/flank extending to the midline, laparotomy and pathology say left ovary. Histology description (nuclear grooves) is given only in a figure legend and no immunohistochemistry or mitotic count is reported; the ''juvenile'' label rests on the authors'' title and discussion. The extent of surgery (oophorectomy vs other) is not specified. Maffucci syndrome with JGCT is also cited by other records as a known association.'
