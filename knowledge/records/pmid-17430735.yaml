alterations:
- gene: FOXL2
  alteration: absent or reduced protein expression (IHC)
  frequency: 14/26 (10 absent, 4 reduced)
  notes: All 3 recurrences had complete extinction.
treatments: []
presentation:
- precocious pseudopuberty
- hemorrhagic ascites
key_findings:
- 26 patients with juvenile ovarian GCT (1994-2004) from the French SFCE TGM95 database and eight pediatric endocrinology centers; FOXL2 immunohistochemistry.
- FOXL2 expression was absent in granulosa cells of 10 patients and markedly reduced in 4.
- Precocious pseudopuberty was more frequently the presenting symptom in children with conserved FOXL2 expression.
- No or reduced FOXL2 expression was associated with hemorrhagic ascites, higher mitotic activity, and significantly more advanced stage; all 7 patients requiring complementary treatment had reduced FOXL2; all 3 recurring tumors had complete extinction of FOXL2 expression.
relevance_to_jgct: Reports loss of FOXL2 protein expression as a marker of aggressive JGCT in children.
