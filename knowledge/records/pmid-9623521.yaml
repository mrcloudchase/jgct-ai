presentation:
- central precocious puberty
- hypothalamic hamartoma
key_findings:
- Central precocious puberty from infancy due to a hypothalamic hamartoma, associated with an ovarian JGCT.
- Central precocious puberty diagnosed by gonadotropin stimulation tests; LHRH agonist therapy was successful.
- MRI, but not CT, demonstrated the hamartoma.
- Authors discuss possible influence of early LH stimulation on development of the granulosa cell tumor.
relevance_to_jgct: Unusual coexistence of central precocious puberty and JGCT.
