key_findings:
- '16-year-old with gradual abdominal distension and 6 months of irregular cycles; CT: large solid-cystic right ovarian mass. CA-125, beta-hCG and LDH normal; AFP 263 ng/mL (normal 0-40).'
- Right salpingo-oophorectomy; frozen section sex cord-stromal tumor; fertility-sparing complete staging surgery; final FIGO stage IA, grade 3; gross mass 25 x 20 cm.
- 'Final histology: gynandroblastoma, Sertoli-Leydig cell tumor component 80% (intermediate to poorly differentiated, few Leydig cells, focal retiform pattern, 15-20 mitoses per HPF) plus juvenile granulosa cell tumor component 20% (solid nodules with secretions resembling Graafian follicles).'
- IHC positive for inhibin, calretinin, vimentin, cytokeratin and Melan A; negative for EMA, CK7 and SALL4; both JGCT and Sertoli-Leydig components were positive for inhibin, calretinin, cytokeratin and vimentin. Sequencing found a pathogenic DICER1 mutation.
- Adjuvant 4 cycles of BEP given for intermediate-to-poor differentiation, tumor size and mitotic rate; recurrence-free at 12 months with AFP in the normal range.
- Authors note gynandroblastoma requires at least 10% minor component, so extensive sampling is needed; discussion cites that about 50-60% of Sertoli-Leydig tumors occur in germline DICER1 carriers and recommends combined germline and tumor DICER1 testing.
relevance_to_jgct: Gynandroblastoma with a juvenile granulosa cell tumor component (20%) and DICER1 mutation in an adolescent; JGCT is the minor component of a Sertoli-Leydig-dominant tumor.
