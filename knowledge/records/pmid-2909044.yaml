key_findings:
- Follicle regulatory protein was found in the ascites and tumor cytosol of a patient with juvenile granulosa cell tumor; daily partially purified protein slowed growth of her tumor cells xenografted in nude mice and inhibited their clonogenic proliferation, without effect on an endometrial adenocarcinoma.
relevance_to_jgct: An early xenograft of JGCT and a protein that slowed its growth.
