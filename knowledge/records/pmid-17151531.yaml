key_findings:
- 'Sixteen granulosa cell tumors over 10 years (Tunisia; 15 adult, 1 juvenile): the juvenile tumor, in a 35-year-old, was stage IV at diagnosis, received adjuvant chemotherapy and recurred locoregionally with liver metastasis after 9 months; no adult-type recurrence at a mean 2 years 2 months (French).'
- The authors describe juvenile forms as rarer, more aggressive and prone to early recurrence.
relevance_to_jgct: A stage IV adult-age JGCT with early fatal course in a mixed series.
