key_findings:
- 'Retrospective study at West China Second University Hospital, surgery January 2001 to January 2018: 164 patients with granulosa cell tumours, 146 adult-type and 18 juvenile-type.'
- Whole-cohort mean age was 44.24 +/- 15.13 years; FIGO stage I 132 (80.49%), II 16 (9.76%), III 5 (3.05%), IV 1 (0.61%).
- After 19 to 146 months of follow-up, 4 patients (2.44%) died and 10 (6.10%) recurred (whole cohort).
- FIGO stage was a significant risk factor for recurrence (P<0.001); pathological type, age, tumour size, fertility-sparing surgery, lymphadenectomy and chemotherapy were not significant for recurrence.
- In univariate analysis pathological type (adult vs juvenile; P<0.001) was a risk factor for survival, along with tumour diameter, FIGO stage and pelvic lymphadenectomy; in Cox analysis only FIGO stage was independent for overall survival (P=0.003). The abstract does not give the direction of the type effect.
- 88 patients had pelvic lymphadenectomy and none had nodal metastasis; the authors conclude lymphadenectomy may be unnecessary.
relevance_to_jgct: Large single-centre Chinese series that includes 18 JGCT; the abstract gives no JGCT-specific stage, treatment or outcome numbers, only that histological type was associated with survival on univariate analysis.
