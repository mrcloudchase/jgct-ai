notes: Full text read via Europe PMC (PMC11707838) on 2026-10-30. FOXL2 IHC positive in all 5 tumors, contrasting with absent FOXL2 expression in 10/26 JGCTs in pmid-17430735; the paper itself notes conflicting prior FOXL2-IHC prognostic findings (D'Angelo vs Kalfa). Small series; includes adult patients (21 and 43 years). Clinical data missing for case 2.
