key_findings:
- Five JGCTs studied with 32 IHC markers, DNA NGS and PTEN methylation analysis.
- All expressed calretinin, inhibin A, SF1, FOXL2, CD99, CKAE1/3, ER, PR, AR; all p53 wild-type pattern, HER2 negative, PD-L1 negative, MMR intact.
- AKT1 internal tandem duplication in two tumors; two others had TERT and EP400 mutations and both developed recurrence.
- All AKT1-wild-type tumors showed immunohistochemical PTEN loss without PTEN mutation, deletion, or promoter hypermethylation.
relevance_to_jgct: Supports PI3K/AKT/mTOR pathway activation as the common feature of JGCT, including via PTEN loss in AKT1-wild-type tumors.
