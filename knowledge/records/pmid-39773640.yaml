key_findings:
- Five primary JGCTs (plus 1 recurrence) after central review of 10 archival cases (4 reclassified as other sex cord-stromal tumors, 1 duplicate); ages 6 to 43 years (median 16), follow-up 20 to 79 months.
- Four stage IC and one stage IIIB; three of five recurred, all within the first year after diagnosis; platinum-based chemotherapy was most often used for recurrence; one patient (43 years) died of disease.
- SF1, inhibin A, calretinin, FOXL2, ER, PR, AR, CKAE1/3 and CD99 positive in 100% (5/5); WT1 in 20% (1/5); p16 negative and p53 wild-type pattern in all; Ki-67 median 30 (range 4-47).
- All tumors HER2 negative, PD-L1 negative (TPS <1%), MMR-proficient; tumor mutation burden low (average 5 mutations/megabase); BRG1 and INI1 retained (distinguishing from SCCOHT).
- 'Pathogenic or likely pathogenic mutations in 80% of cases: AKT1 ITD in 40% (2/5), TERT promoter c.-124C>T in 1, EP400 in 1; no FOXL2 c.402C>G and no somatic DICER1 mutations.'
- PTEN protein loss in 60% (3/5), all AKT1-wild-type, without PTEN mutation, deletion or promoter hypermethylation; authors interpret this as supporting PI3K/AKT/mTOR activation in most JGCTs.
relevance_to_jgct: Supports PI3K/AKT/mTOR pathway activation as a common feature of JGCT (AKT1 ITD or PTEN protein loss) and reports predictive-marker negativity (HER2, PD-L1, MMR).
