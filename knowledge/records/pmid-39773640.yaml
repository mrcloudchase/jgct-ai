key_findings:
- Five ovarian JGCTs studied with 32 immunohistochemical markers and molecular analysis.
- All expressed calretinin, inhibin A, SF1, FOXL2, CD99, CKAE1/3, ER, PR and AR; p53 wild-type pattern, HER2 negative, PD-L1 negative, mismatch repair intact in all.
- AKT1 internal tandem duplication in 2 tumors; PTEN protein loss in all AKT1-wild-type tumors without a detectable genetic cause.
- The two cases with TERT and EP400 mutations both recurred.
- Authors conclude PI3K/AKT/mTOR activation is consistent in JGCT and may have therapeutic implications.
relevance_to_jgct: Suggests PI3K/AKT/mTOR pathway activation is near-universal in JGCT via AKT1 duplication or PTEN loss, and links TERT alterations to recurrence.
