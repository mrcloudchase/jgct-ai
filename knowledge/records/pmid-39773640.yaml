notes: Only 5 cases; includes patients aged 21 and 43 years, so not purely juvenile age. The text says all recurrences occurred within the first year and that none had hormonal features, and that 'all cases with available data presented with abdominal pain' while case 4 is listed with acute abdomen; table lists case 2 clinical data as N/A. The abstract states TERT and EP400 mutated cases both recurred, but the full text assigns TERT to case 3 with recurrence while the location of the EP400 case is not given in the text (it is in Figure 1). The patient-level genotype-to-case mapping is in Fig. 1, which is not available as text.
