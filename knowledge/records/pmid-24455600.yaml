notes: Letter to the editor, very brief. Stage, postoperative course, follow-up and the estrogen-related changes after surgery are not reported. Whether inhibin was repeated or a panel including other markers (e.g. SF-1, FOXL2) was used is not stated, so the JGCT diagnosis rests on morphology plus calretinin.
