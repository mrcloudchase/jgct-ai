key_findings:
- 4-year-old girl with vomiting, abdominal distension, periumbilical pain for 6 months, breast development and pubic hair.
- Estradiol 234 pmol/L with LH and FSH <0.5 IU/L, consistent with peripheral precocious puberty; AFP 1 ng/mL.
- Left adnexal mass 22 x 20 x 18 cm resected at laparotomy.
- Tumor strongly calretinin-positive but inhibin-negative; negative for HCG, AFP, cytokeratin and EMA.
- Authors note a negative inhibin stain does not exclude GCT and calretinin is useful in inhibin-negative sex cord-stromal tumors.
