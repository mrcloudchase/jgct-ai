key_findings:
- Children's Oncology Group observational biology study, status COMPLETED, start 2012-04; estimated enrollment 50.
- Tissue from the ATBR01 B1 tissue bank and from the International Pleuropulmonary Blastoma Registry, Children's Hospital of Boston, and Massachusetts General Hospital.
- Eligible ovarian histologies include juvenile granulosa cell tumor, adult granulosa cell tumor, Sertoli-Leydig cell tumor, gynandroblastoma and others; testicular histologies include granulosa cell tumor, Sertoli, Leydig, Sertoli-Leydig and undifferentiated stromal tumors.
- 'Primary outcome: ''Correlation between DICER1 mutations and miRNA pathways with outcomes using descriptive analysis.'''
- No results posted on ClinicalTrials.gov.
relevance_to_jgct: COG laboratory study that explicitly includes ovarian JGCT and testicular granulosa cell tumors in a pediatric DICER1/miRNA analysis.
