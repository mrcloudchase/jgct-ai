key_findings:
- Ovaries from tumor-susceptible SWR/SWXJ mice (a model of human juvenile granulosa cell tumors) grafted into syngeneic or immune-deficient hosts formed spontaneous tumors independent of the immune system, only before ovarian maturation, and only with gonadotropin support or dehydroepiandrosterone treatment, suggesting ovarian androgens initiate tumorigenesis.
relevance_to_jgct: Mouse model evidence that androgens may initiate juvenile-type granulosa cell tumors.
