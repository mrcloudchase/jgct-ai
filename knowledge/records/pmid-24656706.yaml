key_findings:
- Teenager with Stage III JGCT treated with aggressive debulking and thorough staging, conserving uterus, contralateral uninvolved ovary and tube, plus combination chemotherapy.
- Tumor recurred twice, 18 months and 17 years later, treated with 2 additional surgeries and more chemotherapy.
- Patient achieved 2 pregnancies and had 3 children; long-term survival.
- Authors state about 90% of JGCT are diagnosed in FIGO I and more advanced stages (II-IV) usually have a poor outcome.
relevance_to_jgct: Documents long-term survival and late (17-year) recurrence in stage III JGCT, with fertility preserved by conservative surgery.
