key_findings:
- The Charité nationwide online tumour conference for rare gynaecological tumours (228 registered participants) discussed 22 patients with sex cord-stromal tumours between February 2016 and February 2018, out of 187 patients overall.
- The 22 comprised 13 adult granulosa cell tumours, 2 juvenile granulosa cell tumours, 5 Sertoli-Leydig cell tumours, 1 gynandroblastoma and 1 atypical sex cord tumour.
- Patient ages for the whole group of 22 were 16-78 years (median 40.5); 11 were presented at first diagnosis, 8 of them FIGO I (3 IA, 1 IB, 4 IC).
- Patients with recurrence had a median disease course of 12 years (4 months to 29 years); 3 had a first, 3 a second, 1 a third and 4 a fourth recurrence.
- Eight patients had previously been treated at Charité and 14 were presented from outside; tumour markers were available in 10 of 22, in 2 of those only CA-125.
- The abstract does not give age, stage, treatment or outcome for the two JGCT patients specifically.
relevance_to_jgct: Only count-level JGCT content (2 of 22 sex cord-stromal tumour patients in a German online tumour conference); shows how rare-tumour boards see few JGCT.
