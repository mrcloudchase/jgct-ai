key_findings:
- A 15-year-old with JGCT of the right ovary treated at the Morozov Children's Hospital, Moscow, with a review of the largest treatment studies (Russian).
- The review states that no pediatric treatment standard exists, that management follows adult recommendations, that adjuvant chemotherapy is used above stage IC, and that chemotherapy at stage IC remains debatable.
relevance_to_jgct: Russian case and review; restates the stage IC chemotherapy debate.
