key_findings:
- Mullerian inhibiting substance and inhibin were expressed by all 19 sex cord-stromal tumors, and CD99 by all adult and juvenile granulosa cell tumors but only focally by Sertoli-Leydig tumors; none of 7 endometrioid carcinomas resembling sex cord tumors expressed MIS or inhibin.
relevance_to_jgct: CD99, MIS and inhibin separate JGCT from endometrioid mimics.
