key_findings:
- Prospective German MAKEI series of 54 ovarian sex cord-stromal tumors in children and adolescents with central review of surgery and histopathology.
- 'Stage IA 27, IC 21, II 3, III 3; EFS 0.86 and OS 0.89 at median 59 months.'
- 'EFS by stage: IA 1.0, IC 0.76, II/III 0.67 (P = .02).'
- Recommended observation for stage IA and cisplatin-based chemotherapy for stage IC with preoperative rupture or malignant ascites, especially with high mitotic activity.
relevance_to_jgct: Historical German cohort (45 of 54 were JGCT per pmid-40272823) whose risk stratification became the basis for the later STEP approach.
