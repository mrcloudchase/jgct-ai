key_findings:
- 54 patients with ovarian sex cord-stromal tumors prospectively enrolled as follow-up patients on the German MAKEI protocols; central review of surgery and histopathology (53 complete).
- Stage IA patients followed up; nine stage IC and six stage II-III patients received cisplatin-based chemotherapy.
- 'FIGO stage IA 27, IC 21, II 3, III 3. Median follow-up 59 months: EFS 0.86 +/- 0.05 (47 of 54), OS 0.89 +/- 0.05 (49 of 54).'
- 'EFS by stage: IA 1.0 (27 of 27); IC 0.76 +/- 0.09 (16 of 21); II/III 0.67 +/- 0.19 (four of six); P = .02.'
- Authors recommend follow-up only for stage IA, and cisplatin-based chemotherapy for stage IC with preoperative rupture or malignant ascites, especially with high mitotic activity.
relevance_to_jgct: Historical MAKEI cohort (mostly JGCT) that established the German risk stratification later validated in the STEP registry.
