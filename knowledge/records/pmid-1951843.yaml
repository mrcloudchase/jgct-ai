key_findings:
- 'Twenty malignant melanomas metastatic to the ovary (ages 21 to 60): bilateral in 9, average 10.5 cm, follicle-like spaces in 8; S-100 strongly positive in all 10 tested; these neoplasms were often difficult to differentiate from juvenile granulosa cell tumor and small cell carcinoma because of the follicle-like spaces.'
relevance_to_jgct: Metastatic melanoma with follicle-like spaces as a mimic of JGCT.
